<script>
/* ═══════════════════════════════════════════════════════════════════════════
   GENERATED FILE - do not edit by hand.
   Source: _engine/{geom,draw,pages}.js + _engine/build.py
   Rebuild with:  python3 _engine/build.py
   ═══════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════
   MCEN2002 — SHARED COMPOSITE-AREA ENGINE  (Tutorial 1: centroids, second
   moments, polar moments, balancing)
   Single source of truth for every T1.x solution page.
   Edit this file, then run  _engine/build.py  to regenerate the HTML files.
   The HTML files are self-contained — the engine is inlined into each one.

   ─── MODEL ───────────────────────────────────────────────────────────────
   A section is a list of PARTS. Each part carries sign = +1 (material) or
   -1 (hole / cut-out / notch). Everything else — areas, centroids, second
   moments, the summary table, the figure — is derived.

     {k:'rect', x, y, w, h}          lower-left corner at (x,y)
     {k:'tri',  p:[[x,y],[x,y],[x,y]]}
     {k:'circ', cx, cy, r}
     {k:'semi', cx, cy, r, dir}      (cx,cy) = MIDPOINT OF THE FLAT EDGE;
                                     dir ∈ 'up','down','left','right' = the
                                     direction the bulge points
   Optional per part: sign (default +1), name, at:[x,y] label position.

   Sign convention: holes enter EVERY sum negatively — area, first moment and
   second moment alike. That single rule is what the whole tutorial rests on.
   ══════════════════════════════════════════════════════════════════════════ */

var NAVY='#1a3c6e', ORANGE='#f97316', GREY='#555', FILL='#7fe3ec', CUT='#b45309';
var CIRCLED=['①','②','③','④','⑤','⑥'];

/* ─────────────────── number formatting ─────────────────── */
function fx(v,d){ if(d===undefined) d=0;
  var s=Number(v).toFixed(d), neg=s[0]==='-'; if(neg) s=s.slice(1);
  var q=s.split('.'); q[0]=q[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\\,');
  return (neg?'-':'')+q.join('.');
}
function fxh(v,d){ return fx(v,d).replace(/\\,/g,' '); }   /* thin space, for HTML */
/* engineering form  a.bcd × 10^n */
function eng(v,sig){ if(sig===undefined) sig=3;
  if(Math.abs(v)<1e-12) return '0';
  var e=Math.floor(Math.log10(Math.abs(v))), m=v/Math.pow(10,e);
  return m.toFixed(sig)+' \\times 10^{'+e+'}';
}

/* ─────────────────── geometry primitives ─────────────────── */
function pArea(p){
  switch(p.k){
    case 'rect': return p.w*p.h;
    case 'tri' : var q=p.p; return Math.abs((q[1][0]-q[0][0])*(q[2][1]-q[0][1])-(q[2][0]-q[0][0])*(q[1][1]-q[0][1]))/2;
    case 'circ': return Math.PI*p.r*p.r;
    case 'semi': return Math.PI*p.r*p.r/2;
  }
}
function pC(p){
  switch(p.k){
    case 'rect': return [p.x+p.w/2, p.y+p.h/2];
    case 'tri' : var q=p.p; return [(q[0][0]+q[1][0]+q[2][0])/3, (q[0][1]+q[1][1]+q[2][1])/3];
    case 'circ': return [p.cx, p.cy];
    case 'semi': var e=4*p.r/(3*Math.PI), D={up:[0,1],down:[0,-1],left:[-1,0],right:[1,0]}[p.dir];
                 return [p.cx+D[0]*e, p.cy+D[1]*e];
  }
}
/* second moments about the part's OWN centroidal axes, parallel to x and y */
function pIbar(p){
  var A=pArea(p);
  switch(p.k){
    case 'rect': return [p.w*Math.pow(p.h,3)/12, p.h*Math.pow(p.w,3)/12];
    case 'tri' : var q=p.p,
        sx=Math.pow(q[0][0]-q[1][0],2)+Math.pow(q[1][0]-q[2][0],2)+Math.pow(q[2][0]-q[0][0],2),
        sy=Math.pow(q[0][1]-q[1][1],2)+Math.pow(q[1][1]-q[2][1],2)+Math.pow(q[2][1]-q[0][1],2);
        return [A*sy/36, A*sx/36];
    case 'circ': var I=Math.PI*Math.pow(p.r,4)/4; return [I,I];
    case 'semi': var Id=Math.PI*Math.pow(p.r,4)/8, e=4*p.r/(3*Math.PI), Ie=Id-A*e*e;
        /* Id is about the diameter; Ie about the parallel centroidal axis */
        return (p.dir==='up'||p.dir==='down') ? [Ie,Id] : [Id,Ie];
  }
}
function pName(p,i){ return p.name || ('Part '+CIRCLED[i]); }

/* ─────────────────── composite reduction ─────────────────── */
function reduce(parts){
  var rows=[], A=0, Sx=0, Sy=0;
  parts.forEach(function(p,i){
    var s=(p.sign===undefined?1:p.sign), a=s*pArea(p), c=pC(p), ib=pIbar(p);
    rows.push({p:p,i:i,sign:s,A:a,x:c[0],y:c[1],Ibx:s*ib[0],Iby:s*ib[1],
               name:pName(p,i), mark:CIRCLED[i]});
    A+=a; Sx+=a*c[0]; Sy+=a*c[1];
  });
  return {rows:rows, A:A, Sx:Sx, Sy:Sy, xb:Sx/A, yb:Sy/A};
}
/* second moments of the whole section about axes through (ax,ay) */
function inertiaAbout(R, ax, ay){
  var Ix=0, Iy=0;
  R.rows.forEach(function(r){
    r.dy = r.y-ay; r.dx = r.x-ax;
    r.Ix = r.Ibx + r.A*r.dy*r.dy;
    r.Iy = r.Iby + r.A*r.dx*r.dx;
    Ix += r.Ix; Iy += r.Iy;
  });
  return {Ix:Ix, Iy:Iy, J:Ix+Iy, k:Math.sqrt((Ix+Iy)/R.A),
          kx:Math.sqrt(Ix/R.A), ky:Math.sqrt(Iy/R.A)};
}

/* ─────────────────── SVG figure builder ───────────────────
   The figure is derived from the SAME parts list the algebra uses, so a
   variant can never drift away from its own diagram. Positive parts are
   drawn first (their union is the silhouette, and the internal edges double
   as the decomposition lines); negative parts are then painted white on top.
   Optional per-variant annotation: dims[] and notes[].                     */

function View(parts, opt){
  opt = opt || {};
  var bb = bbox(parts.length?parts:[{k:'rect',x:0,y:0,w:1,h:1}]);
  var pad = (opt.pad===undefined) ? 0.06 : opt.pad;
  var mL = opt.mL===undefined?14:opt.mL, mR = opt.mR===undefined?14:opt.mR,
      mT = opt.mT===undefined?30:opt.mT, mB = opt.mB===undefined?34:opt.mB;
  var gx=(bb.x1-bb.x0)*pad, gy=(bb.y1-bb.y0)*pad;
  var x0=Math.min(bb.x0-gx,0), x1=Math.max(bb.x1+gx,0),
      y0=Math.min(bb.y0-gy,0), y1=Math.max(bb.y1+gy,0);
  /* keep the axes visible even when the section does not touch the origin */
  var ex=(x1-x0)*0.06, ey=(y1-y0)*0.06;
  x0-=ex; x1+=ex; y0-=ey; y1+=ey;
  var W = opt.W || 720, Wi = W-mL-mR;
  var s = Wi/(x1-x0), Hi=(y1-y0)*s;
  this.s=s; this.W=W; this.H=Hi+mT+mB;
  this.ox=mL-x0*s; this.oy=mT+y1*s; this.b=[]; this.bb=bb;
  this.mT=mT; this.mB=mB; this.mL=mL; this.mR=mR;
}
View.prototype.X=function(x){ return this.ox+this.s*x; };
View.prototype.Y=function(y){ return this.oy-this.s*y; };
View.prototype.add=function(t){ this.b.push(t); return this; };
View.prototype.txt=function(px,py,t,o){ o=o||{};
  return this.add('<text x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" font-size="'+(o.size||13)+
   '" fill="'+(o.col||'#1a1a1a')+'" text-anchor="'+(o.anchor||'middle')+'" font-weight="'+(o.weight||'normal')+
   '" font-family="Segoe UI,Arial,sans-serif">'+t+'</text>'); };
View.prototype.line=function(x1,y1,x2,y2,o){ o=o||{};
  return this.add('<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+
   '" stroke="'+(o.col||GREY)+'" stroke-width="'+(o.sw||1.2)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+
   (o.marker?' marker-end="url(#'+o.marker+')"':'')+'/>'); };
View.prototype.mline=function(a,b,o){ return this.line(this.X(a[0]),this.Y(a[1]),this.X(b[0]),this.Y(b[1]),o); };

function bbox(parts){
  var x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  parts.forEach(function(p){
    var e;
    if(p.k==='rect') e=[p.x,p.y,p.x+p.w,p.y+p.h];
    else if(p.k==='tri'){ var xs=p.p.map(function(q){return q[0];}), ys=p.p.map(function(q){return q[1];});
      e=[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]; }
    else e=[p.cx-p.r,p.cy-p.r,p.cx+p.r,p.cy+p.r];
    x0=Math.min(x0,e[0]); y0=Math.min(y0,e[1]); x1=Math.max(x1,e[2]); y1=Math.max(y1,e[3]);
  });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}

/* draw one part */
View.prototype.part=function(p,hole){
  var fill = hole ? '#ffffff' : FILL, op = hole ? 1 : 0.8,
      stroke = hole ? CUT : NAVY, dash = hole ? '7,5' : null, sw = hole ? 1.6 : 2, self=this;
  function poly(pts){
    var d=pts.map(function(q){ return self.X(q[0]).toFixed(1)+','+self.Y(q[1]).toFixed(1); }).join(' ');
    self.add('<polygon points="'+d+'" fill="'+fill+'" fill-opacity="'+op+'" stroke="'+stroke+
             '" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>');
  }
  if(p.k==='rect') poly([[p.x,p.y],[p.x+p.w,p.y],[p.x+p.w,p.y+p.h],[p.x,p.y+p.h]]);
  else if(p.k==='tri') poly(p.p);
  else if(p.k==='circ')
    this.add('<circle cx="'+this.X(p.cx).toFixed(1)+'" cy="'+this.Y(p.cy).toFixed(1)+'" r="'+(p.r*this.s).toFixed(1)+
      '" fill="'+fill+'" fill-opacity="'+op+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>');
  else if(p.k==='semi'){
    var D={up:[1,0],down:[-1,0],left:[0,1],right:[0,-1]}[p.dir];   /* flat-edge direction */
    var a=[p.cx-D[0]*p.r, p.cy-D[1]*p.r], b=[p.cx+D[0]*p.r, p.cy+D[1]*p.r], rr=p.r*this.s;
    this.add('<path d="M'+this.X(a[0]).toFixed(1)+','+this.Y(a[1]).toFixed(1)+' A'+rr.toFixed(1)+','+rr.toFixed(1)+
      ' 0 0 1 '+this.X(b[0]).toFixed(1)+','+this.Y(b[1]).toFixed(1)+' Z" fill="'+fill+'" fill-opacity="'+op+
      '" stroke="'+stroke+'" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>');
  }
  return this;
};

/* dimension lines */
View.prototype.hdim=function(x1,x2,y,label,off,size,lx){
  var Y=this.Y(y)+(off||0), a=this.X(x1), b=this.X(x2), t=5;
  this.line(a,Y,b,Y,{sw:1});
  this.line(a,Y-t,a,Y+t,{sw:1}); this.line(b,Y-t,b,Y+t,{sw:1});
  this.line(a,Y,a+9,Y-3.5,{sw:1}); this.line(a,Y,a+9,Y+3.5,{sw:1});
  this.line(b,Y,b-9,Y-3.5,{sw:1}); this.line(b,Y,b-9,Y+3.5,{sw:1});
  return this.txt((a+b)/2+(lx||0),Y-7,label,{size:size||12.5,col:GREY});
};
View.prototype.vdim=function(y1,y2,x,label,off,size,right){
  var X=this.X(x)+(off||0), a=this.Y(y1), b=this.Y(y2), t=5;
  this.line(X,a,X,b,{sw:1});
  this.line(X-t,a,X+t,a,{sw:1}); this.line(X-t,b,X+t,b,{sw:1});
  this.line(X,a,X-3.5,a-9,{sw:1}); this.line(X,a,X+3.5,a-9,{sw:1});
  this.line(X,b,X-3.5,b+9,{sw:1}); this.line(X,b,X+3.5,b+9,{sw:1});
  return this.txt(X+(right?9:-9),(a+b)/2+4,label,{size:size||12.5,col:GREY,anchor:right?'start':'end'});
};
View.prototype.axes=function(labels){
  labels=labels||['x','y'];
  this.line(4,this.oy,this.W-6,this.oy,{col:'#000',sw:1.4,dash:'7,4',marker:'arrow'});
  this.line(this.ox,this.H-4,this.ox,14,{col:'#000',sw:1.4,dash:'7,4',marker:'arrow'});
  this.txt(this.W-10,this.oy+17,labels[0],{size:14,weight:'bold'});
  this.txt(this.ox-13,24,labels[1],{size:14,weight:'bold'});
  return this;
};
View.prototype.dot=function(x,y,label,dx,dy,col){
  this.add('<circle cx="'+this.X(x).toFixed(1)+'" cy="'+this.Y(y).toFixed(1)+'" r="4.6" fill="'+(col||ORANGE)+'"/>');
  if(label) this.txt(this.X(x)+(dx||0),this.Y(y)+(dy||-11),label,{size:12.5,col:col||ORANGE,weight:'bold'});
  return this;
};
View.prototype.render=function(){
  return '<svg viewBox="0 0 '+this.W.toFixed(0)+' '+this.H.toFixed(0)+'" width="100%" style="max-width:'+this.W.toFixed(0)+
   'px" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">'+
   '<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">'+
   '<path d="M0,0 L0,6 L8,3 z" fill="#000"/></marker></defs>'+this.b.join('')+'</svg>';
};

/* one-call figure for a section */
function sectionFig(v, opt){
  opt = opt || {};
  var o=v.fig||{}, parts=v.parts;
  var V=new View(parts,{W:o.W||opt.W||720, pad:o.pad, mL:o.mL, mR:o.mR, mT:o.mT, mB:o.mB});
  parts.forEach(function(p){ if((p.sign||1)>0) V.part(p,false); });
  parts.forEach(function(p){ if((p.sign||1)<0) V.part(p,true); });
  V.axes(v.axLabels);
  V.txt(V.ox-13,V.oy+18,v.originName||'O',{size:14,weight:'bold'});
  /* part marks */
  parts.forEach(function(p,i){
    var c = p.at || pC(p);
    V.txt(V.X(c[0]), V.Y(c[1])+5, CIRCLED[i], {size:15, col:(p.sign||1)<0?CUT:NAVY, weight:'bold'});
  });
  (v.dims||[]).forEach(function(d){
    if(d[0]==='h') V.hdim(d[1],d[2],d[3],d[4],d[5],d[6],d[7]);
    else           V.vdim(d[1],d[2],d[3],d[4],d[5],d[6],d[7]);
  });
  (v.notes||[]).forEach(function(t){ V.txt(V.X(t[0]),V.Y(t[1]),t[2],{size:t[4]||12,col:t[3]||GREY,anchor:t[5]||'middle'}); });
  if(opt.centroid) V.dot(opt.centroid[0],opt.centroid[1],opt.centroidLabel,opt.cdx,opt.cdy);
  (opt.extra||[]).forEach(function(fn){ fn(V); });
  return V.render();
}

/* ═══════════════ shared block helpers ═══════════════ */
function stepBlock(n,title,summary,body){
  return '<div class="step"><div class="step-heading" style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'+
    '<div class="step-num">'+n+'</div><div class="step-title">'+title+'</div>'+
    '<div class="try-hint">Try it first, then reveal &darr;</div></div>'+
    '<details><summary><span class="step-label" style="font-size:12px;font-weight:500;color:#f97316;margin-right:4px">Step '+n+
    '</span> '+summary+'</summary><div class="step-body">'+body+'</div></details></div>';
}
function mb(t){ return '<div class="math-block">$$'+t+'$$</div>'; }
function co(cls,t){ return '<div class="callout '+cls+'">'+t+'</div>'; }
function fig(svg,cap){ return '<div class="diagram-wrap"><figure>'+svg+'<figcaption>'+cap+'</figcaption></figure></div>'; }
function mistakes(list){
  return co('warn','<p><strong>Common mistakes:</strong></p>'+list.map(function(m,i){
    return '<p style="margin-top:7px">'+CIRCLED[i]+' '+m+'</p>'; }).join(''));
}

/* ═══════════════ automatic part descriptions ═══════════════ */
function triLegs(p){                       /* right triangle with legs on the axes? */
  var q=p.p;
  for(var i=0;i<3;i++) for(var j=0;j<3;j++){ if(i===j) continue;
    var kk=3-i-j;
    if(Math.abs(q[i][0]-q[j][0])<1e-9 && Math.abs(q[i][1]-q[kk][1])<1e-9)
      return {b:Math.abs(q[kk][0]-q[i][0]), h:Math.abs(q[j][1]-q[i][1])};
  }
  return null;
}
function pDesc(p,i){
  var s=(p.sign||1)<0, tail = s? ' &mdash; <em>subtracted</em>':'';
  if(p.desc) return p.desc+tail;
  switch(p.k){
    case 'rect': return 'rectangle '+fxh(p.w)+' &times; '+fxh(p.h)+' mm, spanning $x = '+fxh(p.x)+' \\to '+fxh(p.x+p.w)+
                        '$, $y = '+fxh(p.y)+' \\to '+fxh(p.y+p.h)+'$ mm'+tail;
    case 'tri' : var L=triLegs(p);
                 return 'right triangle'+(L?', legs '+fxh(L.b)+' &times; '+fxh(L.h)+' mm':'')+', vertices '+
                        p.p.map(function(q){return '$('+fxh(q[0])+',\\,'+fxh(q[1])+')$';}).join(', ')+' mm'+tail;
    case 'circ': return 'circle $r = '+fxh(p.r)+'$ mm, centre $('+fxh(p.cx)+',\\,'+fxh(p.cy)+')$ mm'+tail;
    case 'semi': return 'semicircle $r = '+fxh(p.r)+'$ mm, flat edge centred at $('+fxh(p.cx)+',\\,'+fxh(p.cy)+
                        ')$ mm, bulging '+p.dir+tail;
  }
}
function pAreaMath(p){
  var A=pArea(p), s=(p.sign||1)<0?'-':'';
  switch(p.k){
    case 'rect': return s+fx(p.w)+' \\times '+fx(p.h)+' = '+s+fx(A)+'\\text{ mm}^2';
    case 'tri' : var L=triLegs(p);
                 return (L? s+'\\tfrac{1}{2} \\times '+fx(L.b)+' \\times '+fx(L.h)+' = ' : s)+s+fx(A)+'\\text{ mm}^2';
    case 'circ': return s+'\\pi r^2 = '+s+'\\pi ('+fx(p.r)+')^2 = '+s+fx(A,1)+'\\text{ mm}^2';
    case 'semi': return s+'\\tfrac{1}{2}\\pi r^2 = '+s+'\\tfrac{1}{2}\\pi ('+fx(p.r)+')^2 = '+s+fx(A,1)+'\\text{ mm}^2';
  }
}
function pCMath(p){
  var c=pC(p);
  switch(p.k){
    case 'rect': return '\\bar{x} = \\tfrac{'+fx(p.x)+'+'+fx(p.x+p.w)+'}{2} = '+fx(c[0],2)+
                        '\\text{ mm} \\qquad \\bar{y} = \\tfrac{'+fx(p.y)+'+'+fx(p.y+p.h)+'}{2} = '+fx(c[1],2)+'\\text{ mm}';
    case 'tri' : var q=p.p;
                 return '\\bar{x} = \\tfrac{'+fx(q[0][0])+'+'+fx(q[1][0])+'+'+fx(q[2][0])+'}{3} = '+fx(c[0],2)+
                        '\\text{ mm} \\qquad \\bar{y} = \\tfrac{'+fx(q[0][1])+'+'+fx(q[1][1])+'+'+fx(q[2][1])+'}{3} = '+fx(c[1],2)+'\\text{ mm}';
    case 'circ': return '\\bar{x} = '+fx(c[0],2)+'\\text{ mm} \\qquad \\bar{y} = '+fx(c[1],2)+'\\text{ mm}';
    case 'semi': return '\\frac{4r}{3\\pi} = \\frac{4('+fx(p.r)+')}{3\\pi} = '+fx(4*p.r/(3*Math.PI),2)+
                        '\\text{ mm} \\quad\\Rightarrow\\quad \\bar{x} = '+fx(c[0],2)+'\\text{ mm},\\ \\ \\bar{y} = '+fx(c[1],2)+'\\text{ mm}';
  }
}
function pIbarMath(p){
  switch(p.k){
    case 'rect': return '\\bar{I}_x = \\tfrac{bh^3}{12} = \\tfrac{'+fx(p.w)+'\\times'+fx(p.h)+'^3}{12} = '+fx(pIbar(p)[0],0)+
                        ' \\qquad \\bar{I}_y = \\tfrac{hb^3}{12} = \\tfrac{'+fx(p.h)+'\\times'+fx(p.w)+'^3}{12} = '+fx(pIbar(p)[1],0);
    case 'tri' : var L=triLegs(p), I=pIbar(p);
                 return L ? '\\bar{I}_x = \\tfrac{bh^3}{36} = \\tfrac{'+fx(L.b)+'\\times'+fx(L.h)+'^3}{36} = '+fx(I[0],0)+
                            ' \\qquad \\bar{I}_y = \\tfrac{hb^3}{36} = \\tfrac{'+fx(L.h)+'\\times'+fx(L.b)+'^3}{36} = '+fx(I[1],0)
                          : '\\bar{I}_x = '+fx(I[0],0)+' \\qquad \\bar{I}_y = '+fx(I[1],0);
    case 'circ': return '\\bar{I}_x = \\bar{I}_y = \\tfrac{\\pi r^4}{4} = \\tfrac{\\pi ('+fx(p.r)+')^4}{4} = '+fx(pIbar(p)[0],0);
    case 'semi': var I=pIbar(p);
                 return '\\bar{I}_x = '+fx(I[0],0)+' \\qquad \\bar{I}_y = '+fx(I[1],0)+
                        '\\quad\\text{(from }\\tfrac{\\pi r^4}{8}\\text{, shifted by }\\tfrac{4r}{3\\pi}\\text{ where needed)}';
  }
}

/* ═══════════════ BUILDER 1 — centroid of a composite area ═══════════════ */
function buildCentroid(cfg, v){
  var R=reduce(v.parts), h='';
  h += '<h3>Problem Statement</h3><p>'+(v.question||cfg.question)+'</p>';
  h += co('given','<p><strong>Answer:</strong> &nbsp; $\\bar{x} = '+fx(R.xb,1)+'\\ \\text{mm}$ &nbsp;&nbsp; $\\bar{y} = '+
        fx(R.yb,1)+'\\ \\text{mm}$'+(v.book?' &nbsp;&nbsp;<span style="font-size:13px;color:#555">(tutorial sheet: '+v.book+')</span>':'')+'</p>');
  h += fig(sectionFig(v,{W:cfg.figW||720,
        centroid:[R.xb,R.yb], centroidLabel:'C ('+fxh(R.xb,1)+', '+fxh(R.yb,1)+')', cdx:v.cdx||10, cdy:v.cdy||-12}),
        v.caption||'Composite area and its decomposition. The orange dot is the computed centroid C. Dimensions in millimetres.');
  h += co('info','<p><strong>Composite area method:</strong></p>'+
      mb('\\bar{x} = \\frac{\\sum A_i\\,\\bar{x}_i}{\\sum A_i} \\qquad \\bar{y} = \\frac{\\sum A_i\\,\\bar{y}_i}{\\sum A_i}')+
      '<p>Holes, notches and cut-outs are <strong>negative areas</strong>: they enter the numerator and the denominator with a minus sign.</p>');

  h += '<h3>Solution</h3>';
  /* step 1 */
  var b1 = '<p>Place the origin at '+(v.originText||'the bottom-left corner')+'. The section decomposes into '+
           R.rows.length+' parts:</p><ul>'+
           R.rows.map(function(r){ return '<li><strong>'+r.mark+'</strong> &mdash; '+pDesc(r.p,r.i)+'</li>'; }).join('')+'</ul>';
  if(v.splitNote) b1 += co('note','<p>'+v.splitNote+'</p>');
  b1 += co('warn','<p><strong>Every point of the section must belong to exactly one positive part.</strong> '+
      'Overlapping parts double-count material; gaps lose it. Before going further, check the gross area of your parts against '+
      'the area you can compute from the outline.</p>');
  h += stepBlock(1,'Set up the axes and decompose the section','which parts, and where the origin sits',b1);

  /* step 2 */
  var b2 = R.rows.map(function(r){
    return '<p><strong>'+r.mark+' '+(r.p.title||'')+'</strong></p>'+mb('A_{'+(r.i+1)+'} = '+pAreaMath(r.p)); }).join('');
  b2 += '<p>Net area:</p>'+mb('A = \\sum A_i = '+fx(R.A,1)+'\\text{ mm}^2');
  h += stepBlock(2,'Area of each part','remember the sign of every hole',b2);

  /* step 3 */
  var b3 = R.rows.map(function(r){
    return '<p><strong>'+r.mark+'</strong></p>'+mb(pCMath(r.p)); }).join('');
  if(R.rows.some(function(r){return r.p.k==='tri';}))
    b3 += co('info','<p>For a triangle the centroid is the <strong>average of the three vertices</strong>. '+
      'That rule works in any orientation, which is why it is safer than trying to remember which leg the &ldquo;one third&rdquo; is measured from.</p>');
  if(R.rows.some(function(r){return r.p.k==='semi';}))
    b3 += co('info','<p>A semicircle&rsquo;s centroid does <em>not</em> lie on its flat edge: it sits $4r/3\\pi$ from the flat edge, toward the bulge.</p>');
  h += stepBlock(3,'Locate the centroid of each part','standard shapes, one at a time',b3);

  /* step 4 */
  var rows = R.rows.map(function(r){
    return '<tr><td class="left">'+r.mark+' '+r.name+'</td><td>'+fxh(r.A,1)+'</td><td>'+fxh(r.x,2)+'</td><td>'+
      fxh(r.y,2)+'</td><td>'+fxh(r.A*r.x,0)+'</td><td>'+fxh(r.A*r.y,0)+'</td></tr>'; }).join('');
  var b4 = '<table><tr><th>Part</th><th>$A_i$ (mm&sup2;)</th><th>$\\bar{x}_i$ (mm)</th><th>$\\bar{y}_i$ (mm)</th>'+
    '<th>$A_i\\bar{x}_i$ (mm&sup3;)</th><th>$A_i\\bar{y}_i$ (mm&sup3;)</th></tr>'+rows+
    '<tr class="total"><td class="left">&Sigma;</td><td>'+fxh(R.A,1)+'</td><td>&mdash;</td><td>&mdash;</td><td>'+
    fxh(R.Sx,0)+'</td><td>'+fxh(R.Sy,0)+'</td></tr></table>'+
    mb('\\bar{x} = \\frac{'+fx(R.Sx,0)+'}{'+fx(R.A,1)+'} = '+fx(R.xb,2)+'\\text{ mm} \\qquad \\bar{y} = \\frac{'+
       fx(R.Sy,0)+'}{'+fx(R.A,1)+'} = '+fx(R.yb,2)+'\\text{ mm}')+
    co('answer','<p>'+mb('\\bar{x} = '+fx(R.xb,1)+'\\text{ mm} \\qquad \\bar{y} = '+fx(R.yb,1)+'\\text{ mm}')+'</p>');
  if(v.check) b4 += co('note','<p>'+v.check+'</p>');
  h += stepBlock(4,'Summary table and final answer','first moments, then one division',b4);

  /* mistakes */
  var mis=[];
  if(R.rows.some(function(r){return r.sign<0;}))
    mis.push('<strong>Subtracting a hole from the area but not from the first moment.</strong> A void must be negative in <em>both</em> sums. '+
      'Dropping it from the numerator alone gives $\\bar{y} = '+fx((R.Sy-R.rows.filter(function(r){return r.sign<0;})
      .reduce(function(a,r){return a+r.A*r.y;},0))/R.A,2)+'$ mm instead of '+fx(R.yb,2)+' mm.');
  mis.push('<strong>Overlapping decomposition.</strong> If two positive parts share a region, that region is counted twice. '+
      'Split the section along a single clean line and assign every corner block to exactly one part.');
  if(R.rows.some(function(r){return r.p.k==='tri';}))
    mis.push('<strong>Using $h/2$ for a triangle.</strong> The centroid of a triangle is at one third of the height from the base, not half.');
  mis.push('<strong>Measuring a part&rsquo;s centroid from its own edge instead of from the origin.</strong> '+
      'A distance <em>within</em> a part must be added to that part&rsquo;s offset before it enters the table.');
  mis.push('<strong>Not checking the answer against the figure.</strong> The centroid must lie between the extreme coordinates of the section, '+
      'and it should sit toward the bulkiest region. On a re-entrant shape (an L or a channel) it may legitimately fall outside the material.');
  if(v.mistakes) mis = v.mistakes.concat(mis);
  h += '<h3>Common Mistakes</h3>'+mistakes(mis.slice(0,5));
  return h;
}

/* ═══════════════ BUILDER 2 — second moments / polar moment ═══════════════ */
function buildInertia(cfg, v){
  var R=reduce(v.parts), h='', ax, ay, axName;
  if(v.about==='centroid'){ ax=R.xb; ay=R.yb; axName='the centroidal axes through C'; }
  else { ax=(v.origin||[0,0])[0]; ay=(v.origin||[0,0])[1]; axName='the $x$&ndash;$y$ axes shown, through '+(v.originName||'O'); }
  var I=inertiaAbout(R,ax,ay), wantJ=(v.want||{}).J, wantK=(v.want||{}).k;

  h += '<h3>Problem Statement</h3><p>'+(v.question||cfg.question)+'</p>';
  var ans='$I_x = '+eng(I.Ix)+'\\ \\text{mm}^4$ &nbsp;&nbsp; $I_y = '+eng(I.Iy)+'\\ \\text{mm}^4$';
  if(wantJ) ans += ' &nbsp;&nbsp; $J = '+eng(I.J)+'\\ \\text{mm}^4$';
  if(wantK) ans += ' &nbsp;&nbsp; $k = '+fx(I.k,1)+'\\ \\text{mm}$';
  h += co('given','<p><strong>Answer:</strong> &nbsp; '+ans+(v.book?' &nbsp;&nbsp;<span style="font-size:13px;color:#555">(tutorial sheet: '+v.book+')</span>':'')+'</p>');
  h += fig(sectionFig(v,{W:cfg.figW||720,
        centroid: v.about==='centroid'?[R.xb,R.yb]:null,
        centroidLabel: v.about==='centroid'?('C ('+fxh(R.xb,1)+', '+fxh(R.yb,1)+')'):null, cdx:v.cdx||10, cdy:v.cdy||-12}),
        v.caption||'Section and its decomposition. Dimensions in millimetres.');

  h += co('info','<p><strong>Parallel axis theorem</strong> &mdash; the whole problem reduces to this, applied part by part:</p>'+
      mb('I_x = \\bar{I}_x + A\\,d_y^{\\,2} \\qquad I_y = \\bar{I}_y + A\\,d_x^{\\,2}')+
      '<p>$\\bar{I}$ is the second moment about the part&rsquo;s <em>own</em> centroidal axis; $d_y$ is the perpendicular distance '+
      'from that axis to the reference $x$-axis, and $d_x$ to the reference $y$-axis. Transfer distances are <strong>squared</strong>, '+
      'so they are always positive &mdash; and a part far from the axis dominates the total.</p>');

  h += '<h3>Solution</h3>';
  var st=1;
  /* step: geometry / centroid */
  var b1='<p>The section decomposes into '+R.rows.length+' parts:</p><ul>'+
     R.rows.map(function(r){ return '<li><strong>'+r.mark+'</strong> &mdash; '+pDesc(r.p,r.i)+'</li>'; }).join('')+'</ul>';
  if(v.about==='centroid'){
    b1 += '<p>The moments are wanted about the <strong>centroidal</strong> axes, so the centroid must be found first:</p>'+
      '<table><tr><th>Part</th><th>$A_i$ (mm&sup2;)</th><th>$\\bar{x}_i$</th><th>$\\bar{y}_i$</th><th>$A_i\\bar{x}_i$</th><th>$A_i\\bar{y}_i$</th></tr>'+
      R.rows.map(function(r){ return '<tr><td class="left">'+r.mark+' '+r.name+'</td><td>'+fxh(r.A,1)+'</td><td>'+fxh(r.x,2)+
        '</td><td>'+fxh(r.y,2)+'</td><td>'+fxh(r.A*r.x,0)+'</td><td>'+fxh(r.A*r.y,0)+'</td></tr>'; }).join('')+
      '<tr class="total"><td class="left">&Sigma;</td><td>'+fxh(R.A,1)+'</td><td>&mdash;</td><td>&mdash;</td><td>'+
      fxh(R.Sx,0)+'</td><td>'+fxh(R.Sy,0)+'</td></tr></table>'+
      mb('\\bar{x} = '+fx(R.xb,2)+'\\text{ mm} \\qquad \\bar{y} = '+fx(R.yb,2)+'\\text{ mm}');
  } else {
    b1 += '<p>The reference axes are '+axName+'. No centroid calculation is needed &mdash; the transfer distances are read straight off the figure:</p>';
  }
  b1 += '<p>Transfer distances from each part&rsquo;s own centroid to the reference axes:</p>'+
    '<table><tr><th>Part</th><th>$A_i$ (mm&sup2;)</th><th>$\\bar{x}_i$ (mm)</th><th>$\\bar{y}_i$ (mm)</th>'+
    '<th>$d_x = \\bar{x}_i - '+fx(ax,2)+'$</th><th>$d_y = \\bar{y}_i - '+fx(ay,2)+'$</th></tr>'+
    R.rows.map(function(r){ return '<tr><td class="left">'+r.mark+' '+r.name+'</td><td>'+fxh(r.A,1)+'</td><td>'+
      fxh(r.x,2)+'</td><td>'+fxh(r.y,2)+'</td><td>'+fxh(r.dx,2)+'</td><td>'+fxh(r.dy,2)+'</td></tr>'; }).join('')+'</table>';
  if(v.setupNote) b1 += co('note','<p>'+v.setupNote+'</p>');
  h += stepBlock(st++, v.about==='centroid'?'Decompose the section and locate the centroid':'Decompose the section and read off the transfer distances',
        'areas, part centroids, and $d_x$, $d_y$', b1);

  /* step: Ibar of each part */
  var b2 = R.rows.map(function(r){
    return '<p><strong>'+r.mark+' '+r.name+'</strong></p>'+mb(pIbarMath(r.p)); }).join('')+
    co('note','<p>These are the values <em>about each part&rsquo;s own centroid</em> &mdash; they know nothing yet about where the part sits. '+
      'The position enters only through the transfer term $A d^2$ in the next step.</p>');
  h += stepBlock(st++,'Centroidal second moments of each part','$bh^3/12$, $bh^3/36$, $\\pi r^4/4$ &hellip;',b2);

  /* step: Ix */
  var b3='<p>Apply $I_x = \\bar{I}_x + A d_y^2$ to every part and add:</p>'+
    '<table><tr><th>Part</th><th>$\\bar{I}_x$ (mm&#8308;)</th><th>$A$ (mm&sup2;)</th><th>$d_y$ (mm)</th><th>$A d_y^2$ (mm&#8308;)</th><th>$I_x$ (mm&#8308;)</th></tr>'+
    R.rows.map(function(r){ return '<tr><td class="left">'+r.mark+' '+r.name+'</td><td>'+fxh(r.Ibx,0)+'</td><td>'+fxh(r.A,1)+
      '</td><td>'+fxh(r.dy,2)+'</td><td>'+fxh(r.A*r.dy*r.dy,0)+'</td><td>'+fxh(r.Ix,0)+'</td></tr>'; }).join('')+
    '<tr class="total"><td class="left">&Sigma;</td><td>&mdash;</td><td>'+fxh(R.A,1)+'</td><td>&mdash;</td><td>&mdash;</td><td>'+fxh(I.Ix,0)+'</td></tr></table>'+
    co('answer','<p>'+mb('I_x = '+eng(I.Ix)+'\\text{ mm}^4')+'</p>');
  h += stepBlock(st++,'Second moment about the $x$-axis, $I_x$','parallel axis theorem, part by part',b3);

  /* step: Iy */
  var b4='<p>Now $I_y = \\bar{I}_y + A d_x^2$:</p>'+
    '<table><tr><th>Part</th><th>$\\bar{I}_y$ (mm&#8308;)</th><th>$A$ (mm&sup2;)</th><th>$d_x$ (mm)</th><th>$A d_x^2$ (mm&#8308;)</th><th>$I_y$ (mm&#8308;)</th></tr>'+
    R.rows.map(function(r){ return '<tr><td class="left">'+r.mark+' '+r.name+'</td><td>'+fxh(r.Iby,0)+'</td><td>'+fxh(r.A,1)+
      '</td><td>'+fxh(r.dx,2)+'</td><td>'+fxh(r.A*r.dx*r.dx,0)+'</td><td>'+fxh(r.Iy,0)+'</td></tr>'; }).join('')+
    '<tr class="total"><td class="left">&Sigma;</td><td>&mdash;</td><td>'+fxh(R.A,1)+'</td><td>&mdash;</td><td>&mdash;</td><td>'+fxh(I.Iy,0)+'</td></tr></table>'+
    co('answer','<p>'+mb('I_y = '+eng(I.Iy)+'\\text{ mm}^4')+'</p>');
  h += stepBlock(st++,'Second moment about the $y$-axis, $I_y$','same theorem, distances measured the other way',b4);

  /* step: J and k */
  if(wantJ||wantK){
    var b5='<p>The polar second moment about the reference point follows from the perpendicular axis theorem &mdash; no new integration is needed:</p>'+
      mb('J = I_x + I_y = '+fx(I.Ix,0)+' + '+fx(I.Iy,0)+' = '+eng(I.J)+'\\text{ mm}^4');
    if(wantK) b5 += '<p>The polar radius of gyration is the radius at which the whole area could be concentrated as a thin ring '+
      'without changing $J$:</p>'+
      mb('k = \\sqrt{\\frac{J}{A}} = \\sqrt{\\frac{'+fx(I.J,0)+'}{'+fx(R.A,1)+'}} = '+fx(I.k,2)+'\\text{ mm}')+
      co('note','<p>Compare $k = '+fx(I.k,1)+'$ mm with the size of the section. It should land somewhere in the outer half of the '+
        'material &mdash; a radius of gyration much smaller than the section, or larger than its extreme fibre, means an arithmetic slip.</p>');
    b5 += co('answer','<p>'+mb((wantJ?'J = '+eng(I.J)+'\\text{ mm}^4':'')+(wantJ&&wantK?' \\qquad ':'')+(wantK?'k = '+fx(I.k,1)+'\\text{ mm}':''))+'</p>');
    h += stepBlock(st++,'Polar second moment'+(wantK?' and radius of gyration':''),'$J = I_x + I_y$',b5);
  }

  /* summary */
  var b6='<table><tr><th>Quantity</th><th>Value</th><th>Units</th></tr>'+
    '<tr><td class="left">Net area $A$</td><td>'+fxh(R.A,1)+'</td><td>mm&sup2;</td></tr>'+
    (v.about==='centroid'?'<tr><td class="left">Centroid $(\\bar{x}, \\bar{y})$</td><td>('+fxh(R.xb,2)+', '+fxh(R.yb,2)+')</td><td>mm</td></tr>':'')+
    '<tr><td class="left">$I_x$</td><td>'+fxh(I.Ix,0)+'</td><td>mm&#8308;</td></tr>'+
    '<tr><td class="left">$I_y$</td><td>'+fxh(I.Iy,0)+'</td><td>mm&#8308;</td></tr>'+
    '<tr class="total"><td class="left">$J = I_x+I_y$</td><td>'+fxh(I.J,0)+'</td><td>mm&#8308;</td></tr>'+
    '<tr><td class="left">$k_x = \\sqrt{I_x/A}$</td><td>'+fxh(I.kx,2)+'</td><td>mm</td></tr>'+
    '<tr><td class="left">$k_y = \\sqrt{I_y/A}$</td><td>'+fxh(I.ky,2)+'</td><td>mm</td></tr>'+
    '<tr><td class="left">$k = \\sqrt{J/A}$</td><td>'+fxh(I.k,2)+'</td><td>mm</td></tr></table>'+
    co('note','<p><strong>Consistency check:</strong> $k_x^2 + k_y^2 = '+fx(I.kx*I.kx+I.ky*I.ky,1)+' = k^2 = '+
      fx(I.k*I.k,1)+'$ mm&sup2;. &#10003; This follows directly from $J = I_x + I_y$ and is a quick way to catch a slip.</p>');
  if(v.check) b6 += co('note','<p>'+v.check+'</p>');
  h += stepBlock(st++,'Summary','all results in one place',b6);

  var mis=[];
  mis.push('<strong>Forgetting the transfer term.</strong> Adding only the $\\bar{I}$ column gives $I_x = '+
    fx(R.rows.reduce(function(a,r){return a+r.Ibx;},0),0)+'$ mm&#8308; instead of '+fx(I.Ix,0)+' mm&#8308;. '+
    'For parts far from the axis, $Ad^2$ is usually the <em>larger</em> term.');
  mis.push('<strong>Swapping $b$ and $h$.</strong> $\\bar{I}_x = bh^3/12$ cubes the dimension <em>perpendicular</em> to the axis. '+
    'Getting this backwards on a tall thin part changes the answer by a large factor.');
  mis.push('<strong>Using $d$ instead of $d^2$, or carrying a sign.</strong> Transfer distances are squared, so their sign is irrelevant &mdash; '+
    'but the <em>part&rsquo;s</em> sign is not: a hole subtracts both $\\bar{I}$ and $Ad^2$.');
  if(R.rows.some(function(r){return r.p.k==='tri';}))
    mis.push('<strong>Using $bh^3/12$ for a triangle.</strong> About its own centroid a triangle gives $bh^3/36$; $bh^3/12$ is the value about its base.');
  if(wantK) mis.push('<strong>Computing $k$ with the gross area.</strong> $k = \\sqrt{J/A}$ needs the <em>net</em> area '+
    fx(R.A,1)+' mm&sup2;. Using the gross area gives a smaller, wrong radius of gyration.');
  mis.push('<strong>Mixing reference axes between $I_x$ and $I_y$.</strong> Both must be taken about the same point, or $J = I_x + I_y$ is meaningless.');
  if(v.mistakes) mis = v.mistakes.concat(mis);
  h += '<h3>Common Mistakes</h3>'+mistakes(mis.slice(0,5));
  return h;
}

/* ═══════════════ BUILDER 3 — balancing a rotating disk ═══════════════
   Holes: [{d, r, ang}]  (ang in degrees, anticlockwise from +x).
   One further hole of unknown diameter D at radius ru and unknown angle θ
   must bring the mass centre back to O.  Solving ΣA_i x_i = ΣA_i y_i = 0:
       A_D·ru·cosθ = −Mx ,  A_D·ru·sinθ = −My
   so θ = atan2(−My,−Mx) and A_D = |M|/ru.                                */
function solveBalance(v){
  var Mx=0, My=0, hs=v.holes.map(function(o){
    var A=Math.PI*o.d*o.d/4, t=o.ang*Math.PI/180,
        x=o.r*Math.cos(t), y=o.r*Math.sin(t);
    Mx+=A*x; My+=A*y;
    return {d:o.d,r:o.r,ang:o.ang,A:A,x:x,y:y,Ax:A*x,Ay:A*y,name:o.name};
  });
  var ru=v.ru, th=Math.atan2(-My,-Mx), Au=Math.hypot(Mx,My)/ru, D=Math.sqrt(4*Au/Math.PI);
  var deg=(th*180/Math.PI+360)%360;
  return {hs:hs,Mx:Mx,My:My,ru:ru,th:th,deg:deg,Au:Au,D:D,
          x:ru*Math.cos(th), y:ru*Math.sin(th)};
}
function diskFig(v,S){
  var Rd=v.R, V=new View([{k:'circ',cx:0,cy:0,r:Rd}],{W:v.figW||620,pad:0.02,mL:132,mR:132,mT:58,mB:58});
  V.add('<circle cx="'+V.X(0).toFixed(1)+'" cy="'+V.Y(0).toFixed(1)+'" r="'+(Rd*V.s).toFixed(1)+
        '" fill="'+FILL+'" fill-opacity="0.5" stroke="'+NAVY+'" stroke-width="2"/>');
  var radii={}; S.hs.forEach(function(o){radii[o.r]=1;}); radii[S.ru]=1;
  Object.keys(radii).forEach(function(rr){
    V.add('<circle cx="'+V.X(0).toFixed(1)+'" cy="'+V.Y(0).toFixed(1)+'" r="'+(rr*V.s).toFixed(1)+
          '" fill="none" stroke="'+GREY+'" stroke-width="1" stroke-dasharray="9,4,2,4" opacity="0.6"/>');
  });
  V.axes(['x','y']);
  function place(ang,txt,col,size){
    var t=ang*Math.PI/180, c=Math.cos(t), sn=Math.sin(t);
    var px=V.X(Rd*1.06*c), py=V.Y(Rd*1.06*sn)+4;
    if(Math.abs(sn)<0.30) py -= 15;            /* lift clear of the x-axis   */
    if(Math.abs(c) <0.30) py += (sn>0?-8:16);  /* clear of the disk edge      */
    V.txt(px,py,txt,{size:size||12,col:col,weight:'bold',anchor: c>0.25?'start':(c<-0.25?'end':'middle')});
  }
  S.hs.forEach(function(o,i){
    V.add('<circle cx="'+V.X(o.x).toFixed(1)+'" cy="'+V.Y(o.y).toFixed(1)+'" r="'+(o.d/2*V.s).toFixed(1)+
          '" fill="#fff" stroke="'+NAVY+'" stroke-width="1.8"/>');
    V.mline([0,0],[o.x,o.y],{col:GREY,sw:1,dash:'5,4'});
    V.txt(V.X(o.x),V.Y(o.y)+4,CIRCLED[i],{size:12,col:NAVY,weight:'bold'});
    place(o.ang, o.name || ('d = '+fxh(o.d)+' at r = '+fxh(o.r)), NAVY);
  });
  V.add('<circle cx="'+V.X(S.x).toFixed(1)+'" cy="'+V.Y(S.y).toFixed(1)+'" r="'+(S.D/2*V.s).toFixed(1)+
        '" fill="#fff" stroke="'+ORANGE+'" stroke-width="2" stroke-dasharray="7,5"/>');
  V.mline([0,0],[S.x,S.y],{col:ORANGE,sw:1.4,dash:'6,4'});
  V.txt(V.X(S.x),V.Y(S.y)+4,'?',{size:13,col:ORANGE,weight:'bold'});
  place(S.deg,'D at &#952;  (r = '+fxh(S.ru)+')',ORANGE,12.5);
  V.txt(V.ox-14,V.oy+19,'O',{size:14,weight:'bold'});
  return V.render();
}
function buildBalance(cfg,v){
  var S=solveBalance(v), h='';
  h += '<h3>Problem Statement</h3><p>'+(v.question||cfg.question)+'</p>';
  h += co('given','<p><strong>Answer:</strong> &nbsp; $\\theta = '+fx(S.deg,1)+'^\\circ$ &nbsp;&nbsp; $D = '+fx(S.D,2)+
        '\\ \\text{mm}$'+(v.exact?' &nbsp;&nbsp;<span style="font-size:13px;color:#555">(exactly '+v.exact+')</span>':'')+
        (v.book?' &nbsp;&nbsp;<span style="font-size:13px;color:#555">(tutorial sheet: '+v.book+')</span>':'')+'</p>');
  h += fig(diskFig(v,S), v.caption||('Disk of radius '+fxh(v.R)+' mm. Existing holes in navy; the balancing hole (dashed orange) '+
        'has unknown diameter $D$ and unknown angular position $\\theta$, measured anticlockwise from the positive $x$-axis. '+
        'Dash-dot circles are the pitch circles on which the holes lie.'));
  h += co('info','<p><strong>Balance condition.</strong> The disk is balanced when its mass centre stays at O. For a plate of uniform '+
      'thickness and density this is a pure <em>area</em> statement:</p>'+
      mb('\\bar{x} = \\frac{\\sum A_i \\bar{x}_i}{\\sum A_i} = 0 \\qquad \\bar{y} = \\frac{\\sum A_i \\bar{y}_i}{\\sum A_i} = 0')+
      '<p>Since $\\sum A_i \\neq 0$, the only way these can vanish is if the <strong>numerators</strong> do:</p>'+
      mb('\\sum A_i \\bar{x}_i = 0 \\qquad \\sum A_i \\bar{y}_i = 0')+
      '<p>Those are the two equations, and they carry the two unknowns $D$ and $\\theta$.</p>');

  h += '<h3>Solution</h3>';
  var b1='<p>Work with the <em>removed</em> areas only. The solid disk is symmetric about O, so it contributes nothing to either '+
    'first moment &mdash; it cancels out of both equations and can be ignored entirely. Each hole of diameter $d$ at radius $r$ and '+
    'angle $\\alpha$ has area $\\pi d^2/4$ and centroid $(r\\cos\\alpha,\\ r\\sin\\alpha)$.</p>'+
    '<table><tr><th>Hole</th><th>$d$ (mm)</th><th>$r$ (mm)</th><th>$\\alpha$</th><th>$A$ (mm&sup2;)</th>'+
    '<th>$\\bar{x}$ (mm)</th><th>$\\bar{y}$ (mm)</th><th>$A\\bar{x}$ (mm&sup3;)</th><th>$A\\bar{y}$ (mm&sup3;)</th></tr>'+
    S.hs.map(function(o,i){ return '<tr><td class="left">'+CIRCLED[i]+'</td><td>'+fxh(o.d)+'</td><td>'+fxh(o.r)+'</td><td>'+
      fxh(o.ang)+'&deg;</td><td>'+fxh(o.A,1)+'</td><td>'+fxh(o.x,2)+'</td><td>'+fxh(o.y,2)+'</td><td>'+fxh(o.Ax,0)+
      '</td><td>'+fxh(o.Ay,0)+'</td></tr>'; }).join('')+
    '<tr class="total"><td class="left">&Sigma; existing</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td>'+
    '<td>&mdash;</td><td>&mdash;</td><td>'+fxh(S.Mx,0)+'</td><td>'+fxh(S.My,0)+'</td></tr></table>'+
    co('note','<p>Every hole area is <em>positive</em> in this table. The sign information lives entirely in the coordinates '+
      '$\\bar{x}$ and $\\bar{y}$ &mdash; that is what makes a hole on the $-x$ side pull the balance the opposite way to one on $+x$.</p>');
  h += stepBlock(1,'Reduce the existing holes to a single unbalance','the solid disk contributes nothing &mdash; only the holes matter',b1);

  var b2='<p>Writing the balance equations with the unknown hole (area $A_D = \\pi D^2/4$, radius $r = '+fxh(S.ru)+'$ mm, angle $\\theta$):</p>'+
    mb('A_D\\,'+fx(S.ru)+'\\cos\\theta = -\\left(\\sum A_i\\bar{x}_i\\right) = '+fx(-S.Mx,0))+
    mb('A_D\\,'+fx(S.ru)+'\\sin\\theta = -\\left(\\sum A_i\\bar{y}_i\\right) = '+fx(-S.My,0))+
    '<p>Dividing the second by the first eliminates $A_D$ and gives the angle directly:</p>'+
    mb('\\tan\\theta = \\frac{'+fx(-S.My,0)+'}{'+fx(-S.Mx,0)+'} = '+fx(S.My/S.Mx,4))+
    co('answer','<p>'+mb('\\theta = '+fx(S.deg,2)+'^\\circ')+'</p>')+
    co('warn','<p><strong>Quadrant matters.</strong> $\\tan^{-1}$ on a calculator returns an angle in $(-90^\\circ, 90^\\circ)$. '+
      'Here the right-hand sides are $'+fx(-S.Mx,0)+'$ and $'+fx(-S.My,0)+'$, so $\\cos\\theta$ is '+(Math.cos(S.th)<0?'negative':'positive')+
      ' and $\\sin\\theta$ is '+(Math.sin(S.th)<0?'negative':'positive')+' &mdash; the '+
      (S.deg<90?'first':S.deg<180?'second':S.deg<270?'third':'fourth')+' quadrant. The answer is $'+fx(S.deg,2)+
      '^\\circ$, not the bare calculator value.</p>');
  h += stepBlock(2,'Apply the balance condition and find $\\theta$','two equations; divide one by the other',b2);

  var b3='<p>With $\\theta$ known, either equation gives $A_D$. Using the resultant magnitude avoids dividing by a small cosine:</p>'+
    mb('A_D\\,'+fx(S.ru)+' = \\sqrt{\\left(\\sum A_i\\bar{x}_i\\right)^2 + \\left(\\sum A_i\\bar{y}_i\\right)^2} = \\sqrt{'+
       fx(S.Mx,0)+'^2 + '+fx(S.My,0)+'^2} = '+fx(Math.hypot(S.Mx,S.My),0))+
    mb('A_D = \\frac{'+fx(Math.hypot(S.Mx,S.My),0)+'}{'+fx(S.ru)+'} = '+fx(S.Au,1)+'\\text{ mm}^2')+
    mb('\\frac{\\pi D^2}{4} = '+fx(S.Au,1)+' \\quad\\Rightarrow\\quad D = \\sqrt{\\frac{4('+fx(S.Au,1)+')}{\\pi}} = '+fx(S.D,3)+'\\text{ mm}')+
    co('answer','<p>'+mb('D = '+fx(S.D,2)+'\\text{ mm} \\qquad \\theta = '+fx(S.deg,1)+'^\\circ')+'</p>');
  if(v.exactNote) b3 += co('note','<p>'+v.exactNote+'</p>');
  h += stepBlock(3,'Find the diameter $D$','the magnitude of the unbalance sets the area',b3);

  var rx=S.Mx+S.Au*S.x, ry=S.My+S.Au*S.y;
  var b4='<p>Substitute the answer back into both equations:</p>'+
    '<table><tr><th></th><th>$\\sum A\\bar{x}$ (mm&sup3;)</th><th>$\\sum A\\bar{y}$ (mm&sup3;)</th></tr>'+
    '<tr><td class="left">Existing holes</td><td>'+fxh(S.Mx,0)+'</td><td>'+fxh(S.My,0)+'</td></tr>'+
    '<tr><td class="left">New hole $D$ at $\\theta$</td><td>'+fxh(S.Au*S.x,0)+'</td><td>'+fxh(S.Au*S.y,0)+'</td></tr>'+
    '<tr class="total"><td class="left">&Sigma;</td><td>'+fxh(Math.abs(rx)<1e-6?0:rx,0)+'</td><td>'+fxh(Math.abs(ry)<1e-6?0:ry,0)+'</td></tr></table>'+
    co('note','<p>Both sums close to zero, so the mass centre is back at O. &#10003;</p>'+
      '<p><strong>Physical reading:</strong> the new hole must sit <em>diametrically opposite the resultant of the existing holes</em>. '+
      'Removing material on one side is equivalent to adding weight on the other &mdash; the balancing hole always goes on the heavy side.</p>');
  if(v.check) b4 += co('note','<p>'+v.check+'</p>');
  h += stepBlock(4,'Check the solution','substitute back &mdash; both sums must vanish',b4);

  var mis=[
    '<strong>Balancing the holes instead of the disk.</strong> The condition is that the <em>remaining material</em> is balanced. '+
      'It reduces to a statement about the holes only because the intact disk is symmetric &mdash; not because the holes matter in their own right.',
    '<strong>Giving hole areas a negative sign here.</strong> If every hole is made negative, both equations are simply multiplied by $-1$ '+
      'and $\\theta$ is unchanged &mdash; but mixing signs (some holes negative, some not) is fatal. Be consistent.',
    '<strong>Taking $\\tan^{-1}$ without checking the quadrant.</strong> Two angles $180^\\circ$ apart share the same tangent; only one balances the disk. '+
      'The other puts the new hole on the same side as the unbalance and makes it worse.',
    '<strong>Solving for $D$ instead of $D^2$.</strong> The unknown enters as an <em>area</em>, $\\pi D^2/4$. Doubling the required area multiplies $D$ by $\\sqrt{2}$, not by 2.',
    '<strong>Assuming the balancing hole must be the same size as the others.</strong> Only the product (area &times; radius) is fixed; '+
      'moving the hole to a different pitch radius changes the required diameter.'];
  if(v.mistakes) mis = v.mistakes.concat(mis);
  h += '<h3>Common Mistakes</h3>'+mistakes(mis.slice(0,5));
  return h;
}
