<style>

<script>

/* ═══════════ shared formatting + SVG primitives (all six T10 pages) ═══════════ */
var NAVY='#1a3c6e', RED='#c0392b', BLUE='#1a6fc4', ORANGE='#f97316', GREY='#555';
function n(v,d){ d=(d===undefined)?1:d; var m=Math.pow(10,d); var r=Math.round(v*m)/m;
  if(Object.is(r,-0)) r=0; return String(r); }
function n0(v){ return n(v,0); }
/* thousands separator for large numbers in prose */
function ns(v,d){ var s=n(v,d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\\,'); return s.join('.'); }
function pt(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }
function TX(x,y,s,o){ o=o||{};
  return '<text x="'+n(x)+'" y="'+n(y)+'"'
    +(o.a?' text-anchor="'+o.a+'"':'')+' fill="'+(o.f||GREY)+'"'
    +(o.fs?' font-size="'+o.fs+'"':'')+(o.b?' font-weight="bold"':'')
    +(o.i?' font-style="italic"':'')+'>'+s+'</text>'; }
function LN(x1,y1,x2,y2,c,w,dash){
  return '<line x1="'+n(x1)+'" y1="'+n(y1)+'" x2="'+n(x2)+'" y2="'+n(y2)+'" stroke="'+(c||GREY)
    +'" stroke-width="'+(w||1)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>'; }
function CIRC(cx,cy,r,fill,c,w){
  return '<circle cx="'+n(cx)+'" cy="'+n(cy)+'" r="'+n(r)+'" fill="'+(fill||'none')
    +'" stroke="'+(c||NAVY)+'" stroke-width="'+(w||1.5)+'"/>'; }
function RECT(x,y,w,h,fill,c,sw,op){
  return '<rect x="'+n(x)+'" y="'+n(y)+'" width="'+n(w)+'" height="'+n(h)+'" fill="'+fill+'"'
    +(op?' fill-opacity="'+op+'"':'')+' stroke="'+(c||NAVY)+'" stroke-width="'+(sw||1.5)+'"/>'; }
/* arrowhead: tip point, u = unit direction of travel */
function HEAD(tip,u,c,len,half){ len=len||12; half=half||5.5;
  var b=[tip[0]-u[0]*len, tip[1]-u[1]*len], p=[-u[1],u[0]];
  return '<polygon points="'+pt(tip)+' '+pt([b[0]+p[0]*half,b[1]+p[1]*half])+' '
    +pt([b[0]-p[0]*half,b[1]-p[1]*half])+'" fill="'+c+'"/>'; }
/* line from (x1,y1) to (x2,y2) with the head AT (x2,y2) */
function ARR(x1,y1,x2,y2,c,w,len,half){ len=len||12;
  var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy), u=[dx/L,dy/L];
  return LN(x1,y1,x2-u[0]*len,y2-u[1]*len,c,w||2.4)+HEAD([x2,y2],u,c,len,half); }
/* double-headed dimension between two points */
function DIM(x1,y1,x2,y2,c,len){ len=len||11; c=c||GREY;
  var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy), u=[dx/L,dy/L];
  return LN(x1+u[0]*len,y1+u[1]*len,x2-u[0]*len,y2-u[1]*len,c,1)
    +HEAD([x2,y2],u,c,len,4)+HEAD([x1,y1],[-u[0],-u[1]],c,len,4); }
/* through-centre DIAMETER dimension (two heads on the rim) */
function DIA(cx,cy,R,ang,c){ var u=[Math.cos(ang),Math.sin(ang)];
  return DIM(cx-R*u[0],cy-R*u[1],cx+R*u[0],cy+R*u[1],c||GREY,12); }
/* single-headed RADIUS leader, centre out to the rim */
function RAD(cx,cy,R,ang,c){ c=c||GREY; var u=[Math.cos(ang),Math.sin(ang)];
  return ARR(cx,cy,cx+R*u[0],cy+R*u[1],c,1,12,4); }
/* point on a circle, maths convention: 0 = +x, angle increases anticlockwise on screen */
function P(cx,cy,R,t){ return [cx+R*Math.cos(t), cy-R*Math.sin(t)]; }
/* curved arrow along a circle from t0 to t1 (radians, maths convention) */
function ARC(cx,cy,R,t0,t1,c,w){
  var A=P(cx,cy,R,t0), B=P(cx,cy,R,t1), ccw=(t1>t0);
  var sweep = ccw?0:1, large = (Math.abs(t1-t0)>Math.PI)?1:0;
  var u = ccw ? [-Math.sin(t1),-Math.cos(t1)] : [Math.sin(t1),Math.cos(t1)];
  var back = [B[0]-u[0]*2, B[1]-u[1]*2];
  return '<path d="M '+pt(A)+' A '+n(R)+','+n(R)+' 0 '+large+','+sweep+' '+pt(back)+'" fill="none" stroke="'
    +c+'" stroke-width="'+(w||2.2)+'"/>'+HEAD([B[0]+u[0]*9,B[1]+u[1]*9],u,c,11,5.5); }
function HATCH(x,y,c){ var s=LN(x-20,y,x+20,y,c,1.5);
  for(var i=0;i<4;i++){ var bx=x-16+i*10; s+=LN(bx,y+6,bx+6,y,c,1); } return s; }
function PIN(x,y){ return '<polygon points="'+pt([x,y])+' '+pt([x-12,y+22])+' '+pt([x+12,y+22])
  +'" fill="#dbe4f0" stroke="'+NAVY+'" stroke-width="1.5"/>'+HATCH(x,y+22,NAVY); }
/* ═══════════ page furniture ═══════════ */
var CIRCLED=['&#9312;','&#9313;','&#9314;','&#9315;','&#9316;','&#9317;','&#9318;'];
function step(i,title,hint,body){
  return '<div class="step"><details'+(i===1?' open':'')+'><summary><span class="step-num">'+i
    +'</span><span class="step-title">'+title+'</span><span class="try-hint">'+hint
    +'</span></summary><div class="step-body">'+body+'</div></details></div>'; }
function fig(svg,cap){ return '<div class="diagram-wrap"><figure>'+svg
    +'<figcaption>'+cap+'</figcaption></figure></div>'; }
function co(kind,html){ return '<div class="callout '+kind+'">'+html+'</div>'; }
function ans(html){ return co('answer','<p>'+html+'</p>'); }
function note(html){ return co('note','<p>'+html+'</p>'); }
function warn(html){ return co('warn','<p>'+html+'</p>'); }
function info(html){ return co('info','<p>'+html+'</p>'); }
function mistakes(list){ var h='<p><strong>Common mistakes:</strong></p>';
  for(var i=0;i<list.length;i++) h+='<p style="margin-top:6px">'+CIRCLED[i]+' '+list[i]+'</p>';
  return co('warn',h); }
function rows(hdr,list){ var h='<table class="sum"><tr>';
  for(var i=0;i<hdr.length;i++) h+='<th'+(i?' style="text-align:right"':'')+'>'+hdr[i]+'</th>';
  h+='</tr>';
  for(var r=0;r<list.length;r++){ var c=list[r], tot=(c[0]==='*'); if(tot) c=c.slice(1);
    h+='<tr'+(tot?' class="total"':'')+'>';
    for(var k=0;k<c.length;k++) h+='<td'+(k?' class="num"':'')+'>'+c[k]+'</td>';
    h+='</tr>'; }
  return h+'</table>'; }


/* ═══════════ T10.1 — disk brake ═══════════ */
var VARIANTS=[
 {btn:'Original', d:60, rm:125, D:300, mu:0.30, p:500, ncal:2, book:'(a) 1413.7 N per pad &nbsp;&nbsp; (b) 212 N&middot;m',
  desc:'The tutorial sheet problem \u2014 double calliper, four pads of 60 mm diameter at a 125 mm radius.'},
 {btn:'Variant 1 \u2014 new magnitudes', d:75, rm:140, D:360, mu:0.35, p:600, ncal:2,
  desc:'Same double-calliper arrangement, larger pads at a larger radius with a higher pressure limit and a grippier lining. The method is identical \u2014 use it to check you can reproduce the chain A \u2192 F \u2192 \u03bcF \u2192 T.'},
 {btn:'Variant 2 \u2014 single calliper', d:80, rm:130, D:340, mu:0.30, p:500, ncal:1,
  desc:'Configuration change: only ONE calliper, so two pads instead of four. The pads are larger to partly compensate. Count the friction interfaces carefully \u2014 this is where most marks are lost.'}
];
function solve(v){
  var A=Math.PI*v.d*v.d/4/1e6, F=v.p*1000*A, np=2*v.ncal, T1=v.mu*F*v.rm/1000;
  return {A:A, F:F, np:np, Ff:v.mu*F, T1:T1, T:np*T1, over:(v.rm+v.d/2 > v.D/2)};
}
function figBrake(v,S){
  var cx=180, cy=190, Rpx=82.5, s=Rpx/(v.D/2);
  var rp=v.d/2*s, rc=Math.min(v.rm, v.D/2-v.d/2)*s;
  var g='<svg viewBox="0 0 700 356" width="720" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  /* ── face view ── */
  g+=TX(30,24,'Face view',{f:NAVY,b:1,fs:13});
  g+=CIRC(cx,cy,Rpx,'#dbe4f0',NAVY,2)+CIRC(cx,cy,26,'#fff',NAVY,1.5);
  g+=CIRC(cx,cy,rc,'none','#888',1).replace('/>',' stroke-dasharray="5,4"/>');
  g+=CIRC(cx,cy-rc,rp,'#f97316',RED,1.5).replace('fill="#f97316"','fill="#f97316" fill-opacity="0.55"');
  g+=TX(cx+rp+10,cy-rc-rp+4,'pad &#8709;'+n0(v.d),{f:RED,b:1});
  if(v.ncal===2){
    g+=CIRC(cx,cy+rc,rp,'#f97316',RED,1.5).replace('fill="#f97316"','fill="#f97316" fill-opacity="0.55"');
    g+=TX(cx+rp+10,cy+rc+rp+4,'pad &#8709;'+n0(v.d),{f:RED,b:1});
  }
  g+=RAD(cx,cy,rc,-Math.PI/2)+TX(cx+7,cy-rc/2+4,'r = '+n0(v.rm));
  g+=DIA(cx,cy,Rpx,3*Math.PI/4)+TX(cx-Rpx-16,cy+Rpx-6,'&#8709;'+n0(v.D),{a:'end'});
  g+=LN(cx,cy-Rpx-12,cx,cy+Rpx+18,'#888',0.8,'6,3,2,3');
  g+=LN(cx-Rpx-12,cy,cx+Rpx+12,cy,'#888',0.8,'6,3,2,3');
  g+=TX(46,316,(v.ncal===2?'Two callipers 180&#176; apart; each grips the disk':'One calliper only; it grips the disk'),{i:1,fs:11});
  g+=TX(46,332,'from both sides &#8212; '+S.np+' pads in total.',{i:1,fs:11});
  /* ── edge view, same scale, axis aligned with the face-view centre ── */
  var ex=470;
  g+=TX(392,24,'Edge view (one calliper, upper half)',{f:NAVY,b:1,fs:13});
  g+=RECT(ex,cy-Rpx,10,Rpx,'#dbe4f0',NAVY,1.8)+TX(ex+5,cy-Rpx-8,'disk',{a:'middle',f:NAVY,b:1});
  g+=RECT(ex-16,cy-rc-rp,16,2*rp,'#f97316',RED,1.5,0.55);
  g+=RECT(ex+10,cy-rc-rp,16,2*rp,'#f97316',RED,1.5,0.55);
  g+=ARR(396,cy-rc,ex-18,cy-rc,BLUE,2.4)+ARR(570,cy-rc,ex+38,cy-rc,BLUE,2.4);
  g+=TX(396,cy-rc-10,'F',{f:BLUE,b:1})+TX(566,cy-rc-10,'F',{f:BLUE,b:1});
  g+=LN(392,cy,628,cy,'#888',0.8,'6,3,2,3')+TX(392,cy+16,'axis of rotation',{fs:11});
  g+=DIM(530,cy-rc,530,cy)+LN(ex+26,cy-rc,536,cy-rc,GREY,0.8,'3,3')+TX(537,cy-rc/2+6,n0(v.rm));
  g+=DIM(592,cy-Rpx,592,cy)+LN(ex+10,cy-Rpx,598,cy-Rpx,GREY,0.8,'3,3')+TX(599,cy-Rpx/2+6,n0(v.D/2));
  g+=TX(380,316,'Both pads of a calliper carry the same force F.',{i:1,fs:11});
  g+=TX(380,332,'Pad outer edge shown flush with the disk rim.',{i:1,fs:11});
  return g+'</svg>';
}
function build(v){
  var S=solve(v), h='';
  h+='<h3>Problem Statement</h3>'
   +'<p>A disk brake uses a <strong>'+(v.ncal===2?'double calliper':'single calliper')+'</strong>. Each calliper half carries a '
   +'<strong>'+n0(v.d)+'&nbsp;mm diameter round pad</strong> on each side of the disk, so there are <strong>'+S.np
   +'&nbsp;pads</strong> in total. The centre of contact of every pad sits at a radius of <strong>'+n0(v.rm)
   +'&nbsp;mm</strong>. The disk outside diameter is '+n0(v.D)+'&nbsp;mm. The woven linings give a coefficient of friction '
   +'$\\mu = '+v.mu+'$, and the average pad pressure must not exceed <strong>'+n0(v.p)+'&nbsp;kPa</strong>.</p>'
   +'<p><strong>(a)</strong> What clamping force develops the limiting pad pressure? &nbsp;'
   +'<strong>(b)</strong> With that clamping force, what total brake torque is obtained?</p>';
  h+= v.book ? co('given','<p><strong>Given answers:</strong> '+v.book+'</p>')
             : co('given','<p><strong>Answers (computed here \u2014 this variant is not in the book):</strong> (a) '
                  +n(S.F,1)+' N per pad &nbsp;&nbsp; (b) '+n(S.T,1)+' N&middot;m</p>');
  h+=fig(figBrake(v,S),'Disk brake geometry, both views to the same scale. Left: face view with each pad centred on the '
    +n0(v.rm)+'&nbsp;mm radius circle. Right: edge view through one calliper, upper half only &#8212; the clamping force squeezes '
    +'the disk from both sides, so each pad in that calliper carries the same normal force $F$. Dimensions in millimetres.');
  h+=info('<strong>Strategy:</strong> pad pressure fixes the <em>normal force per pad</em> through $F = pA$. Friction turns that '
    +'into a tangential force $\\mu F$ at the mean pad radius, and every pad contributes the same torque. The disk outside '
    +'diameter is a distractor &#8212; it plays no part in either answer.');
  h+='<h3>Solution</h3>';
  h+=step(1,'Clamping force from the limiting pad pressure','try it yourself first',
    '<p>The pad is a full circle of diameter '+n0(v.d)+'&nbsp;mm, so its contact area is</p>'
    +'<div class="math-block">$$A = \\frac{\\pi d^2}{4} = \\frac{\\pi ('+n(v.d/1000,3)+')^2}{4} = '
    +S.A.toExponential(3).replace('e-3','\\times10^{-3}')+'\\ \\text{m}^2$$</div>'
    +'<p>&ldquo;Average pressure&rdquo; means the normal force is simply pressure &times; area:</p>'
    +'<div class="math-block">$$F = pA = ('+n0(v.p)+'\\times10^{3})('+S.A.toExponential(3).replace('e-3','\\times10^{-3}')
    +') = '+n(S.F,1)+'\\ \\text{N}$$</div>'
    +ans('(a) &nbsp; $F = '+n(S.F,1)+'\\ \\text{N}$ clamping force per pad')
    +note('<strong>Why &ldquo;per pad&rdquo; and not &ldquo;per calliper&rdquo;:</strong> a calliper is a clamp. It squeezes the '
      +'disk between two pads, and by Newton\'s third law both pads feel the <em>same</em> force $F$ &#8212; the two do not add to '
      +'$2F$ on the piston. One calliper needs a piston force of '+n(S.F,1)+'&nbsp;N; all '+S.np+' pads each see '+n(S.F,1)+'&nbsp;N.'));
  h+=step(2,'Friction force and torque from one pad','sketch the friction force first',
    '<p>Friction acts tangentially at the pad, opposing the disk\'s surface motion:</p>'
    +'<div class="math-block">$$F_f = \\mu F = '+v.mu+' \\times '+n(S.F,1)+' = '+n(S.Ff,1)+'\\ \\text{N}$$</div>'
    +'<p>All of the pad contact is concentrated at the mean radius $r_m = '+n0(v.rm)+'\\ \\text{mm}$, so one pad gives</p>'
    +'<div class="math-block">$$T_1 = \\mu F r_m = '+n(S.Ff,1)+' \\times '+n(v.rm/1000,3)+' = '+n(S.T1,2)+'\\ \\text{N}\\cdot\\text{m}$$</div>'
    +note('<strong>Why the mean radius is legitimate:</strong> for a wide annular pad you would integrate $\\int\\mu p r\\,'
      +'\\mathrm{d}A$. A '+n0(v.d)+'&nbsp;mm pad centred at '+n0(v.rm)+'&nbsp;mm spans only '+n0(v.rm-v.d/2)+'&ndash;'
      +n0(v.rm+v.d/2)+'&nbsp;mm, and the question gives the average pressure and the centre of contact &#8212; so taking the whole '
      +'friction force at $r_m$ is exactly the intended approximation. The error against a full integration is well under 1%.'));
  h+=step(3,'Total brake torque &#8212; count the pads','how many friction surfaces?',
    '<p>'+(v.ncal===2?'Two callipers':'One calliper')+' &times; two pads each = <strong>'+S.np+'</strong> friction interfaces, '
    +'each with the same normal force at the same radius:</p>'
    +'<div class="math-block">$$T = '+S.np+'\\,\\mu F r_m = '+S.np+' \\times '+v.mu+' \\times '+n(S.F,1)+' \\times '
    +n(v.rm/1000,3)+' = '+n(S.T,1)+'\\ \\text{N}\\cdot\\text{m}$$</div>'
    +ans('(b) &nbsp; $T = '+n(S.T,1)+'\\ \\text{N}\\cdot\\text{m}$')
    +rows(['Quantity','Value','Source'],[
      ['Pad area $A = \\pi d^2/4$', n(S.A*1e3,3)+'&times;10&#8315;&#179; m&#178;', '$d = '+n0(v.d)+'$ mm'],
      ['Clamping force per pad $F = pA$', n(S.F,1)+' N', '$p = '+n0(v.p)+'$ kPa'],
      ['Friction force per pad $\\mu F$', n(S.Ff,1)+' N', '$\\mu = '+v.mu+'$'],
      ['Torque per pad $\\mu F r_m$', n(S.T1,2)+' N&middot;m', '$r_m = '+n0(v.rm)+'$ mm'],
      ['*Total torque, '+S.np+' pads', n(S.T,1)+' N&middot;m', '&times;'+S.np]]));
  var mis=[
    '<strong>Counting the friction interfaces wrongly.</strong> '+(v.ncal===2?'&ldquo;Double calliper&rdquo; means two callipers, '
      +'each with a pad on <em>each side</em> of the disk &#8212; four in all. Missing this halves the torque to '+n(S.T/2,1)
      :'One calliper still has <em>two</em> pads, one each side. Treating it as a single pad halves the torque to '+n(S.T/2,1))
      +'&nbsp;N&middot;m.',
    '<strong>Using the disk outside radius ('+n0(v.D/2)+'&nbsp;mm) as the friction radius.</strong> Friction acts where the pads '
      +'are, at '+n0(v.rm)+'&nbsp;mm. Using '+n0(v.D/2)+'&nbsp;mm inflates the answer to '+n(S.T*(v.D/2)/v.rm,1)+'&nbsp;N&middot;m.',
    '<strong>Doubling the clamping force per calliper.</strong> A clamp applies equal and opposite forces; the piston force and the '
      +'force on each pad are the same number, not double.',
    '<strong>Mixing units.</strong> $A$ must be in m&#178; when $p$ is in Pa. In mm&#178; and MPa: $A = '+n(S.A*1e6,0)
      +'\\ \\text{mm}^2$, $p = '+n(v.p/1000,2)+'\\ \\text{MPa}$, $F = '+n(S.F,1)+'\\ \\text{N}$ &#8212; same answer.',
    '<strong>Forgetting that the pressure is a <em>limit</em>.</strong> The question asks for the clamping force that just reaches '
      +n0(v.p)+'&nbsp;kPa &#8212; the maximum permissible force, not an arbitrary one.'];
  h+=mistakes(mis);
  return h;
}


function render(i){
  var v = VARIANTS[i];
  document.getElementById('doc').innerHTML = build(v);
  document.getElementById('swDesc').textContent = v.desc;
  var b = document.querySelectorAll('#swBtns button');
  for(var j=0;j<b.length;j++) b[j].setAttribute('aria-pressed', j===i ? 'true':'false');
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('doc'), {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false});
  }
}
function init(){
  var box = document.getElementById('swBtns');
  VARIANTS.forEach(function(v,i){
    var b = document.createElement('button');
    b.textContent = v.btn;
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){ render(i); };
    box.appendChild(b);
  });
  render(0);
}
window.addEventListener('load', init);
</script>
