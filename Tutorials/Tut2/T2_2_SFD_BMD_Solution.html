<script>
/* ═══════════════════════════════════════════════════════════════════════════
   GENERATED FILE — do not edit by hand.
   Source: _engine/sfd_bmd_engine.js  +  _engine/build.py
   Rebuild with:  python3 _engine/build.py
   ═══════════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════════
   MCEN2002 — SHARED SFD / BMD ENGINE
   Single source of truth for every T2.x tutorial solution page.
   Edit this file, then run  _engine/build.py  to regenerate the HTML files.
   (The HTML files are self-contained — the engine is inlined into each one —
   so they can be emailed or uploaded on their own.)

   ─── MODEL ───────────────────────────────────────────────────────────────
   Beam occupies 0 ≤ x ≤ L.
     sA, sB  support positions (need NOT be the beam ends — this is what
             lets T2.2's single overhang and T2.6's double overhang work)
     w       UDL intensity acting over [a, b]      (w = 0 → no UDL)
     P       downward point load at x = c          (P = 0 → no point load)
     M0      applied concentrated moment at x = d, COUNTER-CLOCKWISE POSITIVE
             (M0 = 0 → none; use a negative value for a clockwise moment)

   Reactions, from ΣM about support A and ΣF_y:
     R_B = [ W(x̄−sA) + P(c−sA) − M0 ] / (sB − sA),   R_A = W + P − R_B
   Internal actions on the free body LEFT of a cut at x:
     V(x) = R_A·[x>sA] + R_B·[x>sB] − w·ℓ(x) − P·[x>c]
     M(x) = R_A(x−sA)[x>sA] + R_B(x−sB)[x>sB] − w·ℓ(x)·(x−x̄ℓ) − P(x−c)[x>c] − M0·[x>d]
   where ℓ(x) = clamp(x,a,b) − a is the loaded length behind the cut.

   ─── SYMBOLIC MODE ───────────────────────────────────────────────────────
   T2.3 is stated in terms of P and l. The solver still runs in floating
   point with P = 1, l = 1; only the FORMATTING changes — values are turned
   back into exact fractions by continued-fraction expansion, so results
   print as 5Pl/6 rather than 0.8333Pl.
   ══════════════════════════════════════════════════════════════════════════ */

/* ─────────────────── number formatting ─────────────────── */
function nf(n){
  let r = Math.round(n*1e9)/1e9;
  if(Object.is(r,-0)) r = 0;
  if(Math.abs(r) < 1e-12) r = 0;
  return String(Math.round(r*1e6)/1e6);
}
/* exact fraction from a float, via continued fractions */
function toFrac(x){
  const sgn = x<0 ? -1 : 1; x = Math.abs(x);
  let h1=1,h2=0,k1=0,k2=1,b=x;
  for(let i=0;i<24;i++){
    const a=Math.floor(b);
    let h=a*h1+h2, k=a*k1+k2;
    h2=h1; h1=h; k2=k1; k1=k;
    if(Math.abs(x-h1/k1) < 1e-10 || k1>100000) break;
    if(Math.abs(b-a) < 1e-12) break;
    b = 1/(b-a);
  }
  return [sgn*h1, k1];
}
/* symbol = '' | 'P' | 'Pl' | 'l' ; tex = true → \frac{}{} , false → plain a/b */
function fracStr(v, symbol, tex){
  if(Math.abs(v) < 1e-12) return '0';
  const [n,d] = toFrac(v);
  const neg = n<0, N = Math.abs(n);
  const numTxt = (N===1 && symbol) ? symbol : (N + (symbol||''));
  let body;
  if(d===1) body = numTxt;
  else body = tex ? ('\\frac{'+numTxt+'}{'+d+'}') : (numTxt+'/'+d);
  return (neg?'-':'') + body;
}

/* ─────────────────── unit-aware label factory ─────────────────── */
/* Turn a display unit such as "kN·m" into safe LaTeX: \text{kN}\cdot\text{m}.
   A literal "·" inside \text{} is not valid KaTeX text mode and renders as an
   error glyph, which is what produced the stray "\cdotp m" on the page. */
function texUnit(u){
  if(!u) return '';
  return u.split('·').map(function(part){ return '\\text{'+part+'}'; }).join('\\cdot ');
}
function makeFmt(cfg){
  const U = cfg.units || {F:'kN', M:'kN·m', L:'m'};
  const sym = !!cfg.symbolic;
  /* In symbolic mode the "units" ARE the algebraic symbols: for T2.3 they are
     P, PL and L. Nothing is hardcoded, so renaming the length symbol (l -> L,
     say) is a one-line change in build.py. */
  return {
    /* force */
    F : (v,tex) => sym ? fracStr(v,U.F,tex)   : nf(v),
    Fu: (v,tex) => sym ? fracStr(v,U.F,tex)   : nf(v)+' '+U.F,
    /* moment */
    M : (v,tex) => sym ? fracStr(v,U.M,tex)   : nf(v),
    Mu: (v,tex) => sym ? fracStr(v,U.M,tex)   : nf(v)+' '+U.M,
    /* length / position */
    L : (v,tex) => sym ? fracStr(v,U.L,tex)   : nf(v),
    Lu: (v,tex) => sym ? fracStr(v,U.L,tex)   : nf(v)+' '+U.L,
    /* distributed intensity */
    W : (v,tex) => sym ? (fracStr(v,U.F,tex)+'/'+U.L) : nf(v),
    Wu: (v,tex) => sym ? (fracStr(v,U.F,tex)+'/'+U.L) : nf(v)+' '+U.F+'/'+U.L,
    unitF: U.F, unitM: U.M, unitL: U.L, sym: sym,
    texF: texUnit(U.F), texM: texUnit(U.M), texL: texUnit(U.L),
    /* signed, for axis labels */
    pmF: v => (v<0?'−':'+') + (sym ? fracStr(Math.abs(v),U.F,false) : nf(Math.abs(v)))
  };
}

/* ─────────────────── solver ─────────────────── */
function segAt(segs,x){
  for(const g of segs) if(x >= g.s-1e-9 && x <= g.e+1e-9) return g;
  return segs[segs.length-1];
}
function Vseg(g,x){ return g.vA*x + g.vB; }
function Mseg(g,x){ return g.mA*x*x + g.mB*x + g.mC; }

function solve(p){
  const L=p.L, sA=p.sA, sB=p.sB, w=p.w||0, a=p.a||0, b=p.b||0,
        P=p.P||0, c=p.c||0, M0=p.M0||0, d=p.d||0;
  const hasUDL = Math.abs(w)>1e-12 && Math.abs(b-a)>1e-12;
  const hasP   = Math.abs(P)>1e-12;
  const hasM   = Math.abs(M0)>1e-12;

  const W  = hasUDL ? w*(b-a) : 0;
  const xb = hasUDL ? (a+b)/2 : 0;

  const RB = ( W*(xb-sA) + P*(c-sA) - M0 ) / (sB-sA);
  const RA = W + P - RB;

  /* breakpoints: every place the loading or support condition changes */
  const raw = [0, L, sA, sB];
  if(hasUDL){ raw.push(a,b); }
  if(hasP)  raw.push(c);
  if(hasM)  raw.push(d);
  const bps = [...new Set(raw.map(v=>Math.round(v*1e9)/1e9))]
              .filter(v => v>=-1e-9 && v<=L+1e-9).sort((u,v)=>u-v);

  const segs = [];
  for(let i=0;i<bps.length-1;i++){
    const s=bps[i], e=bps[i+1], mid=(s+e)/2;
    const pastA = mid > sA, pastB = mid > sB;
    const udl   = !hasUDL ? 'none' : (mid<=a ? 'none' : (mid>=b ? 'full' : 'partial'));
    const pP    = hasP && mid > c;
    const pM    = hasM && mid > d;

    let vA=0, vB=0;
    if(pastA) vB += RA;
    if(pastB) vB += RB;
    if(pP)    vB -= P;
    if(udl==='partial'){ vA -= w; vB += w*a; }
    if(udl==='full')     vB -= W;

    let mA=0, mB=0, mC=0;
    if(pastA){ mB += RA; mC -= RA*sA; }
    if(pastB){ mB += RB; mC -= RB*sB; }
    if(pP)   { mB -= P;  mC += P*c;   }
    if(udl==='partial'){ mA -= w/2; mB += w*a; mC -= w*a*a/2; }
    if(udl==='full')   { mB -= W;   mC += W*xb; }
    if(pM)   { mC -= M0; }

    segs.push({i:i,s:s,e:e,mid:mid,pastA:pastA,pastB:pastB,udl:udl,hasP:pP,hasM0:pM,
               vA:vA,vB:vB,mA:mA,mB:mB,mC:mC});
  }

  /* every zero-shear location (there can be more than one) */
  const zeros = [];
  for(const g of segs){
    if(Math.abs(g.vA) > 1e-12){
      const x = -g.vB/g.vA;
      if(x > g.s+1e-9 && x < g.e-1e-9) zeros.push({x:x, seg:g});
    }
  }
  /* candidate stationary / corner values of M, sampling BOTH sides of jumps */
  const cand = [];
  for(const g of segs){ cand.push({x:g.s,seg:g}); cand.push({x:g.e,seg:g}); }
  for(const z of zeros) cand.push({x:z.x, seg:z.seg});

  let Mmax=-Infinity, xMax=0, Mmin=Infinity, xMin=0;
  for(const q of cand){
    const m = Mseg(q.seg,q.x);
    if(m > Mmax+1e-9){ Mmax=m; xMax=q.x; }
    if(m < Mmin-1e-9){ Mmin=m; xMin=q.x; }
  }
  /* largest magnitude, whichever sign */
  const Mabs = Math.abs(Mmax) >= Math.abs(Mmin) ? Mmax : Mmin;
  const xAbs = Math.abs(Mmax) >= Math.abs(Mmin) ? xMax : xMin;

  let vMax=0, vMin=0;
  for(const g of segs) for(const x of [g.s,g.e]){
    const v = Vseg(g,x); if(v>vMax) vMax=v; if(v<vMin) vMin=v; }

  return {p:p, W:W, xb:xb, RA:RA, RB:RB, bps:bps, segs:segs, zeros:zeros,
          hasUDL:hasUDL, hasP:hasP, hasM:hasM,
          Mmax:Mmax, xMax:xMax, Mmin:Mmin, xMin:xMin, Mabs:Mabs, xAbs:xAbs,
          vMax:vMax, vMin:vMin,
          Vof: x => Vseg(segAt(segs,x),x),
          Mof: x => Mseg(segAt(segs,x),x)};
}

/* ─────────────────── SVG primitives ─────────────────── */
const RED='#c0392b', NAVY='#1a3c6e', BLUE='#1a6fc4', ORANGE='#f97316', GREY='#555';
const n1 = v => Number(v).toFixed(1);

function udlBlock(x1,x2,yTop,yBot,label){
  let s = '<line x1="'+n1(x1)+'" y1="'+yTop+'" x2="'+n1(x2)+'" y2="'+yTop+'" stroke="'+RED+'" stroke-width="1.5"/>';
  const n = Math.max(3, Math.min(14, Math.round((x2-x1)/19)));
  for(let i=0;i<=n;i++){
    const x = x1 + (x2-x1)*i/n;
    s += '<line x1="'+n1(x)+'" y1="'+yTop+'" x2="'+n1(x)+'" y2="'+yBot+'" stroke="'+RED+'" stroke-width="1.2"/>'
       + '<polygon points="'+n1(x)+','+(yBot+1)+' '+n1(x-5)+','+(yBot-11)+' '+n1(x+5)+','+(yBot-11)+'" fill="'+RED+'"/>';
  }
  if(label) s += '<text x="'+n1((x1+x2)/2)+'" y="'+(yTop-8)+'" font-size="13" fill="'+RED+'" text-anchor="middle" font-weight="bold">'+label+'</text>';
  return s;
}
function udlFaint(x1,x2,y){
  return '<line x1="'+n1(x1)+'" y1="'+y+'" x2="'+n1(x2)+'" y2="'+y+'" stroke="'+RED+'" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="0.45"/>'
       + '<line x1="'+n1(x1)+'" y1="'+y+'" x2="'+n1(x1)+'" y2="'+(y+14)+'" stroke="'+RED+'" stroke-width="1" stroke-opacity="0.45"/>'
       + '<line x1="'+n1(x2)+'" y1="'+y+'" x2="'+n1(x2)+'" y2="'+(y+14)+'" stroke="'+RED+'" stroke-width="1" stroke-opacity="0.45"/>';
}
function ptLoad(x,yTop,yBot,label,fsz){
  fsz = fsz || 13;
  let s = '<line x1="'+n1(x)+'" y1="'+yTop+'" x2="'+n1(x)+'" y2="'+yBot+'" stroke="'+RED+'" stroke-width="2.2"/>'
        + '<polygon points="'+n1(x)+','+(yBot+1)+' '+n1(x-6)+','+(yBot-12)+' '+n1(x+6)+','+(yBot-12)+'" fill="'+RED+'"/>';
  if(label) s += '<text x="'+n1(x)+'" y="'+(yTop-6)+'" font-size="'+fsz+'" fill="'+RED+'" text-anchor="middle" font-weight="bold">'+label+'</text>';
  return s;
}
/* Curved applied-moment symbol.
   Clock-angle convention: 0 = 12 o'clock, increasing clockwise;
   point on circle = (cx + r·sinθ, cy − r·cosθ). The arrowhead lies on the
   FORWARD tangent so it continues the arc's rotation.
   ccw = true  → tail 320°, tip 40°, sweep 0  (counter-clockwise)
   ccw = false → tail  40°, tip 320°, sweep 1 (clockwise)
   The sense MUST match the sign used in ΣM_A, or the figure contradicts the
   algebra — the pre-2026 hand-built pages had exactly that mismatch. */
function momentArrow(cx,cy,r,label,fsz,ccw){
  fsz = fsz || 13;
  const tip = ccw ? 40 : 320, tail = ccw ? 320 : 40, sweep = ccw ? 0 : 1;
  const rad = A => A*Math.PI/180;
  const pt  = A => [cx + r*Math.sin(rad(A)), cy - r*Math.cos(rad(A))];
  const [tx,ty] = pt(tail), [ex,ey] = pt(tip);
  const A = rad(tip);
  const fwd  = (sweep===1) ? [Math.cos(A),Math.sin(A)] : [-Math.cos(A),-Math.sin(A)];
  const apex = [ex+fwd[0]*10, ey+fwd[1]*10];
  const perp = [-fwd[1], fwd[0]];
  const c1 = [ex+perp[0]*6, ey+perp[1]*6], c2 = [ex-perp[0]*6, ey-perp[1]*6];
  let s = '<path d="M '+n1(tx)+','+n1(ty)+' A '+r+','+r+' 0 1,'+sweep+' '+n1(ex)+','+n1(ey)+'" fill="none" stroke="'+RED+'" stroke-width="2.2"/>'
        + '<polygon points="'+n1(apex[0])+','+n1(apex[1])+' '+n1(c1[0])+','+n1(c1[1])+' '+n1(c2[0])+','+n1(c2[1])+'" fill="'+RED+'"/>';
  if(label) s += '<text x="'+n1(cx)+'" y="'+n1(cy-r-14)+'" font-size="'+fsz+'" fill="'+RED+'" text-anchor="middle" font-weight="bold">'+label+'</text>';
  return s;
}
function hatchBar(x,y){
  let s = '<line x1="'+n1(x-20)+'" y1="'+y+'" x2="'+n1(x+20)+'" y2="'+y+'" stroke="'+NAVY+'" stroke-width="1.5"/>';
  for(let i=0;i<4;i++){ const bx = x-16+i*10;
    s += '<line x1="'+n1(bx)+'" y1="'+(y+6)+'" x2="'+n1(bx+6)+'" y2="'+y+'" stroke="'+NAVY+'" stroke-width="1"/>'; }
  return s;
}
function pinSup(x,y){
  return '<polygon points="'+n1(x)+','+y+' '+n1(x-12)+','+(y+22)+' '+n1(x+12)+','+(y+22)+'" fill="#dbe4f0" stroke="'+NAVY+'" stroke-width="1.5"/>'+hatchBar(x,y+22);
}
/* Support name tag. A support sitting at the very end of the beam gets its
   letter outside the beam; an INTERIOR support (T2.2's roller, both of
   T2.6's) would have its letter land on top of the beam, so it is placed
   above the beam on a small white halo that keeps it legible over UDL hatching. */
function supLabel(S,X,x,yT,txt,side){
  const atEnd = Math.abs(x-0)<1e-9 || Math.abs(x-S.p.L)<1e-9;
  if(atEnd){
    const dx = (side==='right') ? 26 : -26;
    return '<text x="'+n1(X(x)+dx)+'" y="'+(yT+10)+'" font-size="14" fill="'+NAVY
         + '" text-anchor="'+(side==='right'?'start':'end')+'" font-weight="bold">'+txt+'</text>';
  }
  return '<rect x="'+n1(X(x)-8)+'" y="'+(yT-21)+'" width="16" height="17" fill="#fff" fill-opacity="0.85"/>'
       + '<text x="'+n1(X(x))+'" y="'+(yT-8)+'" font-size="14" fill="'+NAVY+'" text-anchor="middle" font-weight="bold">'+txt+'</text>';
}
function rollerSup(x,y){
  return '<circle cx="'+n1(x)+'" cy="'+(y+9)+'" r="10" fill="#dbe4f0" stroke="'+NAVY+'" stroke-width="1.5"/>'+hatchBar(x,y+22);
}
/* reaction arrow; a NEGATIVE reaction is drawn pointing DOWN and coloured,
   so the figure never silently contradicts the sign of the answer */
function reactArrow(x,yBase,len,sub,val,lblY,neg){
  const col = BLUE;
  let s;
  if(!neg){
    s = '<line x1="'+n1(x)+'" y1="'+(yBase+len)+'" x2="'+n1(x)+'" y2="'+(yBase+12)+'" stroke="'+col+'" stroke-width="2.2"/>'
      + '<polygon points="'+n1(x)+','+yBase+' '+n1(x-6)+','+(yBase+12)+' '+n1(x+6)+','+(yBase+12)+'" fill="'+col+'"/>';
  } else {
    s = '<line x1="'+n1(x)+'" y1="'+(yBase+2)+'" x2="'+n1(x)+'" y2="'+(yBase+len-12)+'" stroke="'+col+'" stroke-width="2.2"/>'
      + '<polygon points="'+n1(x)+','+(yBase+len)+' '+n1(x-6)+','+(yBase+len-12)+' '+n1(x+6)+','+(yBase+len-12)+'" fill="'+col+'"/>';
  }
  return s + '<text x="'+n1(x)+'" y="'+lblY+'" font-size="12.5" fill="'+col+'" text-anchor="middle" font-weight="bold">'
           + 'R<tspan font-size="9" dy="3">'+sub+'</tspan><tspan font-size="12.5" dy="-3"> = '+val+'</tspan></text>';
}
function dimChain(X,marks,y,fsz,fmt){
  fsz = fsz || 12;
  let s = '<line x1="'+n1(X(marks[0]))+'" y1="'+y+'" x2="'+n1(X(marks[marks.length-1]))+'" y2="'+y+'" stroke="'+GREY+'" stroke-width="1"/>';
  for(const m of marks) s += '<line x1="'+n1(X(m))+'" y1="'+(y-5)+'" x2="'+n1(X(m))+'" y2="'+(y+5)+'" stroke="'+GREY+'" stroke-width="1"/>';
  for(let i=0;i<marks.length-1;i++){
    const gap = marks[i+1]-marks[i];
    if(gap < 1e-9) continue;
    s += '<text x="'+n1((X(marks[i])+X(marks[i+1]))/2)+'" y="'+(y+17)+'" font-size="'+fsz+'" fill="#333" text-anchor="middle">'+fmt.Lu(gap,false)+'</text>';
  }
  return s;
}
function cutFace(xc,yT,yB){
  const yv0 = yT-34, yv1 = yB+10;
  let s = '<line x1="'+n1(xc+30)+'" y1="'+yv0+'" x2="'+n1(xc+30)+'" y2="'+(yv1-6)+'" stroke="'+NAVY+'" stroke-width="2.2"/>'
        + '<polygon points="'+n1(xc+30)+','+yv1+' '+n1(xc+24)+','+(yv1-12)+' '+n1(xc+36)+','+(yv1-12)+'" fill="'+NAVY+'"/>'
        + '<text x="'+n1(xc+30)+'" y="'+(yv0-8)+'" font-size="14" fill="'+NAVY+'" text-anchor="middle" font-weight="bold" font-style="italic">V</text>';
  const my = (yT+yB)/2;
  s += '<path d="M '+n1(xc+76)+','+n1(my+27)+' A 27,27 0 0 0 '+n1(xc+76)+','+n1(my-27)+'" fill="none" stroke="#6b7280" stroke-width="2.2"/>'
     + '<polygon points="'+n1(xc+60)+','+n1(my-27)+' '+n1(xc+78)+','+n1(my-35)+' '+n1(xc+76)+','+n1(my-18)+'" fill="#6b7280"/>'
     + '<text x="'+n1(xc+116)+'" y="'+n1(my+5)+'" font-size="14" fill="'+NAVY+'" font-weight="bold" font-style="italic">M</text>';
  return s;
}
function place(placed,y,gap){
  let ly=y; while(placed.some(t=>Math.abs(t-ly)<gap)) ly+=gap; placed.push(ly); return ly;
}
function leader(labelY,trueY,xAxis,col){
  if(Math.abs(labelY-3.5-trueY) < 2.5) return '';
  return '<line x1="'+(xAxis-4)+'" y1="'+n1(labelY-3.5)+'" x2="'+xAxis+'" y2="'+n1(trueY)+'" stroke="'+col+'" stroke-width="0.8" stroke-opacity="0.65"/>';
}

/* ─────────────────── beam drawing (shared by several figures) ─────────────────── */
function drawBeam(S,fmt,X,yT,opts){
  const p=S.p; let s='';
  s += '<rect x="'+n1(X(0))+'" y="'+yT+'" width="'+n1(X(p.L)-X(0))+'" height="12" fill="#7eaecf" stroke="'+NAVY+'" stroke-width="1.5"/>';
  if(S.hasUDL) s += udlBlock(X(p.a),X(p.b),yT-38,yT-1,fmt.Wu(p.w,false));
  if(S.hasP)   s += ptLoad(X(p.c),yT-60,yT-1,fmt.Fu(p.P,false),12);
  if(S.hasM)   s += momentArrow(X(p.d),yT+6,18,fmt.Mu(Math.abs(p.M0),false),12,p.M0>0);
  s += pinSup(X(p.sA),yT+12) + rollerSup(X(p.sB),yT+12);
  if(opts && opts.labels){
    s += supLabel(S,X,p.sA,yT,'A','left') + supLabel(S,X,p.sB,yT,'B','right');
  }
  return s;
}

/* ─────────────────── FIGURE: cut free body ─────────────────── */
function figCut(S,fmt,g){
  const p=S.p, x0=80, span=270, X=m=>x0+span*m/p.L;
  const xc=g.mid, Xc=X(xc), yT=96, yB=108;
  let s = '<svg viewBox="0 0 590 288" width="590" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="13">';
  s += '<rect x="'+n1(X(0))+'" y="'+yT+'" width="'+n1(Xc-X(0))+'" height="12" fill="#7eaecf" stroke="'+NAVY+'" stroke-width="1.5"/>';
  s += '<line x1="'+n1(Xc)+'" y1="'+(yT-7)+'" x2="'+n1(Xc)+'" y2="'+(yB+7)+'" stroke="'+NAVY+'" stroke-width="1" stroke-dasharray="3,3"/>';
  if(g.udl !== 'none'){
    const ue = (g.udl==='partial') ? xc : p.b;
    const lu = ue - p.a, xr = p.a + lu/2;
    s += udlFaint(X(p.a),X(ue),yT-36);
    const lbl = (g.udl==='partial')
      ? fmt.W(p.w,false)+'(x − '+fmt.L(p.a,false)+')'
      : fmt.W(p.w,false)+'('+fmt.L(p.b-p.a,false)+') = '+fmt.Fu(p.w*lu,false);
    s += ptLoad(X(xr),yT-56,yT-1,lbl,12);
  }
  if(g.hasP)  s += ptLoad(X(p.c),yT-56,yT-1,fmt.Fu(p.P,false),12);
  if(g.hasM0) s += momentArrow(X(p.d),yT+6,18,fmt.Mu(Math.abs(p.M0),false),11,p.M0>0);
  if(g.pastA){
    s += pinSup(X(p.sA),yB);
    s += reactArrow(X(p.sA),yB+36,32,'A',fmt.Fu(S.RA,false),yB+94,S.RA<0);
  }
  if(g.pastB){
    s += rollerSup(X(p.sB),yB);
    s += reactArrow(X(p.sB),yB+36,32,'B',fmt.Fu(S.RB,false),yB+94,S.RB<0);
  }
  s += '<text x="'+n1(X(0)-14)+'" y="'+(yT+10)+'" font-size="13" fill="'+NAVY+'" text-anchor="end" font-weight="bold">'+(Math.abs(p.sA)<1e-9?'A':'')+'</text>';
  s += cutFace(Xc,yT,yB);

  /* Dimension ONLY the fixed features behind the cut. The cut itself is at an
     arbitrary x, so labelling the gap between the last feature and the cut with
     a number would wrongly imply a specific cut location — the running distance
     is carried by the "x" arrow underneath instead. */
  const marks=[0];
  if(g.pastA) marks.push(p.sA);
  if(g.pastB) marks.push(p.sB);
  if(g.udl!=='none') marks.push(p.a);
  if(g.udl==='full') marks.push(p.b);
  if(g.hasP)  marks.push(p.c);
  if(g.hasM0) marks.push(p.d);
  const uniq=[...new Set(marks.map(v=>Math.round(v*1e9)/1e9))].sort((u,v)=>u-v);
  if(uniq.length > 1) s += dimChain(X,uniq,216,11,fmt);

  s += '<line x1="'+n1(X(0))+'" y1="242" x2="'+n1(X(0))+'" y2="252" stroke="'+GREY+'" stroke-width="1"/>';
  s += '<line x1="'+n1(X(0))+'" y1="247" x2="'+n1(Xc-9)+'" y2="247" stroke="'+GREY+'" stroke-width="1"/>';
  s += '<polygon points="'+n1(Xc)+',247 '+n1(Xc-12)+',243 '+n1(Xc-12)+',251" fill="'+GREY+'"/>';
  s += '<text x="'+n1((X(0)+Xc)/2)+'" y="266" font-size="13" fill="#333" text-anchor="middle" font-style="italic">x</text>';
  return s+'</svg>';
}

/* ─────────────────── plot helpers ─────────────────── */
function vJumps(S){
  const p=S.p, out=[];
  const v0 = Vseg(S.segs[0],0);
  if(Math.abs(v0)>1e-9) out.push([0,0,v0]);
  for(let i=0;i<S.segs.length-1;i++){
    const xj=S.segs[i].e, vL=Vseg(S.segs[i],xj), vR=Vseg(S.segs[i+1],xj);
    if(Math.abs(vL-vR)>1e-9) out.push([xj,vL,vR]);
  }
  const last=S.segs[S.segs.length-1], vE=Vseg(last,p.L);
  if(Math.abs(vE)>1e-9) out.push([p.L,vE,0]);
  return out;
}
function mJumps(S){
  const out=[];
  for(let i=0;i<S.segs.length-1;i++){
    const xj=S.segs[i].e, mL=Mseg(S.segs[i],xj), mR=Mseg(S.segs[i+1],xj);
    if(Math.abs(mL-mR)>1e-9) out.push([xj,mL,mR]);
  }
  return out;
}
function vLabels(S){
  const vals=[];
  for(const g of S.segs) for(const x of [g.s,g.e]){
    const v=Vseg(g,x);
    if(Math.abs(v)<1e-9) continue;
    if(!vals.some(q=>Math.abs(q.v-v)<1e-9)) vals.push({v:v,x:x});
  }
  vals.sort((q,r)=>r.v-q.v); return vals;
}
function mLabels(S){
  const pts=[];
  for(const g of S.segs) for(const x of [g.s,g.e]){
    const v=Mseg(g,x);
    if(Math.abs(v)<1e-9) continue;
    if(!pts.some(t=>Math.abs(t.v-v)<1e-9)) pts.push({v:v,x:x});
  }
  for(const z of S.zeros){
    const v=Mseg(z.seg,z.x);
    if(Math.abs(v)>1e-9 && !pts.some(t=>Math.abs(t.v-v)<1e-9)) pts.push({v:v,x:z.x});
  }
  pts.sort((q,r)=>r.v-q.v); return pts;
}
function vSegDraw(g,X,Y){
  const v1=Vseg(g,g.s), v2=Vseg(g,g.e), X1=X(g.s), X2=X(g.e), Z=Y(0);
  let s='';
  if(v1*v2 < -1e-15){
    const xz=g.s+(g.e-g.s)*Math.abs(v1)/(Math.abs(v1)+Math.abs(v2)), Xz=X(xz);
    s += '<polygon points="'+n1(X1)+','+n1(Z)+' '+n1(X1)+','+n1(Y(v1))+' '+n1(Xz)+','+n1(Z)+'" fill="'+(v1>0?'#3b82f6':RED)+'" fill-opacity="0.15"/>'
       + '<polygon points="'+n1(Xz)+','+n1(Z)+' '+n1(X2)+','+n1(Y(v2))+' '+n1(X2)+','+n1(Z)+'" fill="'+(v2>0?'#3b82f6':RED)+'" fill-opacity="0.15"/>';
  } else {
    s += '<polygon points="'+n1(X1)+','+n1(Z)+' '+n1(X1)+','+n1(Y(v1))+' '+n1(X2)+','+n1(Y(v2))+' '+n1(X2)+','+n1(Z)+'" fill="'+((v1+v2)/2>=0?'#3b82f6':RED)+'" fill-opacity="0.15"/>';
  }
  return s+'<line x1="'+n1(X1)+'" y1="'+n1(Y(v1))+'" x2="'+n1(X2)+'" y2="'+n1(Y(v2))+'" stroke="'+NAVY+'" stroke-width="2.5"/>';
}
function mSegDraw(g,X,Y){
  const M1=Mseg(g,g.s), M2=Mseg(g,g.e), X1=X(g.s), X2=X(g.e), Y1=Y(M1), Y2=Y(M2), Z=Y(0);
  let s='';
  if(Math.abs(g.mA) > 1e-15){
    /* A parabolic segment can cross the axis (T2.6's overhung span hogs at both
       supports and sags in between), so the fill cannot be decided from the two
       endpoints. Sample the segment and emit one shaded strip per contiguous
       run of constant sign; the curve itself stays an exact quadratic Bezier. */
    const N = 48, xs = [], ms = [];
    for(let k=0;k<=N;k++){ const x=g.s+(g.e-g.s)*k/N; xs.push(x); ms.push(Mseg(g,x)); }
    let k0 = 0;
    while(k0 < N){
      let k1 = k0;
      const sign = ms[k0] >= 0;
      while(k1 < N && (ms[k1+1] >= 0) === sign) k1++;
      if(k1 > k0){
        let pts = '';
        for(let k=k0;k<=k1;k++) pts += n1(X(xs[k]))+','+n1(Y(ms[k]))+' ';
        pts += n1(X(xs[k1]))+','+n1(Z)+' '+n1(X(xs[k0]))+','+n1(Z);
        s += '<polygon points="'+pts.trim()+'" fill="'+(sign?'#3b82f6':RED)+'" fill-opacity="0.12"/>';
      }
      k0 = k1 + (k1===k0 ? 1 : 0);
      if(k1 === k0) k0++;
    }
    const xm=(g.s+g.e)/2, CPy=2*Y(Mseg(g,xm))-(Y1+Y2)/2, CPx=(X1+X2)/2;
    s += '<path d="M '+n1(X1)+','+n1(Y1)+' Q '+n1(CPx)+','+n1(CPy)+' '+n1(X2)+','+n1(Y2)+'" fill="none" stroke="'+NAVY+'" stroke-width="2.5"/>';
  } else if(M1*M2 < -1e-15){
    const xz=g.s+(g.e-g.s)*Math.abs(M1)/(Math.abs(M1)+Math.abs(M2)), Xz=X(xz);
    s += '<polygon points="'+n1(X1)+','+n1(Z)+' '+n1(X1)+','+n1(Y1)+' '+n1(Xz)+','+n1(Z)+'" fill="'+(M1>0?'#3b82f6':RED)+'" fill-opacity="0.12"/>'
       + '<polygon points="'+n1(Xz)+','+n1(Z)+' '+n1(X2)+','+n1(Y2)+' '+n1(X2)+','+n1(Z)+'" fill="'+(M2>0?'#3b82f6':RED)+'" fill-opacity="0.12"/>'
       + '<line x1="'+n1(X1)+'" y1="'+n1(Y1)+'" x2="'+n1(X2)+'" y2="'+n1(Y2)+'" stroke="'+NAVY+'" stroke-width="2.5"/>';
    return s;
  } else {
    s += '<polygon points="'+n1(X1)+','+n1(Z)+' '+n1(X2)+','+n1(Z)+' '+n1(X2)+','+n1(Y2)+' '+n1(X1)+','+n1(Y1)+'" fill="'+((M1+M2)/2>=0?'#3b82f6':RED)+'" fill-opacity="0.12"/>'
       + '<line x1="'+n1(X1)+'" y1="'+n1(Y1)+'" x2="'+n1(X2)+'" y2="'+n1(Y2)+'" stroke="'+NAVY+'" stroke-width="2.5"/>';
    return s;
  }
  return s;
}

/* ─────────────────── FIGURE: SFD ─────────────────── */
function figSFD(S,fmt){
  const p=S.p, x0=46, span=310, X=m=>x0+span*m/p.L;
  const sc = 142/((S.vMax-S.vMin)||1);
  const zeroY = 46 + S.vMax*sc, Y = v => zeroY - v*sc, bot = Y(S.vMin);
  /* viewBox is 445 wide, not 400: the "x (unit)" axis title is anchored at
     X(L)+26 and is ~36px wide, so a 400-wide canvas clipped it. Widening the
     canvas is the actual fix — reducing the width attribute alone would scale
     the clip region too and change nothing. */
  let s = '<svg viewBox="0 0 445 250" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  s += '<line x1="'+x0+'" y1="'+n1(zeroY)+'" x2="'+n1(X(p.L)+20)+'" y2="'+n1(zeroY)+'" stroke="#888" stroke-width="1"/>';
  s += '<line x1="'+x0+'" y1="24" x2="'+x0+'" y2="'+n1(bot+16)+'" stroke="#888" stroke-width="1"/>';
  for(const m of S.bps){ if(Math.abs(m)<1e-9) continue;
    s += '<line x1="'+n1(X(m))+'" y1="'+n1(zeroY-5)+'" x2="'+n1(X(m))+'" y2="'+n1(zeroY+5)+'" stroke="#888" stroke-width="1"/>'
       + '<text x="'+n1(X(m))+'" y="'+n1(bot+34)+'" text-anchor="middle" fill="'+GREY+'">'+fmt.L(m,false)+'</text>'; }
  s += '<text x="'+n1(X(p.L)+26)+'" y="'+n1(bot+34)+'" fill="'+GREY+'">x ('+fmt.unitL+')</text>';
  s += '<text x="8" y="28" fill="'+GREY+'">V ('+fmt.unitF+')</text>';
  for(const g of S.segs) s += vSegDraw(g,X,Y);
  for(const j of vJumps(S))
    s += '<line x1="'+n1(X(j[0]))+'" y1="'+n1(Y(j[1]))+'" x2="'+n1(X(j[0]))+'" y2="'+n1(Y(j[2]))+'" stroke="'+NAVY+'" stroke-width="1.5" stroke-dasharray="4,3"/>';
  const placed=[];
  for(const q of vLabels(S)){
    const col = q.v>0?NAVY:RED;
    if(X(q.x) > x0+1)
      s += '<line x1="'+x0+'" y1="'+n1(Y(q.v))+'" x2="'+n1(X(q.x))+'" y2="'+n1(Y(q.v))+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="3,3"/>';
    const ly = place(placed, Y(q.v)+3.5, 13);
    s += leader(ly,Y(q.v),x0,col);
    s += '<text x="'+(x0-6)+'" y="'+n1(ly)+'" text-anchor="end" fill="'+col+'" font-weight="bold">'+fmt.pmF(q.v)+'</text>';
  }
  for(const z of S.zeros){
    const Xz=X(z.x);
    s += '<circle cx="'+n1(Xz)+'" cy="'+n1(zeroY)+'" r="3.5" fill="'+ORANGE+'"/>'
       + '<line x1="'+n1(Xz)+'" y1="'+n1(zeroY)+'" x2="'+n1(Xz)+'" y2="'+n1(bot+42)+'" stroke="'+ORANGE+'" stroke-width="1" stroke-dasharray="3,3"/>'
       + '<text x="'+n1(Xz)+'" y="'+n1(bot+56)+'" text-anchor="middle" fill="'+ORANGE+'" font-weight="bold" font-size="11">V = 0 at x = '+fmt.Lu(z.x,false)+'</text>';
  }
  return s+'</svg>';
}

/* ─────────────────── FIGURE: BMD ─────────────────── */
function figBMD(S,fmt){
  const p=S.p, x0=46, span=310, X=m=>x0+span*m/p.L;
  const sc = 150/((S.Mmax-S.Mmin)||1);
  const zeroY = 44 + S.Mmax*sc, Y = m => zeroY - m*sc, bot = Y(S.Mmin);
  let s = '<svg viewBox="0 0 445 258" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  s += '<line x1="'+x0+'" y1="'+n1(zeroY)+'" x2="'+n1(X(p.L)+20)+'" y2="'+n1(zeroY)+'" stroke="#888" stroke-width="1"/>';
  s += '<line x1="'+x0+'" y1="24" x2="'+x0+'" y2="'+n1(bot+16)+'" stroke="#888" stroke-width="1"/>';
  for(const m of S.bps){ if(Math.abs(m)<1e-9) continue;
    s += '<line x1="'+n1(X(m))+'" y1="'+n1(zeroY-5)+'" x2="'+n1(X(m))+'" y2="'+n1(zeroY+5)+'" stroke="#888" stroke-width="1"/>'
       + '<text x="'+n1(X(m))+'" y="'+n1(bot+34)+'" text-anchor="middle" fill="'+GREY+'">'+fmt.L(m,false)+'</text>'; }
  s += '<text x="'+n1(X(p.L)+26)+'" y="'+n1(bot+34)+'" fill="'+GREY+'">x ('+fmt.unitL+')</text>';
  s += '<text x="8" y="28" fill="'+GREY+'">M ('+fmt.unitM+')</text>';
  for(const g of S.segs) s += mSegDraw(g,X,Y);
  for(const j of mJumps(S))
    s += '<line x1="'+n1(X(j[0]))+'" y1="'+n1(Y(j[1]))+'" x2="'+n1(X(j[0]))+'" y2="'+n1(Y(j[2]))+'" stroke="'+NAVY+'" stroke-width="1.5" stroke-dasharray="4,3"/>';
  const placed=[];
  for(const q of mLabels(S)){
    const col = q.v>=0?NAVY:RED;
    if(X(q.x) > x0+1)
      s += '<line x1="'+x0+'" y1="'+n1(Y(q.v))+'" x2="'+n1(X(q.x))+'" y2="'+n1(Y(q.v))+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="3,3"/>';
    const ly = place(placed, Y(q.v)+3.5, 13);
    s += leader(ly,Y(q.v),x0,col);
    s += '<text x="'+(x0-6)+'" y="'+n1(ly)+'" text-anchor="end" fill="'+col+'" font-weight="bold">'+fmt.M(q.v,false)+'</text>';
  }
  const Xp=X(S.xAbs);
  s += '<circle cx="'+n1(Xp)+'" cy="'+n1(Y(S.Mabs))+'" r="3.5" fill="'+ORANGE+'"/>'
     + '<line x1="'+n1(Xp)+'" y1="'+n1(Y(S.Mabs))+'" x2="'+n1(Xp)+'" y2="'+n1(bot+42)+'" stroke="'+ORANGE+'" stroke-width="1" stroke-dasharray="3,3"/>'
     + '<text x="'+n1(Xp)+'" y="'+n1(bot+56)+'" text-anchor="middle" fill="'+ORANGE+'" font-weight="bold" font-size="11">largest |M| = '+fmt.Mu(S.Mabs,false)+' at x = '+fmt.Lu(S.xAbs,false)+'</text>';
  return s+'</svg>';
}

/* ─────────────────── FIGURE: stacked summary ─────────────────── */
function figSummary(S,fmt){
  const p=S.p, x0=86, span=282, X=m=>x0+span*m/p.L;
  let s = '<svg viewBox="0 0 460 810" width="730" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="13">';
  for(const m of S.bps)
    s += '<line x1="'+n1(X(m))+'" y1="130" x2="'+n1(X(m))+'" y2="746" stroke="#aab4c8" stroke-width="1" stroke-dasharray="4,4"/>';

  /* beam FBD */
  const yT=118;
  s += '<rect x="'+n1(X(0))+'" y="'+yT+'" width="'+n1(X(p.L)-X(0))+'" height="12" fill="#7eaecf" stroke="'+NAVY+'" stroke-width="1.5"/>';
  if(S.hasUDL) s += udlBlock(X(p.a),X(p.b),yT-38,yT-1,fmt.Wu(p.w,false));
  if(S.hasP)   s += ptLoad(X(p.c),yT-64,yT-1,fmt.Fu(p.P,false),12);
  if(S.hasM)   s += momentArrow(X(p.d),yT+6,18,fmt.Mu(Math.abs(p.M0),false),11,p.M0>0);
  s += pinSup(X(p.sA),yT+12) + rollerSup(X(p.sB),yT+12);
  s += supLabel(S,X,p.sA,yT,'A','left') + supLabel(S,X,p.sB,yT,'B','right');
  s += reactArrow(X(p.sA),yT+36,30,'A',fmt.Fu(S.RA,false),yT+92,S.RA<0);
  s += reactArrow(X(p.sB),yT+36,30,'B',fmt.Fu(S.RB,false),yT+92,S.RB<0);
  s += dimChain(X,S.bps,252,11.5,fmt);

  /* SFD */
  const vsc = 108/((S.vMax-S.vMin)||1);
  const vZero = 350 + S.vMax*vsc, VY=v=>vZero-v*vsc, vBot=VY(S.vMin);
  s += '<text x="14" y="'+n1((VY(S.vMax)+VY(S.vMin))/2+5)+'" font-size="14" fill="'+NAVY+'" font-weight="bold">SFD</text>';
  s += '<text x="'+x0+'" y="330" font-size="12" fill="'+GREY+'">V ('+fmt.unitF+')</text>';
  s += '<line x1="'+x0+'" y1="'+n1(vZero)+'" x2="'+n1(X(p.L)+24)+'" y2="'+n1(vZero)+'" stroke="#888" stroke-width="1"/>';
  s += '<line x1="'+x0+'" y1="336" x2="'+x0+'" y2="'+n1(vBot+16)+'" stroke="#888" stroke-width="1"/>';
  for(const m of S.bps){ if(Math.abs(m)<1e-9) continue;
    s += '<line x1="'+n1(X(m))+'" y1="'+n1(vZero-4)+'" x2="'+n1(X(m))+'" y2="'+n1(vZero+4)+'" stroke="#888" stroke-width="1"/>'
       + '<text x="'+n1(X(m))+'" y="'+n1(vBot+34)+'" font-size="12" fill="'+GREY+'" text-anchor="middle">'+fmt.L(m,false)+'</text>'; }
  for(const g of S.segs) s += vSegDraw(g,X,VY);
  for(const j of vJumps(S))
    s += '<line x1="'+n1(X(j[0]))+'" y1="'+n1(VY(j[1]))+'" x2="'+n1(X(j[0]))+'" y2="'+n1(VY(j[2]))+'" stroke="'+NAVY+'" stroke-width="1.5" stroke-dasharray="4,3"/>';
  const vp=[];
  for(const q of vLabels(S)){
    const col=q.v>0?NAVY:RED;
    if(X(q.x)>x0+1)
      s += '<line x1="'+x0+'" y1="'+n1(VY(q.v))+'" x2="'+n1(X(q.x))+'" y2="'+n1(VY(q.v))+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="3,3"/>';
    const ly=place(vp,VY(q.v)+4,14);
    s += leader(ly,VY(q.v),x0,col);
    s += '<text x="'+(x0-8)+'" y="'+n1(ly)+'" font-size="13" fill="'+col+'" text-anchor="end" font-weight="bold">'+fmt.pmF(q.v)+'</text>';
  }

  /* BMD */
  const msc = 116/((S.Mmax-S.Mmin)||1);
  const mZero = 620 + S.Mmax*msc, MY=m=>mZero-m*msc, mBot=MY(S.Mmin);
  s += '<text x="14" y="'+n1((MY(S.Mmax)+MY(S.Mmin))/2+5)+'" font-size="14" fill="'+NAVY+'" font-weight="bold">BMD</text>';
  s += '<text x="'+x0+'" y="'+n1(MY(S.Mmax)-14)+'" font-size="12" fill="'+GREY+'">M ('+fmt.unitM+')</text>';
  s += '<line x1="'+x0+'" y1="'+n1(mZero)+'" x2="'+n1(X(p.L)+24)+'" y2="'+n1(mZero)+'" stroke="#888" stroke-width="1"/>';
  s += '<line x1="'+x0+'" y1="'+n1(MY(S.Mmax)-8)+'" x2="'+x0+'" y2="'+n1(mBot+16)+'" stroke="#888" stroke-width="1"/>';
  for(const m of S.bps){ if(Math.abs(m)<1e-9) continue;
    s += '<line x1="'+n1(X(m))+'" y1="'+n1(mZero-4)+'" x2="'+n1(X(m))+'" y2="'+n1(mZero+4)+'" stroke="#888" stroke-width="1"/>'
       + '<text x="'+n1(X(m))+'" y="'+n1(mBot+34)+'" font-size="12" fill="'+GREY+'" text-anchor="middle">'+fmt.L(m,false)+'</text>'; }
  s += '<text x="'+n1(X(p.L)+16)+'" y="'+n1(mBot+34)+'" font-size="12" fill="'+GREY+'">x ('+fmt.unitL+')</text>';
  for(const g of S.segs) s += mSegDraw(g,X,MY);
  for(const j of mJumps(S))
    s += '<line x1="'+n1(X(j[0]))+'" y1="'+n1(MY(j[1]))+'" x2="'+n1(X(j[0]))+'" y2="'+n1(MY(j[2]))+'" stroke="'+NAVY+'" stroke-width="1.5" stroke-dasharray="4,3"/>';
  const mp=[];
  for(const q of mLabels(S)){
    const col=q.v>=0?NAVY:RED;
    if(X(q.x)>x0+1)
      s += '<line x1="'+x0+'" y1="'+n1(MY(q.v))+'" x2="'+n1(X(q.x))+'" y2="'+n1(MY(q.v))+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="3,3"/>';
    const ly=place(mp,MY(q.v)+4,14);
    s += leader(ly,MY(q.v),x0,col);
    s += '<text x="'+(x0-8)+'" y="'+n1(ly)+'" font-size="12" fill="'+col+'" text-anchor="end" font-weight="bold">'+fmt.M(q.v,false)+'</text>';
  }
  return s+'</svg>';
}

/* ─────────────────── equations ─────────────────── */
const CIRCLED = ['①','②','③','④','⑤','⑥'];
function tex(v){ return v; }

function vEqn(S,fmt,g){
  const p=S.p, up=[], dn=[];
  if(g.pastA) up.push('R_A');
  if(g.pastB) up.push('R_B');
  if(g.hasP)  dn.push(fmt.F(p.P,true));
  if(g.udl==='partial') dn.push(fmt.W(p.w,true)+'(x-'+fmt.L(p.a,true)+')');
  if(g.udl==='full')    dn.push(fmt.F(S.W,true));
  const lhs = (up.length? up.join(' + ') : '0') + dn.map(u=>' - '+u).join('') + ' - V = 0';
  const rhs = (Math.abs(g.vA)<1e-12)
    ? 'V = '+fmt.F(g.vB,true)+(fmt.sym?'':'\\ \\text{'+fmt.unitF+'}')+'\\quad\\text{(constant)}'
    : 'V(x) = '+fmt.F(g.vB,true)+' - '+fmt.W(p.w,true)+'x';
  return '\\sum F_y = 0:\\quad ' + lhs + ' \\quad\\Rightarrow\\quad ' + rhs;
}
function vExpr(S,fmt,g){
  const p=S.p;
  if(Math.abs(g.vA)<1e-12) return fmt.F(g.vB,true);
  return fmt.F(g.vB,true)+' - '+fmt.W(p.w,true)+'x';
}
function mEqn(S,fmt,g){
  const p=S.p, t=[];
  if(g.pastB) t.push('R_B(x-'+fmt.L(p.sB,true)+')');
  if(g.udl==='partial') t.push(fmt.W(p.w,true)+'(x-'+fmt.L(p.a,true)+')\\cdot\\tfrac{x+'+fmt.L(p.a,true)+'}{2}');
  if(g.udl==='full')    t.push(fmt.F(S.W,true)+'('+fmt.L(S.xb,true)+')');
  if(g.hasP)            t.push(fmt.F(p.P,true)+'('+fmt.L(p.c,true)+')');
  let lhs = 'M - Vx';
  lhs += t.map(u=>' - '+u).join('');
  if(g.hasM0) lhs += (p.M0>0 ? ' + ' : ' - ') + fmt.M(Math.abs(p.M0),true);
  return '\\sum M_A = 0:\\quad ' + lhs + ' = 0';
}
function mPoly(fmt,g){
  const co = (v,lead) => {
    const a=Math.abs(v);
    const unit = fmt.sym ? false : (Math.abs(a-1)<1e-12);
    const mag = unit ? '' : fmt.M(a,true);
    return (lead ? (v<0?'-':'') : (v<0?' - ':' + ')) + mag;
  };
  let t='';
  if(Math.abs(g.mA)>1e-12) t += co(g.mA,true)+'x^2';
  if(Math.abs(g.mB)>1e-12) t += co(g.mB,!t)+'x';
  if(Math.abs(g.mC)>1e-12) t += (t? (g.mC<0?' - ':' + ')+fmt.M(Math.abs(g.mC),true) : fmt.M(g.mC,true));
  return 'M(x) = ' + (t || '0');
}
function segTitle(S,fmt,g){
  const bits=[];
  if(!g.pastA) bits.push('before support $A$ (overhang)');
  if(g.udl==='partial') bits.push('inside the UDL — only the load behind the cut counts');
  if(g.udl==='full' && S.hasUDL) bits.push('past the whole UDL');
  if(g.hasP) bits.push('past the point load');
  if(g.hasM0) bits.push('past the applied moment');
  if(g.pastB) bits.push('past support $B$');
  const what = bits.length ? bits.join(', ') : 'only $R_A$ acts on the left free body';
  return CIRCLED[g.i]+' &nbsp;$'+fmt.L(g.s,true)+' \\le x \\le '+fmt.L(g.e,true)+'$ — '+what;
}

/* ─────────────────── page builder ─────────────────── */
function stepBlock(n,title,hint,body){
  return '<div class="step"><details'+(n===1?' open':'')+'>'
       + '<summary><span class="step-num">'+n+'</span><span class="step-title">'+title+'</span>'
       + '<span class="try-hint">'+hint+'</span></summary>'
       + '<div class="step-body">'+body+'</div></details></div>';
}

function build(cfg, p){
  const S = solve(p), fmt = makeFmt(cfg);
  /* inline units, ALWAYS used inside $...$ (never appended after the closing $) */
  const U  = fmt.sym ? '' : '\\ '+fmt.texF;
  const UM = fmt.sym ? '' : '\\ '+fmt.texM;
  let h = '';

  /* problem statement */
  const desc = [];
  desc.push('Beam of total length '+fmt.Lu(p.L,false)+'. Pin support at $A$ ($x = '+fmt.L(p.sA,true)+'$), roller at $B$ ($x = '+fmt.L(p.sB,true)+'$).');
  if(Math.abs(p.sA)>1e-9 || Math.abs(p.sB-p.L)>1e-9) desc.push('The beam <strong>overhangs</strong> its supports.');
  if(S.hasUDL) desc.push('UDL of '+fmt.Wu(p.w,false)+' from $x = '+fmt.L(p.a,true)+'$ to $x = '+fmt.L(p.b,true)+'$.');
  if(S.hasP)   desc.push('Downward point load of '+fmt.Fu(p.P,false)+' at $x = '+fmt.L(p.c,true)+'$.');
  if(S.hasM)   desc.push('Applied '+(p.M0>0?'counter-clockwise':'clockwise')+' concentrated moment of '+fmt.Mu(Math.abs(p.M0),false)+' at $x = '+fmt.L(p.d,true)+'$.');

  h += '<h3>Problem Statement</h3><p>'+cfg.question+'</p>'
    +  '<div class="callout info"><p>'+desc.join(' ')+'</p></div>'
    +  '<div class="diagram-wrap"><figure>'+figProblem(S,fmt)+'<figcaption>'+desc.join(' ').replace(/<\/?strong>/g,'')+'</figcaption></figure></div>'
    +  '<div class="callout given"><p><strong>Answer:</strong> &nbsp; '+cfg.answer(S,fmt)+'</p></div>';
  if(cfg.strategy) h += '<div class="callout info"><p><strong>Strategy:</strong> '+cfg.strategy+'</p></div>';
  h += '<h3>Solution</h3>';

  /* step 1 — reactions */
  let b1 = '<div class="diagram-wrap"><figure>'+figReactions(S,fmt)
    + '<figcaption>Free-body diagram of the whole beam — supports replaced by the unknown reactions, both assumed upward.</figcaption></figure></div>';
  if(S.hasUDL)
    b1 += '<p>The UDL of '+fmt.Wu(p.w,false)+' acts over '+fmt.Lu(p.b-p.a,false)+', so it is equivalent to a single downward force of '
       +  '$'+fmt.W(p.w,true)+' \\times '+fmt.L(p.b-p.a,true)+' = '+fmt.F(S.W,true)+U+'$'+' at the centroid of that length, $x = '+fmt.L(S.xb,true)+'$.</p>';
  const mt=[];
  if(S.hasUDL) mt.push(fmt.F(S.W,true)+'('+fmt.L(S.xb-p.sA,true)+')');
  if(S.hasP)   mt.push(fmt.F(p.P,true)+'('+fmt.L(p.c-p.sA,true)+')');
  b1 += '<p>Take moments about $A$, counter-clockwise positive. Downward loads to the right of $A$ turn the beam clockwise, so they enter negatively; '
     +  '$R_B$ turns it counter-clockwise, so it enters positively'
     +  (S.hasM ? '. The applied moment is a pure couple — it contributes $'+fmt.M(Math.abs(p.M0),true)+UM+'$'+' directly, with no lever arm, and being '
        +(p.M0>0?'counter-clockwise it enters positively':'clockwise it enters negatively')+'.' : '.')+'</p>'
     +  '<div class="math-block">$$\\sum M_A = 0:\\quad R_B('+fmt.L(p.sB-p.sA,true)+')'
     +  mt.map(u=>' - '+u).join('')
     +  (S.hasM ? (p.M0>0?' + ':' - ')+fmt.M(Math.abs(p.M0),true) : '')
     +  ' = 0$$'
     +  '$$R_B = '+fmt.F(S.RB,true)+U+(S.RB<0?'\\ (\\text{i.e. downward})':'\\ \\uparrow')+'$$</div>'
     +  '<div class="math-block">$$\\sum F_y = 0:\\quad R_A + R_B = '+fmt.F(S.W+(p.P||0),true)+U
     +  ' \\implies R_A = '+fmt.F(S.RA,true)+U+(S.RA<0?'\\ (\\text{i.e. downward})':'\\ \\uparrow')+'$$</div>'
     +  '<div class="callout answer"><p>$R_A = '+fmt.F(S.RA,true)+U+'$'+' &nbsp;&nbsp;&nbsp; $R_B = '+fmt.F(S.RB,true)+U+'$'+'</p></div>';
  if(S.RA<0 || S.RB<0)
    b1 += '<div class="callout warn"><p><strong>A negative reaction is not a mistake.</strong> $R_'+(S.RA<0?'A':'B')+'$ comes out negative, '
       +  'which simply means the assumed upward direction was wrong — that support actually pulls <em>down</em> on the beam. '
       +  'Keep the negative sign through the rest of the working; do not flip it.</p></div>';
  b1 += '<div class="callout note"><p><strong>Check:</strong> $'+fmt.F(S.RA,true)+' + '+fmt.F(S.RB,true)+' = '+fmt.F(S.RA+S.RB,true)+U+'$'
     +  ', matching the total downward load'+(S.hasM?' (the couple adds no net vertical force)':'')+' ✓</p></div>';
  h += stepBlock(1,'Find the support reactions','try it yourself first',b1);

  /* step 2 — SFD */
  let b2 = '<p>Cut the beam in each segment and apply $\\sum F_y = 0$ to the free body on the <strong>left</strong> of the cut, '
    + 'with $V$ drawn downward on the cut face (assumed positive). The segment boundaries are every place the loading or support '
    + 'condition changes: $x = '+S.bps.map(v=>fmt.L(v,true)).join(',\\ ')+'$.</p>';
  for(const g of S.segs){
    b2 += '<h4>'+segTitle(S,fmt,g)+'</h4>'
       +  '<div class="diagram-wrap"><figure>'+figCut(S,fmt,g)
       +  '<figcaption>Cut at a section $'+fmt.L(g.s,true)+' &lt; x &lt; '+fmt.L(g.e,true)+'$ — the free body to the left of the cut.</figcaption>'
       +  '</figure></div><div class="math-block">$$'+vEqn(S,fmt,g)+'$$';
    if(Math.abs(g.vA)>1e-12)
      b2 += '$$V('+fmt.L(g.s,true)+') = '+fmt.F(Vseg(g,g.s),true)+U+',\\qquad V('+fmt.L(g.e,true)+') = '+fmt.F(Vseg(g,g.e),true)+U+'$$';
    b2 += '</div>';
    for(const z of S.zeros) if(z.seg===g)
      b2 += '<p>Shear crosses zero inside this segment, and the bending moment is always stationary where $V = 0$ — so this locates a peak:</p>'
         +  '<div class="math-block">$$'+vExpr(S,fmt,g)+' = 0 \\implies \\boxed{x = '+fmt.L(z.x,true)+'}$$</div>';
  }
  if(S.hasM) b2 += '<p>Note that $V$ is <strong>unchanged</strong> across $x = '+fmt.L(p.d,true)+'$ — a concentrated moment produces no shear jump.</p>';
  b2 += '<div class="diagram-wrap"><figure>'+figSFD(S,fmt)
     +  '<figcaption>Shear force diagram — a step at each concentrated force (including the reactions), a straight ramp through any UDL, closing to zero at the free end.</figcaption>'
     +  '</figure></div>';
  h += stepBlock(2,'Construct the shear force diagram $V(x)$','sketch it before opening',b2);

  /* step 3 — BMD */
  let b3 = '<p>For each cut apply $\\sum M_A = 0$ to the same left free body, reusing $V$ from Step 2. '
    + '$R_A$ acts through $A$, so its lever arm is zero and it drops out of every equation.</p>';
  for(const g of S.segs){
    /* The cut free body is repeated here rather than cross-referenced, so a
       student working through the moment equations does not have to scroll back
       up to Step 2 to see which loads sit behind the cut. */
    b3 += '<h4>'+segTitle(S,fmt,g)+'</h4>'
       +  '<div class="diagram-wrap"><figure>'+figCut(S,fmt,g)
       +  '<figcaption>The same cut as Step 2 '+CIRCLED[g.i]+' — now taking moments about $A$ instead of '
       +  'summing vertical forces. $R_A$ acts through $A$, so it has no lever arm here.</figcaption>'
       +  '</figure></div>'
       +  '<div class="math-block">$$'+mEqn(S,fmt,g)+'$$</div>'
       +  '<p>Substituting $V = '+vExpr(S,fmt,g)+'$ from Step 2 '+CIRCLED[g.i]+':</p>'
       +  '<div class="math-block">$$'+mPoly(fmt,g)+'$$'
       +  '$$M('+fmt.L(g.s,true)+') = '+fmt.M(Mseg(g,g.s),true)+UM+',\\qquad M('+fmt.L(g.e,true)+') = '+fmt.M(Mseg(g,g.e),true)+UM+'$$</div>';
    if(Math.abs(g.mA)>1e-12)
      b3 += '<p>The squared term makes this segment <strong>parabolic</strong> — that is what a linearly varying shear integrates to.</p>';
    for(const z of S.zeros) if(z.seg===g)
      b3 += '<p>At the zero-shear point ($x = '+fmt.L(z.x,true)+'$):</p>'
         +  '<div class="math-block">$$M('+fmt.L(z.x,true)+') = \\boxed{'+fmt.M(Mseg(g,z.x),true)+UM+'}$$</div>';
  }
  for(const j of mJumps(S))
    b3 += '<div class="callout note"><p><strong>The jump at $x = '+fmt.L(j[0],true)+'$:</strong> the bending moment steps from $'+fmt.M(j[1],true)+'$ to $'
       +  fmt.M(j[2],true)+UM+'$'+' — a change of $'+fmt.M(j[2]-j[1],true)+'$, exactly the applied moment. '
       +  'This is the signature of a concentrated couple: it steps the BMD but leaves the SFD flat.</p></div>';
  if(S.Mmin < -1e-9)
    b3 += '<div class="callout warn"><p><strong>Watch the sign:</strong> the moment goes negative, reaching $'+fmt.M(S.Mmin,true)+UM+'$'+' at $x = '+fmt.L(S.xMin,true)+'$. '
       +  'A negative bending moment means the beam is <strong>hogging</strong> there — curving upward, tension in the top fibre — rather than sagging.</p></div>';
  b3 += '<div class="diagram-wrap"><figure>'+figBMD(S,fmt)
     +  '<figcaption>Bending moment diagram — linear where shear is constant, parabolic through any UDL, zero at a free end and at a simple support with nothing beyond it.</figcaption>'
     +  '</figure></div>'
     +  '<div class="callout answer"><p>'+cfg.answer(S,fmt)+'</p></div>';
  h += stepBlock(3,'Construct the bending moment diagram $M(x)$','sketch it before opening',b3);

  /* step 4 — summary */
  h += stepBlock(4,'Summary','the three diagrams together',
      '<div class="diagram-wrap"><figure>'+figSummary(S,fmt)
    + '<figcaption>Beam FBD, shear force diagram and bending moment diagram on a common horizontal scale — the dashed guide lines connect each load and support position to the kinks and jumps in both diagrams.</figcaption>'
    + '</figure></div><div class="callout answer"><p>'+cfg.answer(S,fmt)+'</p></div>');

  /* common mistakes */
  const mis = [];
  if(S.hasUDL) mis.push('<strong>Taking the UDL lever arm from the wrong point</strong> — the $'+fmt.F(S.W,true)+U+'$'+' resultant acts at $x = '+fmt.L(S.xb,true)
    +'$, the centroid of the loaded length, not at either end of it.');
  if(S.hasUDL) mis.push('<strong>Using the whole UDL inside the loaded zone</strong> — behind a cut at $x$ within the loaded length, only $(x - '+fmt.L(p.a,true)
    +')$ is loaded, giving $'+fmt.W(p.w,true)+'(x-'+fmt.L(p.a,true)+')$, not the full $'+fmt.F(S.W,true)+U+'$'+'.');
  if(S.hasM) mis.push('<strong>Putting the applied moment into $\\sum F_y$</strong> — a pure couple has no resultant force, so it never appears in a vertical '
    +'force balance and never creates a step in the shear diagram. Nor does it get a lever arm in $\\sum M_A$.');
  if(S.zeros.length) mis.push('<strong>Assuming the peak moment sits under the biggest load</strong> — it occurs where $V = 0$'
    + (S.zeros.length===1 ? ', which here is $x = '+fmt.L(S.zeros[0].x,true)+'$' : '')+'. Setting $V(x) = 0$ is the key step.');
  if(Math.abs(p.sA)>1e-9 || Math.abs(p.sB-p.L)>1e-9) mis.push('<strong>Forgetting the overhang</strong> — the bending moment is zero at a <em>free end</em>, '
    +'not at the support. On the overhang the moment is negative (hogging), and it must be carried through into the supported span.');
  if(S.RA<0 || S.RB<0) mis.push('<strong>Flipping a negative reaction to make it positive</strong> — keep the sign. It is telling you the support pulls down.');
  mis.push('<strong>Drawing the BMD as straight lines through a UDL</strong> — where $V$ is linear, $M$ must be quadratic.');
  h += '<div class="callout warn"><p><strong>Common mistakes:</strong></p>'
     + mis.slice(0,5).map((m,i)=>'<p style="margin-top:6px">'+CIRCLED[i]+' '+m+'</p>').join('') + '</div>';

  return h;
}


/* ─────────────────── tutorial configuration ─────────────────── */
var CONFIG = {
  question: "An angle strut welded to the free end $C$ applies a downward force with a horizontal eccentricity. Replace it by an equivalent force-plus-couple at $C$, then draw the <strong>shear force</strong> and <strong>bending moment diagrams</strong> and find the bending moment at the roller $B$.",
  units: {F:"kN", M:"kNm", L:"m"},
  strategy: "an eccentric force is statically equivalent to the same force acting through the section plus a couple equal to force × eccentricity. Reduce it first, then treat the problem as a beam with a point load and an applied moment — both applied at the free end $C$.",
  symbolic: false,
  answer: function(S,fmt){
        return '$M_B = '+fmt.M(S.Mof(S.p.sB),true)+'\\ \\text{kNm}$ at the roller ($x = '+
               fmt.L(S.p.sB,true)+'$ m) &mdash; hogging, and the largest bending moment anywhere on the beam';
      }
};
var VARIANTS = [
  {btn: "Original", desc: "The tutorial sheet problem — strut applies 1.6 kN at 200 mm eccentricity, so the equivalent couple is 1.6 × 0.2 = 0.32 kNm. Note that R_A comes out negative.", L: 0.85, sA: 0, sB: 0.4, P: 1.6, c: 0.85, M0: 0.32, d: 0.85},
  {btn: "Variant 1 — new load magnitudes", desc: "Same geometry. The strut now applies 2.0 kN at 150 mm eccentricity, so the equivalent couple is 2.0 × 0.15 = 0.30 kNm. R_A is still negative — the pin holds the beam down.", L: 0.85, sA: 0, sB: 0.4, P: 2, c: 0.85, M0: 0.3, d: 0.85},
  {btn: "Variant 2 — new load positions", desc: "Same 1.6 kN strut and same 0.32 kNm couple, but the roller moves out to 0.5 m and the overhang lengthens to 1.2 m. The longer lever doubles the hold-down force at A.", L: 1.2, sA: 0, sB: 0.5, P: 1.6, c: 1.2, M0: 0.32, d: 1.2}
];

/* ─────────────────── wiring ─────────────────── */
function render(i){
  var v = VARIANTS[i];
  document.getElementById('doc').innerHTML = build(CONFIG, v);
  document.getElementById('swDesc').textContent = v.desc;
  var btns = document.querySelectorAll('#swBtns button');
  for(var j=0;j<btns.length;j++) btns[j].setAttribute('aria-pressed', j===i ? 'true' : 'false');
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('doc'), {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}
function init(){
  var box = document.getElementById('swBtns');
  VARIANTS.forEach(function(v,i){
    var b = document.createElement('button');
    b.textContent = v.btn;
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){ render(i); };
    box.appendChild(b);
  });
  render(0);
}
window.addEventListener('load', init);
</script>
