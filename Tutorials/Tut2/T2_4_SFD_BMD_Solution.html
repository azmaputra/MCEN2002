<script>
/* ══════════════════════════════════════════════════════════════
   PARAMETRIC SFD / BMD ENGINE
   Beam: simply supported, span L. Pin at A (x=0), roller at B (x=L).
   Loads: UDL of intensity w over [a, b]; point load P at x = c.
   Every diagram and every equation on this page is generated from
   those six numbers — nothing is hard-coded per variant, so the
   segment structure adapts automatically when the loads move.
   ══════════════════════════════════════════════════════════════ */

const VARIANTS = [
  { btn:'Original',
    desc:'The tutorial sheet problem — UDL near mid-span, point load beyond it.',
    L:9, w:0.8, a:2, b:5, P:1.5, c:7 },
  { btn:'Variant 1 — new load magnitudes',
    desc:'Same geometry, heavier loads. The point load now dominates the reactions, but the shear still crosses zero inside the UDL, so the peak moment is located the same way.',
    L:9, w:2.0, a:2, b:5, P:6.0, c:7 },
  { btn:'Variant 2 — new load positions',
    desc:'Same load magnitudes, moved. The point load now sits BEFORE the UDL, so the segment order changes — you cannot pattern-match the original, you have to re-derive which loads sit behind each cut.',
    L:9, w:0.8, a:4, b:7, P:1.5, c:2 }
];

/* ── number formatting ── */
function f(n){
  let r = Math.round(n*1e6)/1e6;
  if(Object.is(r,-0)) r = 0;
  return String(r);
}
function fs(n){ return (n<0 ? '-' : '') + f(Math.abs(n)); }
function sgn(n){ return (n<0 ? ' - ' : ' + ') + f(Math.abs(n)); }

/* ══════════════════ SOLVER ══════════════════ */
function segAt(segs,x){
  for(const g of segs) if(x >= g.s-1e-9 && x <= g.e+1e-9) return g;
  return segs[segs.length-1];
}
function Vleft(g,x){ return g.vA*x + g.vB; }
function Mseg(g,x){ return g.mA*x*x + g.mB*x + g.mC; }

function solve(p){
  const L=p.L, w=p.w, a=p.a, b=p.b, P=p.P, c=p.c;
  const W  = w*(b-a);            // UDL resultant
  const xb = (a+b)/2;            // its line of action
  const RB = (W*xb + P*c)/L;
  const RA = W + P - RB;

  const bps = [...new Set([0,a,b,c,L])].sort(function(u,v){return u-v;});

  const segs = [];
  for(let i=0;i<bps.length-1;i++){
    const s = bps[i], e = bps[i+1], mid = (s+e)/2;
    // what does the free body LEFT of a cut in this segment carry?
    const udl  = (mid <= a) ? 'none' : (mid >= b ? 'full' : 'partial');
    const hasP = mid > c;

    // V(x) = vA·x + vB
    let vA = 0, vB = RA;
    if(hasP)            { vB -= P; }
    if(udl==='partial') { vA -= w;  vB += w*a; }
    if(udl==='full')    { vB -= W; }

    // M(x) = mA·x² + mB·x + mC   (from ΣM_A = 0 on that free body)
    let mA = 0, mB = RA, mC = 0;
    if(hasP)            { mB -= P;   mC += P*c; }
    if(udl==='partial') { mA -= w/2; mB += w*a; mC -= w*a*a/2; }
    if(udl==='full')    { mB -= W;   mC += W*xb; }

    segs.push({i:i,s:s,e:e,mid:mid,udl:udl,hasP:hasP,vA:vA,vB:vB,mA:mA,mB:mB,mC:mC});
  }

  // where does shear cross zero? (only possible inside a running-UDL segment)
  let zero = null, zeroSeg = null;
  for(const g of segs){
    if(g.vA !== 0){
      const x = -g.vB/g.vA;
      if(x > g.s+1e-9 && x < g.e-1e-9){ zero = x; zeroSeg = g; }
    }
  }

  const Mof = function(x){ return Mseg(segAt(segs,x), x); };
  const cand = bps.slice();
  if(zero !== null) cand.push(zero);
  let Mmax = -Infinity, xMax = 0;
  for(const x of cand){ const m = Mof(x); if(m > Mmax + 1e-9){ Mmax = m; xMax = x; } }

  return {p:p,W:W,xb:xb,RA:RA,RB:RB,bps:bps,segs:segs,
          zero:zero,zeroSeg:zeroSeg,Mmax:Mmax,xMax:xMax,Mof:Mof};
}

/* ══════════════════ SVG PRIMITIVES ══════════════════ */
const RED='#c0392b', NAVY='#1a3c6e', BLUE='#1a6fc4', ORANGE='#f97316', GREY='#555';
const n1 = v => Number(v).toFixed(1);

function udlBlock(x1,x2,yTop,yBot,label){
  let s = '<line x1="'+n1(x1)+'" y1="'+yTop+'" x2="'+n1(x2)+'" y2="'+yTop+'" stroke="'+RED+'" stroke-width="1.5"/>';
  const n = Math.max(3, Math.round((x2-x1)/19));
  for(let i=0;i<=n;i++){
    const x = x1 + (x2-x1)*i/n;
    s += '<line x1="'+n1(x)+'" y1="'+yTop+'" x2="'+n1(x)+'" y2="'+yBot+'" stroke="'+RED+'" stroke-width="1.2"/>';
    s += '<polygon points="'+n1(x)+','+(yBot+1)+' '+n1(x-5)+','+(yBot-11)+' '+n1(x+5)+','+(yBot-11)+'" fill="'+RED+'"/>';
  }
  if(label) s += '<text x="'+n1((x1+x2)/2)+'" y="'+(yTop-8)+'" font-size="13" fill="'+RED+'" text-anchor="middle" font-weight="bold">'+label+'</text>';
  return s;
}
function udlFaint(x1,x2,y){
  return '<line x1="'+n1(x1)+'" y1="'+y+'" x2="'+n1(x2)+'" y2="'+y+'" stroke="'+RED+'" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="0.45"/>'
       + '<line x1="'+n1(x1)+'" y1="'+y+'" x2="'+n1(x1)+'" y2="'+(y+14)+'" stroke="'+RED+'" stroke-width="1" stroke-opacity="0.45"/>'
       + '<line x1="'+n1(x2)+'" y1="'+y+'" x2="'+n1(x2)+'" y2="'+(y+14)+'" stroke="'+RED+'" stroke-width="1" stroke-opacity="0.45"/>';
}
function ptLoad(x,yTop,yBot,label,fsz){
  fsz = fsz || 13;
  let s = '<line x1="'+n1(x)+'" y1="'+yTop+'" x2="'+n1(x)+'" y2="'+yBot+'" stroke="'+RED+'" stroke-width="2.2"/>'
        + '<polygon points="'+n1(x)+','+(yBot+1)+' '+n1(x-6)+','+(yBot-12)+' '+n1(x+6)+','+(yBot-12)+'" fill="'+RED+'"/>';
  if(label) s += '<text x="'+n1(x)+'" y="'+(yTop-6)+'" font-size="'+fsz+'" fill="'+RED+'" text-anchor="middle" font-weight="bold">'+label+'</text>';
  return s;
}
function hatchBar(x,y){
  let s = '<line x1="'+(x-20)+'" y1="'+y+'" x2="'+(x+20)+'" y2="'+y+'" stroke="'+NAVY+'" stroke-width="1.5"/>';
  for(let i=0;i<4;i++){ const bx = x-16+i*10;
    s += '<line x1="'+bx+'" y1="'+(y+6)+'" x2="'+(bx+6)+'" y2="'+y+'" stroke="'+NAVY+'" stroke-width="1"/>'; }
  return s;
}
function pinSup(x,y){
  return '<polygon points="'+x+','+y+' '+(x-12)+','+(y+22)+' '+(x+12)+','+(y+22)+'" fill="#dbe4f0" stroke="'+NAVY+'" stroke-width="1.5"/>'
       + hatchBar(x,y+22);
}
function rollerSup(x,y){
  return '<circle cx="'+x+'" cy="'+(y+9)+'" r="10" fill="#dbe4f0" stroke="'+NAVY+'" stroke-width="1.5"/>'
       + hatchBar(x,y+22);
}
/* sub = 'A' or 'B'; dy is used rather than baseline-shift so the subscript
   renders identically in every SVG engine (baseline-shift is patchily supported) */
function reactArrow(x,yTip,len,sub,val,lblY){
  return '<line x1="'+n1(x)+'" y1="'+(yTip+len)+'" x2="'+n1(x)+'" y2="'+(yTip+12)+'" stroke="'+BLUE+'" stroke-width="2.2"/>'
       + '<polygon points="'+n1(x)+','+yTip+' '+n1(x-6)+','+(yTip+12)+' '+n1(x+6)+','+(yTip+12)+'" fill="'+BLUE+'"/>'
       + '<text x="'+n1(x)+'" y="'+lblY+'" font-size="12.5" fill="'+BLUE+'" text-anchor="middle" font-weight="bold">'
       + 'R<tspan font-size="9" dy="3">'+sub+'</tspan><tspan font-size="12.5" dy="-3"> = '+val+' kN</tspan></text>';
}
function dimChain(X,marks,y,fsz){
  fsz = fsz || 12;
  let s = '<line x1="'+n1(X(marks[0]))+'" y1="'+y+'" x2="'+n1(X(marks[marks.length-1]))+'" y2="'+y+'" stroke="'+GREY+'" stroke-width="1"/>';
  for(const m of marks) s += '<line x1="'+n1(X(m))+'" y1="'+(y-5)+'" x2="'+n1(X(m))+'" y2="'+(y+5)+'" stroke="'+GREY+'" stroke-width="1"/>';
  for(let i=0;i<marks.length-1;i++){
    const xm = (X(marks[i])+X(marks[i+1]))/2;
    s += '<text x="'+n1(xm)+'" y="'+(y+17)+'" font-size="'+fsz+'" fill="#333" text-anchor="middle">'+f(marks[i+1]-marks[i])+' m</text>';
  }
  return s;
}
function cutFace(xc,yT,yB){
  const yv0 = yT-34, yv1 = yB+10;
  let s = '<line x1="'+n1(xc+30)+'" y1="'+yv0+'" x2="'+n1(xc+30)+'" y2="'+(yv1-6)+'" stroke="'+NAVY+'" stroke-width="2.2"/>'
        + '<polygon points="'+n1(xc+30)+','+yv1+' '+n1(xc+24)+','+(yv1-12)+' '+n1(xc+36)+','+(yv1-12)+'" fill="'+NAVY+'"/>'
        + '<text x="'+n1(xc+30)+'" y="'+(yv0-8)+'" font-size="14" fill="'+NAVY+'" text-anchor="middle" font-weight="bold" font-style="italic">V</text>';
  const my = (yT+yB)/2;
  s += '<path d="M '+n1(xc+76)+','+n1(my+27)+' A 27,27 0 0 0 '+n1(xc+76)+','+n1(my-27)+'" fill="none" stroke="#6b7280" stroke-width="2.2"/>'
     + '<polygon points="'+n1(xc+60)+','+n1(my-27)+' '+n1(xc+78)+','+n1(my-35)+' '+n1(xc+76)+','+n1(my-18)+'" fill="#6b7280"/>'
     + '<text x="'+n1(xc+116)+'" y="'+n1(my+5)+'" font-size="14" fill="'+NAVY+'" font-weight="bold" font-style="italic">M</text>';
  return s;
}

/* ══════════════════ FIGURE — problem statement ══════════════════ */
function figProblem(S){
  const p=S.p, x0=40, span=340, X=m=>x0+span*m/p.L, yT=100;
  let s = '<svg viewBox="0 0 460 215" width="460" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="13">';
  s += '<rect x="'+x0+'" y="'+yT+'" width="'+span+'" height="12" fill="#7eaecf" stroke="'+NAVY+'" stroke-width="1.5"/>';
  s += udlBlock(X(p.a),X(p.b),66,99,f(p.w)+' kN/m');
  s += ptLoad(X(p.c),42,99,f(p.P)+' kN');
  s += pinSup(x0,yT+12) + rollerSup(X(p.L),yT+12);
  s += '<text x="'+x0+'" y="'+(yT+56)+'" font-size="13" fill="'+NAVY+'" text-anchor="middle" font-weight="bold">A</text>';
  s += '<text x="'+n1(X(p.L))+'" y="'+(yT+56)+'" font-size="13" fill="'+NAVY+'" text-anchor="middle" font-weight="bold">B</text>';
  s += dimChain(X,S.bps,182);
  return s + '</svg>';
}

/* ══════════════════ FIGURE — reactions FBD ══════════════════ */
function figReactions(S){
  const p=S.p, x0=70, span=340, X=m=>x0+span*m/p.L, yT=98;
  let s = '<svg viewBox="0 0 500 250" width="500" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="13">';
  s += '<rect x="'+x0+'" y="'+yT+'" width="'+span+'" height="12" fill="#7eaecf" stroke="'+NAVY+'" stroke-width="1.5"/>';
  s += udlFaint(X(p.a),X(p.b),58);
  s += ptLoad(X(S.xb),40,97,'');
  s += '<text x="'+n1(X(S.xb))+'" y="32" font-size="13" fill="'+RED+'" text-anchor="middle" font-weight="bold">'+f(S.W)+' kN <tspan font-size="10">(UDL resultant)</tspan></text>';
  s += ptLoad(X(p.c),40,97,f(p.P)+' kN');
  s += pinSup(x0,yT+12) + rollerSup(X(p.L),yT+12);
  s += '<text x="'+(x0-26)+'" y="'+(yT+10)+'" font-size="14" fill="'+NAVY+'" text-anchor="end" font-weight="bold">A</text>';
  s += '<text x="'+n1(X(p.L)+26)+'" y="'+(yT+10)+'" font-size="14" fill="'+NAVY+'" text-anchor="start" font-weight="bold">B</text>';
  s += reactArrow(x0,yT+36,32,'A',f(S.RA),yT+94);
  s += reactArrow(X(p.L),yT+36,32,'B',f(S.RB),yT+94);
  s += dimChain(X,S.bps,220);
  return s + '</svg>';
}

/* ══════════════════ FIGURE — cut free body for one segment ══════════════════ */
function figCut(S,g){
  const p=S.p, x0=70, span=300, X=m=>x0+span*m/p.L;
  const xc=g.mid, Xc=X(xc), yT=80, yB=92;
  let s = '<svg viewBox="0 0 580 268" width="580" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="13">';
  s += '<rect x="'+x0+'" y="'+yT+'" width="'+n1(Xc-x0)+'" height="12" fill="#7eaecf" stroke="'+NAVY+'" stroke-width="1.5"/>';
  s += '<line x1="'+n1(Xc)+'" y1="'+(yT-7)+'" x2="'+n1(Xc)+'" y2="'+(yB+7)+'" stroke="'+NAVY+'" stroke-width="1" stroke-dasharray="3,3"/>';

  if(g.udl !== 'none'){
    const ue  = (g.udl==='partial') ? xc : p.b;
    const lu  = ue - p.a;
    const xr  = p.a + lu/2;
    s += udlFaint(X(p.a),X(ue),60);
    const lbl = (g.udl==='partial')
      ? f(p.w)+'(x − '+f(p.a)+') kN'
      : f(p.w)+'('+f(p.b-p.a)+') = '+f(p.w*lu)+' kN';
    s += ptLoad(X(xr),36,79,lbl,12);
  }
  if(g.hasP) s += ptLoad(X(p.c),36,79,f(p.P)+' kN',12);

  s += pinSup(x0,yB);
  s += '<text x="'+(x0-26)+'" y="'+(yT+10)+'" font-size="14" fill="'+NAVY+'" text-anchor="end" font-weight="bold">A</text>';
  s += reactArrow(x0,yB+36,32,'A',f(S.RA),yB+94);
  s += cutFace(Xc,yT,yB);

  const marks = [0];
  if(g.udl!=='none') marks.push(p.a);
  if(g.udl==='full') marks.push(p.b);
  if(g.hasP) marks.push(p.c);
  marks.push(xc);
  const uniq = [...new Set(marks)].sort(function(u,v){return u-v;});
  s += dimChain(X,uniq,200,11.5);

  s += '<line x1="'+x0+'" y1="226" x2="'+x0+'" y2="236" stroke="'+GREY+'" stroke-width="1"/>';
  s += '<line x1="'+x0+'" y1="231" x2="'+n1(Xc-9)+'" y2="231" stroke="'+GREY+'" stroke-width="1"/>';
  s += '<polygon points="'+n1(Xc)+',231 '+n1(Xc-12)+',227 '+n1(Xc-12)+',235" fill="'+GREY+'"/>';
  s += '<text x="'+n1((x0+Xc)/2)+'" y="250" font-size="13" fill="#333" text-anchor="middle" font-style="italic">x</text>';
  return s + '</svg>';
}

/* ══════════════════ shared plot helpers ══════════════════ */
function vExtremes(S){
  let vMax=0, vMin=0;
  for(const g of S.segs){ for(const x of [g.s,g.e]){
    const v = Vleft(g,x); if(v>vMax) vMax=v; if(v<vMin) vMin=v; } }
  return [vMax,vMin];
}
function vJumps(S){
  const p=S.p, out=[[0,0,Vleft(S.segs[0],0)]];
  for(let i=0;i<S.segs.length-1;i++){
    const vL = Vleft(S.segs[i],S.segs[i].e), vR = Vleft(S.segs[i+1],S.segs[i+1].s);
    if(Math.abs(vL-vR) > 1e-9) out.push([S.segs[i].e,vL,vR]);
  }
  const last = S.segs[S.segs.length-1];
  out.push([p.L, Vleft(last,p.L), 0]);
  return out;
}
function vLabels(S){
  const vals=[];
  for(const g of S.segs) for(const pr of [[g.s,Vleft(g,g.s)],[g.e,Vleft(g,g.e)]]){
    const v = pr[1];
    if(Math.abs(v) < 1e-9) continue;
    if(!vals.some(q=>Math.abs(q.v-v)<1e-9)) vals.push({v:v, x:pr[0]});
  }
  vals.sort(function(q,r){return r.v-q.v;});
  return vals;
}
function mLabels(S){
  const pts=[];
  for(const m of S.bps){ const v=S.Mof(m); if(Math.abs(v)>1e-9) pts.push({v:v,x:m}); }
  pts.push({v:S.Mmax,x:S.xMax});
  const uq=[];
  for(const q of pts) if(!uq.some(t=>Math.abs(t.v-q.v)<1e-9)) uq.push(q);
  uq.sort(function(q,r){return r.v-q.v;});
  return uq;
}
/* shear curve + sign-coloured shading for one segment */
function vSeg(g,X,Y){
  const v1=Vleft(g,g.s), v2=Vleft(g,g.e), X1=X(g.s), X2=X(g.e), Z=Y(0);
  let s='';
  if(v1*v2 < 0){
    const xz = g.s + (g.e-g.s)*Math.abs(v1)/(Math.abs(v1)+Math.abs(v2)), Xz=X(xz);
    s += '<polygon points="'+n1(X1)+','+n1(Z)+' '+n1(X1)+','+n1(Y(v1))+' '+n1(Xz)+','+n1(Z)+'" fill="'+(v1>0?'#3b82f6':RED)+'" fill-opacity="0.15"/>';
    s += '<polygon points="'+n1(Xz)+','+n1(Z)+' '+n1(X2)+','+n1(Y(v2))+' '+n1(X2)+','+n1(Z)+'" fill="'+(v2>0?'#3b82f6':RED)+'" fill-opacity="0.15"/>';
  } else {
    s += '<polygon points="'+n1(X1)+','+n1(Z)+' '+n1(X1)+','+n1(Y(v1))+' '+n1(X2)+','+n1(Y(v2))+' '+n1(X2)+','+n1(Z)+'" fill="'+((v1+v2)/2>0?'#3b82f6':RED)+'" fill-opacity="0.15"/>';
  }
  s += '<line x1="'+n1(X1)+'" y1="'+n1(Y(v1))+'" x2="'+n1(X2)+'" y2="'+n1(Y(v2))+'" stroke="'+NAVY+'" stroke-width="2.5"/>';
  return s;
}
/* moment curve + shading for one segment (quadratic Bezier is exact for a parabola) */
function mSeg(g,X,Y,zeroY){
  const M1=Mseg(g,g.s), M2=Mseg(g,g.e), X1=X(g.s), X2=X(g.e), Y1=Y(M1), Y2=Y(M2);
  let s='';
  if(g.mA !== 0){
    const xm=(g.s+g.e)/2, CPy = 2*Y(Mseg(g,xm)) - (Y1+Y2)/2, CPx=(X1+X2)/2;
    s += '<path d="M '+n1(X1)+','+zeroY+' L '+n1(X2)+','+zeroY+' L '+n1(X2)+','+n1(Y2)+' Q '+n1(CPx)+','+n1(CPy)+' '+n1(X1)+','+n1(Y1)+' Z" fill="#3b82f6" fill-opacity="0.12"/>';
    s += '<path d="M '+n1(X1)+','+n1(Y1)+' Q '+n1(CPx)+','+n1(CPy)+' '+n1(X2)+','+n1(Y2)+'" fill="none" stroke="'+NAVY+'" stroke-width="2.5"/>';
  } else {
    s += '<polygon points="'+n1(X1)+','+zeroY+' '+n1(X2)+','+zeroY+' '+n1(X2)+','+n1(Y2)+' '+n1(X1)+','+n1(Y1)+'" fill="#3b82f6" fill-opacity="0.12"/>';
    s += '<line x1="'+n1(X1)+'" y1="'+n1(Y1)+'" x2="'+n1(X2)+'" y2="'+n1(Y2)+'" stroke="'+NAVY+'" stroke-width="2.5"/>';
  }
  return s;
}
/* stack labels that would otherwise collide, and return the shifted y */
function place(placed,y,gap){
  let ly = y;
  while(placed.some(t=>Math.abs(t-ly)<gap)) ly += gap;
  placed.push(ly);
  return ly;
}
/* when a label has been nudged off its true gridline, draw a short leader
   back to the axis at the true height so the pairing stays unambiguous */
function leader(labelY,trueY,xAxis,col){
  if(Math.abs(labelY-3.5-trueY) < 2.5) return '';
  return '<line x1="'+(xAxis-4)+'" y1="'+n1(labelY-3.5)+'" x2="'+xAxis+'" y2="'+n1(trueY)+'" stroke="'+col+'" stroke-width="0.8" stroke-opacity="0.65"/>';
}

/* ══════════════════ EQUATION BUILDERS ══════════════════ */
function vEqn(S,g){
  const p=S.p, t=[];
  if(g.hasP)            t.push(f(p.P));
  if(g.udl==='partial') t.push(f(p.w)+'(x-'+f(p.a)+')');
  if(g.udl==='full')    t.push(f(S.W));
  const lhs = 'R_A' + t.map(u=>' - '+u).join('') + ' - V = 0';
  const rhs = (g.vA === 0)
    ? 'V = '+f(g.vB)+'\\ \\text{kN}\\quad\\text{(constant)}'
    : 'V(x) = '+f(S.RA)+(g.hasP ? ' - '+f(p.P) : '')+' - '+f(p.w)+'(x-'+f(p.a)+')';
  return '\\sum F_y = 0:\\quad ' + lhs + ' \\quad\\Rightarrow\\quad ' + rhs;
}
/* just the right-hand side of V for this segment, for the "substituting V = ..." line in Step 3 */
function vExpr(S,g){
  const p=S.p;
  return (g.vA === 0)
    ? f(g.vB)
    : f(S.RA)+(g.hasP ? ' - '+f(p.P) : '')+' - '+f(p.w)+'(x-'+f(p.a)+')';
}
function mEqn(S,g){
  const p=S.p, t=[];
  if(g.udl==='partial') t.push(f(p.w)+'(x-'+f(p.a)+')\\cdot\\frac{x+'+f(p.a)+'}{2}');
  if(g.udl==='full')    t.push(f(S.W)+'('+f(S.xb)+')');
  if(g.hasP)            t.push(f(p.P)+'('+f(p.c)+')');
  return '\\sum M_A = 0:\\quad M - Vx' + t.map(u=>' - '+u).join('') + ' = 0';
}
/* unit coefficients print as "x" / "-x", not "1x" / "-1x" */
function coef(n,lead){
  const a = Math.abs(n);
  const mag = (Math.abs(a-1) < 1e-12) ? '' : f(a);
  return lead ? ((n<0?'-':'')+mag) : ((n<0?' - ':' + ')+mag);
}
function mPoly(g){
  let t = '';
  if(g.mA !== 0) t += coef(g.mA,true)+'x^2';
  if(g.mB !== 0) t += coef(g.mB,!t) + 'x';
  if(g.mC !== 0) t += (t ? sgn(g.mC) : fs(g.mC));
  return 'M(x) = ' + (t || '0');
}
const CIRCLED = ['①','②','③','④','⑤'];
function segTitle(g){
  let what;
  if(g.udl==='none' && !g.hasP)      what = 'only $R_A$ acts on the left free body';
  else if(g.udl==='none' && g.hasP)  what = 'past the point load, before the UDL';
  else if(g.udl==='partial')         what = 'inside the UDL — only the load behind the cut counts';
  else if(g.udl==='full' && !g.hasP) what = 'past the whole UDL, before the point load';
  else                               what = 'past both the UDL and the point load';
  return CIRCLED[g.i]+' &nbsp;$'+f(g.s)+'\\ \\text{m} \\le x \\le '+f(g.e)+'\\ \\text{m}$ — '+what;
}

/* ══════════════════ PAGE BUILDER ══════════════════ */
function stepBlock(n,title,hint,body){
  return '<div class="step"><details'+(n===1?' open':'')+'>'
       + '<summary><span class="step-num">'+n+'</span><span class="step-title">'+title+'</span>'
       + '<span class="try-hint">'+hint+'</span></summary>'
       + '<div class="step-body">'+body+'</div></details></div>';
}

function build(p){
  const S = solve(p);
  let h = '';

  /* ── problem statement ── */
  h += '<h3>Problem Statement</h3>'
    +  '<p>Draw the shear force and bending moment diagrams for the beam below, and find the '
    +  '<strong>magnitude and position of the maximum bending moment</strong>.</p>'
    +  '<div class="callout info"><p>Simply supported beam, span '+f(p.L)+' m. '
    +  'Pin at $A$ ($x = 0$), roller at $B$ ($x = '+f(p.L)+'$ m). '
    +  'UDL of '+f(p.w)+' kN/m from $x = '+f(p.a)+'$ m to $x = '+f(p.b)+'$ m. '
    +  'Point load of '+f(p.P)+' kN at $x = '+f(p.c)+'$ m.</p></div>'
    +  '<div class="diagram-wrap"><figure>'+figProblem(S)
    +  '<figcaption>Pin at $A$ (0 m), roller at $B$ ('+f(p.L)+' m). UDL '+f(p.w)+' kN/m from '+f(p.a)+' m to '+f(p.b)+' m; point load '+f(p.P)+' kN at '+f(p.c)+' m.</figcaption>'
    +  '</figure></div>'
    +  '<div class="callout given"><p><strong>Answer:</strong> &nbsp; $M_{\\max} = '+f(S.Mmax)+'\\ \\text{kN}\\cdot\\text{m}$ at $x = '+f(S.xMax)+'\\ \\text{m}$ from $A$</p></div>'
    +  '<h3>Solution</h3>';

  /* ── step 1 — reactions ── */
  let b1 = '<p>Replace the UDL by its resultant, then take moments about one support.</p>'
    + '<p>The UDL of '+f(p.w)+' kN/m acts over '+f(p.b-p.a)+' m (from $x = '+f(p.a)+'$ m to $x = '+f(p.b)+'$ m), so it is '
    + 'equivalent to a single downward force of $'+f(p.w)+' \\times '+f(p.b-p.a)+' = '+f(S.W)+'$ kN acting at the centroid '
    + 'of that loaded length: $x = '+f(S.xb)+'$ m from $A$.</p>'
    + '<div class="diagram-wrap"><figure>'+figReactions(S)
    + '<figcaption>Free-body diagram for the reactions — the UDL replaced by its '+f(S.W)+' kN resultant at $x = '+f(S.xb)+'$ m; both reactions assumed upward.</figcaption>'
    + '</figure></div>'
    + '<div class="math-block">$$\\sum M_A = 0:\\quad R_B('+f(p.L)+') - '+f(S.W)+'('+f(S.xb)+') - '+f(p.P)+'('+f(p.c)+') = 0$$'
    + '$$R_B = \\frac{'+f(S.W*S.xb)+' + '+f(p.P*p.c)+'}{'+f(p.L)+'} = \\frac{'+f(S.W*S.xb + p.P*p.c)+'}{'+f(p.L)+'} = \\mathbf{'+f(S.RB)+'\\ \\text{kN} \\uparrow}$$</div>'
    + '<div class="math-block">$$\\sum F_y = 0:\\quad R_A + '+f(S.RB)+' = '+f(S.W)+' + '+f(p.P)+' = '+f(S.W+p.P)+' \\implies \\mathbf{R_A = '+f(S.RA)+'\\ \\text{kN} \\uparrow}$$</div>'
    + '<div class="callout answer"><p>$R_A = '+f(S.RA)+'\\ \\text{kN (upward)}$ &nbsp;&nbsp;&nbsp; $R_B = '+f(S.RB)+'\\ \\text{kN (upward)}$</p></div>'
    + '<div class="callout note"><p><strong>Check:</strong> $'+f(S.RA)+' + '+f(S.RB)+' = '+f(S.RA+S.RB)+'\\ \\text{kN}$ = $'+f(S.W)+' + '+f(p.P)+'\\ \\text{kN}$ ✓</p></div>';
  h += stepBlock(1,'Find the support reactions','try it yourself first',b1);

  /* ── step 2 — SFD ── */
  let b2 = '<p>Cut the beam in each segment and apply $\\sum F_y = 0$ to the free body on the '
    + '<strong>left</strong> of the cut. The internal shear $V$ is drawn downward on the cut face (assumed positive). '
    + 'The segment boundaries are the load discontinuities: $x = '+S.bps.map(f).join(',\\ ')+'$ m.</p>';
  for(const g of S.segs){
    let cap = 'Cut at a section $'+f(g.s)+' &lt; x &lt; '+f(g.e)+'$ m. ';
    if(g.udl==='partial')   cap += 'The UDL behind the cut (dashed) covers the length $(x-'+f(p.a)+')$, so it is replaced by its resultant $'+f(p.w)+'(x-'+f(p.a)+')$ kN acting at the centre of that length. ';
    else if(g.udl==='full') cap += 'The whole UDL (dashed) is behind the cut, replaced by its resultant $'+f(p.w)+'('+f(p.b-p.a)+') = '+f(S.W)+'$ kN at $x = '+f(S.xb)+'$ m. ';
    else                    cap += 'No part of the UDL lies behind this cut. ';
    if(g.hasP) cap += 'The segment also carries the '+f(p.P)+' kN point load at $x = '+f(p.c)+'$ m.';

    b2 += '<h4>'+segTitle(g)+'</h4>'
       +  '<div class="diagram-wrap"><figure>'+figCut(S,g)+'<figcaption>'+cap+'</figcaption></figure></div>'
       +  '<div class="math-block">$$'+vEqn(S,g)+'$$';
    if(g.vA !== 0)
      b2 += '$$V('+f(g.s)+') = '+f(Vleft(g,g.s))+'\\ \\text{kN},\\qquad V('+f(g.e)+') = '+f(Vleft(g,g.e))+'\\ \\text{kN}$$';
    b2 += '</div>';
    if(S.zero !== null && g === S.zeroSeg){
      b2 += '<p>Shear crosses zero inside this segment — and the bending moment is always stationary where $V = 0$. '
         +  'Setting $V = 0$ therefore locates the peak moment:</p>'
         +  '<div class="math-block">$$'+f(S.RA)+(g.hasP ? ' - '+f(p.P) : '')+' - '+f(p.w)+'(x-'+f(p.a)+') = 0 '
         +  '\\implies x - '+f(p.a)+' = '+f(S.zero-p.a)+' \\implies \\boxed{x = '+f(S.zero)+'\\ \\text{m}}$$</div>';
    }
  }
  const lastSeg = S.segs[S.segs.length-1];
  b2 += '<p><strong>Check at $B$:</strong> $'+f(Vleft(lastSeg,p.L))+' + '+f(S.RB)+' = 0$ ✓ — the shear closes out at the far support.</p>'
     +  '<div class="diagram-wrap"><figure>'+figSFD(S)
     +  '<figcaption>Shear force diagram — a step at each point load, a straight ramp through the UDL, closing to zero at $B$.</figcaption>'
     +  '</figure></div>';
  h += stepBlock(2,'Construct the shear force diagram $V(x)$','sketch it before opening',b2);

  /* ── step 3 — BMD ── */
  let b3 = '<p>For each cut, apply $\\sum M_A = 0$ (moments about $A$, counter-clockwise positive) to the same left '
    + 'free body, reusing $V(x)$ from Step 2. $R_A$ acts through $A$, so its lever arm is zero and it drops out of every equation.</p>';
  for(const g of S.segs){
    b3 += '<h4>'+segTitle(g)+'</h4>'
       +  '<div class="math-block">$$'+mEqn(S,g)+'$$</div>'
       +  '<p>Substituting $V = '+vExpr(S,g)+'$ from Step 2 '+CIRCLED[g.i]+':</p>'
       +  '<div class="math-block">$$'+mPoly(g)+'$$'
       +  '$$M('+f(g.s)+') = '+f(Mseg(g,g.s))+'\\ \\text{kN}\\cdot\\text{m},\\qquad M('+f(g.e)+') = '+f(Mseg(g,g.e))+'\\ \\text{kN}\\cdot\\text{m}$$</div>';
    if(g.mA !== 0)
      b3 += '<p>The squared term makes this segment <strong>parabolic</strong>, not linear — that is what a linearly varying shear integrates to.</p>';
    if(S.zero !== null && g === S.zeroSeg)
      b3 += '<p>At the zero-shear point ($x = '+f(S.zero)+'$ m):</p>'
         +  '<div class="math-block">$$M('+f(S.zero)+') = \\boxed{'+f(S.Mmax)+'\\ \\text{kN}\\cdot\\text{m}} \\quad \\checkmark$$</div>';
  }
  b3 += '<div class="diagram-wrap"><figure>'+figBMD(S)
     +  '<figcaption>Bending moment diagram — linear where shear is constant, parabolic through the UDL, returning to zero at $B$.</figcaption>'
     +  '</figure></div>'
     +  '<div class="callout answer"><p>$M_{\\max} = '+f(S.Mmax)+'\\ \\text{kN}\\cdot\\text{m}$ at $x = '+f(S.xMax)+'\\ \\text{m}$ from $A$</p></div>';
  h += stepBlock(3,'Construct the bending moment diagram $M(x)$','sketch it before opening',b3);

  /* ── step 4 — summary ── */
  let b4 = '<div class="diagram-wrap"><figure>'+figSummary(S)
    + '<figcaption>Beam FBD, shear force diagram and bending moment diagram on a common horizontal scale — the dashed guide lines connect each load position to the kinks and jumps in both diagrams.</figcaption>'
    + '</figure></div>'
    + '<div class="callout answer"><p>$M_{\\max} = '+f(S.Mmax)+'\\ \\text{kN}\\cdot\\text{m}$ at $x = '+f(S.xMax)+'\\ \\text{m}$ from $A$</p></div>';
  h += stepBlock(4,'Summary','the three diagrams together',b4);

  /* ── common mistakes ── */
  h += '<div class="callout warn"><p><strong>Common mistakes:</strong></p>'
    + '<p style="margin-top:6px">① <strong>Taking the UDL lever arm from the wrong point</strong> — the '+f(S.W)+' kN resultant acts at '
    + '$x = '+f(S.xb)+'$ m, the centroid of ['+f(p.a)+', '+f(p.b)+'] m, not at $x = '+f(p.a)+'$ m or $x = '+f(p.b)+'$ m.</p>'
    + '<p style="margin-top:6px">② <strong>Assuming $M_{\\max}$ sits under the point load</strong> — it occurs where $V = 0$'
    + (S.zero !== null ? ', which here is $x = '+f(S.zero)+'$ m, inside the UDL' : '')+'. Setting $V(x) = 0$ is the key step.</p>'
    + '<p style="margin-top:6px">③ <strong>Using the whole UDL inside the loaded zone</strong> — behind a cut at $x$ within ['+f(p.a)+', '+f(p.b)+'] m '
    + 'only the length $(x - '+f(p.a)+')$ is loaded, giving $'+f(p.w)+'(x-'+f(p.a)+')$ kN, not the full '+f(S.W)+' kN.</p>'
    + '<p style="margin-top:6px">④ <strong>Drawing the BMD straight through the UDL</strong> — since $V$ is linear there, $M$ must be quadratic. '
    + 'A straight line would miss the '+f(S.Mmax)+' kN·m peak.</p></div>';

  return h;
}

/* ══════════════════ WIRING ══════════════════ */
function render(i){
  const v = VARIANTS[i];
  document.getElementById('doc').innerHTML = build(v);
  document.getElementById('swDesc').textContent = v.desc;
  const btns = document.querySelectorAll('#swBtns button');
  for(let j=0;j<btns.length;j++) btns[j].setAttribute('aria-pressed', j===i ? 'true' : 'false');
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('doc'), {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}
function init(){
  const box = document.getElementById('swBtns');
  VARIANTS.forEach(function(v,i){
    const btn = document.createElement('button');
    btn.textContent = v.btn;
    btn.setAttribute('aria-pressed','false');
    btn.onclick = function(){ render(i); };
    box.appendChild(btn);
  });
  render(0);
}
window.addEventListener('load', init);
</script>
</body>
</html>
