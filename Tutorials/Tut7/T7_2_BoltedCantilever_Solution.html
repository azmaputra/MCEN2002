<script>
/* ══════════════════════════════════════════════════════════════════════════
   MCEN2002 — SHARED BOLT-GROUP (ECCENTRIC SHEAR) ENGINE
   Identical solver to T7.1. See that file for the full derivation of the
   sign convention; the short version:

     M  = x_F·F_y − y_F·F_x        (load position measured from the centroid G)
     F'_i    = ( F_x/n , F_y/n )                    primary / direct
     F''_i,x = − M·y_i / Σr²                        secondary / moment
     F''_i,y = + M·x_i / Σr²

   The signs are pinned by requiring the bolt forces to be statically
   equivalent to the applied load: ΣF_i = F AND Σ(r_i × F_i) = M. The force
   check alone passes for either sign of the secondary term, so the moment
   check is the one that matters. equilOK asserts both.

   What is new in T7.2 relative to T7.1:
     · the load is INCLINED, so F has two components and both enter the
       primary shear (in T7.1 F_x was zero and the algebra hid it);
     · the bolts are COLINEAR, so every r_i lies on the y-axis, r_x = 0 for
       all of them, and every secondary force comes out purely horizontal;
     · the middle bolt sits AT the centroid, r = 0, so it carries no
       secondary shear at all — only its share of the direct load.

   Angles: `ang` is the direction of the force VECTOR, measured CCW from +x.
   Straight down = −90; down-and-to-the-right at 45° = −45.
   ══════════════════════════════════════════════════════════════════════════ */

function nf(v,dp){
  if(dp===undefined) dp = 2;
  var r = Number(v);
  if(Math.abs(r) < 5e-12) r = 0;
  var s = r.toFixed(dp);
  if(s === '-' + (0).toFixed(dp)) s = (0).toFixed(dp);
  return s;
}

function solve(p){
  var bolts = p.bolts, n = bolts.length;
  var Gx = 0, Gy = 0, i;
  for(i=0;i<n;i++){ Gx += bolts[i].x; Gy += bolts[i].y; }
  Gx /= n; Gy /= n;

  var th = p.ang*Math.PI/180;
  var Fx = p.F*Math.cos(th), Fy = p.F*Math.sin(th);
  var ex = p.xF - Gx, ey = p.yF - Gy;
  var M  = ex*Fy - ey*Fx;

  var Sr2 = 0, r = [];
  for(i=0;i<n;i++){
    var rx = bolts[i].x - Gx, ry = bolts[i].y - Gy;
    r.push({x:rx, y:ry, r:Math.hypot(rx,ry)});
    Sr2 += rx*rx + ry*ry;
  }

  var out = [];
  for(i=0;i<n;i++){
    var px = Fx/n,  py = Fy/n;
    var sx = -M*r[i].y/Sr2, sy = M*r[i].x/Sr2;
    out.push({name:bolts[i].name, x:bolts[i].x, y:bolts[i].y,
              rx:r[i].x, ry:r[i].y, r:r[i].r,
              px:px, py:py, p:Math.hypot(px,py),
              sx:sx, sy:sy, s:Math.hypot(sx,sy),
              tx:px+sx, ty:py+sy, t:Math.hypot(px+sx,py+sy)});
  }

  var cx=0, cy=0, cm=0;
  for(i=0;i<n;i++){ cx+=out[i].tx; cy+=out[i].ty; cm+=out[i].rx*out[i].ty - out[i].ry*out[i].tx; }
  var ok = Math.abs(cx-Fx) < 1e-6*Math.max(1,Math.abs(Fx))+1e-6
        && Math.abs(cy-Fy) < 1e-6*Math.max(1,Math.abs(Fy))+1e-6
        && Math.abs(cm-M)  < 1e-6*Math.max(1,Math.abs(M)) +1e-6;

  var Fmax = 0, imax = 0;
  for(i=0;i<n;i++) if(out[i].t > Fmax+1e-9){ Fmax = out[i].t; imax = i; }

  return {p:p, n:n, Gx:Gx, Gy:Gy, Fx:Fx, Fy:Fy, ex:ex, ey:ey, M:M,
          Sr2:Sr2, bolts:out, Fmax:Fmax, worst:out[imax], equilOK:ok};
}

/* ─────────────────── SVG primitives ─────────────────── */
var NAVY='#1a3c6e', RED='#c0392b', BLUE='#1a6fc4', ORANGE='#f97316',
    GREY='#555', GREEN='#15803d', PUR='#7c3aed';
function n1(v){ return Number(v).toFixed(1); }

function arrow(x1,y1,x2,y2,col,w,label,lsz,ldx,ldy){
  var dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
  if(L < 1e-9) return '';
  var ux=dx/L, uy=dy/L, hl=Math.min(11, L*0.45), hw=Math.min(4.5, L*0.18);
  var bx=x2-ux*hl, by=y2-uy*hl, px=-uy, py=ux;
  var s = '<line x1="'+n1(x1)+'" y1="'+n1(y1)+'" x2="'+n1(bx)+'" y2="'+n1(by)+'" stroke="'+col+'" stroke-width="'+(w||2)+'"/>'
        + '<polygon points="'+n1(x2)+','+n1(y2)+' '+n1(bx+px*hw)+','+n1(by+py*hw)+' '+n1(bx-px*hw)+','+n1(by-py*hw)+'" fill="'+col+'"/>';
  if(label) s += '<text x="'+n1(x2+(ldx||0))+'" y="'+n1(y2+(ldy||0))+'" font-size="'+(lsz||12)+'" fill="'+col
              +  '" text-anchor="middle" font-weight="bold">'+label+'</text>';
  return s;
}
function dimH(xa,xb,y,txt,col){
  col = col || GREY;
  return '<line x1="'+n1(xa)+'" y1="'+n1(y-5)+'" x2="'+n1(xa)+'" y2="'+n1(y+5)+'" stroke="'+col+'" stroke-width="1"/>'
       + '<line x1="'+n1(xb)+'" y1="'+n1(y-5)+'" x2="'+n1(xb)+'" y2="'+n1(y+5)+'" stroke="'+col+'" stroke-width="1"/>'
       + '<line x1="'+n1(xa)+'" y1="'+n1(y)+'" x2="'+n1(xb)+'" y2="'+n1(y)+'" stroke="'+col+'" stroke-width="1"/>'
       + '<text x="'+n1((xa+xb)/2)+'" y="'+n1(y-7)+'" font-size="11.5" fill="#333" text-anchor="middle">'+txt+'</text>';
}
function dimV(x,ya,yb,txt,col){
  col = col || GREY;
  return '<line x1="'+n1(x-5)+'" y1="'+n1(ya)+'" x2="'+n1(x+5)+'" y2="'+n1(ya)+'" stroke="'+col+'" stroke-width="1"/>'
       + '<line x1="'+n1(x-5)+'" y1="'+n1(yb)+'" x2="'+n1(x+5)+'" y2="'+n1(yb)+'" stroke="'+col+'" stroke-width="1"/>'
       + '<line x1="'+n1(x)+'" y1="'+n1(ya)+'" x2="'+n1(x)+'" y2="'+n1(yb)+'" stroke="'+col+'" stroke-width="1"/>'
       + '<text x="'+n1(x+7)+'" y="'+n1((ya+yb)/2+4)+'" font-size="11.5" fill="#333" text-anchor="start">'+txt+'</text>';
}
function boltSym(cx,cy,rr,col){
  col = col || NAVY;
  var pts = '', k;
  for(k=0;k<6;k++){ var a = Math.PI/6 + k*Math.PI/3;
    pts += n1(cx+rr*Math.cos(a))+','+n1(cy+rr*Math.sin(a))+' '; }
  return '<polygon points="'+pts.trim()+'" fill="#fff" stroke="'+col+'" stroke-width="1.4"/>'
       + '<circle cx="'+n1(cx)+'" cy="'+n1(cy)+'" r="'+n1(rr*0.55)+'" fill="none" stroke="'+col+'" stroke-width="1"/>';
}
function centroidSym(cx,cy){
  return '<circle cx="'+n1(cx)+'" cy="'+n1(cy)+'" r="4" fill="'+ORANGE+'"/>'
       + '<line x1="'+n1(cx-13)+'" y1="'+n1(cy)+'" x2="'+n1(cx+13)+'" y2="'+n1(cy)+'" stroke="'+ORANGE+'" stroke-width="1" stroke-dasharray="6,2,1.5,2"/>'
       + '<line x1="'+n1(cx)+'" y1="'+n1(cy-13)+'" x2="'+n1(cx)+'" y2="'+n1(cy+13)+'" stroke="'+ORANGE+'" stroke-width="1" stroke-dasharray="6,2,1.5,2"/>';
}
/* Couple centred on (cx,cy) — a couple has no point of application, so drawing
   it anywhere but the centroid invites the reading that it acts elsewhere. */
function momentArc(cx,cy,r,label,col,cw,labelBelow){
  var tip = cw ? 320 : 40, tail = cw ? 40 : 320, sweep = cw ? 1 : 0;
  var rad = function(A){ return A*Math.PI/180; };
  var pt  = function(A){ return [cx + r*Math.sin(rad(A)), cy - r*Math.cos(rad(A))]; };
  var t0 = pt(tail), t1 = pt(tip), A = rad(tip);
  var fwd = (sweep===1) ? [Math.cos(A),Math.sin(A)] : [-Math.cos(A),-Math.sin(A)];
  var ap = [t1[0]+fwd[0]*10, t1[1]+fwd[1]*10], pe = [-fwd[1], fwd[0]];
  var s = '<path d="M '+n1(t0[0])+','+n1(t0[1])+' A '+n1(r)+','+n1(r)+' 0 1,'+sweep+' '+n1(t1[0])+','+n1(t1[1])+'" fill="none" stroke="'+col+'" stroke-width="2.4"/>'
        + '<polygon points="'+n1(ap[0])+','+n1(ap[1])+' '+n1(t1[0]+pe[0]*6)+','+n1(t1[1]+pe[1]*6)+' '+n1(t1[0]-pe[0]*6)+','+n1(t1[1]-pe[1]*6)+'" fill="'+col+'"/>';
  if(label) s += '<text x="'+n1(cx)+'" y="'+n1(labelBelow ? cy+r+17 : cy-r-11)+'" font-size="12.5" fill="'+col
              +  '" text-anchor="middle" font-weight="bold">'+label+'</text>';
  return s;
}
function rightAngle(vx,vy,ux,uy,wx,wy,size,col){
  var lu = Math.hypot(ux,uy), lw = Math.hypot(wx,wy);
  if(lu < 1e-9 || lw < 1e-9) return '';
  ux/=lu; uy/=lu; wx/=lw; wy/=lw;
  var p1 = [vx+ux*size, vy+uy*size],
      p2 = [vx+ux*size+wx*size, vy+uy*size+wy*size],
      p3 = [vx+wx*size, vy+wy*size];
  return '<polyline points="'+n1(p1[0])+','+n1(p1[1])+' '+n1(p2[0])+','+n1(p2[1])+' '+n1(p3[0])+','+n1(p3[1])
       + '" fill="none" stroke="'+(col||'#6b7280')+'" stroke-width="1.2"/>';
}
/* Angle arc between a horizontal reference and the load, at (cx,cy).
   `incoming` selects which side the wedge sits on:
     false — the arrow LEAVES (cx,cy), as in the resolution triangle, so the
             reference runs to the RIGHT and the wedge opens toward the arrow;
     true  — the arrow ARRIVES at (cx,cy), as on the beam, so the reference runs
             to the LEFT and the wedge sits between it and the arrow SHAFT,
             i.e. directly underneath the arrow where the eye expects it. */
function angleMark(cx,cy,r,ang,col,incoming){
  var ref  = incoming ? 180 : 0;
  var meas = incoming ? (180 + ang) : ang;   /* shaft direction vs force direction */
  var rd = function(A){ return A*Math.PI/180; };
  var pt = function(A){ return [cx + r*Math.cos(rd(A)), cy - r*Math.sin(rd(A))]; };
  var p0 = pt(ref), p1 = pt(meas);
  var sweep = (meas < ref) ? 1 : 0, large = (Math.abs(meas-ref) > 180) ? 1 : 0;
  var mid = (ref + meas)/2, lp = [cx + r*1.34*Math.cos(rd(mid)), cy - r*1.34*Math.sin(rd(mid))];
  return '<line x1="'+n1(cx)+'" y1="'+n1(cy)+'" x2="'+n1(cx + (incoming?-1:1)*r*1.6)+'" y2="'+n1(cy)+'" stroke="'+col+'" stroke-width="0.9" stroke-dasharray="4,3"/>'
       + '<path d="M '+n1(p0[0])+','+n1(p0[1])+' A '+n1(r)+','+n1(r)+' 0 '+large+','+sweep+' '+n1(p1[0])+','+n1(p1[1])+'" fill="none" stroke="'+col+'" stroke-width="1.2"/>'
       + '<text x="'+n1(lp[0])+'" y="'+n1(lp[1]+4)+'" font-size="12" fill="'+col+'" text-anchor="middle">'+nf(Math.abs(ang),0)+'&#176;</text>';
}

/* ═══════════════ FIGURE 1 — problem layout, vertical beam (to scale) ═══════════════ */
function figLayout(S){
  var p = S.p, g = p.geom;
  var sc = 0.62, PADL = 150, PADR = 150, PADT = 64, PADB = 46;
  var xmin = g.chX0, xmax = g.chX1, ymax = p.yF + g.capR + 16, ymin = g.beamBot;
  var W = (xmax-xmin)*sc + PADL + PADR, H = (ymax-ymin)*sc + PADT + PADB;
  var X = function(m){ return PADL + (m-xmin)*sc; };
  var Y = function(m){ return PADT + (ymax-m)*sc; };

  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="'+n1(Math.min(560,W*1.2))+'" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';

  /* channel (the support the beam is bolted to) */
  s += '<rect x="'+n1(X(g.chX0))+'" y="'+n1(Y(g.chTop))+'" width="'+n1((g.chX1-g.chX0)*sc)+'" height="'+n1((g.chTop-g.chBot)*sc)+'" fill="#b8c6dd" fill-opacity="0.45" stroke="'+NAVY+'" stroke-width="1.2"/>';
  s += '<text x="'+n1(X(g.chX0)+6)+'" y="'+n1(Y(g.chBot)-7)+'" font-size="11.5" fill="'+NAVY+'" font-style="italic">channel</text>';

  /* the beam: rectangle with a semicircular cap at the loaded end */
  var bw = g.beamW/2;
  s += '<path d="M '+n1(X(-bw))+','+n1(Y(g.beamBot))
     + ' L '+n1(X(-bw))+','+n1(Y(p.yF))
     + ' A '+n1(g.capR*sc)+','+n1(g.capR*sc)+' 0 0,1 '+n1(X(bw))+','+n1(Y(p.yF))
     + ' L '+n1(X(bw))+','+n1(Y(g.beamBot))+' Z" fill="#dfeaf6" fill-opacity="0.95" stroke="'+NAVY+'" stroke-width="1.6"/>';

  /* beam centreline */
  s += '<line x1="'+n1(X(0))+'" y1="'+n1(Y(p.yF))+'" x2="'+n1(X(0))+'" y2="'+n1(Y(g.beamBot)-12)+'" stroke="#999" stroke-width="1" stroke-dasharray="9,3,2,3"/>';

  /* bolts */
  var i;
  for(i=0;i<S.bolts.length;i++){
    var b = S.bolts[i];
    s += boltSym(X(b.x), Y(b.y), 9);
    s += '<text x="'+n1(X(b.x)+15)+'" y="'+n1(Y(b.y)-9)+'" font-size="13.5" fill="'+NAVY+'" text-anchor="middle" font-weight="bold">'+b.name+'</text>';
  }
  s += '<text x="'+n1(X(0)-64)+'" y="'+n1(Y(S.bolts[0].y)+4)+'" font-size="12" fill="'+NAVY+'" text-anchor="end">M'+nf(p.d,0)+' &#215; '+p.pitch+' bolts</text>';
  s += '<line x1="'+n1(X(0)-62)+'" y1="'+n1(Y(S.bolts[0].y))+'" x2="'+n1(X(0)-12)+'" y2="'+n1(Y(S.bolts[0].y))+'" stroke="'+NAVY+'" stroke-width="0.9"/>';

  /* applied load — tip on the loaded point, drawn at its true inclination */
  var th = p.ang*Math.PI/180, LEN = 84;
  var tipx = X(p.xF), tipy = Y(p.yF);
  var tailx = tipx - Math.cos(th)*LEN, taily = tipy + Math.sin(th)*LEN;
  s += arrow(tailx, taily, tipx, tipy, RED, 2.6, '', 13);
  s += '<text x="'+n1(tailx)+'" y="'+n1(taily-9)+'" font-size="13" fill="'+RED+'" text-anchor="middle" font-weight="bold">F = '+nf(p.F/1000,0)+' kN</text>';
  s += angleMark(tipx, tipy, 34, p.ang, RED, true);

  /* vertical dimension chain on the right */
  var xv = X(g.chX1) - 30;
  var chain = [p.yF];
  if(g.chTop < p.yF) chain.push(g.chTop);
  for(i=0;i<S.bolts.length;i++) chain.push(S.bolts[i].y);
  chain = chain.filter(function(v,k,a){ return a.indexOf(v)===k; }).sort(function(a,b2){ return b2-a; });
  for(i=0;i<chain.length-1;i++)
    s += dimV(xv, Y(chain[i]), Y(chain[i+1]), nf(chain[i]-chain[i+1],0));

  /* beam width */
  s += dimH(X(-bw), X(bw), Y(p.yF)-40, nf(g.beamW,0));

  s += '<text x="'+n1(PADL*0.15)+'" y="'+n1(H-10)+'" font-size="11.5" fill="'+GREY+'" font-style="italic">All dimensions in millimetres · drawn to scale</text>';
  return s + '</svg>';
}

/* ═══════════════ FIGURE 2 — resolve the load into components ═══════════════ */
function figResolve(S){
  var p = S.p, L = 150, cx = 120, cy = 62;
  var th = p.ang*Math.PI/180;
  var tx = cx + Math.cos(th)*L, ty = cy - Math.sin(th)*L;
  var W = 470, H = 232;
  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="470" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  /* component rectangle */
  s += '<line x1="'+n1(tx)+'" y1="'+n1(cy)+'" x2="'+n1(tx)+'" y2="'+n1(ty)+'" stroke="#c9ced8" stroke-width="1" stroke-dasharray="4,3"/>';
  s += '<line x1="'+n1(cx)+'" y1="'+n1(ty)+'" x2="'+n1(tx)+'" y2="'+n1(ty)+'" stroke="#c9ced8" stroke-width="1" stroke-dasharray="4,3"/>';
  s += arrow(cx, cy, tx, cy, BLUE, 2.2, '', 12);
  s += arrow(cx, cy, cx, ty, BLUE, 2.2, '', 12);
  s += arrow(cx, cy, tx, ty, RED, 2.8, '', 13);
  s += rightAngle(tx, cy, cx-tx, 0, 0, ty-cy, 12, '#9aa1ac');
  s += '<text x="'+n1((cx+tx)/2)+'" y="'+n1(cy+ (S.Fy<0 ? -9 : 19))+'" font-size="12.5" fill="'+BLUE+'" text-anchor="middle" font-weight="bold">F<tspan font-size="9.5" dy="3">x</tspan><tspan dy="-3"> = '+nf(S.Fx/1000,3)+' kN</tspan></text>';
  s += '<text x="'+n1(cx-9)+'" y="'+n1((cy+ty)/2+4)+'" font-size="12.5" fill="'+BLUE+'" text-anchor="end" font-weight="bold">F<tspan font-size="9.5" dy="3">y</tspan><tspan dy="-3"> = '+nf(S.Fy/1000,3)+' kN</tspan></text>';
  s += '<text x="'+n1(tx+12)+'" y="'+n1(ty+ (S.Fy<0 ? 16 : -8))+'" font-size="13" fill="'+RED+'" text-anchor="start" font-weight="bold">F = '+nf(p.F/1000,0)+' kN</text>';
  s += angleMark(cx, cy, 40, p.ang, '#555', false);
  return s + '</svg>';
}

/* ═══════════════ FIGURE 3 — force transfer to the centroid ═══════════════ */
function figTransfer(S){
  var p = S.p, sc = 0.62, PADL = 190, PADR = 150;
  var ymax = p.yF + 34, ymin = Math.min.apply(null, S.bolts.map(function(b){ return b.y; })) - 60;
  var W = 520, H = (ymax-ymin)*sc + 96;
  var X = function(m){ return PADL + m*sc; };
  var Y = function(m){ return 48 + (ymax-m)*sc; };
  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="520" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';

  s += '<line x1="'+n1(X(0))+'" y1="'+n1(Y(ymax))+'" x2="'+n1(X(0))+'" y2="'+n1(Y(ymin))+'" stroke="#999" stroke-width="1" stroke-dasharray="9,3,2,3"/>';

  var th = p.ang*Math.PI/180, LEN = 70;
  /* original line of action, greyed */
  s += arrow(X(p.xF)-Math.cos(th)*LEN, Y(p.yF)+Math.sin(th)*LEN, X(p.xF), Y(p.yF), '#cbb2ae', 2.2, '', 12);
  s += '<text x="'+n1(X(p.xF)-Math.cos(th)*LEN)+'" y="'+n1(Y(p.yF)+Math.sin(th)*LEN-10)+'" font-size="11.5" fill="#9a8480" text-anchor="middle">original line of action</text>';

  /* equivalent force at G + the couple, both AT G */
  s += arrow(X(S.Gx)-Math.cos(th)*LEN, Y(S.Gy)+Math.sin(th)*LEN, X(S.Gx), Y(S.Gy), RED, 2.5, '', 12);
  s += '<text x="'+n1(X(S.Gx)-Math.cos(th)*LEN-12)+'" y="'+n1(Y(S.Gy)+Math.sin(th)*LEN-8)+'" font-size="12.5" fill="'+RED+'" text-anchor="end" font-weight="bold">F = '+nf(p.F/1000,0)+' kN</text>';
  s += momentArc(X(S.Gx), Y(S.Gy), 30, '', GREEN, S.M < 0, false);
  s += '<text x="'+n1(X(S.Gx)+42)+'" y="'+n1(Y(S.Gy)+5)+'" font-size="12.5" fill="'+GREEN+'" text-anchor="start" font-weight="bold">M = '+nf(Math.abs(S.M)/1000,1)+' kN&#183;mm</text>';
  s += centroidSym(X(S.Gx), Y(S.Gy));
  s += '<text x="'+n1(X(S.Gx)-16)+'" y="'+n1(Y(S.Gy)+22)+'" font-size="12.5" fill="'+ORANGE+'" font-weight="bold" text-anchor="end">G</text>';

  /* the lever arm that generates M: the perpendicular distance is e_y for F_x */
  var xl = X(0) - 96;
  s += '<line x1="'+n1(xl-6)+'" y1="'+n1(Y(p.yF))+'" x2="'+n1(X(p.xF))+'" y2="'+n1(Y(p.yF))+'" stroke="'+BLUE+'" stroke-width="0.8" stroke-dasharray="3,3"/>';
  s += '<line x1="'+n1(xl-6)+'" y1="'+n1(Y(S.Gy))+'" x2="'+n1(X(S.Gx))+'" y2="'+n1(Y(S.Gy))+'" stroke="'+BLUE+'" stroke-width="0.8" stroke-dasharray="3,3"/>';
  s += dimV(xl, Y(p.yF), Y(S.Gy), '', BLUE);
  s += '<text x="'+n1(xl-9)+'" y="'+n1((Y(p.yF)+Y(S.Gy))/2+4)+'" font-size="12" fill="'+BLUE+'" text-anchor="end" font-weight="bold">e<tspan font-size="9.5" dy="3">y</tspan><tspan dy="-3"> = '+nf(S.ey,0)+' mm</tspan></text>';

  for(var i=0;i<S.bolts.length;i++) s += boltSym(X(S.bolts[i].x), Y(S.bolts[i].y), 7, '#9aa8bf');
  return s + '</svg>';
}

/* ═══════════════ FIGURE 4 — per-bolt force vectors ═══════════════ */
function figBolts(S, mode){
  var sc = 1.0, PAD = 206;
  var xs = S.bolts.map(function(b){ return b.x; }), ys = S.bolts.map(function(b){ return b.y; });
  var x0 = Math.min.apply(null,xs), x1 = Math.max.apply(null,xs);
  var y0 = Math.min.apply(null,ys), y1 = Math.max.apply(null,ys);
  var W = (x1-x0)*sc + 2*PAD, H = (y1-y0)*sc + 2*PAD;
  var X = function(m){ return PAD + (m-x0)*sc; };
  var Y = function(m){ return PAD + (y1-m)*sc; };

  /* One arrow scale per figure. When components are shown together they MUST
     share it, or the drawn arrows would not close on the drawn resultant. */
  var big = 0, i;
  for(i=0;i<S.bolts.length;i++){
    var q0 = S.bolts[i];
    big = Math.max(big, mode==='primary' ? q0.p : (mode==='secondary' ? q0.s : q0.t));
  }
  var fs = (big > 0) ? 92/big : 0;
  function vlab(sym,name,val){
    return sym+'<tspan font-size="9.5" dy="3">'+name+'</tspan><tspan dy="-3"> = '+nf(val/1000,3)+' kN</tspan>';
  }

  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="'+n1(Math.min(700,W*1.25))+'" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  /* The secondary arrows are horizontal in a colinear group, so the band either
     side of G is crowded; park the M label clear above the top bolt. */
  if(mode==='secondary')
    s += momentArc(X(S.Gx), Y(S.Gy), 34, '', GREEN, S.M < 0, false)
       + '<text x="'+n1(X(S.Gx))+'" y="'+n1(Y(y1)-42)+'" font-size="12.5" fill="'+GREEN
       + '" text-anchor="middle" font-weight="bold">M = '+nf(Math.abs(S.M)/1000,1)+' kN&#183;mm</text>';
  s += centroidSym(X(S.Gx), Y(S.Gy));
  s += '<text x="'+n1(X(S.Gx)-11)+'" y="'+n1(Y(S.Gy)+22)+'" font-size="12" fill="'+ORANGE+'" font-weight="bold" text-anchor="end">G</text>';

  for(i=0;i<S.bolts.length;i++){
    var b = S.bolts[i], bx = X(b.x), by = Y(b.y);
    if((mode==='secondary' || mode==='all') && b.r > 1e-9)
      s += '<line x1="'+n1(X(S.Gx))+'" y1="'+n1(Y(S.Gy))+'" x2="'+n1(bx)+'" y2="'+n1(by)+'" stroke="'+ORANGE+'" stroke-width="0.9" stroke-dasharray="4,3"/>';
    s += boltSym(bx, by, 9);
    s += '<text x="'+n1(bx)+'" y="'+n1(by-15)+'" font-size="13" fill="'+NAVY+'" text-anchor="middle" font-weight="bold">'+b.name+'</text>';

    /* label just past the arrow tip, pushed clear along the arrow direction */
    var mk = function(vx,vy,col,txt){
      var lx = bx+vx*fs, ly = by-vy*fs;
      var right = (vx > 1e-9) || (Math.abs(vx) < 1e-9 && b.x >= S.Gx);
      return '<text x="'+n1(lx + (right?11:-11))+'" y="'+n1(ly + (vy>=0 ? -9 : 16))+'" font-size="12" fill="'+col
           + '" text-anchor="'+(right?'start':'end')+'" font-weight="bold">'+txt+'</text>';
    };
    if(mode==='primary' || mode==='all'){
      s += arrow(bx, by, bx+b.px*fs, by-b.py*fs, BLUE, 2.2, '', 11);
      if(mode==='primary') s += mk(b.px, b.py, BLUE, vlab('F&#8242;', b.name, b.p));
    }
    if(mode==='secondary' || mode==='all'){
      if(b.s > 1e-9){
        s += arrow(bx, by, bx+b.sx*fs, by-b.sy*fs, ORANGE, 2.2, '', 11);
        if(mode==='secondary'){
          s += rightAngle(bx, by, X(S.Gx)-bx, Y(S.Gy)-by, b.sx, -b.sy, 14, '#8a8f98');
          s += mk(b.sx, b.sy, ORANGE, vlab('F&#8243;', b.name, b.s));
        }
      } else if(mode==='secondary'){
        s += '<text x="'+n1(bx+15)+'" y="'+n1(by+22)+'" font-size="12" fill="'+ORANGE+'" text-anchor="start" font-weight="bold">F&#8243;<tspan font-size="9.5" dy="3">'+b.name+'</tspan><tspan dy="-3"> = 0 &#160;(r = 0)</tspan></text>';
      }
    }
    if(mode==='resultant' || mode==='all')
      s += arrow(bx, by, bx+b.tx*fs, by-b.ty*fs, RED, 2.6, '', 11)
         + mk(b.tx, b.ty, RED, vlab('F', b.name, b.t));
  }

  /* radius components annotated on ONE bolt only — all four labelled turns the
     figure into noise. Handles the colinear case, where r_x = 0 for every bolt. */
  if(mode==='secondary'){
    var q = null;
    for(i=0;i<S.bolts.length;i++) if(S.bolts[i].r > 1e-9){ q = S.bolts[i]; break; }
    if(q){
      var gx = X(S.Gx), gy = Y(S.Gy), qx = X(q.x), qy = Y(q.y);
      var degen = (Math.abs(q.rx) < 0.5 || Math.abs(q.ry) < 0.5);
      function rlab(sub,val){
        return 'r<tspan font-size="9.5" dy="3">'+sub+'</tspan><tspan dy="-3"> = '+nf(val, val===Math.round(val)?0:2)+'</tspan>';
      }
      if(degen){
        /* the radius lies along one axis: no triangle to draw, but the fact
           that the other component is exactly zero is the point worth making */
        s += '<line x1="'+n1(gx)+'" y1="'+n1(gy)+'" x2="'+n1(qx)+'" y2="'+n1(qy)+'" stroke="'+PUR+'" stroke-width="1.8"/>';
        var lx = (Math.abs(q.rx) < 0.5) ? qx - 15 : (gx+qx)/2,
            ly = (Math.abs(q.rx) < 0.5) ? (gy+qy)/2 : gy + 20;
        var anch = (Math.abs(q.rx) < 0.5) ? 'end' : 'middle';
        s += '<text x="'+n1(lx)+'" y="'+n1(ly-14)+'" font-size="12.5" fill="'+PUR+'" text-anchor="'+anch+'" font-weight="bold">'+rlab('x',q.rx)+'</text>'
           + '<text x="'+n1(lx)+'" y="'+n1(ly)+'" font-size="12.5" fill="'+PUR+'" text-anchor="'+anch+'" font-weight="bold">'+rlab('y',q.ry)+'</text>'
           + '<text x="'+n1(lx)+'" y="'+n1(ly+14)+'" font-size="12.5" fill="'+PUR+'" text-anchor="'+anch+'" font-weight="bold">'+rlab('',q.r)+'</text>';
      } else {
        var cnx = qx, cny = gy;
        s += '<line x1="'+n1(gx)+'" y1="'+n1(gy)+'" x2="'+n1(cnx)+'" y2="'+n1(cny)+'" stroke="'+PUR+'" stroke-width="1.6"/>'
           + '<line x1="'+n1(cnx)+'" y1="'+n1(cny)+'" x2="'+n1(qx)+'" y2="'+n1(qy)+'" stroke="'+PUR+'" stroke-width="1.6"/>'
           + '<line x1="'+n1(gx)+'" y1="'+n1(gy)+'" x2="'+n1(qx)+'" y2="'+n1(qy)+'" stroke="'+PUR+'" stroke-width="1.6"/>'
           + rightAngle(cnx, cny, (gx-cnx), 0, 0, (qy-cny), 11, PUR);
        s += '<text x="'+n1((gx+cnx)/2)+'" y="'+n1(cny + (q.y>S.Gy ? 17 : -9))+'" font-size="12.5" fill="'+PUR
           + '" text-anchor="middle" font-weight="bold">'+rlab('x',q.rx)+'</text>';
        s += '<text x="'+n1(qx + (q.x<S.Gx ? -9 : 9))+'" y="'+n1((cny+qy)/2+4)+'" font-size="12.5" fill="'+PUR
           + '" text-anchor="'+(q.x<S.Gx ? 'end' : 'start')+'" font-weight="bold">'+rlab('y',q.ry)+'</text>';
        var mx=(gx+qx)/2, my=(gy+qy)/2, ox=mx-cnx, oy=my-cny, oL=Math.hypot(ox,oy)||1;
        s += '<text x="'+n1(mx+ox/oL*20)+'" y="'+n1(my+oy/oL*20+4)+'" font-size="12.5" fill="'+PUR
           + '" text-anchor="middle" font-weight="bold">'+rlab('',q.r)+'</text>';
      }
    }
  }

  var ly0 = H-14;
  if(mode==='all'){
    s += '<line x1="14" y1="'+n1(ly0-26)+'" x2="40" y2="'+n1(ly0-26)+'" stroke="'+BLUE+'" stroke-width="2.2"/><text x="45" y="'+n1(ly0-22)+'" font-size="11" fill="'+GREY+'">primary F&#8242;</text>';
    s += '<line x1="14" y1="'+n1(ly0-12)+'" x2="40" y2="'+n1(ly0-12)+'" stroke="'+ORANGE+'" stroke-width="2.2"/><text x="45" y="'+n1(ly0-8)+'" font-size="11" fill="'+GREY+'">secondary F&#8243;</text>';
    s += '<line x1="14" y1="'+n1(ly0+2)+'" x2="40" y2="'+n1(ly0+2)+'" stroke="'+RED+'" stroke-width="2.6"/><text x="45" y="'+n1(ly0+6)+'" font-size="11" fill="'+GREY+'">resultant</text>';
  }
  return s + '</svg>';
}

/* ═══════════════ page builder ═══════════════ */
function stepBlock(n,title,hint,body){
  return '<div class="step"><details'+(n===1?' open':'')+'>'
       + '<summary><span class="step-num">'+n+'</span><span class="step-title">'+title+'</span>'
       + '<span class="try-hint">'+hint+'</span></summary>'
       + '<div class="step-body">'+body+'</div></details></div>';
}

function build(p){
  var S = solve(p), i, b, h = '';
  var CIRCLED = ['&#9312;','&#9313;','&#9314;','&#9315;','&#9316;','&#9317;'];

  /* ── problem statement ── */
  h += '<h3>Problem Statement</h3>'
    +  '<p>A horizontal channel has a cantilever beam bolted to it by <strong>'+S.n+' M'+nf(p.d,0)+' &#215; '+p.pitch
    +  ' bolts</strong> at '+S.bolts.map(function(q){ return q.name; }).join(', ')+'. '
    +  'A load <strong>F = '+nf(p.F/1000,0)+' kN</strong> is applied at the free end at <strong>'+nf(Math.abs(p.ang),0)
    +  '&#176;</strong> to the horizontal. Find:</p>'
    +  '<div class="callout info"><p>(a) the resultant load on each bolt &nbsp;·&nbsp; (b) the maximum critical shear stress &nbsp;·&nbsp; '
    +  '(c) the minimum bolt grade for a safety factor of '+nf(p.nsf,0)+', assuming distortion-energy theory ($S_{sy} = 0.58\\,S_y$)</p></div>';

  h += '<div class="diagram-wrap"><figure>'+figLayout(S)
    +  '<figcaption>Beam, bolt line and inclined load, drawn to scale. The '+S.n+' bolts are <strong>colinear</strong> on the beam '
    +  'centreline, so the bolt-group centroid $G$ falls '
    +  (S.n%2===1 ? 'exactly on the middle bolt.' : 'midway between the two central bolts.')+'</figcaption></figure></div>';

  if(p.book)
    h += '<div class="callout given"><p><strong>Given answer:</strong> '+p.book+'</p></div>';
  else
    h += '<div class="callout given"><p><strong>Note:</strong> this is a modified problem — the answers below are computed, '
      +  'not taken from the textbook. Work it through and check yourself against the summary table.</p></div>';

  h += '<div class="callout info"><p><strong>Strategy:</strong> same three moves as T7.1 — resolve, transfer, superpose. The two new '
    +  'wrinkles here are that the load is <strong>inclined</strong>, so it has two components and both feed the primary shear, and '
    +  'that the bolts are <strong>colinear</strong>, which makes every secondary force horizontal and leaves the bolt at the centroid '
    +  'carrying no secondary shear at all.</p></div>';

  h += '<h3>Solution</h3>';

  /* ── step 1: resolve ── */
  var th = p.ang*Math.PI/180;
  var b1 = '<p>Nothing can be done until the load is in components. At '+nf(Math.abs(p.ang),0)+'&#176; below the horizontal, pointing '
    + (S.Fx>0?'to the right':'to the left')+' and '+(S.Fy<0?'downward':'upward')+':</p>'
    + '<div class="math-block">$$F_x = F\\cos'+nf(Math.abs(p.ang),0)+'^\\circ = '+nf(p.F/1000,0)+'\\cos'+nf(Math.abs(p.ang),0)+'^\\circ = '+nf(S.Fx/1000,3)+'\\ \\text{kN}$$'
    + '$$F_y = -F\\sin'+nf(Math.abs(p.ang),0)+'^\\circ = -'+nf(p.F/1000,0)+'\\sin'+nf(Math.abs(p.ang),0)+'^\\circ = '+nf(S.Fy/1000,3)+'\\ \\text{kN}$$</div>'
    + '<div class="diagram-wrap"><figure>'+figResolve(S)
    + '<figcaption>The '+nf(p.F/1000,0)+' kN load resolved. At '+nf(Math.abs(p.ang),0)+'&#176; the two components '
    + (Math.abs(Math.abs(p.ang)-45)<1e-9 ? 'are equal in magnitude — which is a useful arithmetic check, but do not let it tempt you into treating the load as if it were purely vertical.'
      : 'are unequal; keep them separate all the way to the end.')+'</figcaption></figure></div>'
    + '<div class="callout answer"><p>$F_x = '+nf(S.Fx/1000,3)+'$ kN &nbsp;&nbsp;&nbsp; $F_y = '+nf(S.Fy/1000,3)+'$ kN</p></div>'
    + '<div class="callout warn"><p><strong>Do not resolve into "along the beam" and "across the beam" and then throw the axial part away.</strong> '
    + 'Both components are carried in <em>shear</em> across the bolt cross-sections here, because both lie in the plane of the joint. '
    + 'The bolts are loaded in shear, not tension — the '+nf(Math.abs(p.ang),0)+'&#176; inclination does not put them into tension.</p></div>';
  h += stepBlock(1,'Resolve the inclined load into components','try it first, then reveal &darr;',b1);

  /* ── step 2: centroid and moment ── */
  var b2 = '<p>All '+S.n+' bolts are the same size, so the centroid is the average of the bolt positions. They all lie on $x = 0$:</p>'
    + '<div class="math-block">$$\\bar{y} = \\frac{'+S.bolts.map(function(q){ return nf(q.y,0); }).join(' + ')+'}{'+S.n+'} = '+nf(S.Gy,1)+'\\ \\text{mm}$$</div>'
    + '<p>The load acts at $('+nf(p.xF,0)+',\\ '+nf(p.yF,0)+')$, so relative to $G$ its position is</p>'
    + '<div class="math-block">$$e_x = '+nf(S.ex,1)+'\\ \\text{mm}, \\qquad e_y = '+nf(S.ey,1)+'\\ \\text{mm}$$</div>'
    + '<p>Take moments about $G$, counter-clockwise positive. Each component gets the lever arm <em>perpendicular to itself</em>: '
    + '$F_y$ is turned by $e_x$, and $F_x$ is turned by $e_y$.</p>'
    + '<div class="math-block">$$M = e_x F_y - e_y F_x = ('+nf(S.ex,0)+')('+nf(S.Fy/1000,3)+') - ('+nf(S.ey,0)+')('+nf(S.Fx/1000,3)+') = '+nf(S.M/1000,1)+'\\ \\text{kN}\\cdot\\text{mm}$$</div>';
  if(Math.abs(S.ex) < 1e-9)
    b2 += '<div class="callout note"><p><strong>Where the moment actually comes from.</strong> The load is applied on the bolt '
       +  'centreline, so $e_x = 0$ and the vertical component $F_y$ contributes <em>nothing</em> to $M$ — it pulls straight along the '
       +  'bolt line. The entire couple, all '+nf(Math.abs(S.M)/1000,1)+' kN·mm of it, is produced by the <em>horizontal</em> component '
       +  '$F_x$ acting '+nf(Math.abs(S.ey),0)+' mm above $G$. Students who reflexively use "load × distance" with the full '+nf(p.F/1000,0)
       +  ' kN get $'+nf(p.F*Math.abs(S.ey)/1e6,2)+'$ kN·m, which is '+nf(100*(p.F*Math.abs(S.ey)/Math.abs(S.M)-1),0)+'% too high.</p></div>';
  b2 += '<div class="diagram-wrap"><figure>'+figTransfer(S)
    + '<figcaption>Force–couple replacement. Sliding the load onto the centroid is only legitimate if the couple $M$ is added at the '
    + 'same time; the couple is drawn at $G$ because a couple has no point of application.</figcaption></figure></div>'
    + '<div class="callout answer"><p>$G$ at $y = '+nf(S.Gy,1)+'$ mm &nbsp;&nbsp;&nbsp; $M = '+nf(Math.abs(S.M)/1000,1)+'$ kN·mm '
    + (S.M<0?'(clockwise)':'(counter-clockwise)')+'</p></div>';
  h += stepBlock(2,'Locate the centroid and find the moment about it','which component actually causes the moment?',b2);

  /* ── step 3: primary ── */
  var b3 = '<p>The force transferred to the centroid is shared equally by all '+S.n+' bolts:</p>'
    + '<div class="math-block">$$F\'_x = \\frac{F_x}{n} = \\frac{'+nf(S.Fx/1000,3)+'}{'+S.n+'} = '+nf(S.bolts[0].px/1000,3)+'\\ \\text{kN}, \\qquad '
    + 'F\'_y = \\frac{F_y}{n} = \\frac{'+nf(S.Fy/1000,3)+'}{'+S.n+'} = '+nf(S.bolts[0].py/1000,3)+'\\ \\text{kN}$$'
    + '$$|F\'| = \\frac{F}{n} = \\frac{'+nf(p.F/1000,0)+'}{'+S.n+'} = '+nf(S.bolts[0].p/1000,3)+'\\ \\text{kN}$$</div>'
    + '<div class="diagram-wrap"><figure>'+figBolts(S,'primary')
    + '<figcaption>Primary (direct) shear — identical on every bolt, parallel to $F$, still at '+nf(Math.abs(p.ang),0)+'&#176;.</figcaption></figure></div>'
    + '<div class="callout answer"><p>$F\' = '+nf(S.bolts[0].p/1000,3)+'$ kN on every bolt, at '+nf(Math.abs(p.ang),0)+'&#176;</p></div>';
  h += stepBlock(3,'Primary (direct) shear on each bolt','sketch the arrows before opening',b3);

  /* ── step 4: secondary ── */
  var rowsR = '';
  for(i=0;i<S.bolts.length;i++){ b = S.bolts[i];
    rowsR += '<tr><td><strong>'+b.name+'</strong></td><td>'+nf(b.rx,1)+'</td><td>'+nf(b.ry,1)+'</td><td>'+nf(b.r,2)+'</td><td>'
           + nf(b.rx*b.rx+b.ry*b.ry,0)+'</td></tr>'; }
  var zeroBolt = null;
  for(i=0;i<S.bolts.length;i++) if(S.bolts[i].r < 1e-9) zeroBolt = S.bolts[i];
  var farBolt = S.bolts[0];
  for(i=0;i<S.bolts.length;i++) if(S.bolts[i].r > farBolt.r) farBolt = S.bolts[i];

  var b4 = '<p>The couple is resisted by a force on each bolt <strong>perpendicular to $r_i$</strong> and <strong>proportional to $r_i$</strong>:</p>'
    + '<div class="math-block">$$F\'\'_i = \\frac{M\\,r_i}{\\sum r_j^2}, \\qquad\\text{in components}\\qquad '
    + 'F\'\'_{i,x} = -\\frac{M\\,r_{i,y}}{\\sum r^2}, \\quad F\'\'_{i,y} = +\\frac{M\\,r_{i,x}}{\\sum r^2}$$</div>'
    + '<p>The signs are not a free choice: they are fixed by requiring the secondary forces to produce a moment of exactly $+M$ about $G$. '
    + 'Reverse them and the force balance <em>still</em> closes, so the mistake is silent — only the moment check catches it.</p>'
    + '<table class="sum"><tr><th>Bolt</th><th>$r_x$ (mm)</th><th>$r_y$ (mm)</th><th>$r$ (mm)</th><th>$r^2$ (mm²)</th></tr>'
    + rowsR + '<tr class="total"><td colspan="4">$\\sum r^2$</td><td>'+nf(S.Sr2,0)+'</td></tr></table>'
    + '<p>Because every bolt sits on the line $x = 0$, <strong>$r_x = 0$ for all of them</strong>. That kills $F\'\'_{i,y}$ entirely: '
    + 'every secondary force here is <strong>purely horizontal</strong>. For bolt '+farBolt.name+':</p>'
    + '<div class="math-block">$$F\'\'_{x} = -\\frac{('+nf(S.M/1000,1)+')('+nf(farBolt.ry,0)+')}{'+nf(S.Sr2,0)+'} = '+nf(farBolt.sx/1000,3)+'\\ \\text{kN}, \\qquad '
    + 'F\'\'_{y} = +\\frac{('+nf(S.M/1000,1)+')(0)}{'+nf(S.Sr2,0)+'} = 0$$</div>';
  if(zeroBolt)
    b4 += '<div class="callout note"><p><strong>Bolt '+zeroBolt.name+' carries no secondary shear at all.</strong> It sits exactly at the '
       +  'centroid, so $r = 0$ and $F\'\' = Mr/\\sum r^2 = 0$. A bolt at the centroid contributes nothing to the group\'s moment '
       +  'capacity — it adds only to the direct-shear capacity. That is worth remembering when you are choosing where to put bolts: '
       +  'material at the centroid is nearly wasted, exactly as it is in a beam section.</p></div>';
  b4 += '<div class="diagram-wrap"><figure>'+figBolts(S,'secondary')
    + '<figcaption>Secondary (moment) shear. Each force is perpendicular to its own radius — the grey right-angle ticks mark it — '
    + 'and the set circulates '+(S.M<0?'clockwise':'counter-clockwise')+', the same sense as the couple $M$ (green) at $G$ that they '
    + 'replace. The purple annotation on bolt '+farBolt.name+' shows $r_x$, $r_y$ and $r$; here $r_x = 0$, which is why the arrows are horizontal.</figcaption></figure></div>'
    + '<div class="callout answer"><p>$\\sum r^2 = '+nf(S.Sr2,0)+'$ mm² &nbsp;&nbsp;&nbsp; '
    + S.bolts.map(function(q){ return '$F\'\'_{'+q.name+'} = '+nf(q.s/1000,3)+'$ kN'; }).join(' &nbsp;&nbsp; ')+'</p></div>';
  h += stepBlock(4,'Secondary (moment) shear on each bolt','tabulate $r$ and $\\sum r^2$ first',b4);

  /* ── step 5: resultants ── */
  var rows5 = '';
  for(i=0;i<S.bolts.length;i++){ b = S.bolts[i];
    rows5 += '<tr'+(Math.abs(b.t-S.Fmax)<1e-6?' class="total"':'')+'><td><strong>'+b.name+'</strong></td>'
          + '<td>'+nf(b.px/1000,3)+', '+nf(b.py/1000,3)+'</td>'
          + '<td>'+nf(b.sx/1000,3)+', '+nf(b.sy/1000,3)+'</td>'
          + '<td>'+nf(b.tx/1000,3)+', '+nf(b.ty/1000,3)+'</td>'
          + '<td><strong>'+nf(b.t/1000,3)+'</strong></td></tr>'; }
  var w = S.worst;
  var b5 = '<p>Add the two components <strong>as vectors</strong> at each bolt:</p>'
    + '<table class="sum"><tr><th>Bolt</th><th>Primary $(F\'_x, F\'_y)$ kN</th><th>Secondary $(F\'\'_x, F\'\'_y)$ kN</th>'
    + '<th>Resultant $(F_x, F_y)$ kN</th><th>$|F|$ kN</th></tr>'+rows5+'</table>'
    + '<p>Worked through for the critical bolt <strong>'+w.name+'</strong>:</p>'
    + '<div class="math-block">$$F_x = '+nf(w.px/1000,3)+' + ('+nf(w.sx/1000,3)+') = '+nf(w.tx/1000,3)+'\\ \\text{kN}$$'
    + '$$F_y = '+nf(w.py/1000,3)+' + ('+nf(w.sy/1000,3)+') = '+nf(w.ty/1000,3)+'\\ \\text{kN}$$'
    + '$$|F_{'+w.name+'}| = \\sqrt{'+nf(w.tx/1000,3)+'^2 + '+nf(w.ty/1000,3)+'^2} = '+nf(w.t/1000,3)+'\\ \\text{kN}$$</div>'
    + '<div class="diagram-wrap"><figure>'+figBolts(S,'all')
    + '<figcaption>Primary (blue) and secondary (orange) components and their resultants (red). At bolt '+w.name
    + ' the horizontal parts point the same way and add; at the bolt on the far side they oppose and partly cancel.</figcaption></figure></div>'
    + '<div class="callout answer"><p>'
    + S.bolts.map(function(q){ return '$F_{'+q.name+'} = '+nf(q.t/1000,3)+'$ kN'; }).join(' &nbsp;&nbsp; ')+'</p></div>'
    + '<div class="callout note"><p><strong>Sanity check (equilibrium):</strong> the '+S.n+' bolt forces sum to '
    + '$('+nf(S.bolts.reduce(function(a,q){return a+q.tx;},0)/1000,3)+',\\ '+nf(S.bolts.reduce(function(a,q){return a+q.ty;},0)/1000,3)+')$ kN, '
    + 'exactly the applied $('+nf(S.Fx/1000,3)+',\\ '+nf(S.Fy/1000,3)+')$ kN, and their moment about $G$ recovers $M$. '
    + (S.equilOK?'&#10003;':'&#10007; <strong>equilibrium check FAILED</strong>')+'</p></div>';
  if(p.bookNote)
    b5 += '<div class="callout note"><p><strong>Against the printed answer:</strong> '+p.bookNote+'</p></div>';
  h += stepBlock(5,'Resultant load on each bolt — part (a)','add the vectors, do not add the magnitudes',b5);

  /* ── step 6: shear stress ── */
  var tau = S.Fmax/p.At;
  var b6 = '<p>The critical bolt carries $'+nf(S.Fmax/1000,3)+'$ kN in <strong>single shear</strong> — the beam bears on one face of the '
    + 'channel, so each bolt has just one shear plane.</p>'
    + '<div class="math-block">$$\\tau_{\\max} = \\frac{F_{\\max}}{A_t} = \\frac{'+nf(S.Fmax,1)+'\\ \\text{N}}{'+nf(p.At,1)+'\\ \\text{mm}^2} = '+nf(tau,1)+'\\ \\text{MPa}$$</div>'
    + '<div class="callout answer"><p>$\\tau_{\\max} = '+nf(tau,1)+'$ MPa &nbsp; (bolt '+w.name+')</p></div>'
    + '<div class="callout warn"><p><strong>Which area?</strong> The <strong>tensile stress area</strong> $A_t = '+nf(p.At,1)+'$ mm² for an M'
    + nf(p.d,0)+' &#215; '+p.pitch+' bolt is used here — the conservative choice, correct if the threaded portion runs into the shear plane. '
    + 'On the plain shank ($A = '+nf(Math.PI/4*p.d*p.d,1)+'$ mm²) you would get $'+nf(S.Fmax/(Math.PI/4*p.d*p.d),1)+'$ MPa instead, '
    + nf(100*(1 - p.At/(Math.PI/4*p.d*p.d)),0)+'% lower. Say which you have assumed.</p></div>';
  h += stepBlock(6,'Maximum critical shear stress — part (b)','which area do you divide by?',b6);

  /* ── step 7: grade selection ── */
  var SyReq = p.nsf*tau/0.58;
  var rows7 = '', chosen = null;
  for(i=0;i<p.grades.length;i++){
    var g = p.grades[i], ssy = 0.58*g.Sy, nn = ssy/tau, pass = (nn >= p.nsf);
    if(pass && !chosen) chosen = g;
    rows7 += '<tr class="'+(pass ? (chosen===g ? 'total' : '') : 'fail')+'"><td><strong>'+g.cls+'</strong></td><td>'+g.Sy
          +  '</td><td>'+nf(ssy,1)+'</td><td>'+nf(nn,2)+'</td><td>'+(pass ? (chosen===g ? '&#10003; lowest that works' : '&#10003;') : '&#10007;')+'</td></tr>';
  }
  var b7 = '<p>Distortion-energy theory gives the shear yield strength as a fixed fraction of the tensile yield strength. Setting the '
    + 'factor of safety on that shear yield:</p>'
    + '<div class="math-block">$$n = \\frac{S_{sy}}{\\tau_{\\max}} = \\frac{0.58\\,S_y}{\\tau_{\\max}} \\quad\\Longrightarrow\\quad '
    + 'S_y \\ge \\frac{n\\,\\tau_{\\max}}{0.58} = \\frac{'+nf(p.nsf,0)+' \\times '+nf(tau,1)+'}{0.58} = '+nf(SyReq,1)+'\\ \\text{MPa}$$</div>'
    + '<p>Now read down the metric property-class table for the first class that reaches it:</p>'
    + '<table class="sum"><tr><th>Class</th><th>$S_y$ (MPa)</th><th>$S_{sy} = 0.58S_y$ (MPa)</th><th>$n = S_{sy}/\\tau$</th><th>$n \\ge '+nf(p.nsf,0)+'$?</th></tr>'
    + rows7 + '</table>'
    + '<div class="callout answer"><p>Required $S_y \\ge '+nf(SyReq,0)+'$ MPa &nbsp;&#8658;&nbsp; use <strong>class '
    + (chosen ? chosen.cls : '—')+'</strong>'+(chosen ? ' ($S_y = '+chosen.Sy+'$ MPa, giving $n = '+nf(0.58*chosen.Sy/tau,2)+'$)' : '')+'</p></div>'
    + '<div class="callout warn"><p><strong>Check the size range in your own table.</strong> Shigley\'s metric property-class table splits '
    + 'some classes by diameter, and lists class 8.8 against <em>M16–M36</em>. Read strictly, that would rule 8.8 out for an M'+nf(p.d,0)
    + ' bolt and push you to class 9.8 ($S_y = 720$ MPa, $n = '+nf(0.58*720/tau,2)+'$). ISO 898-1 does define class 8.8 for diameters below '
    + 'M16, so 8.8 is a real, purchasable specification for M10 — but if the table in front of you in the exam does not list it at this '
    + 'size, quote 9.8 and say why. <em>This detail is worth confirming against the edition of the table your unit uses.</em></p></div>'
    + '<div class="callout note"><p><strong>Why 0.58?</strong> Distortion-energy (von Mises) theory predicts that a material yields in pure '
    + 'shear at $S_y/\\sqrt{3} = 0.577\\,S_y$, rounded to $0.58$. The maximum-shear-stress (Tresca) theory would give $0.50\\,S_y$ instead — '
    + 'more conservative, and it would demand $S_y \\ge '+nf(p.nsf*tau/0.5,0)+'$ MPa here. Always state which theory you used.</p></div>';
  h += stepBlock(7,'Minimum bolt grade — part (c)','what does the safety factor act on?',b7);

  /* ── step 8: summary ── */
  var rows8 = '';
  for(i=0;i<S.bolts.length;i++){ b = S.bolts[i];
    rows8 += '<tr'+(Math.abs(b.t-S.Fmax)<1e-6?' class="total"':'')+'><td><strong>'+b.name+'</strong></td><td>'+nf(b.ry,1)+'</td>'
          + '<td>'+nf(b.p/1000,3)+'</td><td>'+nf(b.s/1000,3)+'</td><td><strong>'+nf(b.t/1000,3)+'</strong></td></tr>'; }
  var b8 = '<table class="sum"><tr><th>Bolt</th><th>$r_y$ (mm)</th><th>$|F\'|$ kN</th><th>$|F\'\'|$ kN</th><th>$|F|$ kN</th></tr>'+rows8+'</table>'
    + '<table class="sum"><tr><th>Quantity</th><th>Symbol</th><th>Value</th></tr>'
    + '<tr><td>Load components</td><td>$F_x,\\ F_y$</td><td>'+nf(S.Fx/1000,3)+', '+nf(S.Fy/1000,3)+' kN</td></tr>'
    + '<tr><td>Moment about $G$</td><td>$M$</td><td>'+nf(Math.abs(S.M)/1000,1)+' kN·mm</td></tr>'
    + '<tr><td>Polar sum</td><td>$\\sum r^2$</td><td>'+nf(S.Sr2,0)+' mm²</td></tr>'
    + '<tr class="total"><td>(a) Largest bolt load</td><td>$F_{\\max}$</td><td>'+nf(S.Fmax/1000,3)+' kN (bolt '+w.name+')</td></tr>'
    + '<tr class="total"><td>(b) Max shear stress</td><td>$\\tau_{\\max}$</td><td>'+nf(tau,1)+' MPa</td></tr>'
    + '<tr class="total"><td>(c) Minimum grade</td><td>class</td><td>'+(chosen ? chosen.cls+' ($S_y = '+chosen.Sy+'$ MPa)' : '—')+'</td></tr>'
    + '</table>';
  h += stepBlock(8,'Summary','all three answers together',b8);

  /* ── common mistakes ── */
  var mis = [];
  mis.push('<strong>Treating the inclined load as if it were vertical.</strong> At '+nf(Math.abs(p.ang),0)+'&#176; only '
    + nf(100*Math.abs(S.Fy)/p.F,0)+'% of the load is vertical. More importantly, with the load applied on the bolt centreline it is the '
    + '<em>horizontal</em> component that generates the entire moment — drop it and $M$ collapses to zero.');
  mis.push('<strong>Using $F \\times d$ for the moment without checking which lever arm goes with which component.</strong> '
    + '$F_y$ pairs with $e_x$ and $F_x$ pairs with $e_y$. Here $e_x = '+nf(S.ex,0)+'$, so $F_y$ contributes nothing at all.');
  mis.push('<strong>Getting the direction of the secondary shear backwards.</strong> It is a silent error — the force balance still '
    + 'closes — and it swaps which bolt is critical, here reporting '
    + nf(Math.min.apply(null,S.bolts.filter(function(q){return q.r>1e-9;}).map(function(q){return q.t;}))/1000,3)
    + ' kN instead of '+nf(S.Fmax/1000,3)+' kN. Always finish with $\\sum(r_i \\times F_i) = M$.');
  if(zeroBolt)
    mis.push('<strong>Giving bolt '+zeroBolt.name+' a secondary force.</strong> It sits at the centroid, so $r = 0$ and $F\'\' = 0$. '
      + 'It carries only its $'+nf(zeroBolt.p/1000,3)+'$ kN share of the direct load — the smallest of the '+S.n+'.');
  mis.push('<strong>Applying the safety factor to $S_y$ instead of to $S_{sy}$.</strong> The bolt is in <em>shear</em>. Comparing '
    + '$\\tau_{\\max}$ against $S_y/n$ directly would suggest $S_y \\ge '+nf(p.nsf*tau,0)+'$ MPa and let you pick a class that is '
    + 'actually unsafe. Convert to shear yield first with the 0.58 factor.');
  mis.push('<strong>Adding the primary and secondary magnitudes arithmetically.</strong> They are vectors. At bolt '+w.name+' that would give '
    + nf((w.p+w.s)/1000,3)+' kN instead of '+nf(w.t/1000,3)+' kN.');
  h += '<div class="callout warn"><p><strong>Common mistakes:</strong></p>'
     + mis.map(function(m,k){ return '<p style="margin-top:6px">'+CIRCLED[k]+' '+m+'</p>'; }).join('') + '</div>';

  if(!S.equilOK)
    h += '<div class="callout warn"><p><strong>Internal check failed</strong> — the computed bolt forces do not close on the applied '
       + 'load. Do not trust the numbers above; report this page.</p></div>';

  return h;
}

/* ─────────────────── problem definitions ─────────────────── */
/* Datum: x = 0 on the beam centreline (all bolts lie on it), y = 0 at the
   middle bolt O. The load point is 240 + 20 + 60 = 320 mm above O, on the
   centreline, so x_F = 0. */
var GRADES = [ {cls:'4.6', Sy:240}, {cls:'4.8', Sy:340}, {cls:'5.8', Sy:420},
               {cls:'8.8', Sy:660}, {cls:'9.8', Sy:720}, {cls:'10.9', Sy:940},
               {cls:'12.9', Sy:1100} ];
var GEOM = {beamW:60, capR:30, beamBot:-120, chX0:-190, chX1:150, chTop:80, chBot:-100};

var VARIANTS = [
  { btn:"Original (T7.2)",
    desc:"The tutorial sheet problem exactly as printed: three M10 x 1.5 bolts at 60 mm spacing, 4 kN applied at 45 degrees, 320 mm above the middle bolt.",
    F:4000, ang:-45, xF:0, yF:320, d:10, pitch:'1.5', At:58.0, nsf:2, grades:GRADES, geom:GEOM,
    bolts:[{name:'A',x:0,y:60},{name:'O',x:0,y:0},{name:'B',x:0,y:-60}],
    book:"(a) $F_A = 8.537$ kN, $F_B = 6666.2$, $F_O = 1.333$ kN, (b) 147.1 MPa, (c) 8.8",
    bookNote:"The three magnitudes agree: 8.537, 6.667 and 1.333 kN, with bolt $A$ — the top bolt, furthest from the load in the "
           + "direction the plate rotates — critical. Note the printed \"$F_B = 6666.2$ kN\" is a <strong>unit slip</strong>: it is "
           + "6666.2 <strong>N</strong>, i.e. 6.667 kN. A 6666 kN load on an M10 bolt would be about a thousand times its breaking "
           + "strength, which is the kind of order-of-magnitude check worth running on every answer you write down." },

  { btn:"Variant 1 — 30\u00B0 load",
    desc:"Same geometry, but the load comes in at 30 degrees instead of 45. The horizontal component grows and the vertical shrinks, so the moment RISES even though the load magnitude is unchanged - a good test of whether you understand which component drives M.",
    F:4000, ang:-30, xF:0, yF:320, d:10, pitch:'1.5', At:58.0, nsf:2, grades:GRADES, geom:GEOM,
    bolts:[{name:'A',x:0,y:60},{name:'O',x:0,y:0},{name:'B',x:0,y:-60}],
    book:null, bookNote:null },

  { btn:"Variant 2 — four bolts",
    desc:"Four bolts at 60 mm spacing (y = +90, +30, -30, -90) instead of three, same 4 kN at 45 degrees. No bolt now sits at the centroid, the sum of r-squared more than doubles, and the load per bolt drops sharply - the standard fix for an overloaded bolt group.",
    F:4000, ang:-45, xF:0, yF:320, d:10, pitch:'1.5', At:58.0, nsf:2, grades:GRADES,
    geom:{beamW:60, capR:30, beamBot:-150, chX0:-190, chX1:150, chTop:110, chBot:-130},
    bolts:[{name:'A',x:0,y:90},{name:'B',x:0,y:30},{name:'C',x:0,y:-30},{name:'D',x:0,y:-90}],
    book:null, bookNote:null }
];

/* ─────────────────── wiring ─────────────────── */
function render(i){
  var v = VARIANTS[i];
  document.getElementById('doc').innerHTML = build(v);
  document.getElementById('swDesc').textContent = v.desc;
  var btns = document.querySelectorAll('#swBtns button');
  for(var j=0;j<btns.length;j++) btns[j].setAttribute('aria-pressed', j===i ? 'true' : 'false');
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('doc'), {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}
function init(){
  var box = document.getElementById('swBtns');
  VARIANTS.forEach(function(v,i){
    var b = document.createElement('button');
    b.textContent = v.btn;
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){ render(i); };
    box.appendChild(b);
  });
  render(0);
}
window.addEventListener('load', init);
</script>
</body>
</html>
