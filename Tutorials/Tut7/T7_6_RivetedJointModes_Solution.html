<script>
/* ══════════════════════════════════════════════════════════════════════════
   MCEN2002 — RIVETED LAP JOINT ENGINE  (shared with T7.5 — identical solver)

   A riveted lap joint has THREE independent ways of failing, and the safe
   load is whichever comes first. There is no interaction between them — you
   simply evaluate all three and take the minimum.

     1. RIVET SHEAR      the rivets shear off on the faying surface
                         F = n · (π/4)d² · τ_allow          (single shear)

     2. PLATE BEARING    the rivet shank crushes the hole edge
                         F = n · d · t · σ_b,allow
                         (projected area d·t, NOT the hole's circumference)

     3. PLATE TENSION    the plate tears across the line of holes
                         F = (L − n_row·d_hole) · t · σ_t,allow
                         evaluated on the NET width, at the worst hole line

   SAFE LOAD = min(the modes that apply).

   In T7.5 tensile failure is explicitly excluded by the problem statement, so
   only modes 1 and 2 are evaluated; T7.6 uses all three. The same `solve`
   handles both — pass `checkTension:false` to drop mode 3.

   Two details that catch people out:
     · SINGLE shear, not double. A lap joint has two plates and therefore ONE
       faying surface per rivet. A butt joint with two cover plates has two.
     · Bearing uses the thinnest plate in the stack, because the same force is
       spread over less projected area there.
   ══════════════════════════════════════════════════════════════════════════ */

function nf(v,dp){
  if(dp===undefined) dp = 2;
  var r = Number(v);
  if(Math.abs(r) < 5e-12) r = 0;
  var s = r.toFixed(dp);
  if(s === '-' + (0).toFixed(dp)) s = (0).toFixed(dp);
  return s;
}

function solve(p){
  var As = Math.PI/4*p.d*p.d;
  var planes = p.shearPlanes || 1;
  var modes = [];
  modes.push({key:'shear', name:'Rivet shear',
              expr:'n\\,'+(planes>1?planes+'\\,':'')+'\\frac{\\pi}{4}d^2\\,\\tau_{\\text{allow}}',
              F: p.n*planes*As*p.tau});
  modes.push({key:'bearing', name:'Plate bearing',
              expr:'n\\,d\\,t\\,\\sigma_{b,\\text{allow}}',
              F: p.n*p.d*p.t*p.sb});
  if(p.checkTension){
    var wnet = p.L - p.nRow*p.dh;
    modes.push({key:'tension', name:'Plate tension (net section)',
                expr:'(L - n_{\\text{row}}d_h)\\,t\\,\\sigma_{t,\\text{allow}}',
                F: wnet*p.t*p.st, wnet:wnet});
  }
  var gov = modes[0], i;
  for(i=1;i<modes.length;i++) if(modes[i].F < gov.F - 1e-9) gov = modes[i];
  for(i=0;i<modes.length;i++) modes[i].gov = (modes[i] === gov);
  return {p:p, As:As, planes:planes, modes:modes, gov:gov, Fsafe:gov.F};
}

/* ─────────────────── SVG helpers ─────────────────── */
var NAVY='#1a3c6e', RED='#c0392b', BLUE='#1a6fc4', ORANGE='#f97316',
    GREY='#555', GREEN='#15803d', PUR='#7c3aed';
function n1(v){ return Number(v).toFixed(1); }
function arrow(x1,y1,x2,y2,col,w){
  var dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
  if(L < 1e-9) return '';
  var ux=dx/L, uy=dy/L, hl=Math.min(11,L*0.45), hw=Math.min(4.5,L*0.18);
  var bx=x2-ux*hl, by=y2-uy*hl, px=-uy, py=ux;
  return '<line x1="'+n1(x1)+'" y1="'+n1(y1)+'" x2="'+n1(bx)+'" y2="'+n1(by)+'" stroke="'+col+'" stroke-width="'+(w||2)+'"/>'
       + '<polygon points="'+n1(x2)+','+n1(y2)+' '+n1(bx+px*hw)+','+n1(by+py*hw)+' '+n1(bx-px*hw)+','+n1(by-py*hw)+'" fill="'+col+'"/>';
}
function dimH(xa,xb,y,txt,col){
  col = col || GREY;
  return '<line x1="'+n1(xa)+'" y1="'+n1(y-5)+'" x2="'+n1(xa)+'" y2="'+n1(y+5)+'" stroke="'+col+'" stroke-width="1"/>'
       + '<line x1="'+n1(xb)+'" y1="'+n1(y-5)+'" x2="'+n1(xb)+'" y2="'+n1(y+5)+'" stroke="'+col+'" stroke-width="1"/>'
       + '<line x1="'+n1(xa)+'" y1="'+n1(y)+'" x2="'+n1(xb)+'" y2="'+n1(y)+'" stroke="'+col+'" stroke-width="1"/>'
       + '<text x="'+n1((xa+xb)/2)+'" y="'+n1(y-7)+'" font-size="11.5" fill="#333" text-anchor="middle">'+txt+'</text>';
}

/* ═══════════════ FIGURE 1 — the joint, plan + elevation ═══════════════ */
function figJoint(S){
  var p = S.p, W = 680, H = 312;
  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="680" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  var i, xL = 96, xR = 596, xm = (xL+xR)/2, ov = 110;   /* ov = half the lap length */
  /* Rivet pitch is set from the lap length so the rivets are always spaced
     clear of one another, whatever n is — at the old spacing six 22 mm rivets
     drew as a solid band and the count could not be read off the figure. */
  var pitch = 2*ov/(p.n+1), rr = Math.min(7, pitch*0.32);

  /* ── plan view ── */
  var yT = 46, ht = 74;
  s += '<rect x="'+n1(xL)+'" y="'+n1(yT+14)+'" width="'+n1(xm-xL+ov)+'" height="'+n1(ht-28)+'" fill="#dfeaf6" stroke="'+NAVY+'" stroke-width="1.5"/>';
  s += '<rect x="'+n1(xm-ov)+'" y="'+n1(yT)+'" width="'+n1(xR-xm+ov)+'" height="'+n1(ht)+'" fill="#eef4fb" stroke="'+NAVY+'" stroke-width="1.5"/>';
  s += '<rect x="'+n1(xm-ov)+'" y="'+n1(yT+14)+'" width="'+n1(2*ov)+'" height="'+n1(ht-28)+'" fill="none" stroke="'+GREY+'" stroke-width="1" stroke-dasharray="5,4"/>';
  for(i=0;i<p.n;i++){
    var cxr = xm - ov + pitch*(i+1);
    s += '<circle cx="'+n1(cxr)+'" cy="'+n1(yT+ht/2)+'" r="'+n1(rr)+'" fill="#fff" stroke="'+NAVY+'" stroke-width="1.4"/>';
  }
  s += '<line x1="'+n1(xm-ov-14)+'" y1="'+n1(yT+ht/2)+'" x2="'+n1(xm+ov+14)+'" y2="'+n1(yT+ht/2)+'" stroke="#999" stroke-width="0.9" stroke-dasharray="9,3,2,3"/>';
  s += arrow(xL-6, yT+ht/2, xL-52, yT+ht/2, RED, 2.4);
  s += arrow(xR+6, yT+ht/2, xR+52, yT+ht/2, RED, 2.4);
  s += '<text x="'+n1(xL-54)+'" y="'+n1(yT+ht/2-9)+'" font-size="13" fill="'+RED+'" text-anchor="start" font-weight="bold">F</text>';
  s += '<text x="'+n1(xR+54)+'" y="'+n1(yT+ht/2-9)+'" font-size="13" fill="'+RED+'" text-anchor="end" font-weight="bold">F</text>';
  s += '<text x="'+n1(xm)+'" y="'+n1(yT-12)+'" font-size="12" fill="'+NAVY+'" text-anchor="middle">'+p.n+' rivets, &#216;'+nf(p.d,0)+' mm</text>';
  s += '<text x="14" y="'+n1(yT+ht/2+4)+'" font-size="11.5" fill="'+GREY+'" font-style="italic">plan</text>';

  /* ── elevation, showing the single shear plane ── */
  var yE = 206, tp = 15;
  s += '<rect x="'+n1(xL)+'" y="'+n1(yE-tp)+'" width="'+n1(xm-xL+ov)+'" height="'+n1(tp)+'" fill="#dfeaf6" stroke="'+NAVY+'" stroke-width="1.5"/>';
  s += '<rect x="'+n1(xm-ov)+'" y="'+n1(yE)+'" width="'+n1(xR-xm+ov)+'" height="'+n1(tp)+'" fill="#eef4fb" stroke="'+NAVY+'" stroke-width="1.5"/>';
  for(i=0;i<p.n;i++){
    var cxe = xm - ov + pitch*(i+1);
    s += '<rect x="'+n1(cxe-rr*0.85)+'" y="'+n1(yE-tp-5)+'" width="'+n1(rr*1.7)+'" height="'+n1(2*tp+10)+'" fill="#c7d3e4" stroke="'+NAVY+'" stroke-width="1.2"/>';
  }
  s += '<line x1="'+n1(xm-ov-10)+'" y1="'+n1(yE)+'" x2="'+n1(xm+ov+10)+'" y2="'+n1(yE)+'" stroke="'+RED+'" stroke-width="2.2" stroke-dasharray="7,4"/>';
  s += '<text x="'+n1(xm+ov+16)+'" y="'+n1(yE+30)+'" font-size="12" fill="'+RED+'" text-anchor="middle" font-weight="bold">single shear plane</text>';
  s += '<line x1="'+n1(xm+ov+16)+'" y1="'+n1(yE+21)+'" x2="'+n1(xm+ov+16)+'" y2="'+n1(yE+3)+'" stroke="'+RED+'" stroke-width="0.9"/>';
  s += arrow(xL-6, yE-tp/2, xL-52, yE-tp/2, RED, 2.2);
  s += arrow(xR+6, yE+tp/2, xR+52, yE+tp/2, RED, 2.2);

  /* t is a THICKNESS, so it is dimensioned vertically on the edge of the plate */
  var xd = 62;
  s += '<line x1="'+n1(xL)+'" y1="'+n1(yE-tp)+'" x2="'+n1(xd-8)+'" y2="'+n1(yE-tp)+'" stroke="'+GREY+'" stroke-width="0.8"/>';
  s += '<line x1="'+n1(xL)+'" y1="'+n1(yE)+'" x2="'+n1(xd-8)+'" y2="'+n1(yE)+'" stroke="'+GREY+'" stroke-width="0.8"/>';
  s += '<line x1="'+n1(xd)+'" y1="'+n1(yE-tp-9)+'" x2="'+n1(xd)+'" y2="'+n1(yE+9)+'" stroke="'+GREY+'" stroke-width="1"/>';
  s += '<line x1="'+n1(xd-4)+'" y1="'+n1(yE-tp)+'" x2="'+n1(xd+4)+'" y2="'+n1(yE-tp)+'" stroke="'+GREY+'" stroke-width="1"/>';
  s += '<line x1="'+n1(xd-4)+'" y1="'+n1(yE)+'" x2="'+n1(xd+4)+'" y2="'+n1(yE)+'" stroke="'+GREY+'" stroke-width="1"/>';
  /* 1 dp normally, 2 when the thickness needs it (e.g. 6.35 mm from 1/4") so the
     figure agrees with the number used in the working */
  var tdp = (Math.abs(p.t*10 - Math.round(p.t*10)) < 1e-9) ? 1 : 2;
  s += '<text x="'+n1(xd)+'" y="'+n1(yE-tp-15)+'" font-size="11.5" fill="#333" text-anchor="middle">t = '+nf(p.t,tdp)+' mm</text>';
  s += '<text x="'+n1(xd)+'" y="'+n1(yE+24)+'" font-size="11" fill="'+GREY+'" text-anchor="middle">each plate'
     + (p.tDesc ? ' ('+p.tDesc+')' : '')+'</text>';

  s += '<text x="14" y="'+n1(yE+4)+'" font-size="11.5" fill="'+GREY+'" font-style="italic">elev.</text>';
  s += '<text x="14" y="'+n1(H-10)+'" font-size="11.5" fill="'+GREY+'" font-style="italic">Lap joint: the two plates overlap, so each rivet has exactly ONE shear plane.</text>';
  return s + '</svg>';
}

/* ═══════════════ FIGURE 2 — the failure modes ═══════════════ */
function figModes(S){
  var p = S.p, W = 640, H = S.modes.length*104 + 34;
  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="640" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  var i, x0 = 190, tp = 13;
  for(i=0;i<S.modes.length;i++){
    var m = S.modes[i], y = 52 + i*104, col = m.gov ? RED : '#9aa3b2';
    s += '<text x="14" y="'+n1(y-16)+'" font-size="13" fill="'+(m.gov?RED:NAVY)+'" font-weight="bold">'+(i+1)+'. '+m.name+'</text>';
    s += '<text x="14" y="'+n1(y+2)+'" font-size="12" fill="'+(m.gov?RED:GREY)+'">'+nf(m.F/1000,1)+' kN'+(m.gov?'  &#8592; governs':'')+'</text>';
    if(m.key==='shear'){
      s += '<rect x="'+n1(x0)+'" y="'+n1(y-24)+'" width="150" height="'+n1(tp)+'" fill="#dfeaf6" stroke="'+NAVY+'" stroke-width="1.3"/>';
      s += '<rect x="'+n1(x0+90)+'" y="'+n1(y-11)+'" width="150" height="'+n1(tp)+'" fill="#eef4fb" stroke="'+NAVY+'" stroke-width="1.3"/>';
      s += '<rect x="'+n1(x0+126)+'" y="'+n1(y-29)+'" width="12" height="'+n1(2*tp+10)+'" fill="#c7d3e4" stroke="'+NAVY+'" stroke-width="1.2"/>';
      s += '<line x1="'+n1(x0+108)+'" y1="'+n1(y-11)+'" x2="'+n1(x0+156)+'" y2="'+n1(y-11)+'" stroke="'+col+'" stroke-width="2.6"/>';
      s += arrow(x0+120, y-30, x0+64, y-30, col, 2);
      s += arrow(x0+144, y+8, x0+200, y+8, col, 2);
      /* plain glyphs, not $...$ — KaTeX auto-render does not typeset inside SVG */
      s += '<text x="'+n1(x0+250)+'" y="'+n1(y-4)+'" font-size="11.5" fill="'+GREY+'">cut across &#960;d&#178;/4</text>';
    } else if(m.key==='bearing'){
      s += '<rect x="'+n1(x0)+'" y="'+n1(y-24)+'" width="240" height="'+n1(2*tp)+'" fill="#dfeaf6" stroke="'+NAVY+'" stroke-width="1.3"/>';
      s += '<ellipse cx="'+n1(x0+120)+'" cy="'+n1(y-24+tp)+'" rx="15" ry="'+n1(tp*0.92)+'" fill="#fff" stroke="'+NAVY+'" stroke-width="1.3"/>';
      s += '<path d="M '+n1(x0+120)+','+n1(y-24+tp-tp*0.92)+' A 15,'+n1(tp*0.92)+' 0 0,1 '+n1(x0+120)+','+n1(y-24+tp+tp*0.92)
         + '" fill="none" stroke="'+col+'" stroke-width="3.4"/>';
      s += arrow(x0+96, y-24+tp, x0+128, y-24+tp, col, 2.2);
      s += '<text x="'+n1(x0+250)+'" y="'+n1(y-4)+'" font-size="11.5" fill="'+GREY+'">crushes hole edge over d &#215; t</text>';
    } else {
      s += '<rect x="'+n1(x0)+'" y="'+n1(y-30)+'" width="240" height="46" fill="#dfeaf6" stroke="'+NAVY+'" stroke-width="1.3"/>';
      var k, np = Math.min(p.nRow, 6);
      for(k=0;k<np;k++)
        s += '<circle cx="'+n1(x0+30+k*(180/(np-1||1)))+'" cy="'+n1(y-7)+'" r="6" fill="#fff" stroke="'+NAVY+'" stroke-width="1.2"/>';
      s += '<line x1="'+n1(x0+18)+'" y1="'+n1(y-7)+'" x2="'+n1(x0+222)+'" y2="'+n1(y-7)+'" stroke="'+col+'" stroke-width="2.6" stroke-dasharray="6,4"/>';
      s += arrow(x0-4, y-7, x0-44, y-7, col, 2);
      s += arrow(x0+244, y-7, x0+284, y-7, col, 2);
      s += '<text x="'+n1(x0+250)+'" y="'+n1(y+30)+'" font-size="11.5" fill="'+GREY+'">tears across the net width</text>';
    }
  }
  return s + '</svg>';
}

/* ═══════════════ FIGURE 3 — capacity comparison bars ═══════════════ */
function figBars(S){
  var W = 600, H = S.modes.length*46 + 62, x0 = 200, xw = 330;
  var top = 0, i;
  for(i=0;i<S.modes.length;i++) top = Math.max(top, S.modes[i].F);
  top *= 1.10;
  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  for(i=0;i<S.modes.length;i++){
    var m = S.modes[i], y = 30 + i*46;
    s += '<text x="'+n1(x0-12)+'" y="'+n1(y+19)+'" font-size="12.5" fill="'+(m.gov?RED:NAVY)+'" text-anchor="end" font-weight="'+(m.gov?'bold':'normal')+'">'+m.name+'</text>';
    s += '<rect x="'+n1(x0)+'" y="'+n1(y+4)+'" width="'+n1(xw*m.F/top)+'" height="22" fill="'+(m.gov?RED:BLUE)+'" fill-opacity="'+(m.gov?0.72:0.38)+'" stroke="'+(m.gov?RED:BLUE)+'" stroke-width="1.2"/>';
    s += '<text x="'+n1(x0+xw*m.F/top+9)+'" y="'+n1(y+20)+'" font-size="12.5" fill="'+(m.gov?RED:NAVY)+'" text-anchor="start" font-weight="bold">'+nf(m.F/1000,1)+' kN</text>';
  }
  var yl = 30 + S.modes.length*46;
  s += '<line x1="'+n1(x0 + xw*S.Fsafe/top)+'" y1="22" x2="'+n1(x0 + xw*S.Fsafe/top)+'" y2="'+n1(yl+2)+'" stroke="'+RED+'" stroke-width="1.4" stroke-dasharray="5,3"/>';
  s += '<text x="'+n1(x0 + xw*S.Fsafe/top)+'" y="'+n1(yl+22)+'" font-size="12.5" fill="'+RED+'" text-anchor="middle" font-weight="bold">safe load = '+nf(S.Fsafe/1000,1)+' kN</text>';
  return s + '</svg>';
}

/* ═══════════════ FIGURE 4 — the net section ═══════════════ */
function figNet(S){
  var p = S.p, sc = 480/p.L, PAD = 62;
  var W = p.L*sc + 2*PAD, H = 234;
  var X = function(m){ return PAD + m*sc; };
  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="'+n1(Math.min(660,W))+'" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  var yT = 56, ht = 62, i;
  /* the gross strip */
  s += '<rect x="'+n1(X(0))+'" y="'+n1(yT)+'" width="'+n1(p.L*sc)+'" height="'+n1(ht)+'" fill="#dfeaf6" stroke="'+NAVY+'" stroke-width="1.5"/>';
  /* the holes, drawn as the material that is NOT there */
  var pitch = p.L/p.nRow;
  for(i=0;i<p.nRow;i++){
    var cx = (i+0.5)*pitch;
    s += '<rect x="'+n1(X(cx-p.dh/2))+'" y="'+n1(yT)+'" width="'+n1(p.dh*sc)+'" height="'+n1(ht)+'" fill="#fee2e2" stroke="'+RED+'" stroke-width="1.1"/>';
    s += '<circle cx="'+n1(X(cx))+'" cy="'+n1(yT+ht/2)+'" r="'+n1(Math.max(3,p.dh/2*sc))+'" fill="#fff" stroke="'+RED+'" stroke-width="1.3"/>';
  }
  s += '<line x1="'+n1(X(0))+'" y1="'+n1(yT+ht/2)+'" x2="'+n1(X(p.L))+'" y2="'+n1(yT+ht/2)+'" stroke="'+RED+'" stroke-width="1.6" stroke-dasharray="7,4"/>';
  s += dimH(X(0), X(p.L), yT-16, 'L = '+nf(p.L,0)+' mm');
  s += '<text x="'+n1(X(p.L/2))+'" y="'+n1(yT+ht+20)+'" font-size="11.5" fill="'+RED+'" text-anchor="middle">'+p.nRow+' holes &#215; &#216;'+nf(p.dh,1)+' mm removed = '+nf(p.nRow*p.dh,0)+' mm</text>';

  /* gross vs net comparison bars */
  var yB = 168, hb = 20;
  s += '<rect x="'+n1(X(0))+'" y="'+n1(yB)+'" width="'+n1(p.L*sc)+'" height="'+n1(hb)+'" fill="#e5e9f0" stroke="#aab4c8" stroke-width="1"/>';
  s += '<rect x="'+n1(X(0))+'" y="'+n1(yB)+'" width="'+n1((p.L-p.nRow*p.dh)*sc)+'" height="'+n1(hb)+'" fill="'+GREEN+'" fill-opacity="0.42" stroke="'+GREEN+'" stroke-width="1.3"/>';
  s += '<text x="'+n1(X(0)-10)+'" y="'+n1(yB+15)+'" font-size="12" fill="'+NAVY+'" text-anchor="end">width</text>';
  s += '<text x="'+n1(X((p.L-p.nRow*p.dh)/2))+'" y="'+n1(yB+15)+'" font-size="12" fill="#14532d" text-anchor="middle" font-weight="bold">net '+nf(p.L-p.nRow*p.dh,0)+' mm</text>';
  s += '<text x="'+n1(X(p.L))+'" y="'+n1(yB+38)+'" font-size="11.5" fill="'+GREY+'" text-anchor="end">gross '+nf(p.L,0)+' mm</text>';
  s += '<text x="10" y="'+n1(H-8)+'" font-size="11.5" fill="'+GREY+'" font-style="italic">Tension is checked on the NET width, at the hole line.</text>';
  return s + '</svg>';
}

/* ═══════════════ page builder ═══════════════ */
function stepBlock(n,title,hint,body){
  return '<div class="step"><details'+(n===1?' open':'')+'>'
       + '<summary><span class="step-num">'+n+'</span><span class="step-title">'+title+'</span>'
       + '<span class="try-hint">'+hint+'</span></summary>'
       + '<div class="step-body">'+body+'</div></details></div>';
}

function build(p){
  var S = solve(p), i, m, h = '';
  var CIRCLED = ['&#9312;','&#9313;','&#9314;','&#9315;','&#9316;','&#9317;'];
  var get = function(k){ for(var j=0;j<S.modes.length;j++) if(S.modes[j].key===k) return S.modes[j]; return null; };
  var sh = get('shear'), br = get('bearing'), te = get('tension');
  var Fgross = p.L*p.t*p.st;
  var eff = S.Fsafe/Fgross;

  h += '<h3>Problem Statement</h3>'
    +  '<p>Determine the safe <strong>tensile, shear and bearing</strong> loads for a <strong>'+nf(p.L,0)+' mm section</strong> of a '
    +  '<strong>single-riveted lap joint</strong> made from '+p.tDesc+' plates using <strong>'+p.n+' rivets of '+nf(p.d,0)
    +  ' mm diameter</strong>. Assume the holes are <strong>'+nf(p.dh-p.d,1)+' mm larger in diameter than the rivets</strong>. '
    +  'The design limits for tensile, shear and bearing stress may be taken as <strong>'+nf(p.st,0)+', '+nf(p.tau,0)+' and '+nf(p.sb,0)
    +  ' MPa</strong> respectively.</p>';

  h += '<div class="diagram-wrap"><figure>'+figJoint(S)
    +  '<figcaption>The joint in plan and elevation. The two plates overlap, so each rivet is cut by exactly <strong>one</strong> '
    +  'shear plane.</figcaption></figure></div>';

  if(p.book)
    h += '<div class="callout given"><p><strong>Given answer:</strong> '+p.book+'</p></div>';
  else
    h += '<div class="callout given"><p><strong>Note:</strong> this is a modified problem — the answers below are computed, '
      +  'not taken from the textbook.</p></div>';

  h += '<div class="callout info"><p><strong>Strategy:</strong> this is T7.5 with the third failure mode switched back on. Evaluate all '
    +  'three capacities independently, then take the smallest. The wording "determine the tensile, shear and bearing loads" is asking '
    +  'for all three <em>and</em> the conclusion that follows from comparing them.</p></div>';

  h += '<h3>Solution</h3>';

  /* step 1 — the two data conversions that trip people */
  var b1 = '<p>Two pieces of data need converting before any formula is used.</p>'
    + '<p><strong>Plate thickness.</strong> '+p.tDesc+' in millimetres:</p>'
    + '<div class="math-block">$$t = '+p.tConv+' = '+nf(p.t,3)+'\\ \\text{mm}$$</div>'
    + '<p><strong>Hole diameter.</strong> The hole is '+nf(p.dh-p.d,1)+' mm larger than the rivet, to let the rivet be placed:</p>'
    + '<div class="math-block">$$d_h = d + '+nf(p.dh-p.d,1)+' = '+nf(p.d,0)+' + '+nf(p.dh-p.d,1)+' = '+nf(p.dh,1)+'\\ \\text{mm}$$</div>'
    + '<div class="callout warn"><p><strong>The two diameters do different jobs — do not mix them.</strong> '
    + 'The <strong>rivet</strong> diameter $d = '+nf(p.d,0)+'$ mm is what gets sheared and what bears on the hole. '
    + 'The <strong>hole</strong> diameter $d_h = '+nf(p.dh,1)+'$ mm is what is missing from the plate, so it is what you subtract for the '
    + 'net section. Using $d_h$ in the shear check would inflate that capacity by '
    + nf(100*(p.dh*p.dh/(p.d*p.d)-1),0)+'% and make the joint look stronger than it is.</p></div>';
  h += stepBlock(1,'Convert the plate thickness and hole diameter','which diameter goes where?',b1);

  /* step 2 — shear */
  var b2 = '<p>Each of the '+p.n+' rivets is cut on one plane of area $\\frac{\\pi}{4}d^2$:</p>'
    + '<div class="math-block">$$A_s = \\frac{\\pi}{4}d^2 = \\frac{\\pi}{4}('+nf(p.d,0)+')^2 = '+nf(S.As,2)+'\\ \\text{mm}^2$$'
    + '$$F_{\\text{shear}} = n\\,A_s\\,\\tau = '+p.n+' \\times '+nf(S.As,2)+' \\times '+nf(p.tau,0)+' = '+nf(sh.F,0)+'\\ \\text{N} = '+nf(sh.F/1000,1)+'\\ \\text{kN}$$</div>'
    + '<div class="callout answer"><p>$F_{\\text{shear}} = '+nf(sh.F/1000,1)+'$ kN</p></div>';
  h += stepBlock(2,'Shear load','one shear plane per rivet',b2);

  /* step 3 — bearing */
  var b3 = '<p>Bearing acts on the projected rectangle $d \\times t$ at each rivet:</p>'
    + '<div class="math-block">$$F_{\\text{bearing}} = n\\,d\\,t\\,\\sigma_b = '+p.n+' \\times '+nf(p.d,0)+' \\times '+nf(p.t,3)+' \\times '+nf(p.sb,0)+' = '+nf(br.F,0)+'\\ \\text{N} = '+nf(br.F/1000,1)+'\\ \\text{kN}$$</div>'
    + '<div class="callout answer"><p>$F_{\\text{bearing}} = '+nf(br.F/1000,1)+'$ kN</p></div>'
    + '<div class="callout note"><p><strong>Rivet diameter here, not hole diameter.</strong> It is the rivet shank that presses on the '
    + 'plate, so the projected width is $d = '+nf(p.d,0)+'$ mm. This is the one place where the distinction feels arbitrary — the shank '
    + 'sits inside a '+nf(p.dh,1)+' mm hole — but the contact is shank-on-plate and the convention is to use the rivet.</p></div>';
  h += stepBlock(3,'Bearing load','projected area, rivet diameter',b3);

  /* step 4 — tension */
  var b4 = '<p>The plate tears across the line of holes, where the least material remains. Over the '+nf(p.L,0)+' mm section there are '
    + p.nRow+' holes in that line:</p>'
    + '<div class="math-block">$$w_{\\text{net}} = L - n_{\\text{row}}d_h = '+nf(p.L,0)+' - '+p.nRow+' \\times '+nf(p.dh,1)+' = '+nf(te.wnet,0)+'\\ \\text{mm}$$'
    + '$$F_{\\text{tension}} = w_{\\text{net}}\\,t\\,\\sigma_t = '+nf(te.wnet,0)+' \\times '+nf(p.t,3)+' \\times '+nf(p.st,0)+' = '+nf(te.F,0)+'\\ \\text{N} = '+nf(te.F/1000,1)+'\\ \\text{kN}$$</div>'
    + '<div class="diagram-wrap"><figure>'+figNet(S)
    + '<figcaption>The net section. The holes remove '+nf(p.nRow*p.dh,0)+' mm of the '+nf(p.L,0)+' mm width — '
    + nf(100*p.nRow*p.dh/p.L,0)+'% of it — leaving '+nf(te.wnet,0)+' mm to carry the tension.</figcaption></figure></div>'
    + '<div class="callout answer"><p>$F_{\\text{tension}} = '+nf(te.F/1000,1)+'$ kN</p></div>'
    + '<div class="callout warn"><p><strong>Net section, not gross.</strong> Using the full '+nf(p.L,0)+' mm width gives $'
    + nf(Fgross/1000,1)+'$ kN — '+nf(100*(Fgross/te.F-1),0)+'% too high. The plate is only as strong as its weakest cross-section, and '
    + 'that is at the hole line.</p></div>';
  h += stepBlock(4,'Tensile load on the net section','which width carries the tension?',b4);

  /* step 5 — compare */
  var rows5 = '';
  for(i=0;i<S.modes.length;i++){ m = S.modes[i];
    rows5 += '<tr'+(m.gov?' class="total"':'')+'><td>'+m.name+'</td><td>$'+m.expr+'$</td><td>'+nf(m.F/1000,1)+'</td><td>'
          +  (m.gov?'<strong>&#8592; governs</strong>':'')+'</td></tr>'; }
  var b5 = '<table class="sum"><tr><th>Failure mode</th><th>Expression</th><th>$F$ (kN)</th><th></th></tr>'+rows5+'</table>'
    + '<div class="diagram-wrap"><figure>'+figBars(S)
    + '<figcaption>The three capacities side by side. The joint can only carry the shortest bar.</figcaption></figure></div>'
    + '<div class="diagram-wrap"><figure>'+figModes(S)
    + '<figcaption>What each mode physically looks like; the governing one is in red.</figcaption></figure></div>'
    + '<div class="math-block">$$F_{\\text{safe}} = \\min\\left('+S.modes.map(function(q){ return nf(q.F/1000,1); }).join(',\\ ')+'\\right) = '+nf(S.Fsafe/1000,1)+'\\ \\text{kN}$$</div>'
    + '<div class="callout answer"><p>$F_{\\text{safe}} = '+nf(S.Fsafe/1000,1)+'$ kN &nbsp; ('+S.gov.name.toLowerCase()+' governs)</p></div>'
    + '<div class="callout note"><p><strong>Joint efficiency.</strong> An unpunched '+nf(p.L,0)+' mm strip of this plate would carry $'
    + nf(Fgross/1000,1)+'$ kN in tension. The joint carries $'+nf(S.Fsafe/1000,1)+'$ kN, an efficiency of only '
    + '$'+nf(100*eff,0)+'\\%$. That is the real cost of the connection, and it is why joints — not members — are usually what limits a '
    + 'riveted structure. Note also that the efficiency here is set by <em>shear</em>, so it could be improved by more or larger rivets '
    + 'without touching the plate at all.</p></div>'
    + '<div class="callout note"><p><strong>A well-proportioned joint balances the modes.</strong> Here shear capacity is only '
    + nf(100*sh.F/te.F,0)+'% of the tensile capacity — the rivets are the weak link by a wide margin, so most of the plate material is '
    + 'wasted. A designer would add rivets until the three numbers came close together, since that is the point at which no single '
    + 'element is being carried by the others.</p></div>';
  h += stepBlock(5,'Compare the three modes and take the minimum','name the governing mode',b5);

  /* step 6 — summary */
  var rows6 = '';
  for(i=0;i<S.modes.length;i++){ m = S.modes[i];
    rows6 += '<tr'+(m.gov?' class="total"':'')+'><td>'+m.name+'</td><td>'+nf(m.F/1000,1)+'</td><td>'+nf(m.F/S.Fsafe,2)+'</td></tr>'; }
  var b6 = '<table class="sum"><tr><th>Input</th><th>Symbol</th><th>Value</th></tr>'
    + '<tr><td>Section considered</td><td>$L$</td><td>'+nf(p.L,0)+' mm</td></tr>'
    + '<tr><td>Plate thickness</td><td>$t$</td><td>'+nf(p.t,3)+' mm ('+p.tDesc+')</td></tr>'
    + '<tr><td>Rivets / holes</td><td>$n$, $d$, $d_h$</td><td>'+p.n+', '+nf(p.d,0)+' mm, '+nf(p.dh,1)+' mm</td></tr>'
    + '<tr><td>Allowable stresses</td><td>$\\sigma_t,\\ \\tau,\\ \\sigma_b$</td><td>'+nf(p.st,0)+', '+nf(p.tau,0)+', '+nf(p.sb,0)+' MPa</td></tr>'
    + '<tr><td>Net width</td><td>$w_{\\text{net}}$</td><td>'+nf(te.wnet,0)+' mm</td></tr>'
    + '</table>'
    + '<table class="sum"><tr><th>Failure mode</th><th>Capacity (kN)</th><th>Ratio to governing</th></tr>'+rows6+'</table>'
    + '<div class="callout answer"><p>$F_{\\text{safe}} = '+nf(S.Fsafe/1000,1)+'$ kN, limited by '+S.gov.name.toLowerCase()
    + ' &nbsp;·&nbsp; joint efficiency '+nf(100*eff,0)+'%</p></div>';
  h += stepBlock(6,'Summary','all three loads together',b6);

  /* common mistakes */
  var mis = [];
  mis.push('<strong>Swapping the rivet and hole diameters.</strong> Shear and bearing use $d = '+nf(p.d,0)+'$ mm; the net section '
    + 'subtracts $d_h = '+nf(p.dh,1)+'$ mm. Getting this backwards changes the answer in both directions at once.');
  mis.push('<strong>Using the gross width for tension.</strong> $'+nf(p.L,0)+' \\times '+nf(p.t,3)+' \\times '+nf(p.st,0)+'$ gives $'
    + nf(Fgross/1000,1)+'$ kN, ignoring '+nf(100*p.nRow*p.dh/p.L,0)+'% of the width that has been drilled away.');
  mis.push('<strong>Leaving the plate thickness in inches.</strong> '+p.tDesc+' is '+nf(p.t,3)+' mm. Every capacity here is linear in '
    + '$t$, so an unconverted thickness is not a small error.');
  mis.push('<strong>Assuming double shear.</strong> A lap joint gives one shear plane per rivet, so $F_{\\text{shear}} = '
    + nf(sh.F/1000,1)+'$ kN, not '+nf(2*sh.F/1000,1)+' kN.');
  mis.push('<strong>Reporting three numbers and stopping.</strong> The question asks for all three loads, but the useful answer is the '
    + 'minimum and the reason: $'+nf(S.Fsafe/1000,1)+'$ kN, '+S.gov.name.toLowerCase()+'-critical.');
  h += '<div class="callout warn"><p><strong>Common mistakes:</strong></p>'
     + mis.map(function(m2,k){ return '<p style="margin-top:6px">'+CIRCLED[k]+' '+m2+'</p>'; }).join('') + '</div>';

  return h;
}

/* ─────────────────── problem definitions ─────────────────── */
var VARIANTS = [
  { btn:"Original (T7.6)",
    desc:"The tutorial sheet problem as printed: a 600 mm section of single-riveted lap joint in quarter-inch plate, six 16 mm rivets in holes 1.5 mm oversize, limits of 75, 60 and 131 MPa.",
    L:600, n:6, nRow:6, d:16, dh:17.5, t:6.35, tDesc:'&#188;&#8243;', tConv:'\\tfrac{1}{4} \\times 25.4',
    st:75, tau:60, sb:131, shearPlanes:1, checkTension:true,
    book:"$F = 72.4$ kN" },

  { btn:"Variant 1 — twelve rivets",
    desc:"The same 600 mm section and plate, but twelve 16 mm rivets instead of six. Shear and bearing capacity double while the net section shrinks - so all three modes move at once, and the governing mode changes.",
    L:600, n:12, nRow:12, d:16, dh:17.5, t:6.35, tDesc:'&#188;&#8243;', tConv:'\\tfrac{1}{4} \\times 25.4',
    st:75, tau:60, sb:131, shearPlanes:1, checkTension:true,
    book:null },

  { btn:"Variant 2 — 24 mm rivets",
    desc:"Six larger rivets (24 mm, in 25.5 mm holes) in the same plate. Shear capacity rises with the square of the diameter while the net section falls linearly - a direct illustration of why bigger rivets are not always better.",
    L:600, n:6, nRow:6, d:24, dh:25.5, t:6.35, tDesc:'&#188;&#8243;', tConv:'\\tfrac{1}{4} \\times 25.4',
    st:75, tau:60, sb:131, shearPlanes:1, checkTension:true,
    book:null }
];

/* ─────────────────── wiring ─────────────────── */
function render(i){
  var v = VARIANTS[i];
  document.getElementById('doc').innerHTML = build(v);
  document.getElementById('swDesc').textContent = v.desc;
  var btns = document.querySelectorAll('#swBtns button');
  for(var j=0;j<btns.length;j++) btns[j].setAttribute('aria-pressed', j===i ? 'true' : 'false');
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('doc'), {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}
function init(){
  var box = document.getElementById('swBtns');
  VARIANTS.forEach(function(v,i){
    var b = document.createElement('button');
    b.textContent = v.btn;
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){ render(i); };
    box.appendChild(b);
  });
  render(0);
}
window.addEventListener('load', init);
</script>
</body>
