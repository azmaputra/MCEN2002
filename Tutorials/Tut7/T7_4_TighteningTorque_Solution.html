/* ══════════════════════════════════════════════════════════════════════════
   MCEN2002 — PRELOADED BOLT IN TENSION  (T7.4)

   Two short calculations that between them cover the whole life of a bolted
   joint: how hard to do it up, and how much it will then carry.

     PRELOAD      F_i = K_p · A_t · S_p
                  K_p = 0.90 permanent connection, 0.75 re-usable.

     TORQUE       T = K · F_i · d
                  K is the "nut factor", an empirical lumped coefficient
                  covering thread friction, collar friction and the helix
                  angle. It is NOT a coefficient of friction and it is not
                  calculated — it is looked up from the bolt's surface
                  condition (Shigley Table 8-15).

     CAPACITY     W = n_bolts · A_t · S_p / n_safety

   Note the tension between the last two lines, which this page does not
   paper over: the capacity formula treats the bolts as though they were
   slack, while the preload formula has already used up 90% of their proof
   load. See the warning in Step 4 — it is the most instructive part of
   this problem.
   ══════════════════════════════════════════════════════════════════════════ */

  var s = r.toFixed(dp);
  if(s === '-' + (0).toFixed(dp)) s = (0).toFixed(dp);

}

function solve(p){
  var Fp = p.At*p.Sp;            /* proof load of one bolt        */
  var Fi = p.Kp*Fp;              /* recommended preload           */
  var T  = p.K*Fi*p.d/1000;      /* N·m  (d in mm → /1000)        */
  var W  = p.nbolt*Fp/p.nsf;     /* simple proof-strength capacity */
  var margin = p.nbolt*(Fp - Fi);/* what is left above preload     */
  return {p:p, Fp:Fp, Fi:Fi, T:T, W:W, margin:margin};
}

/* ─────────────────── SVG helpers ─────────────────── */
var NAVY='#1a3c6e', RED='#c0392b', BLUE='#1a6fc4', ORANGE='#f97316',
    GREY='#555', GREEN='#15803d', PUR='#7c3aed';
function n1(v){ return Number(v).toFixed(1); }
function arrow(x1,y1,x2,y2,col,w){
  var dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
  if(L < 1e-9) return '';
  var ux=dx/L, uy=dy/L, hl=Math.min(11,L*0.45), hw=Math.min(4.5,L*0.18);
  var bx=x2-ux*hl, by=y2-uy*hl, px=-uy, py=ux;
  return '<line x1="'+n1(x1)+'" y1="'+n1(y1)+'" x2="'+n1(bx)+'" y2="'+n1(by)+'" stroke="'+col+'" stroke-width="'+(w||2)+'"/>'
       + '<polygon points="'+n1(x2)+','+n1(y2)+' '+n1(bx+px*hw)+','+n1(by+py*hw)+' '+n1(bx-px*hw)+','+n1(by-py*hw)+'" fill="'+col+'"/>';
}
function hatchTop(x0,x1,y,n){
  var s = '<line x1="'+n1(x0)+'" y1="'+n1(y)+'" x2="'+n1(x1)+'" y2="'+n1(y)+'" stroke="'+NAVY+'" stroke-width="2"/>', i;
  for(i=0;i<n;i++){ var x = x0 + (x1-x0)*i/(n-1);
    s += '<line x1="'+n1(x)+'" y1="'+n1(y)+'" x2="'+n1(x-9)+'" y2="'+n1(y-9)+'" stroke="'+NAVY+'" stroke-width="1"/>'; }
  return s;
}

/* ═══════════════ FIGURE 1 — the frame, bolted to the ceiling ═══════════════ */
function figFrame(S){
  var p = S.p, W = 470, H = 356, cx = 235;
  var yC = 86, xb = 118, yHub = 258;
  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="470" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  /* ceiling beam */
  s += '<rect x="60" y="'+n1(yC-22)+'" width="350" height="22" fill="#e6ebf3" stroke="'+NAVY+'" stroke-width="1.6"/>';
  s += hatchTop(60, 410, yC-22, 14);
  s += '<text x="14" y="20" font-size="11.5" fill="'+NAVY+'" font-style="italic">steel ceiling beam</text>';

  /* ── the inverted A-frame, drawn FIRST so it sits in the back layer ──
     The legs meet the pads INBOARD of the bolt holes, as in the original
     figure: the hole is out at the end of each pad and the leg joins further
     in. Running the leg into the bolt centre would suggest the load is applied
     on the bolt axis, which is exactly the reading to avoid. */
  var xL = xb - 30, yTop = yC + 6, i;
  s += '<path d="M '+n1(cx-xL)+','+n1(yTop)+' L '+n1(cx)+','+n1(yHub)+' L '+n1(cx+xL)+','+n1(yTop)
     + '" fill="none" stroke="#e07ba8" stroke-width="11" stroke-linejoin="round"/>';
  var fx = 0.52, cyx = yTop + (yHub-yTop)*fx;
  s += '<line x1="'+n1(cx-xL*(1-fx))+'" y1="'+n1(cyx)+'" x2="'+n1(cx+xL*(1-fx))+'" y2="'+n1(cyx)+'" stroke="#e07ba8" stroke-width="9"/>';
  s += '<circle cx="'+n1(cx)+'" cy="'+n1(yHub)+'" r="13" fill="#fff" stroke="#c2618c" stroke-width="7"/>';

  /* ── the mounting pads and bolts, drawn on TOP of the frame ── */
  var bx = [cx-xb, cx+xb];
  for(i=0;i<2;i++){
    var x = bx[i];
    s += '<rect x="'+n1(x-38)+'" y="'+n1(yC)+'" width="76" height="18" fill="#f4c7d8" stroke="'+NAVY+'" stroke-width="1.4"/>';
    s += '<rect x="'+n1(x-5)+'" y="'+n1(yC-22)+'" width="10" height="40" fill="#eef2f7" stroke="'+NAVY+'" stroke-width="1.2"/>';
    s += '<rect x="'+n1(x-11)+'" y="'+n1(yC+18)+'" width="22" height="8" fill="#c7d3e4" stroke="'+NAVY+'" stroke-width="1.2"/>';
    s += arrow(x, yC+64, x, yC+30, RED, 2.2);
    s += '<text x="'+n1(x + (i===0?-16:16))+'" y="'+n1(yC+56)+'" font-size="12" fill="'+RED+'" text-anchor="'+(i===0?'end':'start')
       + '" font-weight="bold">'+nf(S.W/p.nbolt/1000,1)+' kN</text>';
    /* size called out AT each bolt rather than once for the pair — the torque
       in part (a) is what you set the wrench to for each one individually */
    s += '<line x1="'+n1(x)+'" y1="44" x2="'+n1(x)+'" y2="'+n1(yC-24)+'" stroke="'+NAVY+'" stroke-width="0.8"/>';
    s += '<text x="'+n1(x)+'" y="40" font-size="11.5" fill="'+NAVY+'" text-anchor="middle">M'+nf(p.d,0)+' &#215; '+p.pitch+'</text>';
  }

  /* the load */
  s += arrow(cx, yHub+16, cx, yHub+58, RED, 2.8);
  s += '<text x="'+n1(cx+12)+'" y="'+n1(yHub+50)+'" font-size="14" fill="'+RED+'" text-anchor="start" font-weight="bold">W</text>';
  s += '<text x="14" y="'+n1(H-10)+'" font-size="11.5" fill="'+GREY+'" font-style="italic">Both bolts are loaded in direct TENSION — the frame hangs from them.</text>';
  return s + '</svg>';
}

/* ═══════════════ FIGURE 2 — where the preload sits in the bolt's range ═══════════════ */
function figLoadBar(S){
  var p = S.p, W = 560, H = 190, x0 = 130, xw = 350;
  var top = S.Fp*1.12;
  var L = function(F){ return x0 + xw*F/top; };
  var s = '<svg viewBox="0 0 '+n1(W)+' '+n1(H)+'" width="560" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">';
  var y = 56, hgt = 32;
  s += '<rect x="'+n1(x0)+'" y="'+n1(y)+'" width="'+n1(xw)+'" height="'+n1(hgt)+'" fill="#f1f4f9" stroke="#c9d2e2" stroke-width="1"/>';
  s += '<rect x="'+n1(x0)+'" y="'+n1(y)+'" width="'+n1(L(S.Fi)-x0)+'" height="'+n1(hgt)+'" fill="'+BLUE+'" fill-opacity="0.55" stroke="'+BLUE+'" stroke-width="1.2"/>';
  s += '<rect x="'+n1(L(S.Fi))+'" y="'+n1(y)+'" width="'+n1(L(S.Fp)-L(S.Fi))+'" height="'+n1(hgt)+'" fill="'+GREEN+'" fill-opacity="0.45" stroke="'+GREEN+'" stroke-width="1.2"/>';
  s += '<text x="'+n1(x0-10)+'" y="'+n1(y+21)+'" font-size="12.5" fill="'+NAVY+'" text-anchor="end" font-weight="bold">one bolt</text>';
  /* markers */
  s += '<line x1="'+n1(L(S.Fp))+'" y1="'+n1(y-12)+'" x2="'+n1(L(S.Fp))+'" y2="'+n1(y+hgt+10)+'" stroke="'+RED+'" stroke-width="1.6"/>';
  s += '<text x="'+n1(L(S.Fp))+'" y="'+n1(y-17)+'" font-size="12" fill="'+RED+'" text-anchor="middle" font-weight="bold">proof load '+nf(S.Fp/1000,1)+' kN</text>';
  s += '<line x1="'+n1(L(S.Fi))+'" y1="'+n1(y-12)+'" x2="'+n1(L(S.Fi))+'" y2="'+n1(y+hgt+10)+'" stroke="'+BLUE+'" stroke-width="1.6"/>';
  s += '<text x="'+n1(L(S.Fi))+'" y="'+n1(y+hgt+24)+'" font-size="12" fill="'+BLUE+'" text-anchor="middle" font-weight="bold">preload F'
     + '<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> = '+nf(S.Fi/1000,1)+' kN</tspan></text>';
  s += '<text x="'+n1((L(S.Fi)+L(S.Fp))/2)+'" y="'+n1(y+hgt+42)+'" font-size="11.5" fill="'+GREEN+'" text-anchor="middle">margin '+nf((S.Fp-S.Fi)/1000,1)+' kN</text>';
  s += '<text x="'+n1(x0)+'" y="'+n1(H-10)+'" font-size="11.5" fill="'+GREY+'" font-style="italic">The preload already consumes '
     + nf(100*p.Kp,0)+'% of the bolt\'s proof load.</text>';
  return s + '</svg>';
}

/* ═══════════════ page builder ═══════════════ */
function stepBlock(n,title,hint,body){
  return '<div class="step"><details'+(n===1?' open':'')+'>'
       + '<summary><span class="step-num">'+n+'</span><span class="step-title">'+title+'</span>'
       + '<span class="try-hint">'+hint+'</span></summary>'
       + '<div class="step-body">'+body+'</div></details></div>';
}

function build(p){
  var S = solve(p), i, h = '';
  var CIRCLED = ['&#9312;','&#9313;','&#9314;','&#9315;','&#9316;','&#9317;'];

  h += '<h3>Problem Statement</h3>'
    +  '<p>An upside-down steel A-frame is bolted to steel beams on the ceiling of a machine room using <strong>'+p.nbolt
    +  ' ISO grade '+p.cls+' bolts, size M'+nf(p.d,0)+' &#215; '+p.pitch+'</strong>. The frame supports a radial load <strong>W</strong>.</p>'
    +  '<div class="callout info"><p>(a) What tightening torque should be used if the connection is <strong>'+p.jointDesc
    +  '</strong> and the fasteners are <strong>'+p.Kdesc+'</strong>?<br>'
    +  '(b) For a safety factor of '+nf(p.nsf,0)+', calculate the load $W$.</p></div>';

  h += '<div class="diagram-wrap"><figure><img src="'+FIGIMG+'" alt="Upside-down steel A-frame with two drilled mounting pads" '
    +  'style="max-width:min(100%,300px);height:auto"/>'
    +  '<figcaption>The frame as given in the textbook. Note that each pad is drilled out near its end and the leg joins the pad '
    +  '<em>inboard</em> of that hole.'+(p.book ? '' : ' The frame is unchanged in this variant — only the bolt specification differs.')
    +  '</figcaption></figure></div>';

  h += '<div class="diagram-wrap"><figure>'+figFrame(S)
    +  '<figcaption>The same arrangement as a load-path schematic. The frame hangs from the ceiling beams on '+p.nbolt
    +  ' bolts and the load path is straight through them in <strong>tension</strong> — no shear and no eccentricity, which is what '
    +  'makes this a preload problem rather than a bolt-group problem.</figcaption></figure></div>';

  if(p.book)
    h += '<div class="callout given"><p><strong>Given answer:</strong> '+p.book+'</p></div>';
  else
    h += '<div class="callout given"><p><strong>Note:</strong> this is a modified problem — the answers below are computed, '
      +  'not taken from the textbook.</p></div>';

  h += '<div class="callout info"><p><strong>Strategy:</strong> everything follows from the bolt\'s <em>proof load</em> $A_tS_p$. '
    +  'Multiply it by the preload fraction to get $F_i$, then by the nut factor and the diameter to get the torque. Part (b) is a '
    +  'separate, simpler question: how much external load can '+p.nbolt+' such bolts carry at the required safety factor.</p></div>';

  h += '<h3>Solution</h3>';

  /* ── step 1 ── */
  var b1 = '<p>An M'+nf(p.d,0)+' &#215; '+p.pitch+' coarse thread has tensile stress area $A_t = '+nf(p.At,0)+'$ mm², and ISO grade '
    + p.cls+' has a proof strength $S_p = '+nf(p.Sp,0)+'$ MPa. The <strong>proof load</strong> — the axial force the bolt can take with '
    + 'no measurable permanent set — is therefore</p>'
    + '<div class="math-block">$$F_p = A_t S_p = '+nf(p.At,0)+' \\times '+nf(p.Sp,0)+' = '+nf(S.Fp,0)+'\\ \\text{N} = '+nf(S.Fp/1000,1)+'\\ \\text{kN}$$</div>'
    + '<div class="callout note"><p><strong>Reading the grade.</strong> "'+p.cls+'" is not arbitrary: the first number is the minimum '
    + 'tensile strength in hundreds of MPa ($S_{ut} \\approx '+nf(parseFloat(p.cls)*100,0)+'$ MPa), and the two digits multiplied together '
    + 'give the yield strength in the same units ($S_y \\approx '+nf(parseFloat(p.cls.split('.')[0])*parseFloat(p.cls.split('.')[1])*10,0)
    + '$ MPa). You can reconstruct most of the table from the label alone.</p></div>';
  h += stepBlock(1,'Bolt proof load','look up $A_t$ and $S_p$ first',b1);

  /* ── step 2 ── */
  var b2 = '<p>For a <strong>'+p.jointDesc+'</strong> connection the recommended preload is '+nf(100*p.Kp,0)+'% of proof load:</p>'
    + '<div class="math-block">$$F_i = '+nf(p.Kp,2)+'\\,F_p = '+nf(p.Kp,2)+' \\times '+nf(S.Fp,0)+' = '+nf(S.Fi,0)+'\\ \\text{N} = '+nf(S.Fi/1000,1)+'\\ \\text{kN}$$</div>'
    + '<div class="diagram-wrap"><figure>'+figLoadBar(S)
    + '<figcaption>Where the preload sits inside the bolt\'s capacity. Only the green sliver — '+nf((S.Fp-S.Fi)/1000,1)
    + ' kN per bolt — remains below proof once the bolt is done up.</figcaption></figure></div>'
    + '<div class="callout answer"><p>$F_i = '+nf(S.Fi/1000,1)+'$ kN per bolt</p></div>'
    + '<div class="callout note"><p><strong>Permanent vs re-usable.</strong> '+nf(p.Kp,2)+' is the '+p.jointDesc+'-connection figure. '
    + 'The other case gives $F_i = '+nf((p.Kp>0.8?0.75:0.90)*S.Fp/1000,1)+'$ kN and a torque '
    + nf(100*Math.abs((p.Kp>0.8?0.75:0.90)/p.Kp - 1),0)+'% '+(p.Kp>0.8?'lower':'higher')+'. The distinction is real: a joint you intend '
    + 'to open again is preloaded less so the bolt can be reused without having been taken to the edge of yield.</p></div>';
  h += stepBlock(2,'Recommended preload','permanent or re-usable?',b2);

  /* ── step 3 ── */
  var rowsK = '';
  for(i=0;i<p.Kalts.length;i++){
    var a = p.Kalts[i], sel = (Math.abs(a.K - p.K) < 1e-9);
    rowsK += '<tr'+(sel?' class="total"':'')+'><td>'+a.desc+'</td><td>'+nf(a.K,2)+'</td><td>'+nf(a.K*S.Fi*p.d/1000,1)+'</td>'
          +  '<td>'+(sel?'&#10003; used here':'')+'</td></tr>';
  }
  var b3 = '<p>The torque needed to develop a given preload is</p>'
    + '<div class="math-block">$$T = K\\,F_i\\,d$$</div>'
    + '<p>where $K$ is the <strong>nut factor</strong> — an empirically measured lumped coefficient that rolls up thread friction, '
    + 'the friction under the turning face, and the helix angle. It is not a coefficient of friction and it is not derived; it is read '
    + 'from a table against the bolt\'s surface condition.</p>'
    + '<table class="sum"><tr><th>Bolt condition</th><th>$K$</th><th>$T$ (N·m)</th><th></th></tr>'+rowsK+'</table>'
    + '<div class="math-block">$$T = '+nf(p.K,2)+' \\times '+nf(S.Fi,0)+' \\times '+nf(p.d,0)+'\\ \\text{mm} = '+nf(S.T*1000,0)
    + '\\ \\text{N}\\cdot\\text{mm} = '+nf(S.T,0)+'\\ \\text{N}\\cdot\\text{m}$$</div>'
    + '<div class="callout answer"><p>$T = '+nf(S.T,0)+'$ N·m</p></div>'
    + '<div class="callout warn"><p><strong>Watch the units in $T = KF_id$.</strong> With $F_i$ in newtons and $d$ in <em>millimetres</em> '
    + 'the answer is in N·mm. Divide by 1000 for N·m. Forgetting this is the single most common slip in this calculation, and it gives an '
    + 'answer a thousand times too large — a torque of '+nf(S.T*1000,0)+' N·m would need a spanner several metres long.</p></div>';
  if(p.torqueNote)
    b3 += '<div class="callout note"><p><strong>Against the printed answer:</strong> '+p.torqueNote+'</p></div>';
  b3 += '<div class="callout note"><p><strong>How accurate is torque control?</strong> Tightening by torque wrench typically lands the '
    + 'preload within roughly &plusmn;25–30%, because $K$ varies with lubrication, plating, surface finish and even how fast the nut is '
    + 'run down. That scatter is why critical joints are tightened by turn-of-nut, bolt elongation, or direct-tension indicators rather '
    + 'than by torque alone. <em>[This spread is a widely quoted engineering rule of thumb; treat the exact percentage as indicative.]</em></p></div>';
  h += stepBlock(3,'Tightening torque — part (a)','which $K$, and what units?',b3);

  /* ── step 4 ── */
  var b4 = '<p>With '+p.nbolt+' bolts sharing the load in direct tension, and the safety factor applied to the proof load:</p>'
    + '<div class="math-block">$$W = \\frac{n_{\\text{bolts}}\\,A_t S_p}{n} = \\frac{'+p.nbolt+' \\times '+nf(p.At,0)+' \\times '+nf(p.Sp,0)+'}{'+nf(p.nsf,0)+'} = '+nf(S.W,0)+'\\ \\text{N} = '+nf(S.W/1000,1)+'\\ \\text{kN}$$</div>'
    + '<div class="callout answer"><p>$W = '+nf(S.W/1000,1)+'$ kN</p></div>'
    + '<div class="callout warn"><p><strong>This formula and Step 2 do not quite agree — and that is worth understanding.</strong> '
    + 'The capacity above treats each bolt as if it started from zero load. But Step 2 has already preloaded it to '+nf(S.Fi/1000,1)
    + ' kN, leaving only '+nf((S.Fp-S.Fi)/1000,1)+' kN per bolt (i.e. '+nf(S.margin/1000,1)+' kN for the group) below proof. '
    + 'The reconciliation is that in a properly preloaded joint the bolt does <em>not</em> see the full external load: the members are '
    + 'squeezed together, and an external load $P$ raises the bolt force by only $CP$, where the stiffness constant '
    + '$C = k_b/(k_b+k_m)$ is typically 0.2–0.3 for steel joints. So most of $W$ is absorbed by the joint relaxing rather than by the '
    + 'bolt stretching. A full treatment needs $k_b$ and $k_m$, which this problem does not supply — hence the simplified formula. '
    + 'State that assumption when you use it.</p></div>'
    + '<div class="callout note"><p><strong>Why preload a joint at all, then?</strong> Precisely because of that $C$ factor. A slack '
    + 'bolt sees the whole of any fluctuating load; a tight one sees perhaps a quarter of it, so its fatigue stress range collapses. '
    + 'Preload also stops the joint separating and stops the nut backing off. It is the single most important thing about a bolted '
    + 'joint, and it is why part (a) exists at all.</p></div>';
  h += stepBlock(4,'Load capacity $W$ — part (b)','what does the safety factor act on?',b4);

  /* ── step 5 ── */
  var b5 = '<table class="sum"><tr><th>Quantity</th><th>Symbol</th><th>Value</th></tr>'
    + '<tr><td>Tensile stress area, M'+nf(p.d,0)+'</td><td>$A_t$</td><td>'+nf(p.At,0)+' mm²</td></tr>'
    + '<tr><td>Proof strength, grade '+p.cls+'</td><td>$S_p$</td><td>'+nf(p.Sp,0)+' MPa</td></tr>'
    + '<tr><td>Proof load per bolt</td><td>$F_p = A_tS_p$</td><td>'+nf(S.Fp/1000,1)+' kN</td></tr>'
    + '<tr><td>Preload per bolt ('+p.jointDesc+')</td><td>$F_i = '+nf(p.Kp,2)+'F_p$</td><td>'+nf(S.Fi/1000,1)+' kN</td></tr>'
    + '<tr><td>Nut factor ('+p.Kdesc+')</td><td>$K$</td><td>'+nf(p.K,2)+'</td></tr>'
    + '<tr class="total"><td>(a) Tightening torque</td><td>$T = KF_id$</td><td>'+nf(S.T,0)+' N·m</td></tr>'
    + '<tr class="total"><td>(b) Load capacity</td><td>$W$</td><td>'+nf(S.W/1000,1)+' kN</td></tr>'
    + '</table>';
  h += stepBlock(5,'Summary','both answers together',b5);

  /* ── common mistakes ── */
  var mis = [];
  mis.push('<strong>Leaving $d$ in millimetres and reporting N·m.</strong> $T = KF_id$ with $d$ in mm gives N·mm. The answer is '
    + nf(S.T,0)+' N·m, not '+nf(S.T*1000,0)+'.');
  mis.push('<strong>Treating $K$ as a coefficient of friction.</strong> It is a lumped empirical nut factor covering thread friction, '
    + 'collar friction and lead. You look it up against surface condition; you do not compute it from $\\mu$.');
  mis.push('<strong>Using $S_y$ or $S_{ut}$ where $S_p$ belongs.</strong> Preload is specified against <em>proof</em> strength. For '
    + 'grade '+p.cls+', using $S_{ut}$ would inflate the torque by roughly '+nf(100*(parseFloat(p.cls)*100/p.Sp - 1),0)+'%.');
  mis.push('<strong>Forgetting that there are '+p.nbolt+' bolts in part (b) but only one in part (a).</strong> The torque is what you '
    + 'set the wrench to for <em>each</em> bolt; the capacity is the sum over all of them.');
  mis.push('<strong>Quoting the answer without stating the preload and nut-factor assumptions.</strong> Change "'+p.jointDesc
    + '" to the other case, or "'+p.Kdesc+'" to another surface condition, and the torque moves by tens of percent. The number is '
    + 'meaningless without the assumptions attached.');
  h += '<div class="callout warn"><p><strong>Common mistakes:</strong></p>'
     + mis.map(function(m,k){ return '<p style="margin-top:6px">'+CIRCLED[k]+' '+m+'</p>'; }).join('') + '</div>';

  return h;
}

/* ─────────────────── problem definitions ─────────────────── */
/* Nut factors, Shigley Table 8-15 (bolt condition → K). */
var KALTS = [ {desc:'Non-plated, black finish', K:0.30},
              {desc:'Zinc-plated / as received', K:0.20},
              {desc:'Lubricated',                K:0.18},
              {desc:'Cadmium-plated',            K:0.16} ];

var VARIANTS = [
  { btn:"Original (T7.4)",
    desc:"The tutorial sheet problem as printed: two M20 x 2.5 ISO grade 8.8 bolts, permanent connection, lubricated fasteners, safety factor 4.",
    d:20, pitch:'2.5', At:245, cls:'8.8', Sp:600, Kp:0.90, K:0.20, Kdesc:'lubricated',
    jointDesc:'permanent', nbolt:2, nsf:4, Kalts:KALTS,
    book:"(a) $T = 529$ N·m, (b) $W = 73.5$ kN",
    torqueNote:"The printed 529 N·m is reproduced only with $K = 0.20$, which Shigley's table lists against "
             + "<em>zinc-plated / as received</em> — not <em>lubricated</em>, which is $K = 0.18$ and gives $T = 476$ N·m. "
             + "This page uses 0.20 so the numbers match the answer sheet, but the question says lubricated, so 476 N·m is arguably "
             + "the more defensible answer. If you quote 476, say which $K$ you took and why; that will read as understanding rather "
             + "than as an arithmetic slip. <em>Worth confirming against the nut-factor table your unit issues.</em>" },

  { btn:"Variant 1 — re-usable, unlubricated",
    desc:"Same bolts and frame, but the connection is one that will be opened for servicing (0.75 preload factor) and the bolts are supplied with a plain black finish (K = 0.30). Both changes push the torque, and in opposite directions - a good test of whether you are tracking the assumptions rather than the formula.",
    d:20, pitch:'2.5', At:245, cls:'8.8', Sp:600, Kp:0.75, K:0.30, Kdesc:'non-plated, black finish',
    jointDesc:'re-usable', nbolt:2, nsf:4, Kalts:KALTS,
    book:null, torqueNote:null },

  { btn:"Variant 2 — M16 grade 10.9",
    desc:"Smaller bolts of a much stronger grade (Sp = 830 MPa instead of 600). The stress area drops by a third while the proof strength rises by nearly 40 percent, so the two effects nearly cancel - check whether your intuition predicted that before you open the step.",
    d:16, pitch:'2', At:157, cls:'10.9', Sp:830, Kp:0.90, K:0.20, Kdesc:'zinc-plated / as received',
    jointDesc:'permanent', nbolt:2, nsf:4, Kalts:KALTS,
    book:null, torqueNote:null }
];

/* ─────────────────── wiring ─────────────────── */
function render(i){
  var v = VARIANTS[i];
  document.getElementById('doc').innerHTML = build(v);
  document.getElementById('swDesc').textContent = v.desc;
  var btns = document.querySelectorAll('#swBtns button');
  for(var j=0;j<btns.length;j++) btns[j].setAttribute('aria-pressed', j===i ? 'true' : 'false');
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('doc'), {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}
function init(){
  var box = document.getElementById('swBtns');
  VARIANTS.forEach(function(v,i){
    var b = document.createElement('button');
    b.textContent = v.btn;
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){ render(i); };
    box.appendChild(b);
  });
  render(0);
}
window.addEventListener('load', init);
</script>
