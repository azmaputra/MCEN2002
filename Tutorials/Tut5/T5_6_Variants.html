<script>
/* ===========================================================================
   GENERATED FILE - do not edit by hand.
   Source: _engine/impact_engine.js  +  _engine/build.py
   Rebuild with:  python3 _engine/build.py
   =========================================================================== */

/* ══════════════════════════════════════════════════════════════════════════
   MCEN2002 — SHARED IMPACT / ENERGY-METHOD ENGINE
   Single source of truth for the T5.x "impact factor" family:
       T5.2  falling mass on a rod, with and without a series rubber washer
       T5.5  weight dropped on a bar, plus the struck-member mass correction
       T5.6  wooden post — inverse problem, solve for the drop height
       T5.8  diving board — stiffness inferred from a measured deflection

   Edit this file, then run  _engine/build.py  to regenerate the HTML files.
   (The engine is inlined into each generated page, so every page is
    self-contained and can be uploaded to Blackboard on its own.)

   ─── MODEL ────────────────────────────────────────────────────────────────
   Everything reduces to one linear spring struck by a falling weight.

     W    = m g                        weight of the striker            [N]
     k    = A E / L      or   W/dstGiven                                [N/mm]
     keq  = series(k, kExtra)          optional soft element in series  [N/mm]
     dst  = W / keq                    static deflection                [mm]
     eta  = 1/(1 + mMember/(3 m))      energy retained after the plastic
                                       collision with the struck member [-]
     n    = 1 + sqrt(1 + 2 h eta/dst)  impact factor                    [-]

     F = n W,   delta = n dst,   sigma = n W/A

   Inverse mode instead takes a target stress and returns the drop height:
     n = sigma/sst,   h = dst[(n-1)^2 - 1] / (2 eta)

   ─── PARAMETERS (one variant object) ──────────────────────────────────────
     m         striker / person mass                              [kg]
     h         drop height                                        [m]   (forward)
     sigTgt    target impact stress                               [MPa] (inverse)
     shape     'round' | 'square' | null      (null => no stress reported)
     d         diameter                                           [mm]
     b         side of square section                             [mm]
     L         member length                                      [mm]
     E         modulus                                            [MPa = N/mm2]
     kExtra    stiffness of a series element, e.g. a washer       [N/mm]
     dstGiven  measured static deflection (replaces geometry)     [mm]
     rho       density, enables the mass correction from geometry [kg/m3]
     mMember   struck-member mass given directly                  [kg]
     corr      true => apply eta
     mode      'forward' | 'inverse'
   ══════════════════════════════════════════════════════════════════════════ */

var G = 9.81;

/* ─────────────────────────── number formatting ─────────────────────────── */

function sig(x, s) {
  if (x === 0) return '0';
  s = s || 4;
  var a = Math.abs(x), e = Math.floor(Math.log10(a));
  if (a >= 1e6 || a < 1e-3) {
    var mant = x / Math.pow(10, e);
    return trim(mant.toFixed(3)) + ' \\times 10^{' + e + '}';
  }
  var dp = Math.min(6, Math.max(0, s - 1 - e));
  return trim(x.toFixed(dp));
}
function trim(r) {
  if (r.indexOf('.') >= 0) r = r.replace(/0+$/, '').replace(/\.$/, '');
  return r;
}
/* thousands-separated, for prose and tables */
function grp(x, dp) {
  var v = (dp === undefined) ? x.toFixed(0) : x.toFixed(dp);
  var parts = v.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
  return parts.join('.');
}
var fmt = { sig: sig, grp: grp };

/* ─────────────────────────────── solver ────────────────────────────────── */

function solve(p) {
  var S = { p: p };

  S.W = p.m * G;                                   // N

  /* section area */
  if (p.shape === 'round')       S.A = Math.PI * p.d * p.d / 4;
  else if (p.shape === 'square') S.A = p.b * p.b;
  else                           S.A = null;

  /* member stiffness */
  if (p.dstGiven) { S.kMem = S.W / p.dstGiven; S.fromMeasured = true; }
  else            { S.kMem = S.A * p.E / p.L;  S.fromMeasured = false; }

  /* struck-member mass */
  if (p.mMember)   S.mMem = p.mMember;
  else if (p.rho)  S.mMem = p.rho * S.A * p.L * 1e-9;   // mm2 * mm -> m3
  else             S.mMem = null;

  S.eta = (p.corr && S.mMem) ? 1 / (1 + S.mMem / (3 * p.m)) : 1;
  S.hasCorr = !!(p.corr && S.mMem);

  S.sst = S.A ? S.W / S.A : null;                   // MPa

  /* the cases to report: with the series element, and without it */
  S.cases = [];
  if (p.kExtra) {
    S.kEq = 1 / (1 / S.kMem + 1 / p.kExtra);
    S.cases.push(mkCase('(a) with washer', S.kEq, S, p));
    S.cases.push(mkCase('(b) washer removed', S.kMem, S, p));
    S.twoCase = true;
  } else {
    S.kEq = S.kMem;
    S.cases.push(mkCase('', S.kEq, S, p));
    S.twoCase = false;
  }
  S.main = S.cases[0];
  S.dst = S.main.dst;

  return S;
}

function mkCase(name, k, S, p) {
  var c = { name: name, k: k };
  c.dst = S.W / k;                                  // mm
  if (p.mode === 'inverse') {
    c.n = p.sigTgt / S.sst;
    c.h = c.dst * ((c.n - 1) * (c.n - 1) - 1) / (2 * S.eta) / 1000;   // m
    c.sigma = p.sigTgt;
  } else {
    var hmm = p.h * 1000;
    c.n = 1 + Math.sqrt(1 + 2 * hmm * S.eta / c.dst);
    c.h = p.h;
    c.sigma = S.sst ? c.n * S.sst : null;
    /* the same case with the mass correction switched off - part (a) of the
       textbook questions always asks for this "no dissipation" value */
    c.nNo = 1 + Math.sqrt(1 + 2 * hmm / c.dst);
    c.sigmaNo = S.sst ? c.nNo * S.sst : null;
    c.FNo = c.nNo * S.W;
    c.deltaNo = c.nNo * c.dst;
  }
  c.F = c.n * S.W;                                  // N
  c.delta = c.n * c.dst;                            // mm
  c.ratio = 2 * (c.h * 1000) * S.eta / c.dst;
  return c;
}

/* ───────────────────────── small HTML helpers ──────────────────────────── */

function mb(s)            { return '<div class="math-block">$$' + s + '$$</div>'; }
function call(cls, html)  { return '<div class="callout ' + cls + '">' + html + '</div>'; }
function P(html)          { return '<p>' + html + '</p>'; }

var STEPN = 0;
function step(title, summary, body, noHint) {
  STEPN++;
  return '<div class="step">'
    + '<div class="step-heading"><div class="step-num">' + STEPN + '</div>'
    + '<div class="step-title">' + title + '</div>'
    + (noHint ? '' : '<div class="try-hint">Try it first, then reveal \u2193</div>')
    + '</div><details><summary><span class="step-label">Step ' + STEPN + '</span> '
    + summary + '</summary><div class="step-body">' + body + '</div></details></div>';
}

var CIRCLED = ['\u2460', '\u2461', '\u2462', '\u2463', '\u2464'];

/* ═══════════════════════════ DIAGRAMS ═══════════════════════════════════ */
/* Schematic figures. Key dimensions are redrawn in proportion where that is
   meaningful; labels always follow the current variant.                    */

function hatchV(x, y0, y1, col) {   /* vertical hatched face (a wall) */
  var s = '<line x1="' + x + '" y1="' + y0 + '" x2="' + x + '" y2="' + y1 + '" stroke="' + col + '" stroke-width="2.5"/><g stroke="' + col + '" stroke-width="1.2">';
  for (var y = y0 + 10; y < y1; y += 22) s += '<line x1="' + x + '" y1="' + y + '" x2="' + (x - 14) + '" y2="' + (y + 12) + '"/>';
  return s + '</g>';
}
function hatchH(y, x0, x1, col) {   /* horizontal hatched ground */
  var s = '<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke="' + col + '" stroke-width="2.5"/><g stroke="' + col + '" stroke-width="1.2">';
  for (var x = x0 + 10; x < x1; x += 25) s += '<line x1="' + x + '" y1="' + y + '" x2="' + (x - 12) + '" y2="' + (y + 14) + '"/>';
  return s + '</g>';
}
function dimV(x, y0, y1, label, col) {
  col = col || '#555';
  return '<line x1="' + x + '" y1="' + y0 + '" x2="' + x + '" y2="' + y1 + '" stroke="' + col + '" stroke-width="1"/>'
    + '<polygon points="' + x + ',' + y0 + ' ' + (x - 4) + ',' + (y0 + 11) + ' ' + (x + 4) + ',' + (y0 + 11) + '" fill="' + col + '"/>'
    + '<polygon points="' + x + ',' + y1 + ' ' + (x - 4) + ',' + (y1 - 11) + ' ' + (x + 4) + ',' + (y1 - 11) + '" fill="' + col + '"/>'
    + '<text x="' + (x - 8) + '" y="' + ((y0 + y1) / 2) + '" font-size="13" fill="#333" text-anchor="end">' + label + '</text>';
}
function txt(x, y, s, col, size, bold) {
  return '<text x="' + x + '" y="' + y + '" font-size="' + (size || 12) + '" fill="' + (col || '#333') + '"'
    + (bold ? ' font-weight="bold"' : '') + '>' + s + '</text>';
}

var FIGS = {

/* ── T5.2 — rod hanging from a ceiling, collar falls onto a washer ──────── */
rodWasher: function (S) {
  var p = S.p, s = '';
  s += hatchH(40, 200, 380, '#1a3c6e');
  s += '<rect x="283" y="40" width="14" height="330" fill="#7fe3ec" fill-opacity="0.85" stroke="#1a3c6e" stroke-width="1.8"/>';
  s += '<rect x="243" y="105" width="94" height="46" fill="#fde68a" fill-opacity="0.9" stroke="#b45309" stroke-width="2"/>';
  s += txt(345, 126, fmt.sig(p.m, 3) + ' kg', '#7c2d12', 13, true);

  s += '<rect x="252" y="345" width="76" height="12" fill="#e5e7eb" stroke="#1a3c6e" stroke-width="1.6"/>';

  s += '<line x1="290" y1="387" x2="290" y2="398" stroke="#5b21b6" stroke-width="1"/>';
  s += '<line x1="200" y1="175" x2="200" y2="300" stroke="#f97316" stroke-width="2.4"/><polygon points="200,310 194,294 206,294" fill="#f97316"/>';
  s += txt(158, 245, 'falls', '#f97316', 12.5, true);
  s += dimV(90, 40, 357, 'L = ' + fmt.sig(p.L / 1000, 3) + ' m');
  s += '<line x1="84" y1="40" x2="200" y2="40" stroke="#555" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += '<line x1="84" y1="357" x2="252" y2="357" stroke="#555" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += dimV(150, 151, 345, 'h = ' + fmt.sig(p.h, 3) + ' m');
  s += '<line x1="144" y1="151" x2="243" y2="151" stroke="#555" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += '<line x1="144" y1="345" x2="252" y2="345" stroke="#555" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += txt(345, 255, fmt.sig(p.d, 3) + ' mm round bar', '#1a3c6e', 12.5, true);

},

/* ── T5.5 — weight dropped onto a vertical bar on a rigid base ──────────── */
barDrop: function (S) {
  var p = S.p, s = '';
  var barPx = Math.round(Math.max(90, Math.min(210, p.L * 0.55)));      /* scale with L   */
  var gapPx = Math.round(Math.max(26, Math.min(90, p.h * 1000 * 0.42))); /* scale with h  */
  var yTop = 300 - barPx, yW = yTop - gapPx;
  var wPx = 2 * Math.round(Math.max(16, Math.min(40, p.d * 2.2)) / 2);
  s += hatchH(300, 130, 400, '#1a3c6e');
  s += txt(320, 330, 'rigid foundation', '#1a3c6e', 12);
  s += '<rect x="' + (261 - wPx / 2) + '" y="' + yTop + '" width="' + wPx + '" height="' + barPx + '" fill="#7fe3ec" fill-opacity="0.85" stroke="#1a3c6e" stroke-width="2"/>';
  s += '<rect x="222" y="' + (yW - 52) + '" width="78" height="52" fill="#fde68a" fill-opacity="0.9" stroke="#b45309" stroke-width="2"/>';
  s += txt(232, yW - 20, fmt.sig(p.m, 3) + ' kg', '#7c2d12', 13, true);
  s += dimV(180, yW, yTop, 'h = ' + fmt.sig(p.h * 1000, 3) + ' mm');
  s += '<line x1="174" y1="' + yW + '" x2="222" y2="' + yW + '" stroke="#555" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += '<line x1="174" y1="' + yTop + '" x2="' + (261 - wPx / 2) + '" y2="' + yTop + '" stroke="#555" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += dimV(400, yTop, 300, '');
  s += txt(408, (yTop + 300) / 2, 'L = ' + fmt.sig(p.L, 3) + ' mm', '#333', 13);
  s += '<line x1="' + (261 + wPx / 2) + '" y1="' + yTop + '" x2="407" y2="' + yTop + '" stroke="#555" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += txt(118, 250, 'd = ' + fmt.sig(p.d, 3) + ' mm', '#333', 12.5);
  s += '<line x1="' + (261 - wPx / 2) + '" y1="255" x2="200" y2="262" stroke="#555" stroke-width="0.9"/>';
  s += txt(46, 150, 'steel bar', '#1a3c6e', 12, true);
  s += txt(46, 167, 'E = ' + fmt.sig(p.E / 1000, 3) + ' GPa', '#1a3c6e', 12);
  s += txt(46, 184, '\u03c1 = ' + fmt.grp(p.rho) + ' kg/m\u00b3', '#1a3c6e', 12);

},

/* ── T5.6 — square timber post, drop height unknown ─────────────────────── */
post: function (S) {
  var p = S.p, s = '';
  var postPx = Math.round(Math.max(110, Math.min(200, p.L * 0.145)));
  var yTop = 330 - postPx, wPx = 2 * Math.round(Math.max(40, Math.min(80, p.b * 0.6)) / 2);
  s += hatchH(330, 130, 410, '#1a3c6e');
  s += txt(322, 362, 'rigid foundation', '#1a3c6e', 12);
  s += '<rect x="' + (268 - wPx / 2) + '" y="' + yTop + '" width="' + wPx + '" height="' + postPx + '" fill="#d9a066" fill-opacity="0.65" stroke="#7c4a1e" stroke-width="2"/>';
  for (var i = 1; i < 4; i++) {
    var gx = 268 - wPx / 2 + wPx * i / 4;
    s += '<line x1="' + gx + '" y1="' + (yTop + 2) + '" x2="' + gx + '" y2="328" stroke="#7c4a1e" stroke-width="0.7" stroke-opacity="0.5"/>';

  s += '<rect x="222" y="' + (yTop - 100) + '" width="92" height="56" fill="#fde68a" fill-opacity="0.9" stroke="#b45309" stroke-width="2"/>';
  s += txt(232, yTop - 66, fmt.sig(p.m, 3) + ' kg', '#7c2d12', 13, true);
  s += dimV(175, yTop - 44, yTop, 'h = ?', '#dc2626');
  s += '<line x1="169" y1="' + (yTop - 44) + '" x2="222" y2="' + (yTop - 44) + '" stroke="#dc2626" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += '<line x1="169" y1="' + yTop + '" x2="' + (268 - wPx / 2) + '" y2="' + yTop + '" stroke="#dc2626" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += dimV(420, yTop, 330, '');
  s += txt(428, (yTop + 330) / 2, 'L = ' + fmt.sig(p.L / 1000, 3) + ' m', '#333', 13);
  s += '<line x1="' + (268 + wPx / 2) + '" y1="' + yTop + '" x2="427" y2="' + yTop + '" stroke="#555" stroke-width="0.9" stroke-dasharray="3,3"/>';
  s += txt(210, 310, fmt.sig(p.b, 3) + ' \u00d7 ' + fmt.sig(p.b, 3) + ' mm', '#333', 12);
  s += txt(40, 190, 'wooden post', '#7c4a1e', 12.5, true);

  s += txt(40, 234, 'target: \u03c3 = ' + fmt.sig(p.sigTgt, 3) + ' MPa', '#f97316', 12.5, true);
  return '<svg viewBox="0 0 520 400" width="440" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12">' + s + '</svg>';
},

/* ═══════════════════════ DESIGN-THINKING STEPS ═════════════════════════ */
/* Each returns {title, summary, body} or null. Selected by CONFIG.design.
   The point of these is to move students from "what is the stress" to
   "what would I have to change" - a different question every time.        */

var DESIGN = {

/* T5.2 - size the compliance so the rod does not yield ------------------- */
washerSizing: function (S, p, fmt) {
  if (!(p.sigY && S.sst && p.mode !== 'inverse')) return null;
  var b = '';

    var fos = p.fos || 2,
        sAll = p.sigY / fos,
        bare = S.cases[S.cases.length - 1],
        nMax = sAll / S.sst,
        dMin = 2 * (p.h * 1000) * S.eta / ((nMax - 1) * (nMax - 1) - 1),
        kMax = S.W / dMin,
        travel = nMax * dMin;

    b = P('The two answers above are descriptive &mdash; they say what the stress <em>is</em>. A designer has to answer the '
        + 'other question: what stiffness does the system need in order to be <strong>safe</strong>? Take the rod as mild steel, '
        + '$\\sigma_y = ' + fmt.sig(p.sigY, 4) + '$ MPa, and require a factor of safety of ' + fmt.sig(fos, 2) + ':');
    b += mb('\\sigma_{allow} = \\frac{\\sigma_y}{\\text{FoS}} = \\frac{' + fmt.sig(p.sigY, 4) + '}{' + fmt.sig(fos, 2) + '} = ' + fmt.sig(sAll, 4) + '\\ \\text{MPa}');
    b += P('First check the bare rod. With no washer the stress is ' + fmt.sig(bare.sigma, 4) + ' MPa, so its factor of safety is '
         + '$' + fmt.sig(p.sigY, 4) + '/' + fmt.sig(bare.sigma, 4) + ' = ' + fmt.sig(p.sigY / bare.sigma, 3) + '$ &mdash; '
         + (p.sigY / bare.sigma < 1
            ? '<strong>below 1, so the bare rod yields outright.</strong>'
            : (p.sigY / bare.sigma < fos
               ? '<strong>above 1 but short of the target</strong>, so some compliance must be added.'
               : 'already adequate on its own.')));

    b += '<h4>Maximum permissible system stiffness</h4>';
    b += P('Run the impact factor backwards, exactly as in T5.6. The largest impact factor allowed is');
    b += mb('n_{max} = \\frac{\\sigma_{allow}}{\\sigma_{st}} = \\frac{' + fmt.sig(sAll, 4) + '}{' + fmt.sig(S.sst, 4) + '} = ' + fmt.sig(nMax, 4));
    b += P('and the static deflection that produces it follows from $(n-1)^2 = 1 + 2h/\\delta_{st}$:');
    b += mb('\\delta_{st} = \\frac{2h}{(n_{max}-1)^{2} - 1} = ' + fmt.sig(dMin, 4) + '\\ \\text{mm} \\qquad \\Longrightarrow \\qquad '
          + 'k_{eq} \\le \\frac{W}{\\delta_{st}} = ' + fmt.grp(kMax) + '\\ \\text{N/mm}');
    if (p.kExtra && kMax < S.kMem) {
      var kwMax = 1 / (1 / kMax - 1 / S.kMem);
      b += P('The rod itself contributes ' + fmt.grp(S.kMem) + ' N/mm, so the washer must supply the rest of the compliance:');
      b += mb('\\frac{1}{k_{washer}} = \\frac{1}{k_{eq}} - \\frac{1}{k_{rod}} \\qquad \\Longrightarrow \\qquad k_{washer} \\le ' + fmt.grp(kwMax) + '\\ \\text{N/mm}');
      b += call('answer', P('$$k_{washer} \\le ' + fmt.grp(kwMax) + '\\ \\text{N/mm}, \\qquad \\text{travel} = ' + fmt.sig(travel, 3) + '\\ \\text{mm}$$'));
      b += call('info', P('<strong>Now compare with the washer actually specified.</strong> The question gives $k = ' + fmt.sig(p.kExtra, 3)
          + '$ N/mm &mdash; about <strong>' + fmt.grp(kwMax / p.kExtra) + ' times softer</strong> than it needs to be. That is why part (a) '
          + 'predicted ' + fmt.sig(S.cases[0].delta, 4) + ' mm of washer travel, which no real washer can deliver. A washer of '
          + fmt.grp(kwMax) + ' N/mm would need only <strong>' + fmt.sig(travel, 3) + ' mm</strong> of compression &mdash; an entirely '
          + 'buildable component. The specified washer is not just conservative; it is unbuildable.'));
    } else {
      b += call('answer', P('$$k_{eq} \\le ' + fmt.grp(kMax) + '\\ \\text{N/mm}$$'));
      b += call('note', P('Here $k_{eq}$ may exceed the rod\u2019s own ' + fmt.grp(S.kMem) + ' N/mm, so the bare rod already meets the '
          + 'target and no added compliance is required.'));
    }
    b += call('note', P('<strong>The design lesson.</strong> For large drops $n \\approx \\sqrt{2h/\\delta_{st}}$, so $\\sigma \\propto \\sqrt{k}$: '
        + 'halving the system stiffness buys only a ' + fmt.sig((1 - 1 / Math.sqrt(2)) * 100, 2) + '\u202f% reduction in stress. Stiffness is a '
        + 'weak lever taken alone &mdash; but because the rod and washer are in <em>series</em>, the softest element sets $k_{eq}$ almost '
        + 'single-handedly. One cheap compliant part buys what no amount of extra steel can.'));
    b += call('warn', P('<strong>What this calculation does not cover.</strong> Sizing the washer on stiffness alone ignores whether the '
        + 'washer itself survives, whether it bottoms out, and whether rubber behaves linearly over that stroke (it does not &mdash; '
        + 'elastomers stiffen markedly at high compression). Treat $k_{washer}$ here as an upper bound to start from, not a specification.'));

  return { title: 'Size the washer so the rod does not yield',
           summary: 'Work backwards from an allowable stress to a maximum stiffness',
           body: b };
},

/* T5.5 - when does the struck member's mass stop being negligible? ------- */
strikerMass: function (S, p, fmt) {
  if (!S.hasCorr) return null;
  var tol   = p.tol || 0.05,                       /* 5 % stress change     */
      etaT  = (1 - tol) * (1 - tol),               /* since sigma ~ sqrt(eta) */
      mStar = S.mMem / (3 * (1 / etaT - 1)),
      pcNow = 100 * (1 - Math.sqrt(S.eta));

  var b = P('Part (b) answered <em>whether</em> the correction matters for this particular bar. The more useful question is '
        + '<em>when</em> it starts to matter &mdash; that is the version you can carry into a design office.');
  b += P('For a large drop $n \\gg 1$, so $\\sigma \\propto \\sqrt{\\eta}$. Requiring the correction to shift the stress by no '
        + 'more than ' + fmt.sig(100 * tol, 2) + '\u202f% means');
  b += mb('\\sqrt{\\eta} \\ge ' + fmt.sig(1 - tol, 3) + ' \\qquad \\Longrightarrow \\qquad \\eta \\ge ' + fmt.sig(etaT, 4));
  b += P('Substituting $\\eta = 1/(1 + m_{mem}/3m)$ and solving for the striker mass:');
  b += mb('m \\;\\ge\\; \\frac{m_{mem}}{3\\left(\\dfrac{1}{' + fmt.sig(etaT, 4) + '} - 1\\right)} = \\frac{' + fmt.sig(S.mMem, 4) + '}{'
        + fmt.sig(3 * (1 / etaT - 1), 4) + '} = ' + fmt.sig(mStar, 3) + '\\ \\text{kg}');
  b += call('answer', P('$$m \\ge ' + fmt.sig(mStar, 3) + '\\ \\text{kg} \\quad\\text{i.e.}\\quad m \\gtrsim 3\\,m_{mem}$$'));
  b += P('The bar here weighs ' + fmt.sig(S.mMem, 3) + ' kg and the striker ' + fmt.sig(p.m, 3) + ' kg, which is '
        + fmt.sig(p.m / S.mMem, 3) + ' times heavier &mdash; comfortably past the threshold, which is why the correction came out at only '
        + fmt.sig(pcNow, 2) + '\u202f%.');
  b += call('info', P('<strong>The rule worth remembering:</strong> the $3(1/\\eta_{tol} - 1)$ denominator works out to almost exactly '
        + '$1/3$ for a 5\u202f% tolerance, so the threshold is simply <strong>$m \\approx 3\\,m_{mem}$</strong>. Strike a member with '
        + 'something less than about three times its own mass and you are losing a noticeable fraction of your energy to the collision '
        + 'itself, before any of it reaches the workpiece.'));
  b += call('note', P('<strong>Where you meet this in practice.</strong> It is why forging hammers use a heavy tup against a much heavier '
        + 'anvil, why a light hammer is useless on a large casting, and why drop-test rigs specify a striker mass rather than just an '
        + 'impact energy. At the extreme $m = m_{mem}/3$ the factor falls to $\\eta = 0.5$: half the energy is destroyed in the collision '
        + 'and never reaches the part you are testing.'));
  b += call('warn', P('<strong>Note the direction of the inequality.</strong> A <em>heavier</em> striker makes the correction '
        + '<em>less</em> important, not more. Students often assume the opposite because a heavier striker sounds more severe &mdash; it is '
        + 'more severe, but the energy it delivers is transmitted more efficiently, so the massless-member idealisation becomes better, not worse.'));
  return { title: 'When does the bar\u2019s own mass actually matter?',
           summary: 'Find the striker mass below which the correction exceeds ' + fmt.sig(100 * tol, 2) + '\u202f%',
           body: b };
},

/* T5.6 - energy capacity is a property of material and volume ------------ */
volumeCapacity: function (S, p, fmt) {
  if (!(p.mode === 'inverse' && S.A)) return null;
  var c = S.main,
      V = S.A * p.L,                                  /* mm^3              */
      U = p.sigTgt * p.sigTgt * V / (2 * p.E),        /* N.mm              */
      hApprox = U / S.W;                              /* mm, before -delta */

  var b = P('The algebra above gives the right number but hides the physics. Rewrite it in terms of energy and a much more '
        + 'general result appears.');
  b += P('A uniformly stressed member stores $\\sigma^{2}/2E$ joules in every cubic metre of material. Multiply by the volume '
        + '$V = AL$ and you have the total energy the post can absorb before reaching the target stress:');
  b += mb('U = \\frac{\\sigma^{2}}{2E}\\,V = \\frac{(' + fmt.sig(p.sigTgt, 4) + ')^{2}}{2 \\times ' + fmt.grp(p.E) + '} \\times '
        + fmt.grp(V) + ' = ' + fmt.grp(U) + '\\ \\text{N}\\cdot\\text{mm} = ' + fmt.sig(U / 1000, 4) + '\\ \\text{J}');
  b += P('The falling weight supplies $W(h + \\delta)$ &mdash; it descends the drop height <em>plus</em> the deflection. Equating:');
  b += mb('W(h + \\delta) = \\frac{\\sigma^{2}V}{2E} \\qquad \\Longrightarrow \\qquad h = \\frac{\\sigma^{2}V}{2EW} - \\delta');
  b += mb('h = ' + fmt.sig(hApprox, 5) + ' - ' + fmt.sig(c.delta, 4) + ' = ' + fmt.sig(c.h * 1000, 4) + '\\ \\text{mm}');
  b += call('answer', P('$$h = \\frac{\\sigma^{2}V}{2EW} - \\delta = ' + fmt.sig(c.h * 1000, 4) + '\\ \\text{mm} \\quad \\checkmark$$'));
  b += P('Exactly the answer obtained from the impact factor &mdash; but now every symbol means something.');
  b += call('info', P('<strong>The design statement:</strong> the safe drop height is <strong>proportional to the volume of the post</strong>. '
        + 'Not to its area, not to its length &mdash; to $AL$. Double the cross-section or double the length and you double the drop the post '
        + 'can survive. Area and length are worth exactly the same per cubic metre of timber.'));
  b += '<h4>Two ways to double the safe drop height</h4>';
  b += '<table><thead><tr><th>Option</th><th>Change</th><th>Volume</th><th>Safe drop</th></tr></thead><tbody>'
     + '<tr><td class="left">As specified</td><td>' + fmt.sig(p.b, 3) + ' mm square, ' + fmt.sig(p.L, 4) + ' mm long</td><td>'
     + fmt.sig(V / 1e6, 4) + ' \u00d7 10\u2076 mm\u00b3</td><td>' + fmt.sig(c.h * 1000, 4) + ' mm</td></tr>'
     + '<tr><td class="left">Longer post</td><td>length \u00d7 2</td><td>\u00d7 2</td><td>\u2248 ' + fmt.sig(2 * c.h * 1000, 4) + ' mm</td></tr>'
     + '<tr><td class="left">Bigger section</td><td>side \u00d7 ' + fmt.sig(Math.sqrt(2), 3) + '</td><td>\u00d7 2</td><td>\u2248 '
     + fmt.sig(2 * c.h * 1000, 4) + ' mm</td></tr>'
     + '<tr class="total"><td class="left">Verdict</td><td colspan="2">identical &mdash; only $V$ appears</td><td>equal</td></tr>'
     + '</tbody></table>';
  b += call('note', P('<strong>Contrast with static design.</strong> Under a static load $\\sigma = P/A$: length is irrelevant and only area '
        + 'buys strength. Under impact the two are interchangeable, because what you are really buying is <em>material in which to store '
        + 'energy</em>. This is the same result as T5.4, arrived at from the opposite direction.'));
  b += call('warn', P('<strong>Where the volume argument fails.</strong> It assumes every element of the post is equally stressed. A step, '
        + 'a notch, a bolt hole or a knot in the timber concentrates the stress and shrinks the volume that genuinely participates &mdash; '
        + 'so the member fails well below what its volume suggests. It also assumes the post stays elastic and does not buckle: at '
        + fmt.sig(p.L / p.b, 3) + ' slenderness ratio that is reasonable here, but a longer post would need a buckling check before you '
        + 'could claim the extra length as extra capacity.'));
  return { title: 'What actually sets the safe drop height',
           summary: 'Rewrite the answer as an energy balance and read off the design rule',
           body: b };
}

};

/* ═══════════════════════════ DOCUMENT BUILDER ══════════════════════════ */

function build(CONFIG, p) {
  var S = solve(p);
  STEPN = 0;
  var U = CONFIG.units || {};
  var h = '';

  /* ── problem statement ───────────────────────────────────────────────── */
  h += '<h3>Problem Statement</h3>';
  h += P(CONFIG.question(S, fmt));
  /* attribution belongs to the textbook problem only - the variants are ours */
  if (CONFIG.source && p.book) h += '<p style="font-size:13.5px;color:#666">' + CONFIG.source + '</p>';
  h += call('given', P('<strong>' + (p.book ? 'Given answer:' : 'Computed answer:') + '</strong> &nbsp; ' + CONFIG.answer(S, fmt)));

  /* ── diagram ─────────────────────────────────────────────────────────── */
  h += '<div class="diagram-wrap"><figure>' + FIGS[CONFIG.fig](S)
     + '<figcaption>' + CONFIG.caption(S, fmt) + '</figcaption></figure></div>';

  h += '<h3>Solution</h3>';

  /* ── STEP: stiffness and static reference values ─────────────────────── */
  var b = '';
  if (S.fromMeasured) {
    b += P('No dimensions, no $I$, no $E$ &mdash; and none are needed. The measured static deflection <em>is</em> '
         + 'the stiffness at the point of interest:');
    b += mb('W = mg = ' + fmt.sig(p.m, 4) + ' \\times 9.81 = ' + fmt.sig(S.W, 4) + '\\ \\text{N}');
    b += mb('k = \\frac{W}{\\delta_{st}} = \\frac{' + fmt.sig(S.W, 4) + '}{' + fmt.sig(p.dstGiven, 4) + '} = '
          + fmt.sig(S.kMem, 4) + '\\ \\text{N/mm}');
    b += call('info', P('<strong>Why a measured $k$ beats a calculated one:</strong> for a cantilever you could use '
         + '$k = 3EI/L^3$, but a measured load&ndash;deflection pair captures the real boundary conditions, the joint '
         + 'and the lay-up &mdash; everything the formula idealises away.'));
  } else {
    b += P('Work in N and mm throughout, so $E = ' + fmt.grp(p.E) + '$ N/mm\u00b2 and $W = mg = '
         + fmt.sig(p.m, 4) + ' \\times 9.81 = ' + fmt.sig(S.W, 4) + '$ N.');
    if (p.shape === 'round') b += mb('A = \\frac{\\pi d^{2}}{4} = \\frac{\\pi (' + fmt.sig(p.d, 4) + ')^{2}}{4} = ' + fmt.sig(S.A, 4) + '\\ \\text{mm}^{2}');
    else                     b += mb('A = ' + fmt.sig(p.b, 4) + ' \\times ' + fmt.sig(p.b, 4) + ' = ' + fmt.grp(S.A) + '\\ \\text{mm}^{2}');
    b += mb('k = \\frac{AE}{L} = \\frac{' + fmt.sig(S.A, 4) + ' \\times ' + fmt.grp(p.E) + '}{' + fmt.sig(p.L, 4) + '} = ' + fmt.sig(S.kMem, 4) + '\\ \\text{N/mm}');
    b += mb('\\sigma_{st} = \\frac{W}{A} = ' + fmt.sig(S.sst, 4) + '\\ \\text{N/mm}^{2} \\qquad '
          + '\\delta_{st} = \\frac{WL}{AE} = ' + fmt.sig(S.W / S.kMem, 4) + '\\ \\text{mm}');
    b += call('note', P('<strong>Read the numbers before continuing.</strong> The member\u2019s own static deflection is '
         + fmt.sig(S.W / S.kMem, 3) + ' mm. Everything that follows is driven by how that compares with the drop height.'));
  }
  h += step('Stiffness and static reference values',
            'Find $A$, $k$ and the static deflection $\\delta_{st}$', b);

  /* ── STEP: series combination (only if a soft element is present) ────── */
  if (p.kExtra) {
    var r = S.kMem / p.kExtra;
    b = P('The falling collar pushes on the washer, the washer pushes on the rod. The <em>same force</em> passes '
        + 'through both and their deflections <em>add</em> &mdash; that is the definition of springs in <strong>series</strong>:');
    b += mb('\\frac{1}{k_{eq}} = \\frac{1}{k_{rod}} + \\frac{1}{k_{washer}}');
    b += call('info', P('<strong>Look at the two stiffnesses before doing any algebra:</strong> the rod is '
        + fmt.grp(S.kMem) + ' N/mm and the washer ' + fmt.sig(p.kExtra, 3) + ' N/mm &mdash; a ratio of <strong>'
        + fmt.grp(r) + ' : 1</strong>. In series the <em>softest</em> element dominates, so $k_{eq}$ will land just '
        + 'under ' + fmt.sig(p.kExtra, 3) + '. The rubber washer governs the whole system.'));
    b += mb('k_{eq} = \\left(\\frac{1}{' + fmt.grp(S.kMem) + '} + \\frac{1}{' + fmt.sig(p.kExtra, 4) + '}\\right)^{-1} = '
        + fmt.sig(S.kEq, 5) + '\\ \\text{N/mm}');
    b += P('Only ' + fmt.sig(100 * (p.kExtra - S.kEq) / p.kExtra, 2) + '\u202f% below the washer\u2019s own stiffness, as predicted.');
    h += step('Combine the washer and the rod in series', 'Add the flexibilities, not the stiffnesses', b);
  }

  /* ── STEP: derivation of the impact factor ───────────────────────────── */
  b = P('A weight $W$ released from height $h$ above the point of contact keeps falling through the extra '
      + 'deflection $\\delta$ as the system yields. Over the whole descent:');
  b += mb('\\underbrace{W(h + \\delta)}_{\\text{potential energy released}} = \\underbrace{\\tfrac{1}{2}k\\delta^{2}}_{\\text{strain energy stored}}');
  b += P('With $\\delta_{st} = W/k$ this rearranges to a quadratic in $\\delta$, whose positive root is:');
  b += mb('n = 1 + \\sqrt{1 + \\frac{2h}{\\delta_{st}}}, \\qquad \\delta = n\\,\\delta_{st}, \\qquad F = n\\,W, \\qquad \\sigma = n\\,\\sigma_{st}');
  b += call('note', P('<strong>Where the &ldquo;+1&rdquo; comes from:</strong> it accounts for the weight continuing to do work '
      + 'as the system deflects. Drop it and you assume the mass arrives with kinetic energy but then weighs nothing. '
      + 'At $h = 0$ the correct result is $n = 2$ &mdash; a suddenly applied load produces twice the static stress.'));
  h += step('Set up the impact factor', 'Derive $n = 1 + \\sqrt{1 + 2h/\\delta_{st}}$ from energy conservation', b);

  /* ── STEP: mass correction ───────────────────────────────────────────── */
  if (S.hasCorr) {
    var ratio = S.mMem / p.m;
    b = P('The step above treated the struck member as massless. In reality the impact must also set '
        + (S.fromMeasured ? 'the board' : 'the bar') + '\u2019s own mass in motion, and that sudden sharing of momentum is a '
        + '<strong>perfectly inelastic collision</strong> &mdash; which always destroys kinetic energy.');
    if (!S.fromMeasured)
      b += mb('m_{mem} = \\rho A L = ' + fmt.grp(p.rho) + ' \\times ' + fmt.sig(S.A * 1e-6, 4) + ' \\times ' + fmt.sig(p.L / 1000, 3) + ' = ' + fmt.sig(S.mMem, 4) + '\\ \\text{kg}');
    b += P('Only the struck end moves at full speed; the supported end does not move at all. Integrating the kinetic '
        + 'energy over a linear velocity distribution gives an <strong>effective mass of one third</strong>:');
    b += mb('\\eta = \\frac{1}{1 + \\dfrac{m_{mem}}{3m}} = \\frac{1}{1 + \\dfrac{' + fmt.sig(S.mMem, 4) + '}{3 \\times ' + fmt.sig(p.m, 4) + '}} = ' + fmt.sig(S.eta, 4));
    b += call('answer', P('$$\\eta = ' + fmt.sig(S.eta, 3) + '\\quad\\Rightarrow\\quad ' + fmt.sig(100 * (1 - S.eta), 2) + '\\%\\ \\text{of the landing energy is lost}$$'));
    var m0 = S.main, chg = 100 * (1 - (m0.sigma !== null ? m0.sigma / m0.sigmaNo : m0.F / m0.FNo));
    b += P('Applying $\\eta$ to the energy delivered by the fall &mdash; i.e. to the $2h$ term inside the root &mdash; changes the answer from');
    b += mb((m0.sigma !== null
        ? '\\sigma = ' + fmt.sig(m0.sigmaNo, 4) + '\\ \\text{MPa} \\quad \\longrightarrow \\quad ' + fmt.sig(m0.sigma, 4) + '\\ \\text{MPa}'
        : 'F_e = ' + fmt.sig(m0.FNo, 5) + '\\ \\text{N} \\quad \\longrightarrow \\quad ' + fmt.sig(m0.F, 5) + '\\ \\text{N}')
      + ' \\qquad (' + fmt.sig(chg, 2) + '\\%)');
    var verdict = Math.abs(chg) < 2
      ? 'The mass ratio $m_{mem}/m = ' + fmt.sig(ratio, 3) + '$ is small, so the change is only ' + fmt.sig(chg, 2)
        + ' % &mdash; far inside the scatter of the inputs ($E$ for steel varies by ±3 % on its own). It always '
        + '<em>reduces</em> the prediction, so ignoring it is <strong>conservative</strong>. <strong>Not worthwhile</strong> here, '
        + 'but it would be if $m_{mem}$ approached $3m$.'
      : 'The mass ratio $m_{mem}/m = ' + fmt.sig(ratio, 3) + '$ shifts the answer by ' + fmt.sig(chg, 2) + ' %. That is large '
        + 'enough to matter &mdash; unlike the light-member cases, this correction cannot be waved away.';
    b += call('note', P('<strong>Is it worth it?</strong> ' + verdict));
    h += step('Correct for the struck member\u2019s own mass', 'Compute $\\eta = 1/(1 + m_{mem}/3m)$', b);
  }

  /* ── STEP: the numbers ───────────────────────────────────────────────── */
  b = '';
  if (p.mode === 'inverse') {
    var c0 = S.main;
    b += P('This problem runs the chain <em>backwards</em>: the target stress is given, the drop height is unknown. '
         + 'Start by turning the target stress into the impact factor it demands:');
    b += mb('n = \\frac{\\sigma}{\\sigma_{st}} = \\frac{' + fmt.sig(p.sigTgt, 4) + '}{' + fmt.sig(S.sst, 4) + '} = ' + fmt.sig(c0.n, 4));
    b += P('Then isolate $h$. Move the 1 across <em>before</em> squaring:');
    b += mb('(n-1)^{2} = 1 + \\frac{2h}{\\delta_{st}} \\qquad \\Longrightarrow \\qquad h = \\frac{\\delta_{st}}{2}\\left[(n-1)^{2} - 1\\right]');
    b += mb('h = \\frac{' + fmt.sig(c0.dst, 4) + '}{2}\\left[(' + fmt.sig(c0.n - 1, 4) + ')^{2} - 1\\right] = ' + fmt.sig(c0.h * 1000, 4) + '\\ \\text{mm}');
    b += call('answer', P('$$h = ' + fmt.sig(c0.h * 1000, 4) + '\\ \\text{mm} \\approx ' + fmt.sig(c0.h, 2) + '\\ \\text{m}$$'));
    b += call('note', P('<strong>Forward check</strong> &mdash; always verify an inverse answer by running it forwards: '
         + '$n = 1 + \\sqrt{1 + 2(' + fmt.sig(c0.h * 1000, 4) + ')/' + fmt.sig(c0.dst, 4) + '} = ' + fmt.sig(c0.n, 4)
         + '$, so $\\sigma = ' + fmt.sig(c0.n, 4) + ' \\times ' + fmt.sig(S.sst, 4) + ' = ' + fmt.sig(c0.n * S.sst, 4) + '$ MPa \u2713'));
    b += mb('F = nW = ' + fmt.grp(c0.F) + '\\ \\text{N} \\qquad \\delta = n\\delta_{st} = ' + fmt.sig(c0.delta, 4) + '\\ \\text{mm}');
  } else {
    for (var i = 0; i < S.cases.length; i++) {
      var c = S.cases[i];
      if (S.twoCase) b += '<h4>' + c.name + '</h4>';
      b += mb('\\delta_{st} = \\frac{W}{k} = \\frac{' + fmt.sig(S.W, 4) + '}{' + fmt.sig(c.k, 4) + '} = ' + fmt.sig(c.dst, 4) + '\\ \\text{mm}');
      if (S.hasCorr) {
        b += P('First <strong>with no dissipation</strong> ($\\eta = 1$), which is what part (a) of these questions asks for:');
        b += mb('n = 1 + \\sqrt{1 + \\frac{2 \\times ' + fmt.sig(p.h * 1000, 4) + '}{' + fmt.sig(c.dst, 4) + '}} = ' + fmt.sig(c.nNo, 5));
        b += call('answer', P('$$' + (c.sigmaNo
              ? '\\sigma_a = ' + fmt.sig(c.sigmaNo, 4) + '\\ \\text{MPa}'
              : 'F_e = ' + fmt.sig(c.FNo, 5) + '\\ \\text{N} \\qquad \\delta = ' + fmt.sig(c.deltaNo / 1000, 3) + '\\ \\text{m}') + '$$'));
        b += P('Now <strong>with the mass correction</strong> $\\eta = ' + fmt.sig(S.eta, 4) + '$ from the previous step:');
      }
      b += mb('n = 1 + \\sqrt{1 + \\frac{2 \\times ' + fmt.sig(p.h * 1000, 4) + (S.hasCorr ? ' \\times ' + fmt.sig(S.eta, 4) : '')
            + '}{' + fmt.sig(c.dst, 4) + '}} = 1 + \\sqrt{' + fmt.sig(1 + c.ratio, 5) + '} = ' + fmt.sig(c.n, 5));
      b += mb('F = nW = ' + fmt.sig(c.n, 5) + ' \\times ' + fmt.sig(S.W, 4) + ' = ' + fmt.grp(c.F) + '\\ \\text{N}'
            + (c.sigma ? ' \\qquad \\sigma = \\frac{F}{A} = ' + fmt.sig(c.sigma, 4) + '\\ \\text{MPa}' : ''));
      b += call('answer', P('$$' + (c.sigma
            ? '\\sigma' + (S.twoCase ? '_{' + (i === 0 ? 'a' : 'b') + '}' : (S.hasCorr ? '_b' : '')) + ' = ' + fmt.sig(c.sigma, 4) + '\\ \\text{MPa}'
            : 'F_e = ' + fmt.sig(c.F, 5) + '\\ \\text{N} \\qquad \\delta = ' + fmt.sig(c.delta / 1000, 3) + '\\ \\text{m}') + '$$'));
      if (!c.sigma) b += call('note', P('<strong>Cross-check:</strong> $k\\delta = ' + fmt.sig(c.k, 4) + ' \\times '
            + fmt.sig(c.delta, 4) + ' = ' + fmt.sig(c.k * c.delta, 5) + '$ N \u2713 &mdash; two independent routes to the same force. '
            + 'The diver feels a peak acceleration of $(n-1)g = ' + fmt.sig(c.n - 1, 3) + 'g$.'));
    }
    if (S.twoCase) {
      var rr = S.cases[1].sigma / S.cases[0].sigma;
      b += call('info', P('<strong>The two cases differ by a factor of ' + fmt.sig(rr, 3) + '</strong> from adding a single soft '
          + 'component that carries no extra load and adds almost no mass. For large drops $n \\approx \\sqrt{2h/\\delta_{st}}$, '
          + 'so $\\sigma \\propto \\sqrt{k}$: softening the system by a factor of ' + fmt.grp(S.kMem / p.kExtra) + ' cuts the stress by '
          + '$\\sqrt{' + fmt.grp(S.kMem / p.kExtra) + '} = ' + fmt.sig(Math.sqrt(S.kMem / p.kExtra), 3) + '$. '
          + '<strong>To survive an impact, get softer, not stronger.</strong>'));
    }
  }
  h += step(p.mode === 'inverse' ? 'Solve for the drop height' : 'Impact factor, force and stress',
            p.mode === 'inverse' ? 'Run the impact factor backwards' : 'Substitute and interpret the result', b);

  /* ── STEP: design thinking (selected by CONFIG.design) ───────────────── */
  if (CONFIG.design && DESIGN[CONFIG.design]) {
    var dz = DESIGN[CONFIG.design](S, p, fmt);
    if (dz) h += step(dz.title, dz.summary, dz.body);
  }

  /* ── STEP: summary table ─────────────────────────────────────────────── */
  b = '<table><thead><tr><th>Quantity</th><th>Symbol</th><th>Expression</th>'
    + (S.twoCase ? '<th>' + S.cases[0].name + '</th><th>' + S.cases[1].name + '</th>' : '<th>Value</th>') + '</tr></thead><tbody>';
  function row(q, sym, ex, v1, v2, tot) {
    return '<tr' + (tot ? ' class="total"' : '') + '><td class="left">' + q + '</td><td>' + sym + '</td><td>' + ex + '</td>'
      + '<td>' + v1 + '</td>' + (S.twoCase ? '<td>' + (v2 === undefined ? v1 : v2) + '</td>' : '') + '</tr>';
  }
  if (S.A) b += row('Section area', '$A$', p.shape === 'round' ? '$\\pi d^2/4$' : '$b^2$', fmt.sig(S.A, 4) + ' mm\u00b2');
  b += row('Striker weight', '$W$', '$mg$', fmt.sig(S.W, 4) + ' N');
  b += row('Member stiffness', '$k$', S.fromMeasured ? '$W/\\delta_{st}$' : '$AE/L$', fmt.sig(S.kMem, 4) + ' N/mm');
  if (p.kExtra) b += row('System stiffness', '$k_{eq}$', 'series', fmt.sig(S.cases[0].k, 5) + ' N/mm', fmt.sig(S.cases[1].k, 5) + ' N/mm');
  if (S.sst) b += row('Static stress', '$\\sigma_{st}$', '$W/A$', fmt.sig(S.sst, 4) + ' MPa');
  b += row('Static deflection', '$\\delta_{st}$', '$W/k_{eq}$', fmt.sig(S.cases[0].dst, 4) + ' mm', S.twoCase ? fmt.sig(S.cases[1].dst, 4) + ' mm' : undefined);
  if (S.hasCorr) {
    b += row('Impact factor, no dissipation', '$n_a$', '$1+\\sqrt{1+2h/\\delta_{st}}$', fmt.sig(S.main.nNo, 5));
    b += row(S.sst ? 'Stress, no dissipation (a)' : 'Force, no dissipation (a)', S.sst ? '$\\sigma_a$' : '$F_a$',
             '$n_a\\sigma_{st}$', S.sst ? fmt.sig(S.main.sigmaNo, 4) + ' MPa' : fmt.sig(S.main.FNo, 5) + ' N', undefined, true);
    b += row('Struck-member mass', '$m_{mem}$', S.fromMeasured ? 'given' : '$\\rho A L$', fmt.sig(S.mMem, 4) + ' kg');
    b += row('Correction factor (b)', '$\\eta$', '$1/(1+m_{mem}/3m)$', fmt.sig(S.eta, 4), undefined, true);
  }
  b += row('Impact factor', '$n$', '$1+\\sqrt{1+2h\\eta/\\delta_{st}}$', fmt.sig(S.cases[0].n, 5), S.twoCase ? fmt.sig(S.cases[1].n, 5) : undefined);
  b += row('Dynamic deflection', '$\\delta$', '$n\\delta_{st}$', fmt.sig(S.cases[0].delta, 4) + ' mm', S.twoCase ? fmt.sig(S.cases[1].delta, 4) + ' mm' : undefined);
  b += row('Impact force', '$F$', '$nW$', fmt.grp(S.cases[0].F) + ' N', S.twoCase ? fmt.grp(S.cases[1].F) + ' N' : undefined, !S.sst);
  if (S.sst && p.mode !== 'inverse')
    b += row('Maximum stress', '$\\sigma$', '$n\\sigma_{st}$', fmt.sig(S.cases[0].sigma, 4) + ' MPa', S.twoCase ? fmt.sig(S.cases[1].sigma, 4) + ' MPa' : undefined, true);
  if (p.mode === 'inverse')
    b += row('Required drop height', '$h$', '$\\tfrac{\\delta_{st}}{2}[(n-1)^2-1]$', fmt.sig(S.main.h * 1000, 4) + ' mm', undefined, true);
  b += '</tbody></table>';
  if (CONFIG.extraTable) b += CONFIG.extraTable(S, fmt);
  h += step('Summary Table', 'Review the complete set of values for this variant', b, true);

  /* ── adaptive common mistakes ────────────────────────────────────────── */
  var mis = [];
  if (p.kExtra) mis.push('<strong>Adding the stiffnesses instead of the flexibilities.</strong> $k_{rod} + k_{washer}$ treats them as '
      + 'parallel and makes the washer look useless. Series elements share the force and add deflections &mdash; it is the '
      + '<em>reciprocals</em> that add.');
  if (p.kExtra) mis.push('<strong>Using the washer\u2019s stiffness to compute the stress.</strong> The washer sets the compliance and '
      + 'hence $n$, but the stress is in the rod, so it is always $F/A_{rod}$.');
  if (p.mode === 'inverse') mis.push('<strong>Using $n$ instead of $(n-1)$ when squaring.</strong> $h = \\tfrac{\\delta_{st}}{2}(n^2-1)$ '
      + 'gives ' + fmt.sig(S.main.dst * (S.main.n * S.main.n - 1) / 2, 4) + ' mm instead of ' + fmt.sig(S.main.h * 1000, 4)
      + ' mm &mdash; close enough to look right, which makes it dangerous.');
  if (S.hasCorr) mis.push('<strong>Using the full member mass instead of $m_{mem}/3$.</strong> That would give '
      + '$\\eta = ' + fmt.sig(1 / (1 + S.mMem / p.m), 4) + '$ &mdash; three times the correction, and wrong. The one third comes from '
      + 'the linear velocity distribution along the member.');
  if (!S.hasCorr && S.A) mis.push('<strong>Using $\\delta_{st}$ as the dynamic deflection.</strong> The formula in the question is the '
      + '<em>static</em> deflection &mdash; the reference value that feeds the impact factor. The real deflection is $n$ times larger.');
  mis.push('<strong>Dropping the &ldquo;+1&rdquo;</strong> and using $n = \\sqrt{2h/\\delta_{st}} = ' + fmt.sig(S.main.n - 1, 5) + '$. '
      + 'Here it changes the answer by only ' + fmt.sig(100 / S.main.n, 2) + '\u202f%, which tempts students into using it habitually '
      + '&mdash; but at $h = 0$ it gives $n = 0$ instead of the correct $n = 2$.');
  mis.push('<strong>Mixing units.</strong> Work consistently in N and mm ($E$ in N/mm\u00b2, $h$ in mm) and the stress falls out '
      + 'directly in MPa. Density calculations must be done separately in SI.');
  if (CONFIG.mistakes) mis = mis.concat(CONFIG.mistakes(S, fmt));
  h += call('warn', '<p><strong>Common mistakes:</strong></p>'
      + mis.slice(0, 5).map(function (m, i) { return '<p style="margin-top:6px">' + CIRCLED[i] + ' ' + m + '</p>'; }).join(''));

  return h;
}


/* ------------------- tutorial configuration ------------------- */
var CONFIG = {
  fig: "post",
  question: function(S,fmt){
        return 'A square (<strong>' + fmt.sig(S.p.b,3) + ' \u00d7 ' + fmt.sig(S.p.b,3) + ' mm</strong>) wooden post with a '
          + 'length of <strong>' + fmt.sig(S.p.L/1000,3) + ' m</strong> stands on a rigid foundation. Ignore the effect '
          + 'of the weight of the post. Assume $E = ' + fmt.sig(S.p.E/1000,4) + '$ GPa.'
          + '<br/><strong>a)</strong> From what <strong>height</strong> must a <strong>' + fmt.sig(S.p.m,4) + ' kg</strong> '
          + 'weight be dropped on the upper end of the post to give an impact stress of <strong>'
          + fmt.sig(S.p.sigTgt,3) + ' MPa</strong>?'
          + '<br/><strong>b)</strong> Show that the answer can be written as $h = \\sigma^2 V/(2EW) - \\delta$, where '
          + '$V$ is the volume of the post, and use it to state which is more effective per cubic metre of timber: '
          + 'a bigger cross-section or a longer post.';
      },
  answer: function(S,fmt){
        return 'a) $h = ' + fmt.sig(S.main.h*1000,4) + '$ mm $\\approx ' + fmt.sig(S.main.h,2)
          + '$ m &nbsp;&nbsp;&nbsp; b) safe drop height $\\propto V$ &mdash; section and length are equally effective';
      },
  caption: function(S,fmt){
        return 'An inverse problem: the target stress is given and the drop height is the unknown. The post is treated as a '
          + 'massless axial spring of stiffness $AE/L$, per the instruction to ignore its weight. Post length and section '
          + 'are drawn in proportion to the selected variant.';
      },
  design: "volumeCapacity",
  source: "(prob 12.18, <em>Design of Machine Elements</em>, Spotts M.F., Third Edition, Prentice-Hall)",
  mistakes: function(S,fmt){
        return ['<strong>Adding a strength check the question did not ask for</strong> and concluding the post &ldquo;fails&rdquo;. '
          + 'The question asks only for the height that <em>produces</em> ' + fmt.sig(S.p.sigTgt,3) + ' MPa. Whether the timber '
          + 'survives it is a separate remark, not the answer.',
          '<strong>Not verifying the inverse answer by substituting it forwards.</strong> Inverse problems are where algebraic '
          + 'slips survive undetected; the forward check costs thirty seconds.'];
      }
};
var VARIANTS = [
  {
    "btn": "Original",
    "desc": "The tutorial sheet problem - 225 kg dropped on a 100 mm square post, 1.22 m long, to reach 27.5 MPa.",
    "m": 225,
    "shape": "square",
    "b": 100,
    "L": 1220,
    "E": 10340,
    "sigTgt": 27.5,
    "mode": "inverse",
    "book": true
  },
  {
    "btn": "Variant 1 - new magnitudes",
    "desc": "Same post, but a lighter 150 kg weight and a lower 20 MPa target. Both changes push the required height in the same direction - predict which way before computing.",
    "m": 150,
    "shape": "square",
    "b": 100,
    "L": 1220,
    "E": 10340,
    "sigTgt": 20,
    "mode": "inverse"
  },
  {
    "btn": "Variant 2 - new geometry",
    "desc": "Same 225 kg weight and same 27.5 MPa target, but a 150 mm square post 2 m long. Bigger section lowers the static stress while the extra length raises the compliance - two competing effects on the required height.",
    "m": 225,
    "shape": "square",
    "b": 150,
    "L": 2000,
    "E": 10340,
    "sigTgt": 27.5,
    "mode": "inverse"
  }
];

/* ------------------- wiring ------------------- */
function render(i){
  var v = VARIANTS[i];
  document.getElementById('doc').innerHTML = build(CONFIG, v);
  document.getElementById('swDesc').textContent = v.desc;
  var btns = document.querySelectorAll('#swBtns button');
  for(var j=0;j<btns.length;j++) btns[j].setAttribute('aria-pressed', j===i ? 'true' : 'false');
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('doc'), {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}
function init(){
  var box = document.getElementById('swBtns');
  VARIANTS.forEach(function(v,i){
    var b = document.createElement('button');
    b.textContent = v.btn;
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){ render(i); };
    box.appendChild(b);
  });
  render(0);
}
window.addEventListener('load', init);
</script>
