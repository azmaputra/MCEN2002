<script>

/* ═══════════════════════════════════════════════════════════════════════════
   GENERATED FILE — do not edit by hand.
   Source: _engine/engine.py + _engine/build.py
   Rebuild with:  python3 _engine/build.py
   ═══════════════════════════════════════════════════════════════════════════

   MCEN2002 — TUTORIAL 9 (CLUTCHES) SHARED ENGINE
   ───────────────────────────────────────────────────────────────────────────
   THE TWO FRICTION-CLUTCH MODELS, once, so every page uses the same algebra.

   Let r_i, r_o be the inner and outer radii of one annular friction face and
   f the coefficient of friction. Take an elemental ring of radius r,
   width dr, area dA = 2*pi*r*dr, carrying pressure p(r).

     Axial force   F = ∫ p dA         Torque (one face)  T = ∫ f * p * r dA

   UNIFORM PRESSURE  (a rigid, brand-new, perfectly flat pair of faces)
     p = constant
       F = p * pi * (r_o^2 - r_i^2)
       T = f*F * (2/3) * (r_o^3 - r_i^3)/(r_o^2 - r_i^2)   =  f * F * R_p
   UNIFORM WEAR  (after running in: wear rate ∝ p*v ∝ p*r, so p*r = const)
     p*r = p_max * r_i     (max pressure is at the INNER radius)
       F = 2*pi*p_max*r_i*(r_o - r_i)
       T = f*F * (r_o + r_i)/2                             =  f * F * R_w

   R_w < R_p always, so uniform wear is the conservative (safe) assumption and
   is what you design to unless the question says otherwise.

   N friction SURFACES in series all carry the same axial force F, so
       T_total = N * f * F * R          and    number of disks = N + 1.

   CONE CLUTCH: the axial force is resolved onto the cone face,
       N_face = F_a / sin(alpha)   ⇒   T = f * F_a * R_m / sin(alpha)
   (alpha = semi-angle measured from the axis).

   CENTRIFUGAL CLUTCH: each shoe of mass m, centre of mass at radius r,
   is held off by a spring set to just balance centrifugal force at the
   engagement speed w_1, so the net radial (normal) force at running speed w is
       N = m*r*(w^2 - w_1^2)
   and with n shoes bearing on a drum of internal radius R_d,
       T = n * f * N * R_d.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ─────────────────── number formatting ─────────────────── */
function num(v, d){
  if(d === undefined) d = 2;
  var r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
  if(Object.is(r, -0)) r = 0;
  return String(r);
}
/* thin-space thousands grouping, for forces in newtons */
function ns(v, d){
  var s = num(v, (d === undefined) ? 1 : d);
  var neg = s.charAt(0) === '-'; if(neg) s = s.slice(1);
  var parts = s.split('.'), ip = parts[0], out = '';
  for(var i = 0; i < ip.length; i++){
    if(i > 0 && (ip.length - i) % 3 === 0) out += '\\,';
    out += ip.charAt(i);
  }
  return (neg ? '-' : '') + out + (parts[1] ? '.' + parts[1] : '');
}
function deg(v){ return num(v, 2) + '^\\circ'; }

/* ─────────────────── page furniture ─────────────────── */
var CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧'];
function stepBlock(n, title, hint, body){
  return '<div class="step"><details' + (n === 1 ? ' open' : '') + '>'
       + '<summary><span class="step-num">' + n + '</span><span class="step-title">' + title + '</span>'
       + '<span class="try-hint">' + hint + '</span></summary>'
       + '<div class="step-body">' + body + '</div></details></div>';
}
function mb(){ /* math block from any number of $$ lines */
  var s = '<div class="math-block">';
  for(var i = 0; i < arguments.length; i++) s += '$$' + arguments[i] + '$$';
  return s + '</div>';
}
function callout(cls, html){ return '<div class="callout ' + cls + '"><p>' + html + '</p></div>'; }
function fig(svg, cap){
  return '<div class="diagram-wrap"><figure>' + svg + '<figcaption>' + cap + '</figcaption></figure></div>';
}
function mistakes(list){
  return '<div class="callout warn"><p><strong>Common mistakes:</strong></p>'
       + list.slice(0, 6).map(function(m, i){ return '<p style="margin-top:6px">' + CIRCLED[i] + ' ' + m + '</p>'; }).join('')
       + '</div>';
}

/* ─────────────────── SVG primitives ─────────────────── */
var NAVY = '#1a3c6e', RED = '#c0392b', BLUE = '#1a6fc4', ORANGE = '#f97316',
    GREY = '#555', FILL = '#7fe3ec', GOLD = '#f59e0b';
function n1(v){ return Number(v).toFixed(1); }
function defsBlock(){
  return '<defs>'
    + '<marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="' + RED + '"/></marker>'
    + '<marker id="ab" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="' + BLUE + '"/></marker>'
    + '<marker id="ag" markerWidth="8" markerHeight="7" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5 z" fill="' + GREY + '"/></marker>'
    + '<marker id="ao" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="' + ORANGE + '"/></marker>'
    + '</defs>';
}
function txt(x, y, s, col, size, anchor, weight, style){
  return '<text x="' + n1(x) + '" y="' + n1(y) + '" fill="' + (col || '#333') + '" font-size="' + (size || 12.5)
       + '" text-anchor="' + (anchor || 'middle') + '"' + (weight ? ' font-weight="' + weight + '"' : '')
       + (style ? ' font-style="' + style + '"' : '') + '>' + s + '</text>';
}
/* Text on a small white pad. Radius call-outs cross shaded shoes and hatched
   rings, and a bare label sitting on top of them is unreadable; the pad also
   lets a label sit close to its own leader line without merging into it. */
function txtHalo(x, y, s0, col, size, anchor, weight){
  size = size || 12.5;
  var w = s0.length * size * 0.56 + 8, h = size + 7;
  var x0 = (anchor === 'end') ? x - w + 4 : (anchor === 'start' ? x - 4 : x - w / 2);
  return '<rect x="' + n1(x0) + '" y="' + n1(y - size + 1) + '" width="' + n1(w) + '" height="' + n1(h)
       + '" rx="3" fill="#fff" fill-opacity="0.86"/>' + txt(x, y, s0, col, size, anchor, weight);
}
function arrow(x1, y1, x2, y2, mk, col, w){
  return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2)
       + '" stroke="' + col + '" stroke-width="' + (w || 2.1) + '" marker-end="url(#' + mk + ')"/>';
}
/* double-headed dimension line with a centred caption */
function dim(x1, y1, x2, y2, label, off){
  var s = '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2)
        + '" stroke="' + GREY + '" stroke-width="1" marker-start="url(#ag)" marker-end="url(#ag)"/>';
  return s + txt((x1 + x2) / 2, (y1 + y2) / 2 - (off === undefined ? 6 : off), label, GREY, 12.5);
}
function circlePath(cx, cy, r){
  return 'M ' + n1(cx - r) + ',' + n1(cy) + ' a ' + n1(r) + ',' + n1(r) + ' 0 1,0 ' + n1(2 * r) + ',0'
       + ' a ' + n1(r) + ',' + n1(r) + ' 0 1,0 ' + n1(-2 * r) + ',0';
}
function sector(cx, cy, r1, r2, a1, a2){
  var rd = function(a){ return a * Math.PI / 180; };
  var P = function(r, a){ return [cx + r * Math.cos(rd(a)), cy + r * Math.sin(rd(a))]; };
  var p1 = P(r2, a1), p2 = P(r2, a2), p3 = P(r1, a2), p4 = P(r1, a1);
  var big = (a2 - a1) > 180 ? 1 : 0;
  return 'M ' + n1(p1[0]) + ',' + n1(p1[1])
       + ' A ' + n1(r2) + ',' + n1(r2) + ' 0 ' + big + ',1 ' + n1(p2[0]) + ',' + n1(p2[1])
       + ' L ' + n1(p3[0]) + ',' + n1(p3[1])
       + ' A ' + n1(r1) + ',' + n1(r1) + ' 0 ' + big + ',0 ' + n1(p4[0]) + ',' + n1(p4[1]) + ' Z';
}

/* ─── FIGURE: plan view of one annular friction face, with the element dA ─── */
/* Subscripts are written with the Unicode subscript letters (rᵢ, rₒ, Fₐ, Rₘ, Fₛ)
   rather than <tspan dy="..">, because a raised/lowered tspan shifts the text
   baseline for everything that follows it and mangles the rest of the label in
   several SVG renderers. */
function dimH(x1, x2, y, label, tickTop){
  var s = '<line x1="' + n1(x1) + '" y1="' + n1(y) + '" x2="' + n1(x2) + '" y2="' + n1(y)
        + '" stroke="' + GREY + '" stroke-width="1" marker-start="url(#ag)" marker-end="url(#ag)"/>';
  if(tickTop !== undefined){
    s += '<line x1="' + n1(x1) + '" y1="' + n1(tickTop) + '" x2="' + n1(x1) + '" y2="' + n1(y + 6) + '" stroke="#bbb" stroke-width="0.8"/>';
    s += '<line x1="' + n1(x2) + '" y1="' + n1(tickTop) + '" x2="' + n1(x2) + '" y2="' + n1(y + 6) + '" stroke="#bbb" stroke-width="0.8"/>';
  }
  return s + txt((x1 + x2) / 2, y - 7, label, GREY, 12.5);
}

function figAnnulus(di, dout, opts){
  opts = opts || {};
  var cx = 158, cy = 158, Ro = 112, Ri = Ro * di / dout;
  var s = '<svg viewBox="0 0 520 360" width="580" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12.5">' + defsBlock();
  /* the ring itself (even-odd fill punches the hole out) */
  s += '<path d="' + circlePath(cx, cy, Ro) + ' ' + circlePath(cx, cy, Ri) + '" fill="' + FILL
     + '" fill-opacity="0.5" fill-rule="evenodd" stroke="' + NAVY + '" stroke-width="2"/>';
  /* elemental ring dA = 2*pi*r*dr */
  var rr = (Ri + Ro) / 2, dr = 11;
  s += '<path d="' + circlePath(cx, cy, rr - dr / 2) + ' ' + circlePath(cx, cy, rr + dr / 2)
     + '" fill="' + ORANGE + '" fill-opacity="0.55" fill-rule="evenodd" stroke="' + ORANGE + '" stroke-width="1"/>';
  /* centre lines */
  s += '<line x1="' + n1(cx - Ro - 16) + '" y1="' + cy + '" x2="' + n1(cx + Ro + 16) + '" y2="' + cy
     + '" stroke="#999" stroke-width="0.9" stroke-dasharray="10,4,2,4"/>';
  s += '<line x1="' + cx + '" y1="' + n1(cy - Ro - 16) + '" x2="' + cx + '" y2="' + n1(cy + Ro + 16)
     + '" stroke="#999" stroke-width="0.9" stroke-dasharray="10,4,2,4"/>';
  /* Radii call-outs. They must NOT be 180 degrees apart, or the two arrows line
     up into what reads as a single diameter. r_o is taken out at 20 degrees and
     r_i up at 118 degrees, which also keeps both clear of the dash-dot centre
     lines and of the element leader at 45 degrees. */
  s += arrow(cx, cy, cx + Ro * 0.940, cy - Ro * 0.342, 'ag', NAVY, 1.2);
  s += txtHalo(cx + Ro * 0.50, cy - Ro * 0.14, 'rₒ', NAVY, 14, 'middle', 'bold');
  s += arrow(cx, cy, cx - Ri * 0.470, cy - Ri * 0.883, 'ag', NAVY, 1.2);
  s += txtHalo(cx - Ri * 0.32, cy - Ri * 0.44, 'rᵢ', NAVY, 14, 'middle', 'bold');
  /* element call-out, leadered out to the top right */
  var ex = cx + rr * 0.707, ey = cy - rr * 0.707;
  s += '<line x1="' + n1(ex) + '" y1="' + n1(ey) + '" x2="306" y2="46" stroke="' + ORANGE + '" stroke-width="1" stroke-dasharray="3,3"/>';
  s += txt(312, 40, 'element at radius r, width dr', ORANGE, 12.5, 'start', 'bold');
  s += txt(312, 57, 'dA = 2πr dr', ORANGE, 12.5, 'start', 'bold');
  /* diameter dimensions, stacked clear of the ring */
  s += dimH(cx - Ri, cx + Ri, cy + Ro + 30, 'dᵢ = ' + num(di, 1) + ' mm', cy);
  s += dimH(cx - Ro, cx + Ro, cy + Ro + 62, 'dₒ = ' + num(dout, 1) + ' mm', cy);
  /* pressure-distribution inset */
  if(opts.model){
    var bx = 310, by = 90, bw = 196, bh = 126, ax = bx + 34, ay0 = by + 22, ay1 = by + bh - 30;
    s += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="5" fill="#f8f9fb" stroke="#e2e6ef"/>';
    s += '<line x1="' + ax + '" y1="' + ay1 + '" x2="' + (bx + bw - 16) + '" y2="' + ay1 + '" stroke="#888" stroke-width="1"/>';
    s += '<line x1="' + ax + '" y1="' + ay0 + '" x2="' + ax + '" y2="' + ay1 + '" stroke="#888" stroke-width="1"/>';
    s += txt(ax - 12, ay0 + 4, 'p', GREY, 12.5, 'middle');
    s += txt(bx + bw - 10, ay1 + 15, 'r', GREY, 12.5, 'middle');
    s += txt(ax, ay1 + 15, 'rᵢ', GREY, 12, 'middle');
    s += txt(bx + bw - 30, ay1 + 15, 'rₒ', GREY, 12, 'middle');
    var xL = ax + 6, xR = bx + bw - 30;
    if(opts.model === 'pressure'){
      s += '<line x1="' + xL + '" y1="' + (ay0 + 16) + '" x2="' + xR + '" y2="' + (ay0 + 16) + '" stroke="' + RED + '" stroke-width="2.6"/>';
      s += '<line x1="' + xL + '" y1="' + (ay0 + 16) + '" x2="' + xL + '" y2="' + ay1 + '" stroke="' + RED + '" stroke-width="1" stroke-dasharray="3,3"/>';
      s += '<line x1="' + xR + '" y1="' + (ay0 + 16) + '" x2="' + xR + '" y2="' + ay1 + '" stroke="' + RED + '" stroke-width="1" stroke-dasharray="3,3"/>';
      s += txt((xL + xR) / 2, ay0 + 8, 'p = constant', RED, 12, 'middle', 'bold');
    } else {
      /* p = p_max * r_i / r, so the curve falls to (r_i/r_o) of its peak */
      var ratio = di / dout, top = ay0 + 12, span = ay1 - top, pth = '';
      for(var k = 0; k <= 26; k++){
        var t = k / 26, rq = ratio + t * (1 - ratio);
        pth += (k ? ' L ' : 'M ') + n1(xL + t * (xR - xL)) + ',' + n1(top + span * (1 - ratio / rq));
      }
      s += '<path d="' + pth + '" fill="none" stroke="' + RED + '" stroke-width="2.6"/>';
      s += '<line x1="' + xL + '" y1="' + top + '" x2="' + xL + '" y2="' + ay1 + '" stroke="' + RED + '" stroke-width="1" stroke-dasharray="3,3"/>';
      s += '<line x1="' + xR + '" y1="' + n1(top + span * (1 - ratio)) + '" x2="' + xR + '" y2="' + ay1 + '" stroke="' + RED + '" stroke-width="1" stroke-dasharray="3,3"/>';
      s += txt(xL + 4, top - 6, 'pmax', RED, 12, 'start', 'bold');
      s += txt((xL + xR) / 2 + 26, ay0 + 6, 'p r = constant', RED, 12, 'middle', 'bold');
    }
  }
  return s + '</svg>';
}

/* ─── FIGURE: section through a multi-disk stack ─── */
function figStack(nDisk, capF){
  var pitch = 24, pw = 9, x0 = 132;
  var xEnd = x0 + (nDisk - 1) * pitch + pw;
  var w = xEnd + 130;
  var s = '<svg viewBox="0 0 ' + w + ' 280" width="' + Math.min(700, w + 40) + '" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12.5">' + defsBlock();
  var yTop = 74, yBot = 214, mid = (yTop + yBot) / 2;
  /* shaft */
  s += '<rect x="40" y="' + (mid - 13) + '" width="' + (xEnd + 60) + '" height="26" fill="#e7edf6" stroke="' + NAVY + '" stroke-width="1.2"/>';
  /* housing rails */
  s += '<rect x="' + (x0 - 32) + '" y="' + (yTop - 18) + '" width="' + (xEnd - x0 + 64) + '" height="14" fill="#dbe4f0" stroke="' + NAVY + '" stroke-width="1.3"/>';
  s += '<rect x="' + (x0 - 32) + '" y="' + (yBot + 4) + '" width="' + (xEnd - x0 + 64) + '" height="14" fill="#dbe4f0" stroke="' + NAVY + '" stroke-width="1.3"/>';
  /* plates: even index splined to the housing, odd index splined to the shaft */
  for(var i = 0; i < nDisk; i++){
    var x = x0 + i * pitch, drive = (i % 2 === 0);
    var y1 = drive ? yTop - 4 : yTop + 32, y2 = drive ? yBot - 32 : yBot + 4;
    s += '<rect x="' + x + '" y="' + y1 + '" width="' + pw + '" height="' + (y2 - y1) + '" fill="'
       + (drive ? FILL : '#ffd9a8') + '" fill-opacity="0.9" stroke="' + NAVY + '" stroke-width="1.2"/>';
  }
  /* rubbing interfaces */
  for(var j = 0; j < nDisk - 1; j++){
    var xm = x0 + j * pitch + pw + (pitch - pw) / 2;
    s += '<circle cx="' + n1(xm) + '" cy="' + mid + '" r="3.6" fill="' + ORANGE + '"/>';
  }
  /* clamping force */
  s += arrow(x0 - 84, mid + 52, x0 - 18, mid + 52, 'ab', BLUE, 2.3);
  s += arrow(xEnd + 84, mid + 52, xEnd + 18, mid + 52, 'ab', BLUE, 2.3);
  s += txt(x0 - 84, mid + 70, capF || 'F', BLUE, 13.5, 'middle', 'bold');
  s += txt(xEnd + 84, mid + 70, capF || 'F', BLUE, 13.5, 'middle', 'bold');
  s += txt(w / 2, 26, 'blue = splined to the housing   ·   orange = splined to the shaft', GREY, 12, 'middle');
  s += txt(w / 2, 44, (nDisk - 1) + ' friction surfaces (orange dots) between ' + nDisk + ' disks', ORANGE, 13, 'middle', 'bold');
  s += txt(46, mid + 4, 'shaft', NAVY, 11.5, 'start');
  return s + '</svg>';
}

/* ─── FIGURE: cone clutch section ─── */
function figCone(alphaDeg, showForces){
  var s = '<svg viewBox="0 0 560 340" width="620" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12.5">' + defsBlock();
  var yc = 178, x1 = 168, x2 = 372, r1 = 100, hub = 20;
  var t = Math.tan(alphaDeg * Math.PI / 180), r2 = r1 - (x2 - x1) * t, aE = Math.atan2(r1 - r2, x2 - x1);
  /* axis of rotation */
  s += '<line x1="70" y1="' + yc + '" x2="510" y2="' + yc + '" stroke="#999" stroke-width="1" stroke-dasharray="12,4,2,4"/>';
  /* female cup: a band lying just outside each face. Drawn FIRST so the cone
     sits on top of it and the contact line stays crisp. */
  var band = function(sgn){
    var ax1 = x1, ax2 = x2 + 24, o1 = 7, o2 = 21;
    var ya = function(x){ return yc + sgn * (r1 - (x - x1) * t); };
    return '<path d="M ' + n1(ax1) + ',' + n1(ya(ax1) + sgn * o1) + ' L ' + n1(ax2) + ',' + n1(ya(ax2) + sgn * o1)
         + ' L ' + n1(ax2) + ',' + n1(ya(ax2) + sgn * o2) + ' L ' + n1(ax1) + ',' + n1(ya(ax1) + sgn * o2)
         + ' Z" fill="#dbe4f0" stroke="' + NAVY + '" stroke-width="1.4"/>';
  };
  s += band(-1) + band(1);
  /* male cone, upper and lower halves of the section */
  s += '<path d="M ' + x1 + ',' + n1(yc - r1) + ' L ' + x2 + ',' + n1(yc - r2) + ' L ' + x2 + ',' + (yc - hub) + ' L ' + x1 + ',' + (yc - hub)
     + ' Z" fill="' + FILL + '" fill-opacity="0.6" stroke="' + NAVY + '" stroke-width="1.8"/>';
  s += '<path d="M ' + x1 + ',' + n1(yc + r1) + ' L ' + x2 + ',' + n1(yc + r2) + ' L ' + x2 + ',' + (yc + hub) + ' L ' + x1 + ',' + (yc + hub)
     + ' Z" fill="' + FILL + '" fill-opacity="0.6" stroke="' + NAVY + '" stroke-width="1.8"/>';
  s += txt(224, yc - 44, 'cone (moving)', NAVY, 12, 'middle');
  s += txt(452, yc + r2 + 46, 'cup (fixed)', NAVY, 12, 'middle');
  /* semi-angle, at the large end of the upper face */
  s += '<line x1="' + x1 + '" y1="' + n1(yc - r1) + '" x2="' + (x1 + 118) + '" y2="' + n1(yc - r1) + '" stroke="' + GREY + '" stroke-width="0.9" stroke-dasharray="4,3"/>';
  var aR = 54;
  s += '<path d="M ' + n1(x1 + aR) + ',' + n1(yc - r1) + ' A ' + aR + ',' + aR + ' 0 0,1 '
     + n1(x1 + aR * Math.cos(aE)) + ',' + n1(yc - r1 + aR * Math.sin(aE)) + '" fill="none" stroke="' + ORANGE + '" stroke-width="1.6"/>';
  s += txt(x1 + aR + 6, yc - r1 - 9, 'α = ' + num(alphaDeg, 2) + '°', ORANGE, 13.5, 'start', 'bold');
  /* mean radius */
  var xm = (x1 + x2) / 2, ym = yc - (r1 + r2) / 2;
  s += '<line x1="' + n1(xm) + '" y1="' + n1(ym) + '" x2="' + n1(xm) + '" y2="' + yc
     + '" stroke="' + GREY + '" stroke-width="1" marker-start="url(#ag)" marker-end="url(#ag)"/>';
  s += txt(xm + 8, (ym + yc) / 2 + 4, 'Rm', GREY, 13.5, 'start', 'bold');
  if(showForces){
    s += arrow(74, yc + 74, 152, yc + 74, 'ab', BLUE, 2.4);
    s += txt(112, yc + 92, 'Fa (axial)', BLUE, 13.5, 'middle', 'bold');
    /* the force set is applied well to the right of the semi-angle call-out so
       the two annotations cannot overlap at shallow cone angles */
    var xq = x1 + 0.68 * (x2 - x1), yq = yc - (r1 - (xq - x1) * t);
    var nx = Math.sin(aE), nyv = Math.cos(aE);
    s += arrow(xq + 74 * nx, yq - 74 * nyv, xq + 4 * nx, yq - 4 * nyv, 'ar', RED, 2.3);
    s += txt(xq + 84 * nx, yq - 84 * nyv, 'N = Fa / sinα', RED, 13, 'middle', 'bold');
    s += arrow(xq, yq, xq + 66 * Math.cos(aE), yq + 66 * Math.sin(aE), 'ao', ORANGE, 2.3);
    s += txt(xq + 78 * Math.cos(aE) + 14, yq + 66 * Math.sin(aE) + 20, 'f N', ORANGE, 13.5, 'start', 'bold');
  }
  return s + '</svg>';
}

/* ─── FIGURE: centrifugal clutch — drum plan plus a free body of one shoe ─── */
function figCentrifugal(nShoe, showForces){
  var s = '<svg viewBox="0 0 620 380" width="660" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="12.5">' + defsBlock();
  var cx = 150, cy = 190, Rw = 142, Rd = 130, rs2 = 122, rs1 = 74, hub = 26;
  /* drum wall */
  s += '<path d="' + circlePath(cx, cy, Rw) + ' ' + circlePath(cx, cy, Rd) + '" fill="#dbe4f0" fill-rule="evenodd" stroke="' + NAVY + '" stroke-width="1.6"/>';
  /* shoes on the spider */
  var span = 360 / nShoe - 16;
  for(var i = 0; i < nShoe; i++){
    var a1 = i * 360 / nShoe - span / 2, a2 = a1 + span;
    s += '<path d="' + sector(cx, cy, rs1, rs2, a1, a2) + '" fill="' + FILL + '" fill-opacity="0.6" stroke="' + NAVY + '" stroke-width="1.5"/>';
    var am = (a1 + a2) / 2 * Math.PI / 180;
    s += '<line x1="' + n1(cx + hub * Math.cos(am)) + '" y1="' + n1(cy + hub * Math.sin(am))
       + '" x2="' + n1(cx + rs1 * Math.cos(am)) + '" y2="' + n1(cy + rs1 * Math.sin(am)) + '" stroke="' + NAVY + '" stroke-width="1.8"/>';
  }
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + hub + '" fill="#e7edf6" stroke="' + NAVY + '" stroke-width="1.6"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="3" fill="' + NAVY + '"/>';
  /* The two radii that matter. Deliberately NOT diametrically opposite: at 180
     degrees apart the pair reads as one line through the hub instead of as two
     separate radii. R is taken down-right at -42 degrees, r up-right at 72. */
  var rG = (rs1 + rs2) / 2;
  s += arrow(cx, cy, cx + Rd * 0.743, cy + Rd * 0.669, 'ag', NAVY, 1.2);
  s += txtHalo(cx + Rd * 0.50 * 0.743 + 10, cy + Rd * 0.50 * 0.669 - 11, 'R (drum)', NAVY, 12.5, 'start', 'bold');
  s += arrow(cx, cy, cx + rG * 0.309, cy - rG * 0.951, 'ag', NAVY, 1.2);
  s += txtHalo(cx + rG * 0.55 * 0.309 + 13, cy - rG * 0.55 * 0.951 + 5, 'r', NAVY, 13.5, 'start', 'bold');
  s += txt(cx, cy + Rw + 32, nShoe + ' shoes on a spider, inside a drum', GREY, 12.5, 'middle');
  if(showForces){
    /* Free body of ONE shoe, drawn as a flat schematic rather than a curved
       sector: the forces are all radial or tangential, and straightening the
       geometry buys the room the labels need. */
    var bx = 326, by = 46, bw = 272, bh = 288;
    s += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="6" fill="#f8f9fb" stroke="#e2e6ef"/>';
    s += txt(bx + bw / 2, by + 24, 'free body of one shoe', GREY, 12.5, 'middle', 'bold');
    var cxq = bx + bw / 2;
    /* drum wall above, shoe below it */
    s += '<rect x="' + (bx + 18) + '" y="152" width="' + (bw - 36) + '" height="18" fill="#dbe4f0" stroke="' + NAVY + '" stroke-width="1.4"/>';
    s += txt(bx + bw - 24, 146, 'drum', NAVY, 11.5, 'end');
    s += '<rect x="' + (cxq - 82) + '" y="176" rx="4" width="164" height="60" fill="' + FILL + '" fill-opacity="0.65" stroke="' + NAVY + '" stroke-width="1.6"/>';
    s += txt(cxq - 74, 194, 'shoe', NAVY, 11.5, 'start');
    s += '<circle cx="' + cxq + '" cy="206" r="4" fill="' + ORANGE + '"/>';
    s += txt(cxq - 10, 224, 'G', ORANGE, 13, 'end', 'bold');
    /* drum reaction pushing the shoe back inward */
    s += arrow(cxq, 116, cxq, 174, 'ab', BLUE, 2.2);
    s += txt(cxq + 8, 128, 'N', BLUE, 13.5, 'start', 'bold');
    /* friction, tangential along the rubbing face */
    s += arrow(cxq + 76, 186, cxq + 6, 186, 'ao', ORANGE, 2.2);
    s += txt(cxq + 84, 190, 'f N', ORANGE, 13.5, 'start', 'bold');
    /* centrifugal force outward (toward the drum) and the spring pulling back */
    s += arrow(cxq - 46, 292, cxq - 46, 210, 'ar', RED, 2.4);
    s += txt(cxq - 46, 310, 'mω²r', RED, 13, 'middle', 'bold');
    s += arrow(cxq + 46, 210, cxq + 46, 292, 'ab', BLUE, 2.4);
    s += txt(cxq + 46, 310, 'Fs (spring)', BLUE, 13, 'middle', 'bold');
    s += txt(cxq, 330, 'net inward push  N = mω²r - Fs', NAVY, 12.5, 'middle', 'bold');
  }
  return s + '</svg>';
}

/* ─────────────────── wiring ─────────────────── */
function render(i){
  var v = VARIANTS[i];
  document.getElementById('doc').innerHTML = build(CONFIG, v);
  document.getElementById('swDesc').textContent = v.desc;
  var btns = document.querySelectorAll('#swBtns button');
  for(var j = 0; j < btns.length; j++) btns[j].setAttribute('aria-pressed', j === i ? 'true' : 'false');
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('doc'), {
      delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
      throwOnError: false
    });
  }
}
function init(){
  var box = document.getElementById('swBtns');
  VARIANTS.forEach(function(v, i){
    var b = document.createElement('button');
    b.textContent = v.btn;
    b.setAttribute('aria-pressed', 'false');
    b.onclick = function(){ render(i); };
    box.appendChild(b);
  });
  render(0);
}
window.addEventListener('load', init);



var CONFIG = {
  question: "In a <strong>cone clutch</strong>, the contact surfaces have an effective diameter of <strong>75 mm</strong>. The semi angle is "
          + "<strong>15&#176;</strong>. Take <strong>f = 0.3</strong>."
          + "<br><br>(a) Find the <strong>torque</strong> required if the axial force applied is <strong>180 N</strong>. Assume uniform wear."
          + "<br><br>The clutch is employed to connect an electric motor, running uniformly at <strong>1000 rev/min</strong>, with a flywheel which is "
          + "initially stationary. The flywheel has a mass of <strong>13.5 kg</strong> and its radius of gyration is <strong>150 mm</strong>."
          + "<br><br>(b) Calculate the <strong>time required for the flywheel to attain full speed</strong>.",
  book: "a) 7.824 N\u00b7m, b) 4.07 s"
};
var VARIANTS = [
  {btn:"Original", desc:"The tutorial-sheet problem. 75 mm effective diameter, 15\u00b0 semi-angle, f = 0.3, F_a = 180 N; flywheel 13.5 kg with k = 150 mm run up to 1000 rev/min.",
   Dm:75, alpha:15, f:0.3, Fa:180, rpm:1000, m:13.5, kg:150},
  {btn:"Variant 1 \u2014 shallower cone", desc:"A 100 mm cone at only 12.5\u00b0 with f = 0.25 and F_a = 250 N, driving a heavier 20 kg flywheel to 1200 rev/min. The shallower angle wedges harder, so the torque gain is larger than the force increase alone would suggest.",
   Dm:100, alpha:12.5, f:0.25, Fa:250, rpm:1200, m:20, kg:180},
  {btn:"Variant 2 \u2014 steeper cone", desc:"A 90 mm cone opened out to 20\u00b0 with f = 0.35 and only 200 N of axial force, on a light 10 kg flywheel at 900 rev/min. Steeper means less wedging \u2014 compare the amplification factor 1/sin\u03b1 with the original.",
   Dm:90, alpha:20, f:0.35, Fa:200, rpm:900, m:10, kg:120}
];

function solve(p){
  var Rm = p.Dm/2000, a = p.alpha*Math.PI/180;
  var Nf = p.Fa/Math.sin(a);
  var T  = p.f*p.Fa*Rm/Math.sin(a);
  var Tflat = p.f*p.Fa*Rm;
  var k = p.kg/1000, I = p.m*k*k;
  var w = p.rpm*2*Math.PI/60;
  var acc = T/I, t = w/acc;
  return {Rm:Rm, a:a, Nf:Nf, T:T, Tflat:Tflat, amp:1/Math.sin(a), I:I, w:w, acc:acc, t:t,
          E:0.5*I*w*w, slip:0.5*I*w*w};
}

function build(cfg, p){
  var S = solve(p), h = '';

  h += '<h3>Problem Statement</h3><p>' + cfg.question + '</p>';
  h += callout('given', '<strong>Book answers:</strong> &nbsp; a) $' + num(S.T,3) + '$ N&#183;m &nbsp;&#183;&nbsp; b) $' + num(S.t,2)
     + '$ s');
  h += fig(figCone(p.alpha, true),
      'Section through the cone clutch. The axial force $F_a$ is resolved onto the cone face: the face carries $N = F_a/\\sin\\alpha$, '
      + 'and the friction force $fN$ acts at the mean radius $R_m$.');
  h += callout('info', '<strong>Strategy:</strong> (a) is a statics problem \u2014 the cone <em>wedges</em>, amplifying the axial force by '
    + '$1/\\sin\\alpha$ before friction ever enters. (b) is pure rigid-body dynamics: a constant torque on a constant inertia gives constant '
    + 'angular acceleration, so $t = \\omega/\\alpha_{\\text{acc}}$. The clutch torque links the two.');

  h += '<h3>Solution</h3>';

  var b1 = '<p>Resolve perpendicular to the cone surface. The semi-angle $\\alpha$ is measured from the <strong>axis</strong>, so the normal '
    + 'force on the face is <em>larger</em> than the axial force you push with:</p>'
    + mb('F_a = N\\sin\\alpha \\qquad\\Longrightarrow\\qquad N = \\frac{F_a}{\\sin\\alpha} = \\frac{' + num(p.Fa,0) + '}{\\sin ' + num(p.alpha,2)
       + '^\\circ} = ' + num(S.Nf,1) + '\\ \\text{N}')
    + '<p>Friction acts along the face at the mean radius, giving</p>'
    + mb('T = f N R_m = \\frac{f F_a R_m}{\\sin\\alpha}')
    + mb('T = \\frac{' + num(p.f,2) + ' \\times ' + num(p.Fa,0) + ' \\times ' + num(S.Rm,4) + '}{\\sin ' + num(p.alpha,2)
       + '^\\circ} = \\frac{' + num(p.f*p.Fa*S.Rm,4) + '}{' + num(Math.sin(S.a),6) + '} = \\boxed{' + num(S.T,3) + '\\ \\text{N}\\cdot\\text{m}}')
    + callout('answer', '<strong>(a)</strong> &nbsp; $T = ' + num(S.T,3) + '\\ \\text{N}\\cdot\\text{m}$')
    + callout('note', '<strong>The wedge factor.</strong> A flat plate clutch with the same $F_a$, $f$ and radius would manage only $'
      + num(S.Tflat,3) + '$ N&#183;m. The cone multiplies it by $1/\\sin ' + num(p.alpha,2) + '^\\circ = ' + num(S.amp,3)
      + '$ \u2014 which is exactly why cone clutches are used where the operating force must stay small. The price is that a shallow cone is '
      + 'prone to grabbing and can be hard to disengage; below about 12&#176; the cone tends to stick.')
    + callout('warn', 'Uniform wear was assumed, so $R_m$ is the <em>mean</em> radius $(r_o + r_i)/2$. Here the question hands you the '
      + '"effective diameter" directly, so $R_m = ' + num(p.Dm,0) + '/2 = ' + num(p.Dm/2,1) + '$ mm \u2014 no integration needed.');
  h += stepBlock(1, '(a) Torque from the axial force', 'resolve on the cone face first', b1);

  var b2 = '<p>The flywheel\u2019s resistance to angular acceleration comes from its mass moment of inertia, built from the radius of gyration:</p>'
    + mb('I = m k^2 = ' + num(p.m,2) + ' \\times ' + num(p.kg/1000,3) + '^2 = ' + num(S.I,5) + '\\ \\text{kg}\\cdot\\text{m}^2')
    + '<p>and the target speed is</p>'
    + mb('\\omega = \\frac{2\\pi(' + num(p.rpm,0) + ')}{60} = ' + num(S.w,3) + '\\ \\text{rad/s}')
    + callout('note', 'The radius of gyration $k$ is the radius at which the whole mass could be concentrated without changing $I$. It is a '
      + 'shortcut past the shape of the flywheel \u2014 you never need its actual geometry.');
  h += stepBlock(2, 'Flywheel inertia and target speed', 'what does the radius of gyration give you?', b2);

  var b3 = '<p>While the clutch is slipping, the friction torque is constant at the value found in (a), so the flywheel sees constant '
    + 'angular acceleration:</p>'
    + mb('T = I\\,\\alpha_{\\text{acc}} \\qquad\\Longrightarrow\\qquad \\alpha_{\\text{acc}} = \\frac{T}{I} = \\frac{' + num(S.T,4) + '}{'
       + num(S.I,5) + '} = ' + num(S.acc,3) + '\\ \\text{rad/s}^2')
    + mb('\\omega = \\alpha_{\\text{acc}}\\,t \\qquad\\Longrightarrow\\qquad t = \\frac{\\omega}{\\alpha_{\\text{acc}}} = \\frac{'
       + num(S.w,3) + '}{' + num(S.acc,3) + '} = \\boxed{' + num(S.t,3) + '\\ \\text{s}}')
    + callout('answer', '<strong>(b)</strong> &nbsp; $t = ' + num(S.t,2) + '\\ \\text{s}$')
    + callout('note', '<strong>Where the energy goes.</strong> The flywheel ends up with $\\tfrac12 I\\omega^2 = ' + num(S.E,1)
      + '$ J of kinetic energy. Because the motor runs at constant speed throughout, it supplies twice that \u2014 and the other $' + num(S.E,1)
      + '$ J is dissipated as heat in the slipping friction surfaces. That heat, not the torque, is what limits how often a clutch can be cycled.')
    + callout('warn', 'The motor is stated to run <em>uniformly</em> at ' + num(p.rpm,0) + ' rev/min, i.e. it is stiff enough not to be dragged '
      + 'down. If it were not, the two sides would meet at some intermediate speed and this simple constant-acceleration model would fail.');
  h += stepBlock(3, '(b) Run-up time', 'constant torque \u21d2 constant angular acceleration', b3);

  h += mistakes([
    '<strong>Using $\\cos\\alpha$ or $\\tan\\alpha$ instead of $\\sin\\alpha$.</strong> With the semi-angle measured from the <em>axis</em>, '
      + '$F_a = N\\sin\\alpha$. Getting this wrong here changes the torque by a factor of ' + num(1/Math.tan(S.a)*Math.sin(S.a),2) + ' or more.',
    '<strong>Forgetting the $1/\\sin\\alpha$ amplification altogether</strong> and treating the cone as a flat plate \u2014 that gives $'
      + num(S.Tflat,3) + '$ N&#183;m instead of $' + num(S.T,3) + '$ N&#183;m.',
    '<strong>Using $I = mk$ or $I = mk^2/2$.</strong> The radius of gyration is defined so that $I = mk^2$ exactly, with no extra shape factor.',
    '<strong>Leaving $k$ in millimetres.</strong> $I$ must be in kg&#183;m&#178;; $150$ mm is $0.15$ m and it is squared, so the error is a factor of $10^6$.',
    '<strong>Using rev/min in $\\omega = \\alpha t$.</strong> Convert to rad/s before touching the dynamics.',
    '<strong>Adding the motor\u2019s own inertia.</strong> The question gives only the flywheel; the motor is treated as an infinitely stiff constant-speed source.'
  ]);
  return h;
}

</script>
