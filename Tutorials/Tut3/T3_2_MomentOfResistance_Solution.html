/* ─────────────────── number formatting ─────────────────── */
function r1(v){ return fixed(v,1); }
function r2(v){ return fixed(v,2); }
function fixed(v,dp){
  if(Math.abs(v) < 5e-13) v = 0;
  var s = v.toFixed(dp);
  if(s === '-0' || /^-0\.0*$/.test(s)) s = s.slice(1);
  return s;
}
/* trim trailing zeros: 140.60 -> 140.6, 45.00 -> 45 */
function trim(v,dp){
  var s = fixed(v, dp===undefined ? 4 : dp);
  if(s.indexOf('.') >= 0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
/* minus sign for prose/SVG (true minus, not hyphen) */
function mn(s){ return String(s).replace(/-/g,'\u2212'); }
/* thousands grouped with a LaTeX thin space: 19769 -> 19\,769 */
function grp(v,dp){
  var s = fixed(v, dp===undefined ? 0 : dp), neg = s.charAt(0)==='-';
  if(neg) s = s.slice(1);
  var p = s.split('.'), i = p[0], out = '';
  while(i.length > 3){ out = '\\,' + i.slice(-3) + out; i = i.slice(0,-3); }
  out = i + out + (p[1] ? '.'+p[1] : '');
  return (neg?'-':'') + out;
}
/* parenthesise a negative number inside a product: 4(-56)^2 */
function par(v,dp){
  var s = trim(v,dp);
  return v < 0 ? '('+s+')' : s;

  b.y0 = Math.min(b.y0, y0, y1); b.y1 = Math.max(b.y1, y0, y1);

Svg.prototype.raw = function(s){ this.p.push(s); return this; };
Svg.prototype.def = function(s){ this.defs.push(s); return this; };

/* Arial advance width is ~0.55 em averaged over mixed-case text; 0.62 keeps a

    ' 0 '+large+','+sweep+' '+n3(x1)+','+n3(y1)+'" fill="none" stroke="'+stroke+

/* ══════════════════════════════════════════════════════════════════════════
   MCEN2002 — SHARED BENDING / SECTION-PROPERTIES ENGINE  (Tutorial 3.x)
   Single source of truth for every T3.x tutorial solution page.
   Edit this file, then run  _engine/build.py  to regenerate the HTML files.
   Rendering helpers (formatting, SVG builder, HTML blocks) live in
   _shared/render_lib.js and are inlined ahead of this file.

   ─── SECTION MODEL ───────────────────────────────────────────────────────
   A cross-section is a list of PARTS. Every part carries both an analytic
   description (area, own centroid height, own second moment) and a polygon
   for drawing, with y measured UPWARD FROM THE BOTTOM FACE throughout.

     Rect(name, x0, y0, b, h)                 rectangle
     Tri (name, x0, y0, b, h, wide, mirror)   right triangle, 'wide' face
                                              at 'bottom' or 'top'
     Tbl (name, x0, y0, t, kind)              tabulated steel section: A and
                                              I come from the manufacturer's
                                              table, the polygon is drawn from
                                              d/bf/tf/tw for illustration only

   Composite properties then follow from first principles:
     A    = sum A_i
     ybar = sum(A_i y_i) / A            (from the bottom face)
     I    = sum(Ibar_i + A_i d_i^2),    d_i = y_i - ybar

   ─── BEAM MODEL ──────────────────────────────────────────────────────────
     {k:'pointMid',     P, L}        M = PL/4
     {k:'pointOffset',  P, a, L}     M = Pab/L,  b = L - a
     {k:'udlOverhang',  w, Lsp, Lo}  pin at A, roller at B, free overhang
                                     beyond B; gives BOTH a sagging peak and
                                     a hogging moment at the support
     {k:'given',        M}           moment stated directly

   Sign convention: a POSITIVE (sagging) moment puts the BOTTOM fibre in
   tension and the TOP fibre in compression. A negative (hogging) moment
   reverses this. Every stress reported by the engine carries that logic
   rather than assuming the bottom fibre is always the tension face.

   ─── MODES ───────────────────────────────────────────────────────────────
   'span'       stress limit + mid-span point load  -> allowable span  (T3.1)
   'moment'     two stress limits                   -> moment of resistance (T3.2)
   'stress'     known loading                       -> extreme fibre stresses (T3.3)
   'selfweight' density -> UDL -> overhanging beam  -> stresses both sections (T3.4)
   'coverplate' tabulated beam + welded plate       -> % increase in Z  (T3.5)
   'select'     required Z -> pick from a table     -> section + I about k (T3.6)
   ══════════════════════════════════════════════════════════════════════════ */

var GRAV = 9.81;

/* ─────────────────── part constructors ─────────────────── */
function Rect(name, x0, y0, b, h){
  return {name: name, kind: 'rect', x0: x0, y0: y0, b: b, h: h,
          A: b*h, yc: y0 + h/2, Ibar: b*h*h*h/12,
          dims: b+' &times; '+h,
          poly: [[x0,y0],[x0+b,y0],[x0+b,y0+h],[x0,y0+h]]};
}
/* Right triangle with a vertical leg. 'wide' names the face carrying the
   horizontal leg; 'mirror' puts the vertical leg on the right.            */
function Tri(name, x0, y0, b, h, wide, mirror){
  var bottomWide = (wide !== 'top');
  var p;
  if(bottomWide) p = mirror ? [[x0,y0],[x0+b,y0],[x0+b,y0+h]] : [[x0,y0],[x0+b,y0],[x0,y0+h]];
  else           p = mirror ? [[x0+b,y0],[x0+b,y0+h],[x0,y0+h]] : [[x0,y0],[x0,y0+h],[x0+b,y0+h]];
  return {name: name, kind: 'tri', x0: x0, y0: y0, b: b, h: h, wide: wide,
          A: b*h/2, yc: y0 + (bottomWide ? h/3 : 2*h/3), Ibar: b*h*h*h/36,
          dims: b+' &times; '+h,
          poly: p};
}
/* Tabulated steel section. t = {d, bf, tf, tw, A, Ix, Zx, ...}            */
function Tbl(name, x0, y0, t, kind){
  var d = t.d, bf = t.bf, tf = t.tf, tw = t.tw, p;
  if(kind === 'channel'){
    p = [[x0,y0],[x0+bf,y0],[x0+bf,y0+tf],[x0+tw,y0+tf],
         [x0+tw,y0+d-tf],[x0+bf,y0+d-tf],[x0+bf,y0+d],[x0,y0+d]];
  } else {                                   /* I-section / universal beam */
    var w0 = x0 + (bf-tw)/2;
    p = [[x0,y0],[x0+bf,y0],[x0+bf,y0+tf],[w0+tw,y0+tf],
         [w0+tw,y0+d-tf],[x0+bf,y0+d-tf],[x0+bf,y0+d],[x0,y0+d],
         [x0,y0+d-tf],[w0,y0+d-tf],[w0,y0+tf],[x0,y0+tf]];
  }
  return {name: name, kind: 'tbl', x0: x0, y0: y0, b: bf, h: d, tbl: t,
          A: t.A, yc: y0 + d/2, Ibar: t.Ix,
          dims: t.name,
          poly: p};
}

/* ─────────────────── section solver ─────────────────── */
function sectionProps(parts){
  var A = 0, Ay = 0, i;
  for(i=0;i<parts.length;i++){ A += parts[i].A; Ay += parts[i].A*parts[i].yc; }
  var ybar = Ay/A, I = 0;
  for(i=0;i<parts.length;i++){
    var p = parts[i];
    p.d  = p.yc - ybar;
    p.Ad2 = p.A*p.d*p.d;
    p.Ixx = p.Ibar + p.Ad2;
    I += p.Ixx;
  }
  var ytop = 0, ybot = 0;
  for(i=0;i<parts.length;i++){
    for(var j=0;j<parts[i].poly.length;j++){
      ytop = Math.max(ytop, parts[i].poly[j][1]);
      ybot = Math.min(ybot, parts[i].poly[j][1]);
    }
  }
  return {parts: parts, A: A, Ay: Ay, ybar: ybar, I: I,
          depth: ytop - ybot, yBot: ybar - ybot, yTop: ytop - ybar,
          Zbot: I/(ybar - ybot), Ztop: I/(ytop - ybar)};
}

/* ─────────────────── beam solver ─────────────────── */
function beamSolve(b){
  var B = {k: b.k};
  if(b.k === 'pointMid'){
    B.P = b.P; B.L = b.L; B.RA = b.P/2; B.RB = b.P/2;
    B.Msag = b.L === undefined ? undefined : b.P*b.L/4;
    B.xMax = b.L === undefined ? undefined : b.L/2;
    B.Mhog = 0;
  } else if(b.k === 'pointOffset'){
    B.P = b.P; B.L = b.L; B.a = b.a; B.b = b.L - b.a;
    B.RA = b.P*B.b/b.L; B.RB = b.P*b.a/b.L;
    B.Msag = b.P*b.a*B.b/b.L; B.xMax = b.a; B.Mhog = 0;
  } else if(b.k === 'udlOverhang'){
    var w = b.w, Ls = b.Lsp, Lo = b.Lo, Lt = Ls + Lo;
    B.w = w; B.Lsp = Ls; B.Lo = Lo; B.Lt = Lt; B.W = w*Lt;
    B.RB = w*Lt*Lt/(2*Ls);
    B.RA = B.W - B.RB;
    B.xMax = B.RA/w;                       /* where the shear crosses zero */
    B.inSpan = B.xMax <= Ls + 1e-12 && B.RA > 0;
    B.Msag = B.inSpan ? B.RA*B.RA/(2*w) : 0;
    B.Mhog = -w*Lo*Lo/2;                   /* at the roller B              */
  } else {
    B.Msag = b.M; B.Mhog = 0; B.xMax = b.x;
  }
  B.Mgov = Math.abs(B.Mhog) > Math.abs(B.Msag || 0) ? B.Mhog : B.Msag;
  B.hogGoverns = Math.abs(B.Mhog) > Math.abs(B.Msag || 0);
  return B;
}

/* stresses at the extreme fibres for a given moment (sign-aware) */
function fibreStress(sec, M){
  var sBot = M*sec.yBot/sec.I, sTop = M*sec.yTop/sec.I;
  /* sagging (M>0): bottom tension (+), top compression. Report magnitudes
     with an explicit sense so nothing depends on the reader's convention. */
  return {
    M: M,
    bot: {y: sec.yBot, mag: Math.abs(sBot), sense: M >= 0 ? 'tension' : 'compression'},
    top: {y: sec.yTop, mag: Math.abs(sTop), sense: M >= 0 ? 'compression' : 'tension'}
  };
}

/* ─────────────────── top-level solve ─────────────────── */
function solve(cfg, v){
  var S = {cfg: cfg, v: v, mode: cfg.mode};

  /* 'select' must choose the profile BEFORE the section can be built, since
     the section IS the chosen profile. Table values are already in base
     units: A in mm^2, I in mm^4, Z in mm^3.                              */
  if(cfg.mode === 'select'){
    S.M = v.M; S.sy = v.sy; S.SF = v.SF;
    S.sAllow = v.sy/v.SF;
    S.axis = v.axis || 'x';
    S.Zreq = v.M*1e6/S.sAllow;                     /* kN.m -> N.mm        */
    var tab = cfg.table.slice().sort(function(p,q){ return p.mass - q.mass; });
    var Zof = function(t){ return S.axis === 'x' ? t.Zx : Math.min(t.ZyL, t.ZyR); };
    S.Zof = Zof; S.table = tab; S.pick = null; S.below = null;
    tab.forEach(function(t){
      if(Zof(t) >= S.Zreq){ if(S.pick === null || t.mass < S.pick.mass) S.pick = t; }
      else               { if(S.below === null || t.mass > S.below.mass) S.below = t; }
    });
    S.Zpick = Zof(S.pick);
    S.spare = 100*(S.Zpick/S.Zreq - 1);
    S.Iaxis = S.axis === 'x' ? S.pick.Ix : S.pick.Iy;
    S.dbar  = S.axis === 'x' ? S.pick.d/2 : S.pick.xL;
    S.Ik    = S.Iaxis + S.pick.A*S.dbar*S.dbar;
  }

  S.sec = sectionProps(cfg.section(v, S));
  var sec = S.sec;

  if(cfg.mode === 'span'){
    /* tension limit acts on the fibre that a sagging moment stretches:
       the BOTTOM fibre. Solve sigma = (PL/4)*y/I for L.                  */
    S.P = v.P; S.sAllow = v.sAllow;
    S.yT = sec.yBot; S.yC = sec.yTop;
    S.L = 4*v.sAllow*sec.I/(v.P*S.yT);            /* mm */
    S.M = v.P*S.L/4;                              /* N.mm */
    S.sC = v.sAllow*S.yC/S.yT;
    S.beam = beamSolve({k:'pointMid', P: v.P, L: S.L});
  }

  if(cfg.mode === 'moment'){
    S.sT = v.sT; S.sC = v.sC;
    S.yT = sec.yBot; S.yC = sec.yTop;             /* sagging */
    S.Mt = v.sT*sec.I/S.yT;
    S.Mc = v.sC*sec.I/S.yC;
    S.M  = Math.min(S.Mt, S.Mc);
    S.tensionGoverns = S.Mt <= S.Mc;
    S.sCatM = S.M*S.yC/sec.I;
    S.sTatM = S.M*S.yT/sec.I;
    S.margin = 100*Math.abs(S.Mc - S.Mt)/Math.min(S.Mt, S.Mc);
    S.balancedRatio = v.sT/v.sC;
    S.actualRatio = S.yT/S.yC;
  }

  if(cfg.mode === 'stress'){
    S.beam = beamSolve(v.load);
    S.M = S.beam.Msag;
    S.f = fibreStress(sec, S.M);
    S.sTop = S.f.top.mag; S.sBot = S.f.bot.mag;
    S.sMax = Math.max(S.sTop, S.sBot);
    S.maxAt = S.sTop >= S.sBot ? 'top' : 'bottom';
    S.maxSense = S.sTop >= S.sBot ? S.f.top.sense : S.f.bot.sense;
  }

  if(cfg.mode === 'selfweight'){
    S.rho = v.rho;
    S.Am2 = sec.A*1e-6;                            /* mm^2 -> m^2 */
    S.w = v.rho*S.Am2*GRAV;                        /* N/m */
    S.beam = beamSolve({k:'udlOverhang', w: S.w, Lsp: v.Lsp, Lo: v.Lo});
    S.fSag = fibreStress(sec, S.beam.Msag*1000);   /* N.m -> N.mm */
    S.fHog = fibreStress(sec, S.beam.Mhog*1000);
    /* worst tension and worst compression anywhere on the beam */
    var cand = [
      {s: S.fSag.top.mag, sense: S.fSag.top.sense, where: 'top fibre at the sagging peak'},
      {s: S.fSag.bot.mag, sense: S.fSag.bot.sense, where: 'bottom fibre at the sagging peak'},
      {s: S.fHog.top.mag, sense: S.fHog.top.sense, where: 'top fibre at the support'},
      {s: S.fHog.bot.mag, sense: S.fHog.bot.sense, where: 'bottom fibre at the support'}
    ];
    S.cand = cand;
    S.worstT = {s: 0}; S.worstC = {s: 0};
    cand.forEach(function(c){
      if(c.sense === 'tension'    && c.s > S.worstT.s) S.worstT = c;
      if(c.sense === 'compression'&& c.s > S.worstC.s) S.worstC = c;
    });
  }

  if(cfg.mode === 'coverplate'){
    S.base = v.base;                               /* table entry */
    S.plate = {b: v.pb, t: v.pt, onTop: v.onTop !== false};
    S.Zbase = v.base.Zx;
    S.ZbaseAlt = v.base.Ix/(v.base.d/2);
    S.Znew = Math.min(sec.Zbot, sec.Ztop);
    /* a symmetric composite has Zbot = Ztop, so naming a "governing fibre"
       would be an artefact of the min() tie-break rather than mechanics    */
    S.symZ = Math.abs(sec.Zbot - sec.Ztop) < 1e-6*Math.max(sec.Zbot, sec.Ztop);
    S.govFibre = sec.Zbot <= sec.Ztop ? 'bottom' : 'top';
    S.govPhrase = S.symZ ? 'the section is symmetric, so both fibres govern together'
                         : 'the ' + S.govFibre + ' fibre governs';
    S.pct = 100*(S.Znew - S.Zbase)/S.Zbase;
    S.shift = sec.ybar - v.base.d/2 - (S.plate.onTop ? 0 : v.pt);
    S.areaPct = 100*(sec.A - v.base.A)/v.base.A;
  }

  return S;
}

/* ═══════════════════ diagram: the cross-section ═══════════════════ */
function figSection(S, opts){
  opts = opts || {};
  var sec = S.sec, g = new Svg();
  var wMax = 0, i, j;
  for(i=0;i<sec.parts.length;i++)
    for(j=0;j<sec.parts[i].poly.length;j++)
      wMax = Math.max(wMax, sec.parts[i].poly[j][0]);
  var k = Math.min(300/Math.max(wMax,1), 300/Math.max(sec.depth,1));
  function X(x){ return x*k; }
  function Y(y){ return -y*k; }                     /* y up on the page */

  sec.parts.forEach(function(p){
    g.poly(p.poly.map(function(q){ return [X(q[0]), Y(q[1])]; }),
           '#7fe3ec', '#1a3c6e', 2, 0.85);
  });

  /* neutral axis */
  g.line(X(-0.10*wMax), Y(sec.ybar), X(1.10*wMax), Y(sec.ybar), '#f97316', 1.8, '7,4');
  g.text(X(1.12*wMax), Y(sec.ybar)+4, 'N.A.', {size:12, weight:'bold', fill:'#f97316'});
  g.dot(X(wMax/2), Y(sec.ybar), 4.2, '#f97316');
  g.text(X(wMax/2)+7, Y(sec.ybar)-8, 'C', {size:13, weight:'bold', fill:'#f97316'});

  /* ybar dimension on the left */
  var dx = X(-0.16*wMax);
  g.line(dx, Y(0), dx, Y(sec.ybar), '#555', 1.2);
  g.arrow(dx, Y(0)-9, dx, Y(0), '#555', 1.2);
  g.arrow(dx, Y(sec.ybar)+9, dx, Y(sec.ybar), '#555', 1.2);
  g.text(dx-6, (Y(0)+Y(sec.ybar))/2+4, '&#563; = '+trim(sec.ybar,2), {size:12, anchor:'end', fill:'#555'});

  /* overall depth on the right */
  var dx2 = X(1.30*wMax);
  g.line(dx2, Y(0), dx2, Y(sec.depth), '#555', 1.2);
  g.arrow(dx2, Y(0)-9, dx2, Y(0), '#555', 1.2);
  g.arrow(dx2, Y(sec.depth)+9, dx2, Y(sec.depth), '#555', 1.2);
  g.text(dx2+6, (Y(0)+Y(sec.depth))/2+4, 'd = '+trim(sec.depth,1), {size:12, fill:'#555'});

  /* extreme fibre distances */
  g.text(X(wMax/2), Y(sec.depth)-10, 'y_top = '+trim(sec.yTop,2)+' mm',
         {size:11.5, anchor:'middle', fill:'#1a3c6e'});
  g.text(X(wMax/2), Y(0)+18, 'y_bot = '+trim(sec.yBot,2)+' mm',
         {size:11.5, anchor:'middle', fill:'#1a3c6e'});
  g.text(X(wMax/2), Y(0)+40, 'Dimensions in mm',
         {size:11, anchor:'middle', fill:'#888', style:'italic'});
  return g.renderAuto(opts.min || 340, opts.max || 760);
}

/* ═══════════════════ diagram: the beam ═══════════════════ */
function figBeam(S, opts){
  opts = opts || {};
  var B = S.beam, g = new Svg();
  var Lt = (B.k === 'udlOverhang') ? B.Lt : B.L;
  var k = 420/Lt, y = 0;
  function X(x){ return x*k; }

  g.line(0, y, X(Lt), y, '#1a3c6e', 4);

  function pin(x){
    g.poly([[X(x), y+2],[X(x)-13, y+26],[X(x)+13, y+26]], '#1a3c6e', '#1a3c6e', 1.4);
    g.line(X(x)-19, y+26, X(x)+19, y+26, '#1a3c6e', 2);
  }
  function roller(x){
    g.poly([[X(x), y+2],[X(x)-13, y+22],[X(x)+13, y+22]], 'none', '#1a3c6e', 1.6);
    g.circle(X(x)-7, y+27, 5, 'none', '#1a3c6e', 1.4);
    g.circle(X(x)+7, y+27, 5, 'none', '#1a3c6e', 1.4);
    g.line(X(x)-19, y+33, X(x)+19, y+33, '#1a3c6e', 2);
  }

  if(B.k === 'udlOverhang'){
    pin(0); roller(B.Lsp);
    for(var q=0;q<=16;q++){
      var xx = X(Lt*q/16);
      g.arrow(xx, y-34, xx, y-4, '#e11d48', 1.5);
    }
    g.line(0, y-34, X(Lt), y-34, '#e11d48', 1.8);
    g.text(X(Lt/2), y-42, 'w = '+trim(B.w,1)+' N/m (self-weight)',
           {size:12.5, anchor:'middle', fill:'#e11d48'});
    g.text(X(B.Lsp/2), y+52, trim(B.Lsp,2)+' m', {size:12, anchor:'middle', fill:'#555'});
    g.text(X(B.Lsp + B.Lo/2), y+52, trim(B.Lo,2)+' m', {size:12, anchor:'middle', fill:'#555'});
    g.line(0, y+44, X(B.Lsp), y+44, '#555', 1);
    g.line(X(B.Lsp), y+44, X(Lt), y+44, '#555', 1);
    g.text(0, y+70, 'A', {size:13, weight:'bold', anchor:'middle'});
    g.text(X(B.Lsp), y+70, 'B', {size:13, weight:'bold', anchor:'middle'});
  } else {
    pin(0); roller(B.L);
    var xp = (B.k === 'pointMid') ? B.L/2 : B.a;
    g.arrow(X(xp), y-56, X(xp), y-5, '#e11d48', 2.6);
    g.text(X(xp), y-64, 'P = '+trim(B.P/1000,2)+' kN', {size:13, anchor:'middle', fill:'#e11d48'});
    g.line(0, y+44, X(xp), y+44, '#555', 1);
    g.line(X(xp), y+44, X(B.L), y+44, '#555', 1);
    g.text(X(xp/2), y+58, trim(xp/1000,3)+' m', {size:12, anchor:'middle', fill:'#555'});
    g.text(X((xp+B.L)/2), y+58, trim((B.L-xp)/1000,3)+' m', {size:12, anchor:'middle', fill:'#555'});
    g.text(0, y+76, 'A', {size:13, weight:'bold', anchor:'middle'});
    g.text(X(B.L), y+76, 'B', {size:13, weight:'bold', anchor:'middle'});
  }
  if(opts.note)
    g.text(X(Lt/2), y+96, opts.note, {size:11, anchor:'middle', fill:'#888', style:'italic'});
  return g.renderAuto(380, 760);
}

/* ═══════════════════ diagram: bending moment diagram ═══════════════════ */
function figBMD(S){
  var B = S.beam, g = new Svg();
  var Lt = B.Lt, k = 420/Lt;
  var pts = [], N = 160, i, Mmax = 0;
  for(i=0;i<=N;i++){
    var x = Lt*i/N, M;
    if(x <= B.Lsp) M = B.RA*x - B.w*x*x/2;
    else           M = -B.w*(Lt-x)*(Lt-x)/2;
    pts.push([x, M]);
    Mmax = Math.max(Mmax, Math.abs(M));
  }
  var ky = 130/Math.max(Mmax, 1e-9);
  function X(x){ return x*k; }
  function Y(M){ return -M*ky; }

  g.line(0, 0, X(Lt), 0, '#222', 1.6);
  g.polyline(pts.map(function(q){ return [X(q[0]), Y(q[1])]; }), '#1a3c6e', 2.4);
  g.line(X(B.Lsp), Y(0)-6, X(B.Lsp), Y(0)+6, '#555', 1.4);

  g.dot(X(B.xMax), Y(B.Msag), 4.2, '#f97316');
  g.text(X(B.xMax)+7, Y(B.Msag)-8, 'M = +'+trim(B.Msag,1)+' N&#183;m (sagging)',
         {size:11.5, fill:'#f97316'});
  g.dot(X(B.Lsp), Y(B.Mhog), 4.2, '#a855f7');
  g.text(X(B.Lsp)+7, Y(B.Mhog)+16, 'M = '+mn(trim(B.Mhog,1))+' N&#183;m (hogging at B)',
         {size:11.5, fill:'#a855f7'});

  g.text(0, Y(0)+30, 'A', {size:12, anchor:'middle'});
  g.text(X(B.Lsp), Y(0)+30, 'B', {size:12, anchor:'middle'});
  g.text(X(Lt/2), Math.max(Y(-Mmax), Y(Mmax)) + 56,
         'Sagging plotted above the axis &#8226; the curve is parabolic throughout because the load is a UDL',
         {size:11, anchor:'middle', fill:'#888', style:'italic'});
  return g.renderAuto(420, 760);
}

/* ═══════════════════ shared step builders ═══════════════════ */

/* the A / y / Ibar / d / Ad^2 / I table used by every section problem */
function partsTable(S){
  var sec = S.sec;
  var h = '<table><thead><tr><th>Part</th><th>Dimensions</th><th>$A$ (mm&sup2;)</th>'
        + '<th>$y$ from bottom (mm)</th><th>$\\bar{I}$ (mm&#8308;)</th><th>$d$ (mm)</th>'
        + '<th>$Ad^2$ (mm&#8308;)</th><th>$I$ about x&ndash;x (mm&#8308;)</th></tr></thead><tbody>';
  sec.parts.forEach(function(p){
    h += '<tr><td class="left">'+p.name+'</td><td>'+p.dims+'</td><td>'+trim(p.A,1)+'</td><td>'
       + trim(p.yc,2)+'</td><td>'+sci(p.Ibar)+'</td><td>'+mn(trim(p.d,2))+'</td><td>'
       + sci(p.Ad2)+'</td><td>'+sci(p.Ixx)+'</td></tr>';
  });
  h += '<tr class="total"><td class="left">Section total</td><td>&mdash;</td><td>'+trim(sec.A,1)
     + '</td><td>&#563; = '+trim(sec.ybar,2)+'</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td><strong>'
     + sci(sec.I)+'</strong></td></tr></tbody></table>';
  return h;
}
/* scientific-ish formatting for the big mm^4 numbers */
function sci(v){
  if(Math.abs(v) < 1e-9) return '0';
  if(Math.abs(v) >= 1e5) return trim(v/1e6,4)+' &times; 10&#8310;';
  return trim(v,0);
}

function stepCentroid(S, k){
  var sec = S.sec, b = '';
  b += '<p>Measuring $y$ upward from the <strong>bottom face</strong>, the section splits into '
     + sec.parts.length + ' part' + (sec.parts.length>1?'s':'') + '. Areas and part centroids:</p>';
  sec.parts.forEach(function(p){
    b += mb('\\text{'+p.name.replace(/<[^>]+>/g,'')+': } A = '+trim(p.A,1)+'\\ \\text{mm}^2,'
          + ' \\qquad y = '+trim(p.yc,2)+'\\ \\text{mm}');
  });
  b += mb('A = '+sec.parts.map(function(p){ return trim(p.A,1); }).join(' + ')+' = '+trim(sec.A,1)+'\\ \\text{mm}^2');
  b += mb('\\bar{y} = \\frac{\\sum A_i y_i}{\\sum A_i} = \\frac{'
        + sec.parts.map(function(p){ return trim(p.A,1)+'('+trim(p.yc,2)+')'; }).join(' + ')
        + '}{'+trim(sec.A,1)+'} = \\frac{'+trim(sec.Ay,0)+'}{'+trim(sec.A,1)+'}');
  b += co('answer','$$\\bar{y} = '+trim(sec.ybar,2)+'\\ \\text{mm above the bottom face}'
        + ' \\quad\\Rightarrow\\quad y_{bot} = '+trim(sec.yBot,2)+'\\ \\text{mm}, \\quad y_{top} = '
        + trim(sec.yTop,2)+'\\ \\text{mm}$$');
  var mid = sec.depth/2;
  b += co('note','<strong>Physical check:</strong> mid-depth is at '+trim(mid,2)+' mm, and the centroid '
    + 'comes out '+trim(sec.ybar,2)+' mm &mdash; '+(sec.ybar < mid - 1e-6 ? 'BELOW' : (sec.ybar > mid + 1e-6 ? 'ABOVE' : 'exactly at'))
    + ' it. That is what you should expect, because the area is concentrated toward the '
    + (sec.ybar < mid - 1e-6 ? 'bottom' : (sec.ybar > mid + 1e-6 ? 'top' : 'middle'))+' of the section. '
    + 'If your answer lands on the wrong side of mid-depth, the arithmetic is wrong &mdash; check it before going on.');
  return stepBlock(k, 'Locate the centroid of the section',
    'first moments of area about the bottom face', b);
}

function stepInertia(S, k){
  var sec = S.sec, b = '';
  b += '<p>Each part contributes its own second moment plus a transfer term, '
     + '$I_i = \\bar{I}_i + A_i d_i^2$, where $d_i$ is the distance from that part\'s centroid to '
     + '$\\bar{y} = '+trim(sec.ybar,2)+'$ mm:</p>';
  sec.parts.forEach(function(p){
    var own = p.kind === 'rect' ? '\\frac{'+trim(p.b,1)+'('+trim(p.h,1)+')^3}{12}'
            : (p.kind === 'tri' ? '\\frac{'+trim(p.b,1)+'('+trim(p.h,1)+')^3}{36}'
                                : '\\bar{I}_{\\text{table}}');
    b += mb('\\text{'+p.name.replace(/<[^>]+>/g,'')+': } '+own+' + '+trim(p.A,1)+'('+trim(Math.abs(p.d),2)+')^2 = '
          + trim(p.Ibar,0)+' + '+trim(p.Ad2,0)+' = '+trim(p.Ixx/1e6,4)+' \\times 10^6\\ \\text{mm}^4');
  });
  b += co('answer','$$I_{xx} = '+trim(sec.I/1e6,4)+' \\times 10^6\\ \\text{mm}^4$$');
  /* which term dominates? */
  var totOwn = 0, totAd2 = 0;
  sec.parts.forEach(function(p){ totOwn += p.Ibar; totAd2 += p.Ad2; });
  b += co('note','<strong>Where the stiffness comes from:</strong> the transfer terms $Ad^2$ contribute '
    + trim(100*totAd2/sec.I,1)+'% of $I_{xx}$ and the parts\' own $\\bar{I}$ only '+trim(100*totOwn/sec.I,1)
    + '%. Bending stiffness is bought by placing area <em>far</em> from the neutral axis, not by making '
    + 'individual parts thick.');
  if(S.cfg.trapCheck) b += S.cfg.trapCheck(S);
  return stepBlock(k, 'Second moment of area about the centroidal x&ndash;x axis',
    'parallel axis theorem, part by part', b);
}

function stepSummaryTable(S, k, rows){
  return stepBlock(k, 'Summary Table', 'section properties and final results',
    partsTable(S) + tableRows(rows), true);
}

/* ═══════════════════ page assembly ═══════════════════ */
function build(cfg, v){
  var S = solve(cfg, v);
  S.uid = v.uid || 'v';
  var sec = S.sec, h = '', k = 1;

  h += '<h3>Problem Statement</h3>' + cfg.question(S);
  h += '<div class="callout given"><p><strong>' + (v.bookAns ? 'Given answer:' : 'Answer to check against:')
     + '</strong> &nbsp; ' + (v.bookAns || cfg.answer(S)) + '</p></div>';
  if(cfg.tableNote) h += co('info', cfg.tableNote(S));
  if(cfg.tableFigs) h += cfg.tableFigs(S);

  /* lead diagrams */
  if(cfg.mode !== 'select' && S.beam)
    h += fig(figBeam(S, {note: cfg.beamNote ? cfg.beamNote(S) : ''}), cfg.beamCap(S));
  h += fig(figSection(S), cfg.sectionCap(S));

  h += '<h3>Solution</h3>';

  if(cfg.preSteps) { var pre = cfg.preSteps(S, k); h += pre.html; k = pre.k; }

  if(cfg.mode !== 'select'){
    h += stepCentroid(S, k++);
    h += stepInertia(S, k++);
  }

  var post = cfg.postSteps(S, k);
  h += post.html; k = post.k;

  h += stepSummaryTable(S, k++, cfg.summary(S));
  h += mistakes(cfg.mistakes(S));
  return h;
}



/* ─────────────────── tutorial configuration ─────────────────── */
var CONFIG = {
  mode: "moment",
  section: function(v){
      var W = v.b3, cx = W/2;
      return [
        Rect('&#9312; Bottom flange', cx - v.b1/2, 0,                 v.b1, v.t1),
        Rect('&#9313; Web',           cx - v.tw/2, v.t1,              v.tw, v.hw),
        Rect('&#9314; Wide flange',   0,           v.t1 + v.hw,       v.b3, v.t3),
        Rect('&#9315; Stub',          cx - v.b4/2, v.t1 + v.hw + v.t3, v.b4, v.h4)
      ];
    },
  question: function(S){
      var v = S.v;
      return '<p>The figure shows the cross-section of an <strong>extruded alloy member</strong> used as a '
        + '<strong>simply supported beam</strong> with the <strong>'+v.b1+' mm wide flange at the bottom'
        + '</strong>. Determine the <strong>moment of resistance</strong> of the section if the maximum '
        + 'permissible stresses in <strong>tension and compression are '+trim(v.sT,1)+' and '+trim(v.sC,1)
        + ' MPa</strong> respectively. The loading causes a <strong>positive (sagging) moment</strong>.</p>';
    },
  answer: function(S){
      return '$M_{\\max} = '+trim(S.M/1e6,3)+'\\ \\text{kN}\\!\\cdot\\!\\text{m}$ ('
        + (S.tensionGoverns ? 'tension' : 'compression')+' governs)';
    },
  sectionCap: function(S){
      return 'Section to scale in its service orientation, four rectangles measured from the bottom face. '
        + 'Overall depth '+trim(S.sec.depth,0)+' mm; the centroid sits '+trim(S.sec.ybar,2)+' mm above the '
        + 'bottom, well above mid-depth because most of the area is in the top flange and stub.';
    },
  postSteps: function(S, k){
      var h = '', v = S.v, I = S.sec.I;
      var b1 = '<p>A sagging moment puts the <strong>bottom fibre in tension</strong> ($\\sigma_t \\le '
        + trim(v.sT,1)+'$ MPa at $y_t = '+trim(S.yT,2)+'$ mm) and the <strong>top fibre in compression</strong> '
        + '($\\sigma_c \\le '+trim(v.sC,1)+'$ MPa at $y_c = '+trim(S.yC,2)+'$ mm). Each limit gives a '
        + 'candidate moment $M = \\sigma I / y$:</p>'
        + mb('M_t = \\frac{'+trim(v.sT,1)+' \\times '+trim(I/1e6,4)+' \\times 10^6}{'+trim(S.yT,2)+'} = '
            +trim(S.Mt/1e6,4)+'\\ \\text{kN}\\!\\cdot\\!\\text{m}')
        + mb('M_c = \\frac{'+trim(v.sC,1)+' \\times '+trim(I/1e6,4)+' \\times 10^6}{'+trim(S.yC,2)+'} = '
            +trim(S.Mc/1e6,4)+'\\ \\text{kN}\\!\\cdot\\!\\text{m}')
        + '<p>The section must satisfy <em>both</em> limits at once, so the <strong>smaller</strong> candidate '
        + 'is the moment of resistance:</p>'
        + co('answer','$$M_{\\max} = \\min('+trim(S.Mt/1e6,3)+',\\ '+trim(S.Mc/1e6,3)+') = '
            +trim(S.M/1e6,3)+'\\ \\text{kN}\\!\\cdot\\!\\text{m} \\quad ('
            +(S.tensionGoverns?'tension':'compression')+'\\text{ governs)}$$');
      h += stepBlock(k++, 'Moment of resistance: two limits, the smaller governs',
        'a candidate $M$ for each stress limit, then take the minimum', b1);

      var nm = S.tensionGoverns ? 'compressive' : 'tensile';
      var val = S.tensionGoverns ? S.sCatM : S.sTatM;
      var lim = S.tensionGoverns ? v.sC : v.sT;
      var b2 = '<p>Under the governing moment, check the other fibre really is inside its limit:</p>'
        + mb('\\sigma = \\frac{M y}{I} = \\frac{'+trim(S.M/1e6,4)+' \\times 10^6 \\times '
            +trim(S.tensionGoverns ? S.yC : S.yT,2)+'}{'+trim(I/1e6,4)+' \\times 10^6} = '+trim(val,2)
            +'\\ \\text{MPa} \\;<\\; '+trim(lim,1)+'\\ \\text{MPa} \\ \\checkmark')
        + '<p>Both limits hold: the '+(S.tensionGoverns?'bottom':'top')+' fibre sits exactly at '
        + trim(S.tensionGoverns ? v.sT : v.sC,1)+' MPa while the '+(S.tensionGoverns?'top':'bottom')
        + ' retains a margin of '+trim(lim - val,2)+' MPa.</p>'
        + co('note','<strong>How close is this to a balanced design?</strong> Both fibres would reach their '
          + 'limits simultaneously if $y_t/y_c = \\sigma_t/\\sigma_c = '+trim(S.balancedRatio,3)+'$. '
          + 'This section has $y_t/y_c = '+trim(S.actualRatio,3)+'$, so the two candidate moments differ by '
          + 'only '+trim(S.margin,1)+'%. '
          + (S.margin < 10
             ? 'That is close to optimal — the asymmetry of the extrusion is doing real work, deliberately pulling the neutral axis toward the compression face.'
             : 'There is real slack here: the section is carrying material that never reaches its limit, so the shape could be made lighter for the same moment.'));
      h += stepBlock(k++, 'Verify the non-governing fibre', 'check the other limit is satisfied', b2);
      return {html: h, k: k};
    },
  summary: function(S){
      return [
        ['Second moment of area $I_{xx}$', trim(S.sec.I/1e6,4)+' &times; 10&#8310; mm&#8308;'],
        ['Bottom fibre &mdash; $y_t$, limit, candidate $M$',
         trim(S.yT,2)+' mm, '+trim(S.v.sT,1)+' MPa, '+trim(S.Mt/1e6,3)+' kN&#183;m'],
        ['Top fibre &mdash; $y_c$, limit, candidate $M$',
         trim(S.yC,2)+' mm, '+trim(S.v.sC,1)+' MPa, '+trim(S.Mc/1e6,3)+' kN&#183;m'],
        ['Stress at the non-governing fibre',
         trim(S.tensionGoverns ? S.sCatM : S.sTatM,2)+' MPa'],
        ['Moment of resistance $M_{\\max}$',
         '<strong>'+trim(S.M/1e6,3)+' kN&#183;m ('+(S.tensionGoverns?'tension':'compression')+' governs)</strong>']
      ];
    },
  mistakes: function(S){
      var v = S.v, m = [], big = Math.max(S.Mt, S.Mc);
      m.push('<strong>Taking the LARGER candidate moment ('+trim(big/1e6,3)+' kN&#183;m).</strong> At that '
        + 'moment the '+(S.tensionGoverns?'bottom':'top')+' fibre would reach '
        + trim((S.tensionGoverns ? v.sT : v.sC)*big/S.M,1)+' MPa, above its limit. The moment of resistance '
        + 'is always the MINIMUM over all stress limits.');
      m.push('<strong>Pairing the limits with the wrong fibres.</strong> The '+v.b1+' mm flange is at the '
        + 'bottom and the moment is sagging, so the tensile limit belongs to the bottom fibre at '
        + trim(S.yT,2)+' mm and the compressive limit to the top at '+trim(S.yC,2)+' mm. Swapping them gives '
        + trim(Math.min(v.sT*S.sec.I/S.yC, v.sC*S.sec.I/S.yT)/1e6,3)+' kN&#183;m &mdash; wrong value AND wrong '
        + 'governing fibre.');
      m.push('<strong>Neglecting the $Ad^2$ terms for the thin plates.</strong> The bottom flange\'s own '
        + '$bh^3/12$ is only '+trim(S.sec.parts[0].Ibar,0)+' mm&#8308;, but its transfer term is '
        + trim(S.sec.parts[0].Ad2,0)+' mm&#8308; &mdash; '+trim(S.sec.parts[0].Ad2/S.sec.parts[0].Ibar,0)
        + '&times; larger. Thin far-flung plates carry the section almost entirely through $Ad^2$.');
      m.push('<strong>Assuming the deeper fibre always governs.</strong> Here '
        + (S.tensionGoverns ? 'the tension fibre governs even though it is '+(S.yT>S.yC?'the deeper one':'the shallower one')
                            : 'compression governs, despite the compression fibre being the shallower one')
        + '. Which limit binds depends on the RATIO $\\sigma/y$, not on $y$ alone.');
      return m;
    }
};
var VARIANTS = [
  {uid: "v0", btn: "Original", b1: 60, t1: 5, tw: 5, hw: 50, b3: 140, t3: 5, b4: 20, h4: 20, sT: 60, sC: 45, bookAns: "$M_{\\max} = 1.322\\ \\text{kN}\\!\\cdot\\!\\text{m}$", desc: "The tutorial sheet problem — tension governs, and only just: the two candidate moments are within 3.4% of each other, so the extrusion is close to a balanced design."},
  {uid: "v1", btn: "Variant 1 — new numbers", b1: 70, t1: 6, tw: 6, hw: 50, b3: 150, t3: 6, b4: 24, h4: 24, sT: 60, sC: 50, desc: "Same shape family and the same governing fibre — tension still binds — with a heavier extrusion and different allowable stresses. The method is unchanged; only the arithmetic moves, and the design sits a little further from balanced than the original."},
  {uid: "v2", btn: "Variant 2 — compression governs instead", b1: 60, t1: 5, tw: 5, hw: 50, b3: 140, t3: 5, b4: 20, h4: 20, sT: 90, sC: 40, desc: "Structural change: the SAME section with a stronger tensile limit and a weaker compressive one. Now the compression fibre binds even though it is the shallower of the two — which is the whole point of computing both candidates rather than assuming the deeper fibre wins. The section is also far from balanced now, so a lot of tensile capacity goes unused."}
];

/* ─────────────────── wiring ─────────────────── */
function render(i){
  var v = VARIANTS[i];
  document.getElementById('doc').innerHTML = build(CONFIG, v);
  document.getElementById('swDesc').textContent = v.desc;
  var btns = document.querySelectorAll('#swBtns button');
  for(var j=0;j<btns.length;j++) btns[j].setAttribute('aria-pressed', j===i ? 'true' : 'false');
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('doc'), {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}
function init(){
  var box = document.getElementById('swBtns');
  VARIANTS.forEach(function(v,i){
    var b = document.createElement('button');
    b.textContent = v.btn;
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){ render(i); };
    box.appendChild(b);
  });
  render(0);
}
window.addEventListener('load', init);
</script>
